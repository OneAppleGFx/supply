.org{position:relative;align-self:stretch;display:flex;align-items:center}

<style>
/* ============ 卡片 ============ */
.card{
  background:#fff;border:1px solid var(--brand-line);border-radius:var(--r-xl);
  box-shadow:var(--sh-card);padding:20px;
}
.card+.card{margin-top:12px}
.card.pad0{padding:0;overflow:hidden}

  padding:16px 20px;border-bottom:1px solid var(--line);
}

.card-bd{padding:20px}

.pagehd{

.pagehd .acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hd-title-row{display:flex;align-items:center;gap:10px}

/* ============ 按钮 XS24 / 28 / 32 ============ */
.btn{
  height:32px;padding:0 15px;border-radius:var(--r-md);border:1px solid transparent;
  font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s ease;white-space:nowrap;background:#fff;color:var(--text-2);
}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn.sm{height:28px;padding:0 12px;font-size:13px;border-radius:var(--r-md)}
.btn.xs{height:24px;padding:0 10px;font-size:12px;border-radius:var(--r-sm)}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:var(--sh-btn)}

.btn-secondary{background:var(--brand-100);color:var(--brand-700);border-color:#B8DFC8}

.btn-default{background:#fff;border-color:#D9D9D9;color:var(--text-2)}

}

/* ---------- 判定引擎 ---------- */
function thrOf(row){
  const c = CAT[row.c];
  if(c.type === 'pct'){

    const lo = Math.floor(row.q*(1-c.v/100)), hi = Math.ceil(row.q*(1+c.v/100));
    return {lo:lo, hi:hi, label:c.label, txt:`${c.label} · ${lo}~${hi} ${row.u}`, rule:c.rule};
  }
  return {lo:row.q+c.min, hi:row.q+c.max, label:c.label, txt:`${c.label}`, rule:c.rule};
}
function judge(row, act){
  if(act === row.q) return {k:'normal', txt:'正常', dev:0};
  const t = thrOf(row);
  const dev = (act - row.q) / row.q * 100;
  if(act >= t.lo - 1e-9 && act <= t.hi + 1e-9) return {k:'float', txt:'浮差', dev};
  if(act === 0) return {k:'void', txt:'整行未发', dev};
  return {k: act < row.q ? 'short' : 'over', txt: act < row.q ? '短装' : '超发', dev};
}

     否则会出现「徽标 30、点进去待设价 28」—— 数字对不上，比没有数字更糟。 */
  B03: () => CATALOG.filter(c=>!VOID[c.sid] && !SUSPEND[c.sid] && gSt(c.sid)==='pending').length,
  /* 询价单待报价：与 C01 页头、A03 页头、待办 Tab 同一个口径 —— 数 RFQ 里状态为
     「待报价」的单。四处都写死数字的下场是迟早有一天四个数不一样。 */
  C01: () => RFQ.filter(r=>r.st==='待报价').length,
  /* 待办中心的「询价待报价」页签与之同源 —— 提交报价后这单就不再是待办，
     徽标该跟着少一个，而不是等谁想起来手动改 */
  A03: () => RFQ.filter(r=>r.st==='待报价').length,
  /* 订单中心徽标 = 待确认 + 已确认但门店申请撤回（两者都需供应商动作），与 D01 待处理口径一致 */
  D01: () => ORDERS.filter(isTodo).length,
  /* 待发货 = 系统自动生成、尚未确认发货的发货单；E01 页头、A04 待办、左侧徽标同源。
     一个订单只发一次，所以「待发货」数 = 处于 WAIT 状态的发货单数（含订单确认 / 中标时自动生成的空单）。 */
  E01: () => shipWaitCount(),
  A04: () => shipWaitCount(),
  /* 差异待说明徽标 = 待发货且有发货差异的单数，与 A05 列表行数、工作台 KPI 的「差异行」同源。
     口径不同：徽标数「单」，KPI 数「行」，所以 SH-0041 是 1 单 / 7 行。 */
  A05: () => SHIPMENTS.filter(sh=>sh.st==='WAIT' && shipDiffOf(sh)>0).length,
  /* 售后退货待处理 = 门店发起、供应商尚未处置的退货单（待确认）。
     F04「售后退货」与 A06「退货待处理」共用同一份 RETURNS 数据，徽标同源、点数一致。 */
  F04: () => RETURNS.filter(r=>r.st==='待确认').length,
  A06: () => RETURNS.filter(r=>r.st==='待确认').length
};
/* 有动态口径就现算，没有就退回 NAV 里写的字面值 */
function navNum(sid, hard){
  const f = NAVCNT[sid];
  return f ? f() : (parseInt(hard, 10) || 0);
}
/* 模块徽标 = 总待办。NAV 里写 'sum' 表示「由子项加总」，
   不写 'sum' 的模块保持自己的字面值 —— 还没接口径的模块不会被误改。 */
function navModNum(n){
  if(n.bd === 'sum') return (n.subs||[]).reduce((s,[sid,,sbd])=> s + navNum(sid, sbd), 0);
  return navNum(n.id, n.bd);
}

function renderNavList(){
  const el = document.getElementById('navlist');

  let h = '';
  GROUPS.forEach(g=>{
    const items = SCREENS.filter(s=>s.group===g);

  });

function toggleNav(){
  const p = document.getElementById('navpanel');
  p.style.display = p.style.display==='none' ? 'block' : 'none';

function go(id){
  /* 旧入口兼容：确认发货单已并入发货单详情，同一环节只有一屏 */
  if(id==='E03') id='E04';
  /* 离开 E02 时把当前填写自动落到同一张「待发货」单：
     合并成一个编辑态后，页面显示与确认发货冻结的必须是同一份数据。 */
  if(CUR==='E02' && id!=='E02' && typeof shipSave==='function') shipSave(true, true);
  CUR = id;
  /* D03 备货参考：整页锁定视口高度，表格区域吃掉剩余空间并内部上下滚动；
     其余页面保持原来的整页滚动。每次 go() 自动切换，直链 / 重渲染同样生效。 */
  document.body.classList.toggle('fit-d03', id==='D03');
  if(id==='A01'){ document.getElementById('root').innerHTML = loginPage(); window.scrollTo(0,0); return; }
  if(!TABS.includes(id)){
    TABS.push(id);
    if(TABS.length > 7) TABS.splice(1,1);
  }
  const navEl = document.querySelector('.nav');
  const navTop = navEl ? navEl.scrollTop : 0;
  document.getElementById('root').innerHTML = shell();
  const navEl2 = document.querySelector('.nav');
  if(navEl2) navEl2.scrollTop = navTop;
  const s = SCREENS.find(x=>x.id===id);
  const v = document.getElementById('view');
  v.innerHTML = s.render();
  /* 规则说明入口：注入到页面右上角，紧挨操作按钮 */
  const acts = v.querySelector('.pagehd .acts');
  if(acts){ const h = ruleBtn(id); if(h) acts.insertAdjacentHTML('afterbegin', h); }
  v.scrollTop = 0;
  window.scrollTo(0,0);
  const ct = document.getElementById('crumb-t');
  if(ct) ct.textContent = s.title;
  const p = document.getElementById('navpanel');
  if(p && p.style.display==='block') renderNavList();
  if(typeof afterRender === 'function') afterRender(id);
}

function closeTab(id, ev){
  if(ev) ev.stopPropagation();
  if(TABS.length <= 1) return;
  TABS = TABS.filter(x=>x!==id);
  if(CUR === id){ go(TABS[TABS.length-1]); return; }
  document.getElementById('root').innerHTML = shell();
  const s = SCREENS.find(x=>x.id===CUR);
  const v = document.getElementById('view');
  if(s && v) v.innerHTML = s.render();
  if(typeof afterRender === 'function') afterRender(CUR);
}

  const d = document.createElement('div');
  d.className = 'toast ' + (kind||'ok');
  d.innerHTML = (kind==='err'?I.warn:I.check) + '<span>'+msg+'</span>';
  document.body.appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .25s'; setTimeout(()=>d.remove(),260); }, 2200);
}

      （生鲜蔬果 · 7 类），既不能用来找人，也框不住需求；档口才是发起方。
      一个档口可以同时要素菜和肉，品类范围根本框不住它，删掉不丢任何信息。
      档口本身不进筛选区：它回答的是「这单是谁要的」，要认人看那一列就够，
      多一个下拉只会多一次点击。
   —— lines 是采购行数（门店要的），qLines 是报价行数（我报了几行）。

/* 当前正在查看的询价单（C02 数据源）；其状态决定右上角「报价」入口的形态 */

function openRfq(no){ CUR_RFQ = RFQ.find(r=>r.no===no) || RFQ[0]; go('C02'); }
/* 询价单右上角「报价」入口随状态切换：
   待报价 → 参与报价（进 C03，提交后生成「已提交」报价单，截止前可多次改）
   已报价 → 修改报价（进对应「已提交」报价单，C03 可改）
   待公示 → 查看报价（已截止且已提交，等门店确认，只读；中标结果灰置）
   已中标 / 未中标 → 查看报价（进 C06 只读快照）
   未参与 → 无报价单入口（从未提交报价，故无报价数据） */
function rfqTopBtn(R){
  if(R.st==='待报价') return `<button class="btn btn-primary" onclick="openEdit('${R.no}')">参与报价</button>`;
  if(R.st==='已报价') return `<button class="btn btn-primary" onclick="openEdit('${R.no}')">修改报价</button>`;
  if(R.st==='已中标' || R.st==='未中标' || R.st==='待公示'){
    const q = QUOTE_LIST.find(x=>x.rfq===R.no);
    return `<button class="btn btn-default" onclick="openQuote('${q?q.st:'已提交'}','${q?q.no:''}')">查看报价</button>`;
  }
  return '';   /* 未参与 = 无报价单入口 */
}
function rfqStatusTag(st){
  if(st==='未参与') return tag('未参与','off');
  if(st==='待公示') return tag('待公示','proc');
  return tag(st, st==='待报价'?'wait':st==='已报价'?'proc':st==='已中标'?'done':'off');
}

const IQ = [

def('C02','询价单详情','询价与报价', ()=>{
  /* 「报价」= 我在报价单里填的价，不是平台参考价。
     —— 参考价回答的是「别人上一轮卖多少」，可我要决定的是「这单我报多少」。
        两个数长得差不多，放在同一行最容易被读成一个（3.24 和 3.10 到底哪个是我报的？），
        所以这一屏只留我自己的那个数。
     —— 价从 QUOTE 取 —— 也就是「参与报价」打开时默认带出的货品价格，可逐行调整。
        同一个来源，才不会出现「列表看一个价、点进去是另一个价」。
     —— 询价单本身不含失效货品，所有行门店都能正常报价，所以「报价」列只会因为「还没填」而显示 —：
        它不是「报了 0 元」，是「这行你还没给价」。填 0 或留空都会被读成别的意思。
        本轮不供货请用报价单里的「不可供」标记，不会在这一屏出现死行。
     —— 所以这一列同时回答两件事：我报了多少、还有几行没报。 */
  const R = CUR_RFQ;
  const noQuote = R.st==='未参与';            // 未参与：从未提交报价，没有报价数据
  /* 明细来源：本询价单若已有报价单快照（QDETAIL），就用当时提交的真实货品与报价，
     避免「点开徐汇汤品档却看到浦东快餐档的上海青」这种对不上；
     只有当前正在报 / 待报的单（无快照）才沿用 IQ 示例货品。 */
  const q = QUOTE_LIST.find(x=>x.rfq===R.no);
  /* 明细来源：有报价单快照就用快照（当时提交的那几行、那几个价）；
     没有快照（待报价 / 未参与）就列这一单自己的询价货品，报价列自然全是 —。
     两边都只认「这一张单」，不再是任何一张单都套浦东那 8 行。 */
  const detail = q ? QDETAIL[q.no] : null;
  const src = detail ? detail.lines : (RFQ_LINES[R.no] || IQ).slice(0, R.lines);
  const priceOf = line => (noQuote || !detail) ? NaN : line.price;
  const rows = src.map((r,i)=>{
    const p = priceOf(r, i);
    const hasP = p > 0;
    return `
    <tr>
      <td class="mono" style="color:var(--text-4)">${r.i || (i+1)}</td>
      <td class="name">${r.n}</td>
      <td style="color:var(--text-3)">${r.s}</td>
      <td>${r.u}</td>
      <td class="mono r">${r.q}</td>
      <td class="mono r">${hasP
        ? `<b style="font-variant-numeric:tabular-nums">${p.toFixed(2)}</b>`
        : '<span style="color:var(--text-4)">—</span>'}</td>
    </tr>`;
  }).join('');
  const filled = src.filter((r,i)=>priceOf(r,i) > 0).length;

  return pagehd(R.no,
      `${R.store} · <b>${R.stall}</b> · ${R.lines} 行 · 报价截止 <b>${R.due}</b>${R.left && R.left!=='—'?`（剩 ${R.left}）`:''}`,
      `<button class="btn btn-default" onclick="go('C01')">${I.back}返回列表</button>

      rfqStatusTag(R.st)) +
  `<div class="card">
    <div class="dl">
      <div><dt>采购门店</dt><dd>${R.store}</dd></div>
      <div><dt>采购档口</dt><dd><span class="stall">${R.stall}</span></dd></div>
      <div><dt>所属商户</dt><dd>浦东新区第二食堂运营方</dd></div>
      <div><dt>询价发起时间</dt><dd class="mono">2026-10-26 08:30</dd></div>
      <div><dt>报价截止时间</dt><dd class="mono" style="color:var(--warning)">${R.due}</dd></div>
      <div><dt>期望配送日期</dt><dd class="mono">2026-10-28 · 06:00–08:00</dd></div>
      <div><dt>结算方式</dt><dd>验收合格量 × 中标单价</dd></div>

/* ============================================================

/* 每张询价单自己的明细 —— 「参与报价」进来要看到这一单要的货，
   而不是隔壁门店那几行。行内货品一律取门店可正常报价的 SKU，
   pid 落到 CATALOG 的 sid，C03「我的供货货品」列才能显示别名与规格。 */
const RFQ_LINES = {
  'RFQ-20261026-0012': IQ,
  'RFQ-20261026-0010': [
    {i:1, n:'胡萝卜', s:'5kg/袋',  u:'袋', q:20, ref:2.60,  pid:'S1000601'},
    {i:2, n:'猪里脊', s:'5kg/件',  u:'件', q:12, ref:18.40, pid:'S1000801'},
    {i:3, n:'鸡蛋',   s:'12kg/箱', u:'箱', q:8,  ref:22.00, pid:'S1001201'},
    {i:4, n:'老豆腐', s:'5kg/箱',  u:'箱', q:10, ref:8.50,  pid:'S1001301'}
  ],
  /* 未参与的那单从来没有报价单，但询价货品依旧要列出来 ——
     否则点进「凉菜档」看到的是浦东快餐那几行，等于换了张单 */
  'RFQ-20261022-0002': [
    {i:1, n:'海带丝', s:'5kg/箱',  u:'箱', q:6,  ref:12.00},
    {i:2, n:'黄瓜',   s:'5kg/件',  u:'件', q:20, ref:3.80},
    {i:3, n:'黑木耳', s:'500g/袋', u:'袋', q:15, ref:16.50},
    {i:4, n:'腐竹',   s:'2.5kg/袋',u:'袋', q:10, ref:14.00},
    {i:5, n:'花生米', s:'5kg/袋',  u:'袋', q:8,  ref:9.60},
    {i:6, n:'粉皮',   s:'2.5kg/袋',u:'袋', q:12, ref:6.80},
    {i:7, n:'香菜',   s:'1kg/把',  u:'把', q:10, ref:8.00}
  ]
};
/* 正在编辑的询价单 + 它的报价行。QUOTE 由 loadQuote() 重建：
   —— 没报过价的（待报价）用货品价格作默认供货价；
   —— 已报过价的（已报价）回填当时提交的价，改价才有意义。 */
let EDIT_RFQ = 'RFQ-20261026-0012';
let QUOTE = [];
function loadQuote(rfqNo, qno){
  EDIT_RFQ = rfqNo;
  const src = RFQ_LINES[rfqNo] || IQ;
  const dl  = (qno && QDETAIL[qno]) ? QDETAIL[qno].lines : null;
  QUOTE = src.map((r,i)=>{
    const d = dl && dl[i] ? dl[i] : null;
    /* 初始供货价 = 我的货品价格（CLAIM），没有就退回平台参考价；
       已提交过的行用当时提交价，不用今天的价格冒充 */
    const c = (typeof CLAIM !== 'undefined') && CLAIM[r.pid];
    const base = (c && parseFloat(c.price) > 0) ? parseFloat(c.price) : r.ref;
    return {i:r.i||i+1, n:r.n, s:r.s, u:r.u, q:r.q, ref:r.ref, pid:r.pid,
      price:(d && d.price != null) ? d.price : base,
      avail:(d && d.none) ? '不可供' : '可供'};
  });
}
/* 从询价单进报价页：带对的单、带对的货 */
function openEdit(rfqNo){
  const q = QUOTE_LIST.find(x=>x.rfq===rfqNo);
  loadQuote(rfqNo, q ? q.no : null);
  go('C03');
}

/* 询价单只含门店当前可正常报价的货品 —— 门店发起询价时筛选的就是「能报的」，
   询价期间门店不允许删除 / 下架询价商品，所以编辑页不会出现失效 / 删除的行，也不存在偏差。
   供应商唯一能表达的「这轮不供」是逐行选「不可供」（覆盖本轮临时停售）；
   停售只影响下一轮新询价，本轮已生成的询价单照常可报、可填价。 */
function quoteSubmit(){
  /* 本轮要供货的行 = 没选「不可供」的；它们必须都填上有效报价 */
  const need = QUOTE.filter(r=>qOk(r));
  const bad  = need.filter(r=>!(parseFloat(r.price) > 0));
  if(bad.length){
    toast('第 '+bad.map(r=>r.i).join('、')+' 行还没填报价价（或改选「不可供」），先处理这 '+bad.length+' 行','err');
    return;
  }
  /* 提交即生成「已提交」报价单 —— 取消二次确认环节，直接传上平台；
     截止前都可再进 C03 修改，以最后一次提交为准。
     单号与报价单都按「正在编辑的那张询价单」落，不写死某一张。 */
  const total = need.reduce((s,r)=>s+r.q*(parseFloat(r.price)||0),0);
  const rfq = RFQ.find(x=>x.no===EDIT_RFQ);
  let q = QUOTE_LIST.find(x=>x.rfq===EDIT_RFQ);
  if(!q){
    q = {no:'QT-20261026-'+String(QT_SEQ++).padStart(4,'0'), rfq:EDIT_RFQ,
         store:rfq?rfq.store:'', stall:rfq?rfq.stall:'',
         qLines:need.length, lines:QUOTE.length, amt:0, t:'2026-10-26 15:12',
         st:'已提交', cls:'wait'};
    QUOTE_LIST.unshift(q);
  }
  q.amt = +total.toFixed(2); q.st='已提交'; q.cls='wait';
  q.qLines = need.length; q.lines = QUOTE.length;
  /* 报价单明细同步落库 —— 没有快照的报价单点进 C02/C06 会是一片空白 */
  QDETAIL[q.no] = {submitter:'李敏（仓库主管）', cmp:'—', lose:[],
    lines: QUOTE.map(r=>({n:r.n, s:r.s, u:r.u, q:r.q, price:r.price, none:!qOk(r)}))};
  /* 同步翻转询价单状态：提交后从「待报价」变为「已报价」，
     再进 C02 时右上角即显示「修改报价」而非「参与报价」 */
  if(rfq){ rfq.st='已报价'; rfq.cls='proc'; rfq.act='修改报价'; rfq.qLines=need.length; }
  toast('报价已提交，生成「已提交」报价单 '+q.no+'，截止前可再次修改');
  go('C05');
}

function openQuote(st, no){
  CUR_QUOTE = QUOTE_LIST.find(x=>x.no===no) || CUR_QUOTE;
  if(st==='已提交'){ loadQuote(CUR_QUOTE.rfq, CUR_QUOTE.no); go('C03'); return; }

}

function quoteCalc(){
  let amt = 0;
  QUOTE.forEach(r=>{ if(qOk(r)) amt += r.q * (parseFloat(r.price)||0); });
  const el = document.getElementById('q-total');
  if(el) el.textContent = money(amt);
  return amt;
}
function setPrice(i, v){
  if(!qOk(QUOTE[i])) return;
  QUOTE[i].price = v;
  const cell = document.getElementById('q-amt-'+i);
  if(cell) cell.textContent = money(QUOTE[i].q * (parseFloat(v)||0));
  quoteCalc();
}

def('C07','中标结果','询价与报价', ()=>{

     当前正在报的这单（RFQ-20261026-0012）沿用 IQ 派生。避免「看 A 单结果却是 B 单」的对不上。 */
  const q = CUR_QUOTE;
  /* 待公示：已提交且已截止，门店还没确认报价 —— 中标结果不对外展示。
     入口在 C06 已灰置，这里再做一次兜底，防止被直接跳转进来。 */
  if(q && (q.st==='待公示' || q.st==='已提交')){
    /* 已提交是「询价还没截止」，比价根本没开始；待公示是「截止了、还没公示」。
       两种情况结果都不可见，但措辞要分开，否则用户以为是系统没算出来。 */
    const openRfq = q.st==='已提交';
    return pagehd('中标结果',
      `${q.no} · ${q.store} · <b>${q.stall}</b> · ${openRfq?'询价进行中，尚未开始比价':'已截止，待门店确认后公示'}`,
      `<button class="btn btn-default" onclick="go('C06')">${I.back}返回报价单</button>`,
      tag(q.st, openRfq?'wait':'proc')) +
    `<div class="card" style="padding:42px;text-align:center;color:var(--text-3);font-size:13.5px;line-height:1.9">
       ${openRfq
         ? '本张报价单已提交，但询价还没到截止时间，报价仍可修改。<br><b>比价在截止后统一开始</b>，中标结果届时按流程公示。'
         : '本张报价单已提交、且已过报价截止时间，正在等待采购门店确认报价。<br><b>中标结果在门店确认公示后才可见</b>，届时本页会列明中标的行与金额。'}</div>`;
  }
  /* 中标结果一律由该报价单自己的快照（QDETAIL）派生 ——
     不再给「当前在报那单」留一条派生路径：两套算法迟早会给出两个答案 */
  const d = QDETAIL[q.no] || {lose:[], lines:[]};
  const loseSet = new Set(d.lose||[]);
  const win  = d.lines.filter((l,i)=>!l.none && !loseSet.has(i));
  const lose = d.lines.filter((l,i)=> l.none || loseSet.has(i));
  const winN = win.length, loseN = lose.length;
  const amt  = win.reduce((s,l)=>s+l.q*(l.price||0), 0);
  const po   = d.po || (winN>0 ? '已生成（见订单中心）' : '无');
  const ship = d.ship || '—';

  const winRows = win.map((l,i)=>`<tr>
      <td class="mono" style="color:var(--text-4)">${i+1}</td>
      <td class="name">${l.n}</td><td>${l.u}</td>
      <td class="mono r">${l.q}</td><td class="mono r">${l.price.toFixed(2)}</td>
      <td class="mono r name">${money(l.q*l.price)}</td>
      <td>${tag('中标','done')}</td></tr>`).join('');
  const loseRows = lose.map((l,i)=>`<tr>
      <td class="mono" style="color:var(--text-4)">${winN+i+1}</td>
      <td class="name" style="color:var(--text-3)">${l.n}</td><td>${l.u}</td>
      <td class="mono r">${l.q}</td>
      <td class="mono r" style="color:var(--text-4)">${l.none?'—':l.price.toFixed(2)}</td>
      <td class="mono r" style="color:var(--text-4)">—</td>
      <td>${tag(l.none?'不可供':'未中标','off')}</td></tr>`).join('');

  const btns = `${q.st==='已提交'?`<button class="btn btn-default" onclick="openEdit('${q.rfq}')">修改报价（截止前）</button>`:''}
       ${winN>0?`<button class="btn btn-primary" onclick="go('D01')">查看正式订单</button>`:''}`;

  return pagehd('中标结果',
      `${q.no} · ${q.store} · <b>${q.stall}</b> · <b>中标 ${winN} 行</b>，未中标 ${loseN} 行`,
      btns, tag(q.st, q.cls)) +
  `<div class="card" style="margin-bottom:12px">
    <div class="dl four">

function ordReadReceipt(o, createdDay, hasReceipt){

/* 订单明细唯一数据源：D02 订单详情、E02 发货单编辑、E04 发货单详情、K05 送货单都取这一份，
   不再共用 PO-…0081 的 18 行演示数据，避免「发货单商品 ≠ 订单商品」。
   数量按包装单位整件计数（件 / 袋 / 箱 / 桶 / 包 …），单价取商品主数据价，
   行金额 = 整数下单量 × 单价；订单金额由明细合计派生，全站金额与数量严格自洽。
   PO-…0081 沿用主数据 ROWS（含真实缺货预告行）；其余订单按「行数 + 金额种子」生成。 */
const ORD_LINES = {};
/* 预估备货量 = 下单量 − 预告缺货数量（缺口），也就是订单详情里的「预计可供量」；
   没有缺货预告的行按足量备货，等于下单量。 */
function ordPlanQty(r){
  if(!r || !r.pres) return r ? qtyNorm(r.q, r.u) : 0;
  const available = Number(r.pres.qty);
  const plan = isFinite(available) ? Math.min(r.q, Math.max(0, available)) : r.q;
  return qtyNorm(plan, r.u);
}
function ordLines(o){
  if(ORD_LINES[o.no]) return ORD_LINES[o.no];
  let out;
  if(o.no === ORDER.no){
    out = ROWS.map(r=>({...r, amt:Math.round(r.q*r.p*100)/100}));
  } else {
    /* 金额种子只决定各行规模，不参与最终金额计算 */
    const cents = Math.round((ORD_AMT_SEED[o.no] || o.amt)*100);
    const n = o.lines;
    const seed = o.no.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    const weights = [];
    for(let i=0;i<n;i++) weights.push(0.6 + ((seed + i*7) % 9)*0.12);
    const wsum = weights.reduce((a,b)=>a+b,0);
    let acc = 0;
    const draft = [];
    for(let i=0;i<n;i++){
      const g = ROWS[(seed + i*5) % ROWS.length];
      const rowCents = (i===n-1) ? (cents - acc) : Math.round(cents*weights[i]/wsum);
      acc += rowCents;
      /* 按整件下单：数量取正整数，单价取商品主数据价（两位小数） */
      const q = Math.max(1, Math.round((rowCents/100)/g.p));
      const p = g.p;
      draft.push({i:i+1, n:g.n, s:g.s, u:g.u, c:g.c, q:q, p:p,
                  pid:g.pid||'', sid:g.sid||'',
                  amt:Math.round(q*p*100)/100, act:q, ship:'none', pres:null});
    }
    out = draft;
  }
  /* 所有数量按各自单位规整，杜绝 5.7 袋 / 20.9 件 */
  out = out.map(r=>({...r, q:qtyNorm(r.q,r.u), act:qtyNorm(r.act,r.u),
                     plan:qtyNorm(ordPlanQty(r),r.u), buyerNote:ordBuyerNote(o,r.i)}));
  /* 展示金额由明细派生：列表金额 = Σ(下单量 × 单价) */
  o.amt = Math.round(out.reduce((a,r)=>a+r.amt,0)*100)/100;
  ORD_LINES[o.no] = out;
  return out;
}

/* 列表操作列对所有订单一律只有「详情」：门店申请撤回这类需要判断的动作，

function ordActions(o){

}
function ordConfirm(no, auto){
  const o = ORDERS.find(x=>x.no===no);
  if(!o || o.st!=='PENDING_CONFIRM'){ toast('该订单状态已变更，请刷新列表','err'); return; }
  /* 是否「供应商同意撤回」后的重新确认：撤回回执 withdrawAgreed 只在首次重确认时存在。 */
  const isReconfirm = !!o.withdrawAgreed;
  o.st='CONFIRMED';
  if(isReconfirm){ o.confirmSource = '重新确认接单'; o.withdrawAgreed = null; }
  else { o.confirmSource = auto ? '系统自动确认' : '人工确认'; }
  /* 首次确认沿用创建日 16:25；撤回后重确认须落在「同意撤回」之后，避免时间倒流回下单日。
     取撤回日志末条（同意撤回）的日期 +16:25，firstConfirmAt 始终保留首确认时刻、不被覆盖。 */
  o.confirmedAt = isReconfirm
    ? ((o.withdrawLog && o.withdrawLog.length ? o.withdrawLog[o.withdrawLog.length-1].at.slice(0,10) : '2026-10-26') + ' 16:25')
    : no.replace(/^[A-Z]+-(\d{4})(\d{2})(\d{2}).*$/, '$1-$2-$3') + ' 16:25';
  /* 确认即由系统自动建单：一单一发，不再有人工「创建发货单」这一步 */
  const sh = shipAutoCreate(o, o.confirmedAt);
  /* 撤回后重确认：把「重新确认接单 + 新发货单」追加进持久化撤回日志，历史只增不减 */
  if(isReconfirm && sh){
    (o.withdrawLog = o.withdrawLog || []).push({at:o.confirmedAt, type:'reconfirm', sh:sh.no});
  }
  CUR_ORDER_NO = no;
  toast('订单 '+no+' 已确认 · 系统已自动生成发货单 '+sh.no+'（待发货）'); go('D02');
}
function ordReject(no){

/* 门店直采单在「已确认」后被门店申请撤回：供应商同意才退回待确认并关闭原发货单。

function ordWithdrawAgree(no){
  const o = ORDERS.find(x=>x.no===no);

    <div class="hint" style="line-height:1.9">门店已申请撤回该直采单（${o.store} · ${o.stall}），订单目前仍处「已确认」并挂有一张待发货单。<br>同意后：① 订单退回「待确认」，门店可重新提交；② 原发货单 <b>${sh?sh.no:'—'}</b> 置为<b>「已关闭」</b>（不可恢复，仍在发货管理中留痕可查）；③ 若门店再次确认，系统将生成<b>全新一张</b>发货单。</div>
    <div class="field" style="margin-top:12px"><label>处理说明 <span class="hint">（选填）</span></label><input class="input" id="wf-note" placeholder="同意撤回的处理依据，便于追溯"></div>`,
    `<button class="btn btn-default" onclick="closeModal()">取消</button>

function ordWithdrawAgreeDo(no){
  const o = ORDERS.find(x=>x.no===no);
  if(!o || !isWithdrawReq(o)){ closeModal(); toast('该订单状态已变更','err'); return; }
  const sh = shipOf(o.no);

  o.withdrawLog = o.withdrawLog || [];

  o.st='PENDING_CONFIRM';
  o.confirmedAt = null; o.confirmSource = null;
  CUR_ORDER_NO = no;
  closeModal(); toast('已同意门店撤回 · 订单 '+no+' 退回待确认，原发货单已关闭'); go('D02');
}

/* 系统兜底：订单过了配送日期仍未发货，自动置为「已关闭」，
   同时作废那张随订单自动生成的待发货单，避免留下永远发不出去的孤儿单。 */
function ordClose(no){
  const o = ORDERS.find(x=>x.no===no);
  if(!o || o.st!=='CONFIRMED') return false;
  o.st='CLOSED'; o.closeReason='过了配送日期仍未发货，系统自动关闭';
  const sh = SHIPMENTS.find(x=>x.order===no && !shipLocked(x));
  if(sh){ sh.st='CLOSED'; sh.closedAt=nowStamp(); }
  return true;
}
/* 演示口径：把 10-26 视为「今天」，过期未发货的「已确认」订单在载入时自动关闭 */
function shipAutoCloseExpired(){
  ORDERS.filter(o=>o.st==='CONFIRMED' && ('2026-'+o.date) < '2026-10-26')
        .forEach(o=>ordClose(o.no));
}

   导出 · 原 D04「订单导出」独立页已撤销，能力全部并入 D01。
   导出是列表的下游动作：直接按「当前列表查询结果」生成文件，无二次确认。
   ------------------------------------------------------------ */
/* 当前列表筛选条件：查询 / 重置写入这里，重渲染与导出共用同一份口径。 */
let D01_FILTER = {type:'', st:'', store:'', date0:'', date1:'', kw:''};
function ordFilter(){
  /* 「全部类型 / 全部状态 / 全部门店」是不带 value 的占位项，读出来是字面量，统一归一为空 = 不限。 */
  const v = (id, all) => {
    const e = document.getElementById(id); if(!e) return '';
    const s = String(e.value||'').trim();
    return (all && s===all) ? '' : s;
  };
  return {type:v('f-type','全部类型'), st:v('f-status','全部状态'), store:v('f-store','全部门店'),
          date0:v('f-date0'), date1:v('f-date1'), kw:v('f-kw')};
}
function d01Query(){ D01_FILTER = ordFilter(); go('D01'); }
function d01Reset(){ D01_FILTER = {type:'', st:'', store:'', date0:'', date1:'', kw:''}; go('D01'); }
/* 行数据口径单一来源：列表渲染与导出都走这里，金额 / 售后数不各算各的。 */
function d01RowData(o){
  const sh = shipOf(o.no);
  const ys = sh ? ysOf(sh) : null;
  return {ysAmt: ys ? ys.amt : null,
          retN: ys ? RETURNS.filter(r=>r.ys===ys.no && r.st==='已同意').length : 0};
}
/* 当前列表查询结果：筛选条件来自 D01_FILTER，导出范围与可见行严格一致。 */
function d01Rows(){
  const f = D01_FILTER;
  return ORDERS.filter(o=>{
    if(f.type && ORD_TYPE[o.type].label !== f.type) return false;
    if(f.st && stLabel(o.st) !== f.st) return false;
    if(f.store && o.store !== f.store) return false;
    const day = '2026-'+o.date;
    if(f.date0 && day < f.date0) return false;
    if(f.date1 && day > f.date1) return false;
    if(f.kw && o.no.toLowerCase().indexOf(String(f.kw).toLowerCase()) < 0) return false;
    return true;
  });
}
function d01Export(){
  const list = d01Rows();
  if(!list.length){ toast('当前查询结果为空，无可导出数据','err'); return; }
  const head = ['订单号','订单类型','采购门店','采购档口','配送日期','行数','预估金额','验收总金额','状态','售后情况'];
  const esc = v => { const s = String(v==null?'':v); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [head.map(esc).join(',')];
  list.forEach(o=>{
    const d = d01RowData(o);
    lines.push([o.no, ORD_TYPE[o.type].label, o.store, o.stall, o.date, o.lines,
      money(o.amt), d.ysAmt==null?'-':money(d.ysAmt), stLabel(o.st), d.retN+' 条'].map(esc).join(','));
  });
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '订单中心_当前查询结果_'+list.length+'条.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('已直接导出当前查询结果 '+list.length+' 条订单');
}

def('D02','订单详情', '订单中心', ()=>{
  const o = ordCurrent();
  const st = o.st;
  const type = ORD_TYPE[o.type];
  const lines = ordLines(o);
  const pres = lines.filter(r=>r.pres);
  const store = STORES.find(s=>s.n===o.store) || {m:'—'};

  /* 由订单号 / 配送日派生的公共字段 */
  const day = o.date.split(' ')[0];
  const createdDay = o.no.replace(/^[A-Z]+-(\d{4})(\d{2})(\d{2}).*$/, '$1-$2-$3');
  const dd = new Date(2026, Number(day.split('-')[0])-1, Number(day.split('-')[1]));
  const prev = new Date(dd.getTime()-86400000);
  const prevDay = `2026-${String(prev.getMonth()+1).padStart(2,'0')}-${String(prev.getDate()).padStart(2,'0')}`;
  /* 门店下单只到具体日期，订单上不带配送时段；时段属于配送侧，一期不设计。
     发货截止、预告截止一期都不做字段设计，故本页不再显示任何截止时间。 */
  const deliver = `2026-${day}`;
  const confirmed = ['CONFIRMED','SHIPPED','ACCEPTING','COMPLETED'].indexOf(st)>=0;
  const terminal  = st==='REJECTED' || st==='CLOSED';
  const pending   = st==='PENDING_CONFIRM';
  /* 打开详情即登记已读回执：原本没有回执的此刻生成，已有的保持原值 */
  const readAt = ordReadReceipt(o, createdDay, confirmed);
  /* 确认时间：询价中标订单中标即确认（取中标生成时刻），门店直采取供应商确认时刻；
     待确认 / 已拒绝 / 已关闭没有确认动作，留空。确认后由 ordConfirm 写入实际时刻。 */
  const confirmedAt = pending || terminal ? '—'
    : (o.confirmedAt || (o.type==='plan' ? createdDay+' 09:12' : createdDay+' 10:05'));

  /* 确认方式只给主文案，不挂「·」后的解释说明 */
  const confirmDesc = pending ? '待供应商确认'
    : st==='REJECTED' ? '已拒绝'
    : st==='CLOSED'   ? '门店撤回直采单'
    : o.type==='plan' ? '中标即确认'
    : (o.confirmSource || '人工确认');

  const shipTag = pending ? tag('待确认','off')
    : st==='CONFIRMED' ? tag('待发货','wait')
    : st==='SHIPPED' ? tag('已发货','ship')
    : st==='ACCEPTING' ? tag('验收中','proc')
    : st==='COMPLETED' ? tag('已完成','done')
    : tag('不发货','off');

  /* 订单明细的履约统计：订单行 i / 发货行 i / 验收行 i 三者同源（shipBaseLines 由 ordLines 派生），
     故按 i 精确对齐，不用商品名模糊匹配。
     实发量取发货单已发出的实发件数；实收量 / 拒收量 / 该行验收金额取关联验收单的逐行派生结果。
     尚无验收单时这三项留空（-），与 D01「验收总金额」口径一致；各行验收金额合计 = 验收单结算金额。 */
  const ordShip = shipOf(o.no);
  const ordYs   = ordShip ? ysOf(ordShip) : null;
  const yLines  = ordYs ? ysLines(ordYs) : [];
  /* 注意 ysLines 的行对象把订单行放在 x.r 里，行号是 x.r.i（不是 x.i） */
  const ysByI   = {}; yLines.forEach(x=>{ ysByI[x.r.i] = x; });
  const shipByI = {};
  if(ordShip && shipLocked(ordShip)) shipLinesOf(ordShip).forEach(l=>{ shipByI[l.i] = l; });
  const dash = '<span class="hint">-</span>';
  /* 下单备注是门店下单原文：只读、按行展示；空值统一给「-」，全文放 title 便于悬停查看。 */
  const buyerNoteCell = r => {
    const n = ordBuyerNote(o, r.i);
    return n
      ? `<span title="${escHTML(n)}" style="display:block;min-width:160px;line-height:1.5;color:var(--text-2)">${escHTML(n)}</span>`
      : dash;
  };
  const rows = lines.map(r=>{
    const y  = ysByI[r.i] || null;
    const sl = shipByI[r.i] || null;
    const sent = y ? y.ship : (sl ? Number(sl.qty) : null);   /* 有验收单以验收行实发为准；已发货未验收则取发货单 */
    const got  = y ? y.got : null;

      <td>${presCell}</td>
      <td>${buyerNoteCell(r)}</td>
      <td>${shipTag}</td>
    </tr>`;
  }).join('');
  const totalQty = lines.reduce((s,r)=>s+r.q,0);
  const totSent = yLines.reduce((s,x)=>s+x.ship,0);
  const totGot  = yLines.reduce((s,x)=>s+x.got,0);
  const totRej  = yLines.reduce((s,x)=>s+x.rej,0);

  /* 售后申述：本订单对应验收单下的全部退货申请，与 F04 / A06 / D01 共用 RETURNS 现算。
     只做记录展示（逐条明细 + 状态），不含验收异议申诉链路。 */

      <td class="mono r">${r.q}</td>

      <td class="mono" style="font-size:12px;color:var(--text-3)">${r.t}</td>
      <td class="mono" style="font-size:12px;color:var(--text-3)">${r.st==='待确认' ? dash : r.pt}</td>
      <td>${tag(r.st, r.cls)}</td>

  const retCard = `

          门店在收货后发起退货申请时，会在此逐条展示明细与处理状态。

    </tr>`).join('');
  const presCard = pres.length ? `
      <div class="card pad0">
        <div class="card-hd">
          <h3>缺货预告 <span style="font-size:12px;font-weight:400;color:var(--warning)">（本期前端不做）</span> <span class="sub">已提交 ${pres.length} 行 · ${o.no}</span></h3>
          <div style="display:flex;gap:8px;align-items:center">

        <div class="hint" style="line-height:1.8">本单暂无缺货预告记录。${
          st==='CONFIRMED' ? '订单未发货前均可上报缺货预告，不设截止时间；发货后供不上请走发货差异备注。'
          : pending ? '确认接单后至发货前均可上报缺货预告，不设截止时间。'
          : terminal ? '订单已到终态，不再开放缺货预告。'
          : '本单已发货，缺货预告入口已关闭；供不上请在发货差异备注中说明。'}</div>
      </div>`;

  /* 步骤条：按订单类型与当前状态生成；验收完成即「已完成」，不再有「已验收」这一步 */
  const stepLabels = terminal ? [] : (pending
    ? ['门店提交','待确认','已确认','已发货','验收中','已完成']
    : [o.type==='plan'?'中标生成':'门店提交','已确认','已发货','验收中','已完成']);
  /* COMPLETED 取越界索引，让终态步骤条全部显示为已完成（无 cur 节点） */
  const curIdx = pending ? 1 : (({CONFIRMED:1, SHIPPED:2, ACCEPTING:3, COMPLETED:5}[st]) ?? 0);
  const steps = stepLabels.length ? `<div class="steps">${stepLabels.map((x,i)=>
    `<span class="step ${i<curIdx?'done':(i===curIdx?'cur':'')}"><span class="n">${i<curIdx?'✓':i+1}</span>${x}</span>${i<stepLabels.length-1?'<span class="ln"></span>':''}`
  ).join('')}</div>` : '';

  /* 页头操作：只按当前状态给可用动作 */
  const acts = [`<button class="btn btn-default" onclick="go('${D02_BACK}')">${I.back}${D02_BACK_LABEL[D02_BACK]||'返回列表'}</button>`];
  if(pending){
    acts.push(`<button class="btn btn-default" onclick="ordReject('${o.no}')">拒绝接单</button>`);
    acts.push(`<button class="btn btn-primary" onclick="ordConfirm('${o.no}')">${I.check}确认接单</button>`);
  } else if(st==='CONFIRMED'){
    acts.push(`<button class="btn btn-default" onclick="goD05('${o.no}','D02')">${I.bell}缺货预告</button>`);
    /* 发货单在订单确认 / 中标生成那一刻已由系统自动创建，这里只有「查看 / 维护」，没有创建入口 */
    acts.push(`<button class="btn btn-primary" onclick="orderShipOpen('${o.no}')">${I.doc}查看发货单</button>`);
    /* 门店已申请撤回（仍处已确认）：右上角给出「同意撤回」入口，处理后退回待确认并关闭原发货单 */
    if(isWithdrawReq(o)) acts.push(`<button class="btn btn-default" style="border-color:var(--warning);color:var(--warning)" onclick="ordWithdrawAgree('${o.no}')">${I.back}同意撤回</button>`);
  } else if(['SHIPPED','ACCEPTING','COMPLETED'].indexOf(st)>=0){
    /* 货已发出 / 订单已完成：只保留只读「查看发货单」；一单一发，关联单由 shipAudit() 保证一定存在 */
    acts.push(`<button class="btn btn-default" onclick="orderShipOpen('${o.no}')">${I.doc}查看发货单</button>`);
  }
  /* 已拒绝 / 已关闭 / 待确认：终态或不涉发货，不给任何发货单入口 */
  /* 已拒绝 / 已关闭 / 待确认：终态或不涉发货，不给任何发货单入口 */
  acts.push(`<button class="btn btn-default" onclick="goOrderPrint('D02')">${I.print}打印</button>`);

  /* 流转记录：由状态生成，每条都是「真实状态变更时间」，不再用「现在」占位。
     末条即当前状态、且带真实时间：待确认=创建(09:12)、已拒绝=拒绝接单(10:05)、已关闭=撤回(10:05)、
     已确认=确认时刻、已发货=确认发货(05:30)、验收中=门店提交第一次验收数据(07:00)、
     已完成=食堂验收完成(08:30)。门店提交第一次验收数据即进入「验收中」，验收结论回写才进入「已完成」，
     两段都要留痕，不能从「已发货」直接跳到「已完成」；节点名与 K07 状态字典一致
     （待确认 / 已确认 / 已发货 / 验收中 / 已完成），门店端与供应端同名，不另造别名。 */
  const tl = [];
  /* 验收人：验收中取发货单 acceptingBy（门店首次提交人），完成态取验收单 by；系统层面动作留空 */
  const accBy = ordShip ? ((ysOf(ordShip) && ysOf(ordShip).by) || ordShip.acceptingBy || '') : '';
  tl.push([createdDay+' 09:12', o.type==='plan'
    ? '<b>中标生成</b> · 进入待确认'
    : '<b>门店提交直采单</b> · 进入待确认','done', o.type==='plan'?'':o.store]);
  if(st==='REJECTED'){
    tl.push([createdDay+' 10:05','<b>供应商拒绝接单</b> · 进入已拒绝','done', CUR_ACCOUNT.name]);
  } else if(st==='CLOSED'){
    tl.push([createdDay+' 10:05','<b>门店撤回直采单</b> · 进入已关闭','done', o.store]);
  } else if(pending && !o.withdrawAgreed){
    /* 纯待确认（从未确认过、也未被同意撤回退回）：创建即进入，无后续节点 */
  } else {
    /* 已确认 / 已发货及之后 / 或被「同意撤回」退回待确认：保留完整历史，不丢首确认与撤回记录 */
    const cAt = o.firstConfirmAt || confirmedAt;
    tl.push([cAt, o.type==='plan' ? '<b>中标即确认</b> · 进入已确认' : '<b>确认接单</b> · 进入已确认','done', o.type==='plan'?'':CUR_ACCOUNT.name]);
    /* 撤回历史读持久化日志 withdrawLog（req / agree / reconfirm，只增不减），
       不依赖会被清空的 withdraw / withdrawAgreed 状态标记，重确认之后仍完整保留。 */
    (o.withdrawLog||[]).forEach(e=>{
      if(e.type==='req')
        tl.push([e.at, '<b>门店申请撤回</b> · 申请中（待供应商同意）','warn', e.by||o.store]);
      else if(e.type==='agree')
        tl.push([e.at, '<b>供应商同意撤回</b> · 退回待确认，原发货单 '+e.sh+' 已关闭','warn', CUR_ACCOUNT.name]);
      else if(e.type==='reconfirm')
        tl.push([e.at, '<b>重新确认接单</b> · 再次进入已确认，系统生成新发货单 '+e.sh,'done', CUR_ACCOUNT.name]);
    });
    if(st!=='CONFIRMED' && st!=='PENDING_CONFIRM'){
      tl.push(['2026-'+day+' 05:30','<b>确认发货</b> · 进入已发货','done', (ordShip&&ordShip.shipper)||CUR_ACCOUNT.name]);
      /* 门店提交第一次验收数据即进入「验收中」；验收结论回写才进入「已完成」—— 两段都要留痕 */
      if(st==='ACCEPTING' || st==='COMPLETED')
        tl.push(['2026-'+day+' 07:00','<b>食堂验收</b> · 进入验收中','done', accBy]);
      if(st==='COMPLETED')
        tl.push(['2026-'+day+' 08:30','<b>食堂验收完成</b> · 进入已完成','done', accBy]);
    }
    if(pres.length && st!=='PENDING_CONFIRM') tl.push([prevDay+' 16:20','<b>缺货预告</b>','done', CUR_ACCOUNT.name]);
  }
  const timeline = tl.map(tlRow).join('');

  return pagehd(o.no,
      `${type.label} · ${o.store} · ${o.stall} · ${o.lines} 行 · 预估 <b>${money(o.amt)}</b> · 配送 ${deliver}`,
      acts.join('\n       '), stTag(st)) +
  `
  <div class="grid-2-1">
    <div>
      <div class="card">
        <div class="card-hd" style="padding:0 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px">
          <h3>订单信息</h3>
          ${steps}
        </div>
        <div class="dl">
          <div><dt>订单号</dt><dd class="mono">${o.no}</dd></div>
          <div><dt>订单类型</dt><dd>${type.label} <span class="hint">（${type.src}）</span></dd></div>
          <div><dt>来源渠道</dt><dd>${o.type==='plan'?'门店采购计划':'门店临时采购'}</dd></div>
          <div><dt>确认方式</dt><dd>${confirmDesc}</dd></div>
          <div><dt>采购门店 / 档口</dt><dd>${o.store} · ${o.stall}</dd></div>
          <div><dt>所属商户</dt><dd>${store.m}</dd></div>
          <div><dt>下单时间</dt><dd class="mono">${createdDay} 09:12</dd></div>
          <div><dt>确认时间</dt><dd class="mono">${confirmedAt}</dd></div>
          <div><dt>配送日期</dt><dd class="mono">${deliver}</dd></div>
          <div><dt>已读回执</dt><dd class="mono">${readAt}</dd></div>
          <div><dt>预估金额</dt><dd class="big">${money(o.amt)}</dd></div>
          <div><dt>结算口径</dt><dd>验收合格量 × 单价</dd></div>
        </div>
      </div>

      ${presCard}

      <div class="card pad0" style="margin-top:12px">
        <div class="card-hd">
          <h3>订单明细 <span class="sub">${o.lines} 行 · 按包装单位整件计数 · 下单量已锁定，不可修改</span></h3>
          <span class="hint">${o.no} · 发货 SKU 必须是下列行的子集 · 「下单备注」为门店下单原文，只读</span>
        </div>
        <div class="tbl-wrap"><table class="tbl" style="min-width:1160px">
          <thead><tr>
            <th style="width:44px">序号</th><th>商品 / 规格</th><th style="width:48px">单位</th>
            <th class="r" style="width:70px">下单量</th><th class="r" style="width:70px">实发量</th>
            <th class="r" style="width:70px">实收量</th><th class="r" style="width:70px">拒收量</th>
            <th class="r" style="width:70px">单价</th><th class="r" style="width:96px">订单金额</th>
            <th class="r" style="width:100px">验收总金额</th><th style="width:96px">预告</th>
            <th style="width:190px" title="门店下单时按商品行填写的备注，供应端只读展示">下单备注</th><th style="width:88px">发货状态</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <div class="sum-bar">
          <span>合计 ${o.lines} 行</span>
          <span>下单总量 <b>${fmt(totalQty)}</b></span>
          ${ordYs ? `<span>实发 <b>${fmt(totSent)}</b></span><span>实收 <b>${fmt(totGot)}</b></span><span>拒收 <b style="color:var(--danger)">${fmt(totRej)}</b></span>` : ''}
          <span style="margin-left:auto">订单金额&nbsp; <b>${money(o.amt)}</b>${ordYs ? ` · 验收总金额&nbsp; <b>${money(ordYs.amt)}</b>` : ''}</span>
        </div>
      </div>

      ${retCard}
    </div>

    <div>
      <div class="card">
        <div class="card-hd" style="padding:0 0 14px;border-bottom:none"><h3>流转记录 <span class="sub">${stLabel(st)}</span></h3></div>
        <div class="timeline">${timeline}</div>
      </div>
    </div>
  </div>`;
});

/* ============================================================
   D05 · 缺货预告（按订单上下文渲染）
   商品行唯一来源 = ordLines(当前订单)，与 D02 订单详情 / E02 / E04 / K05 同源；
   不再固定展示 PO-…0081 的 18 行演示数据，避免「点哪张订单都是同一批商品」。
   提交后写回该订单明细的 pres / plan，D02 缺货预告卡、E02 预估备货量随之更新。
   ============================================================ */
let D05_ORDER_NO = ORDER.no;          /* 本次预告针对哪张采购订单 */
let D05_BACK = 'D02';                 /* 由哪个页面进入，决定返回去向 */
const D05_BACK_LABEL = {D02:'返回订单', D01:'返回列表', A02:'返回工作台', A05b:'返回待办中心', K06:'返回帮助中心', A01:'返回首页'};
function goD05(no, back){
  D05_ORDER_NO = no || CUR_ORDER_NO || ORDER.no;
  D05_BACK = back || 'D02';
  CUR_ORDER_NO = D05_ORDER_NO;       /* 同步订单上下文：返回 D02 时仍是同一张单 */
  go('D05');
}
function presOrder(){ return ORDERS.find(o=>o.no===D05_ORDER_NO) || ordCurrent(); }
function presLines(){ return ordLines(presOrder()); }
/* 演示口径：把 10-26 视为「今天」，新提交的预告用固定时刻，不用真实系统时间打断演示时间线 */
function presStamp(){ return '10-26 18:30'; }

/* 每个订单一份编辑态：PRES_BY_ORDER[订单号][行号]。
   首次进入由该订单明细里已有的 pres 初始化；提交后清空，下次再由落库结果重建。 */
const PRES_BY_ORDER = {};
function presState(){
  const o = presOrder(), lines = presLines();
  if(!PRES_BY_ORDER[o.no]){
    const st = {};
    lines.forEach(r=>{
      st[r.i] = r.pres
        ? {on:true, qty:r.pres.qty, reason:r.pres.reason||'', note:r.pres.note||'',
           late:!!r.pres.late, handled:r.pres.handled||'', time:r.pres.time||'', readAt:r.pres.readAt||''}
        : {on:false, qty:r.q, reason:'', note:'', late:false, handled:'', time:'', readAt:''};
    });
    PRES_BY_ORDER[o.no] = st;
  }
  return PRES_BY_ORDER[o.no];
}
function presLine(i){ return presLines().find(r=>r.i===i) || presLines()[0]; }

function presToggle(i, el){
  const S = presState();
  S[i].on = el.checked;
  const row = document.getElementById('pr-'+i);
  if(row){
    row.querySelectorAll('input.qty,input.txt,select').forEach(x=>{ x.disabled = !el.checked; });
    row.classList.toggle('is-diff', el.checked);
  }
  presCalc();
}
function presSetQ(i, v){
  /* 预计可供量同样是整件数，不允许 3.5 袋 */
  const S = presState(), r = presLine(i);
  S[i].qty = v==='' ? '' : qtyNorm(v, r.u);
  const g = document.getElementById('pg-'+i);
  if(g){
    const gap = (S[i].qty==='' ? 0 : r.q - S[i].qty);
    g.textContent = gap>0 ? '−'+fmt(gap) : (gap===0 ? '0' : '+'+fmt(-gap));
    g.style.color = gap>0 ? 'var(--warning)' : (gap===0 ? 'var(--text-4)' : 'var(--danger)');
  }
  presCalc();
}
function presSetR(i, v){ presState()[i].reason = v; presCalc(); }
function presSetN(i, v){ presState()[i].note = v; }

function presCalc(){
  const S = presState(), lines = presLines();
  let on=0, gap=0;
  lines.forEach(r=>{
    const p = S[r.i];
    if(p.on){ on++; gap += r.q - (p.qty==='' ? 0 : (Number(p.qty)||0)); }
  });
  const ratio = lines.length ? on / lines.length : 0;
  const a = document.getElementById('pc-on'); if(a) a.textContent = on;
  const b = document.getElementById('pc-gap'); if(b) b.textContent = fmt(gap);
  const box = document.getElementById('pres-extra');
  if(box) box.style.display = ratio > 0.5 ? 'block' : 'none';
  const warn = document.getElementById('pres-ratio-tip');
  if(warn) warn.style.display = ratio > 0.5 ? 'flex' : 'none';
  return {on, gap, ratio};
}

def('D05','缺货预告','订单中心', ()=>{
  const o = presOrder();
  const lines = presLines();
  const S = presState();
  const pres = lines.filter(r=>r.pres);
  /* 只有「已确认(CONFIRMED)」且未发货的订单可上报 / 撤回；已发货后本页只读 */
  const editable = o.st === 'CONFIRMED';
  let onN = 0, gapN = 0;
  lines.forEach(r=>{
    const p = S[r.i];
    if(p.on){ onN++; gapN += r.q - (p.qty==='' ? 0 : (Number(p.qty)||0)); }
  });
  const ratio = lines.length ? onN / lines.length : 0;
  const allNote = (pres.find(r=>r.pres && r.pres.allNote) || {pres:{}}).pres.allNote || '';

  const rows = lines.map(r=>{
    const p = S[r.i];
    /* 历史预告用的是旧版自由文本原因（产地缺货 / 未到货 / —），不在现行原因码字典里，
       仍要作为选中项保留，否则进页面后下拉会显示成空白。 */
    const extra = (p.reason && REASONS.indexOf(p.reason) < 0)
      ? `<option value="${escHTML(p.reason)}" selected>${escHTML(p.reason)}</option>` : '';
    const opts = REASONS.map(x=>`<option${p.reason===x?' selected':''}>${x}</option>`).join('') + extra;
    const dis = (p.on && editable) ? '' : 'disabled';
    const g = r.q - (p.qty==='' ? 0 : (Number(p.qty)||0));
    const gapTxt = p.on ? (g>0 ? '−'+fmt(g) : (g===0 ? '0' : '+'+fmt(-g))) : '—';
    return `
    <tr id="pr-${r.i}" class="${p.on?'is-diff':''}">
      <td class="c"><input type="checkbox" style="width:15px;height:15px;accent-color:var(--brand-600);cursor:pointer"
            ${p.on?'checked':''} ${editable?'':'disabled'} onchange="presToggle(${r.i}, this)"></td>
      <td class="nm"><b>${escHTML(r.n)}</b><span>${escHTML(r.s)}</span></td>
      <td>${escHTML(r.u)}</td>
      <td class="mono r" style="color:var(--text-3)">${fmt(r.q)}</td>
      <td class="r"><input class="qty" type="number" step="${qtyStep(r.u)}" min="0" style="width:84px;height:30px;text-align:right;border:1px solid #D9D9D9;border-radius:6px;padding:0 8px;font-variant-numeric:tabular-nums"
            value="${p.qty}" ${dis} oninput="presSetQ(${r.i}, this.value)"></td>
      <td class="mono r" id="pg-${r.i}" style="font-weight:600">${gapTxt}</td>
      <td>
        <select class="select" style="height:30px;font-size:12.5px;width:100%" ${dis} onchange="presSetR(${r.i}, this.value)">
          <option value="">请选择原因</option>${opts}
        </select>
      </td>
      <td>
        <input class="input txt" style="height:30px;font-size:12.5px" value="${escHTML(p.note)}" placeholder="选填，≤100 字" ${dis} oninput="presSetN(${r.i}, this.value)">
      </td>
    </tr>`;
  }).join('');

  /* 台账取该订单明细里所有 pres 记录：原有演示单、新提交的、以及食堂回音都在这里现算 */
  const ledger = pres.length ? pres.map(r=>{
    const pr = r.pres, g = r.q - (Number(pr.qty)||0);
    const hd = pr.handled || '待回音';
    const hdTag = hd==='已找替补' ? tag('已找替补','done')
      : hd==='接受减量' ? tag('接受减量','proc')
      : hd==='待回音' ? tag('待回音','wait') : tag(hd,'off');
    const readAt = pr.readAt || (hd==='待回音' ? '<span class="hint">待回音</span>' : '10-26 18:30');
    return `
    <tr>
      <td class="name">${escHTML(r.n)}</td>
      <td class="mono r">${fmt(r.q)} ${escHTML(r.u)}</td>
      <td class="mono r">${fmt(pr.qty)} ${escHTML(r.u)}</td>
      <td class="mono r" style="color:${g>0?'var(--warning)':'var(--text-4)'}">${g>0?'−'+fmt(g)+' '+escHTML(r.u):'0'}</td>
      <td>${pr.reason==='—'?'<span class="hint">—</span>':escHTML(pr.reason||'—')}</td>
      <td class="mono">${escHTML(pr.time||'—')}</td>
      <td class="mono">${readAt}</td>
      <td>${hdTag}</td>
    </tr>`;
  }).join('') : `
    <tr><td colspan="8" class="hint" style="padding:18px 20px;line-height:1.8">
      本单（${o.no}）暂无缺货预告记录。勾选上方「供不上的行」并提交后，记录与食堂回音会在此逐行展示。
    </td></tr>`;

  const backBtn = `<button class="btn btn-default" onclick="go('${D05_BACK}')">${I.back}${D05_BACK_LABEL[D05_BACK]||'返回'}</button>`;
  const submitBtn = `<button class="btn btn-primary" onclick="presSubmit()">${I.bell}提交预告并推送食堂</button>`;

  return pagehd('缺货预告',
      `<span class="mono">${o.no}</span> · ${escHTML(o.store)} · ${lines.length} 行 · 已预告 <b>${pres.length} 行</b>${editable?' · 未发货前均可上报':' · 该订单已发货，仅供查看'}`,
      backBtn + (editable ? submitBtn : ''),
      tag(editable?'未发货前可上报':'已发货 · 只读', editable?'done':'off')) +
  `

  <div class="card pad0">
    <div class="card-hd">
      <h3>勾选供不上的行 <span class="sub">未勾选的行视为可以足量供应 · 预计可供量按整件填写</span></h3>

/* 提交 = 真正把预告写回该订单的商品行，而不是只弹一个提示。
   D02 缺货预告卡、E02/E04 预估备货量、D03 备货汇总都读同一份 ordLines()，因此一处落库全站同步。 */
function presSubmit(){
  const o = presOrder();
  if(o.st !== 'CONFIRMED'){ toast('该订单已发货或不在「已确认」状态，缺货预告入口已关闭','err'); return; }
  const lines = presLines(), S = presState();
  const {on, ratio} = presCalc();
  if(on === 0){ toast('请至少勾选一行需要预告的商品','err'); return; }
  /* 逐行校验：原因码必填、预计可供量须在 0 ~ 下单量 之间 */
  const bad = lines.filter(r=>{
    const p = S[r.i];
    if(!p.on) return false;
    if(!p.reason) return true;
    const q = p.qty==='' ? 0 : Number(p.qty);
    return !isFinite(q) || q < 0 || q > r.q;
  });
  if(bad.length){
    toast('第 '+bad.map(r=>r.i).join('、')+' 行未完成：请选原因码，且预计可供量需在 0 ~ 下单量 之间','err');
    return;
  }
  const noteAll = ((document.getElementById('pres-note-all')||{}).value || '').trim();
  if(ratio > 0.5 && !noteAll){ toast('预告行数超过半数，请先填写整单说明','err'); return; }

  const stamp = presStamp();
  lines.forEach(r=>{
    const p = S[r.i], old = r.pres;
    if(p.on){
      r.pres = {
        qty: p.qty==='' ? 0 : qtyNorm(p.qty, r.u),
        reason: p.reason,
        note: p.note,
        time: (old && old.time) || stamp,
        handled: (old && old.handled) || '待回音',
        readAt: (old && old.readAt) || '',
        late: old ? !!old.late : false,
        allNote: ratio > 0.5 ? noteAll : ((old && old.allNote) || '')
      };
      p.qty = r.pres.qty; p.handled = r.pres.handled; p.time = r.pres.time; p.late = r.pres.late;
    } else {
      r.pres = null;   /* 取消勾选 = 撤回该行预告 */
      S[r.i] = {on:false, qty:r.q, reason:'', note:'', late:false, handled:'', time:'', readAt:''};
    }
    /* 预估备货量 = 下单量 − 预告缺口，随预告同步刷新 */
    r.plan = qtyNorm(ordPlanQty(r), r.u);
    /* 主数据 ROWS 是 PO-…0081 的商品行来源，同步一份避免 E06 等旧屏读到旧预告 */
    if(o.no === ORDER.no){ const rr = ROWS.find(x=>x.i===r.i); if(rr) rr.pres = r.pres; }
  });
  delete PRES_BY_ORDER[o.no];   /* 下次进入由落库后的 ordLines 重新初始化编辑态 */
  toast('已推送食堂：'+on+' 行缺货预告 · '+o.no);
  setTimeout(()=>go(D05_BACK), 700);
}

   门店下单只到「日」，订单的 date 是 'MM-DD' 短格式，与自动建单时的 '2026-'+o.date 同口径。
   日期固定也是食安报告有效期自动关联（R87）的判定基准，不能随填写动作漂移。 */
function shipDateFromOrder(sh){
  const o = sh && ORDERS.find(x=>x.no===sh.order);
  if(!o || !o.date) return sh ? sh.date : '';
  const d = String(o.date).trim().split(' ')[0];
  return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : ('2026-'+d);
}
/* 配送时间 = 配送日期 + 选填的送达时间（时分），E01 / E04 / K05 共用同一份拼接口径。

   未填送达时间时只显示日期，不补占位符 —— 选填就是允许没有。 */
function shipTimeText(sh){
  if(!sh) return '';
  const a = String(sh.arrival||'').trim();
  if(!a) return sh.date;
  const m = a.match(/^(\d{1,2}):(\d{2})$/);
  return sh.date + ' ' + (m ? (Number(m[1])+':'+m[2]) : a);
}

function shipBaseLines(sh){
  const ord = ORDERS.find(o=>o.no===sh.order);
  const src = ord ? ordLines(ord) : ROWS.map(r=>({...r, amt:r.q*r.p, pres:null, plan:r.q}));
  return src.map(r=>({
    i:r.i, n:r.n, s:r.s, u:r.u, q:r.q, p:r.p, c:r.c,
    pid:r.pid||'', sid:r.sid||'',
    amt:r.amt, pres:r.pres||null, plan:ordPlanQty(r)
  }));
}
function shipAutoLines(sh){

  return shipBaseLines(sh).map(l=>({...l, qty:l.q, off:false, note:''}));
}
/* 历史只读单：SKU / 规格 / 单位 / 下单量 / 单价全部取自己的订单行，按足量发货落快照 */
function shipLockedLines(sh){
  return shipBaseLines(sh).map(l=>({...l, qty:l.q, off:false, note:''}));
}
/* 行级校验：没勾「本行不发」且实发量未填 / 为 0（或非法）→ 不允许提交 */
function shipInvalidLines(lines){
  return lines.filter(l=>{
    if(l.off) return false;
    const v = l.qty;
    if(v==='' || v===null || v===undefined) return true;
    const n = Number(v);
    if(!isFinite(n) || n<=0) return true;
    /* 包装单位不允许 3.5 件这种实发量 */
    return !qtyOk(n, l.u);
  });
}
function shipPrepared(sh){
  if(shipLocked(sh)) return true;
  /* 预填值是预估量、不是实际出库量：至少显式保存 / 核对过一次才能确认发货 */
  return !!(sh.savedAt || sh.prepared);
}
function shipLinesOf(sh){
  if(sh.lines) return sh.lines;
  if(sh.savedLines) return sh.savedLines;
  if(shipLocked(sh)) return shipLockedLines(sh);
  return shipAutoLines(sh);
}
function shipAmtOf(sh){ return shipLineAmt(shipLinesOf(sh)); }
function shipDiffOf(sh){
  return shipLinesOf(sh).filter(l=>l.off || (l.qty!=='' && Number(l.qty)!==l.q)).length;
}
function shipEditLines(){ return shipBaseLines(curShip()); }

/* 订单 ↔ 发货单 一致性自检：覆盖全部订单，回归时一跑便知有无遗漏。
   规则（一单一发）：已确认 / 已发货 / 验收中 / 已完成 必须且只能挂一张系统自动生成的发货单；
   「已确认」→ 待发货；已发货及之后 → 只读单 + 送货单；待确认 / 已拒绝 / 已关闭 → 不挂发货单；
   发货单门店须与其订单一致；所有发货单都能找到上游订单（不留孤儿单）。 */
function shipAudit(){
  const bad = [], archived = [];
  const past = ['SHIPPED','ACCEPTING','COMPLETED'];
  SHIPMENTS.forEach(sh=>{
    if(sh.del) return;
    const ord = ORDERS.find(o=>o.no===sh.order);
    if(!ord){ archived.push(sh.no); return; }
    if(sh.store!==ord.store)
      bad.push(sh.no+' 门店「'+sh.store+'」≠ 订单 '+sh.order+'「'+ord.store+'」');
    /* 商品行不变量：发货单的品名 / 规格 / 单位 / 下单量必须逐行等于关联订单 */
    const ol = ordLines(ord), sl = shipLinesOf(sh);
    if(sl.length!==ol.length || ol.some((r,i)=>!sl[i] || sl[i].n!==r.n || sl[i].s!==r.s ||
       sl[i].u!==r.u || Number(sl[i].q)!==Number(r.q)))
      bad.push(sh.no+' 商品行与订单 '+sh.order+' 不一致');
    const n = SHIPMENTS.filter(x=>x.order===sh.order && !x.del).length;
    if(n!==1) bad.push('订单 '+sh.order+' 挂了 '+n+' 张发货单（违反一单一发）');
    if(ord.st==='PENDING_CONFIRM' || ord.st==='REJECTED')
      bad.push(sh.no+' 的订单 '+sh.order+' 已 '+stLabel(ord.st)+'，不应挂发货单');
    /* 订单过期关闭时，自动生成的待发货单同步作废为「已关闭」，保留作追溯、不再可编辑 */
    if(ord.st==='CLOSED' && sh.st!=='CLOSED')
      bad.push(sh.no+' 的订单 '+sh.order+' 已关闭，但发货单仍为 '+SHIP_ST[sh.st][0]);
    if(ord.st==='CONFIRMED' && sh.st!=='WAIT')
      bad.push(sh.no+' 不是待发货，但订单 '+sh.order+' 仍为「已确认」');
    if(past.indexOf(ord.st)>=0 && !shipLocked(sh))
      bad.push(sh.no+' 仍可编辑，但订单 '+sh.order+' 已 '+stLabel(ord.st));
    if(past.indexOf(ord.st)>=0 && !dnOf(sh)) bad.push(sh.no+' 缺随货送货单');
  });
  ORDERS.forEach(o=>{
    const list = SHIPMENTS.filter(x=>x.order===o.no && !x.del);
    if(o.st==='PENDING_CONFIRM' || o.st==='REJECTED'){
      if(list.length) bad.push('订单 '+o.no+'（'+stLabel(o.st)+'）不应挂发货单');
      return;
    }
    if(o.st==='CLOSED'){
      if(list.some(x=>x.st!=='CLOSED')) bad.push('订单 '+o.no+'（已关闭）仍有未作废的发货单');
      return;
    }
    if(!list.length) bad.push('订单 '+o.no+'（'+stLabel(o.st)+'）缺系统自动生成的发货单');
  });
  /* 验收单关联不变量（双向）：验收单由门店侧验收后回写产生，供应端只读。
     · 待发货 / 已发货阶段不得挂任何验收单（「已发货 · 待门店验收」是合法中间态）；
     · 一旦挂了验收单，发货单与订单都应联动进入「已完成」；
     · 反过来，进入「已完成」的发货单 / 订单必须能查到一张验收单 —— 验收结论回写
       才进入已完成，所以「已完成 ⇔ 有验收单」一一对应，不能出现已完成 8 单只列 5 条验收结果；
     · 一单一验，验收单的门店 / 验收时间 / 数量口径必须与发货单自洽。 */
  const seenSh = {};
  ACCEPTANCES.forEach(a=>{
    const sh = SHIPMENTS.find(x=>x.no===a.sh);
    if(!sh){ bad.push('验收单 '+a.no+' 指向不存在的发货单 '+a.sh); return; }
    if(sh.st!=='COMPLETED') bad.push('验收单 '+a.no+' 关联的发货单 '+a.sh+' 不是已完成（'+SHIP_ST[sh.st][0]+'）');
    const ord = ORDERS.find(o=>o.no===sh.order);
    if(ord && ord.st!=='COMPLETED') bad.push('验收单 '+a.no+' 关联的订单 '+sh.order+' 不是已完成（'+stLabel(ord.st)+'）');
    if(seenSh[a.sh]) bad.push('发货单 '+a.sh+' 关联了多张验收单（'+seenSh[a.sh]+' / '+a.no+'），违反一单一验');
    seenSh[a.sh] = a.no;
    if(a.store!==sh.store) bad.push('验收单 '+a.no+' 门店「'+a.store+'」≠ 发货单 '+a.sh+'「'+sh.store+'」');
    if(sh.acceptedAt && a.t!==sh.acceptedAt)
      bad.push('验收单 '+a.no+' 验收时间 '+a.t+' ≠ 发货单 '+a.sh+' 验收完成时间 '+sh.acceptedAt);
    if(a.ok!==a.got-a.rej) bad.push('验收单 '+a.no+' 合格量 '+a.ok+' ≠ 实收 '+a.got+' − 拒收 '+a.rej);
  });
  SHIPMENTS.forEach(sh=>{
    const a = ysOf(sh);
    if(a && (sh.st==='WAIT' || sh.st==='SHIPPED'))
      bad.push(sh.no+' 处于'+SHIP_ST[sh.st][0]+'却已关联验收单 '+a.no+'（验收应由门店回写后才产生）');
    if(sh.st==='COMPLETED' && !a)
      bad.push(sh.no+' 已完成但缺关联验收单（验收结论回写才进入已完成，必须一一对应）');
  });
  ORDERS.forEach(o=>{
    if(o.st!=='COMPLETED') return;
    const sh = SHIPMENTS.find(x=>x.order===o.no);
    if(sh && !ysOf(sh)) bad.push('订单 '+o.no+' 已完成，但其发货单 '+sh.no+' 缺关联验收单');
  });
  /* 验收明细一致性：逐行必须长在该验收单关联发货单的商品行上，
     汇总字段不得再独立编造 —— 全部由 ysSummary() 派生并回填，护栏逐项复核。 */
  ACCEPTANCES.forEach(a=>{
    const sh = SHIPMENTS.find(x=>x.no===a.sh);
    if(!sh) return;
    const s  = ysSummary(a);
    const sl = shipLinesOf(sh);
    if(s.rows.length!==sl.length)
      bad.push('验收单 '+a.no+' 明细 '+s.rows.length+' 行 ≠ 发货单 '+a.sh+' 商品 '+sl.length+' 行');
    s.rows.forEach((x,i)=>{
      const l = sl[i];
      if(!l) return;
      const tagLine = '验收单 '+a.no+' 第'+x.r.i+'行';
      if(x.r.n!==l.n || x.r.s!==l.s || x.r.u!==l.u ||
         Number(x.r.q)!==Number(l.q) || Number(x.r.p)!==Number(l.p))
        bad.push(tagLine+' 商品信息 ≠ 发货单 '+a.sh+' 的商品行（验收明细必须取自发货单）');
      if(x.ship!==Number(l.qty)) bad.push(tagLine+' 实发量 ≠ 发货单 '+a.sh);
      if(x.got>x.ship || x.rej>x.got || x.ok!==x.got-x.rej)
        bad.push(tagLine+' 数量口径不自洽（实收 / 拒收 / 合格量）');
      if(Math.round(x.amt*100)!==Math.round(x.ok*x.r.p*100))
        bad.push(tagLine+' 结算金额 ≠ 合格量 × 单价');
    });
    ['due','got','rej','ok','diff','res','cls'].forEach(k=>{
      if(a[k]!==s[k]) bad.push('验收单 '+a.no+' 汇总字段 '+k+'='+a[k]+' ≠ 明细派生 '+s[k]);
    });
    if(Math.abs(a.amt-s.amt)>0.001)
      bad.push('验收单 '+a.no+' 结算金额 '+a.amt+' ≠ Σ(合格量 × 单价) '+s.amt);
    if(s.amt>s.shipAmt+0.001)
      bad.push('验收单 '+a.no+' 结算金额 '+s.amt+' 超过发货金额 '+s.shipAmt);
    if(s.res==='全部合格' && (s.diff!==0 || Math.abs(s.amt-s.shipAmt)>0.001))
      bad.push('验收单 '+a.no+' 标记全部合格却有 '+s.diff+' 行差异 / 结算金额 ≠ 发货金额');
  });
  /* 验收环节不变量：门店提交第一次验收数据（订单进入验收中，发货单仍为已发货）→ 验收完成 → 两张单进入已完成。
     已完成发货单必须留齐 acceptingAt / acceptedAt，且时间顺序不得倒流。 */
  SHIPMENTS.forEach(sh=>{
    if(sh.st!=='COMPLETED') return;
    if(!sh.acceptingAt) bad.push(sh.no+' 已完成但缺「门店首次提交验收数据」时间 acceptingAt');
    if(!sh.acceptedAt)  bad.push(sh.no+' 已完成但缺「进入已完成」时间 acceptedAt');
    if(sh.dispatchedAt && sh.acceptingAt && sh.dispatchedAt > sh.acceptingAt)
      bad.push(sh.no+' 门店首次提交验收数据时间早于确认发货时间');
    if(sh.acceptingAt && sh.acceptedAt && sh.acceptingAt > sh.acceptedAt)
      bad.push(sh.no+' 门店首次提交验收数据时间晚于验收完成时间');
  });
  /* 展示金额不变量：发货单 / 送货单金额必须等于各自商品行合计，行数必须等于商品行数。
     防止源码里再写死一个与明细不符的初始值（例如旧版 2005.30 与真实 1997.10）。 */
  SHIPMENTS.forEach(sh=>{
    const real = shipLineAmt(shipLinesOf(sh));
    if(Math.abs(sh.amt-real)>0.001)
      bad.push(sh.no+' 展示金额 '+sh.amt+' ≠ 商品行合计 '+real);
    const dn = dnOf(sh);
    if(dn && Math.abs(dn.amt-real)>0.001)
      bad.push('送货单 '+dn.no+' 金额 '+dn.amt+' ≠ 发货单 '+sh.no+' 商品行合计 '+real);
    if(dn && dn.lines!==shipLinesOf(sh).length)
      bad.push('送货单 '+dn.no+' 行数 '+dn.lines+' ≠ 发货单 '+sh.no+' 商品行数');
  });
  /* 数量口径不变量：整件计数、金额由明细派生 */
  ordAudit().bad.forEach(x=>bad.push(x));
  return {bad:bad, archived:archived, orders:ORDERS.length, ships:SHIPMENTS.length};
}

/* 全站数量自检：所有订单行 / 发货行的数量必须符合单位粒度，金额必须 = 数量 × 单价 */
function ordAudit(){
  const bad = []; let lines = 0;
  const cents = x => Math.round(Number(x)*100);
  ORDERS.forEach(o=>{
    const ls = ordLines(o); lines += ls.length;
    const sum = cents(ls.reduce((a,r)=>a+r.amt,0));
    if(cents(o.amt)!==sum) bad.push(o.no+' 订单金额 '+o.amt+' ≠ 明细合计 '+(sum/100).toFixed(2));
    ls.forEach(r=>{
      if(!qtyOk(r.q,r.u)) bad.push(o.no+'#'+r.i+' 下单量 '+r.q+' '+r.u+' 非整件');
      if(!qtyOk(r.plan,r.u)) bad.push(o.no+'#'+r.i+' 预估备货量 '+r.plan+' 非整件');
      if(!qtyOk(r.act,r.u)) bad.push(o.no+'#'+r.i+' 实发量 '+r.act+' 非整件');
      if(cents(r.amt)!==cents(r.q*r.p)) bad.push(o.no+'#'+r.i+' 行金额 ≠ 下单量 × 单价');
    });
  });
  SHIPMENTS.forEach(sh=>{
    shipLinesOf(sh).forEach(l=>{
      if(l.qty==='' || l.off) return;
      if(!qtyOk(l.qty,l.u)) bad.push(sh.no+'#'+l.i+' 实发量 '+l.qty+' '+l.u+' 非整件');
    });
  });
  return {bad:bad, orders:ORDERS.length, lines:lines};
}

/* 系统自动建单：一个订单有且仅有一张发货单。
   门店直采 = 确认接单那一刻；询价中标 = 中标生成那一刻（无人工确认动作，由 bootstrap 按中标时刻补建）。
   已存在就直接返回，绝不重复建单；补发另走新订单，不在本单上追加。 */
function shipAutoCreate(o, at){
  if(!o || ['CONFIRMED','SHIPPED','ACCEPTING','COMPLETED'].indexOf(o.st)<0) return null;
  const exist = shipOf(o.no);
  if(exist) return exist;
  const sh = {no:nextShipNo(), order:o.no, store:o.store, stall:o.stall,
              date:'2026-'+(o.date||'').split(' ')[0], st:'WAIT', amt:0, diff:0,
              shipper:CUR_ACCOUNT.name, phone:CUR_ACCOUNT.phone,
              createdAt:at || o.confirmedAt || nowStamp(), savedAt:'', dispatchedAt:'',
              auto:true, createdBy:'系统自动生成', prepared:false,
              arrival:'',   /* 运行时补建的单同样带选填字段；待发货单尚无实际送达时刻 */
              note:'', lines:null, savedLines:null};
  SHIPMENTS.unshift(sh);
  /* 预填：实发量 = 下单量（足量备货）；缺货预告在确认后才可能产生，建单时刻不预扣 */
  sh.savedLines = shipAutoLines(sh);
  sh.amt = shipLineAmt(sh.savedLines);
  sh.diff = shipDiffOf(sh);
  return sh;
}
function nextShipNo(){
  const nums = SHIPMENTS.map(x=>Number(x.no.slice(-4))).filter(n=>!isNaN(n));
  const max = nums.length ? Math.max.apply(null, nums) : 40;
  return 'SH-20261026-' + String(max+1).padStart(4,'0');
}
function shipOpen(no){ CUR_SHIP_FROM='e01'; CUR_SHIP_NO=no; const sh=curShip(); if(!shipLocked(sh)) shipLoadSaved(sh); go('E04'); }
function shipOpenByOrder(no){
  const sh = shipOf(no);
  if(sh) shipOpen(sh.no); else toast('该订单还没有发货单');
}
/* 打开一张待发货单时，按这张单自己的订单行回填编辑态（填写与二次修改是同一处）。
   发货人、电话、整单备注与逐行备注都按单重置，避免串到上一张单。 */
function shipInitFor(sh){
  SHIP_META.notes = {};
  SHIP_META.note = sh.note || '';
  SHIP_META.shipper = sh.shipper || CUR_ACCOUNT.name;
  SHIP_META.phone = sh.phone || CUR_ACCOUNT.phone;
  SHIP_META.arrival = sh.arrival || '';   /* 送达时间也按单重置，避免串到上一张发货单 */
  const ls = sh.savedLines || sh.lines || shipAutoLines(sh);
  SHIP = {};
  ls.forEach(l=>{
    SHIP[l.i] = {qty:l.off ? 0 : (l.qty==='' ? '' : Number(l.qty)), off:!!l.off, keep:l.qty};
    SHIP_META.notes[l.i] = l.note || '';
  });
}
function shipLoadSaved(sh){ shipInitFor(sh); }
function shipCreateForOrder(no){
  CUR_SHIP_FROM='e01';
  const sh = shipOf(no);
  if(!sh){ toast('该订单还没有发货单'); return; }
  CUR_SHIP_NO = sh.no;
  if(shipLocked(sh)){ go('E04'); return; }
  shipLoadSaved(sh); go('E02');
}
/* 快捷入口优先落到「已核对保存」的待发货单，未核对的自动单留给对应订单自行核对 */
function shipFirstWait(){
  return SHIPMENTS.find(x=>x.st==='WAIT' && shipPrepared(x)) || SHIPMENTS.find(x=>x.st==='WAIT') || null;
}
/* 待发货数 = 处于 WAIT 状态的发货单数（与 E01 页头、A04 待办、左侧徽标同源）。 */
function shipWaitCount(){ return SHIPMENTS.filter(x=>x.st==='WAIT' && !x.del).length; }
function shipEditNo(no, from){
  CUR_SHIP_FROM = from || 'e01';
  const sh = SHIPMENTS.find(x=>x.no===no);
  if(!sh || shipLocked(sh)){ toast('该发货单不可编辑'); return; }
  CUR_SHIP_NO = sh.no;
  shipLoadSaved(sh);
  go('E02');
}
/* 工作台 / 待办等通用入口：总是落到当前可编辑的那张发货单 */
function shipEdit(){
  const sh = shipFirstWait();
  if(!sh){ toast('当前没有待发货的发货单'); return; }
  shipEditNo(sh.no, 'e01');
}
/* 从发货单详情点「修改发货信息」：保留进入来源，回到同一张单的编辑页 */
function shipEditCurrent(){ shipEditNo(curShip().no, CUR_SHIP_FROM); }

/* 订单详情「查看发货单」：只做关联发货单的查看与维护，不提供发货下一步。
   一期没有人工建单入口；万一查不到，按系统不变量补建，绝不进入空白新建表单。 */
function orderShipOpen(no){
  const ord = ORDERS.find(x=>x.no===no);
  let sh = shipOf(no);
  if(!sh && ord) sh = shipAutoCreate(ord, ord.confirmedAt || nowStamp());
  if(!sh){ toast('该订单暂无关联发货单','err'); return; }
  CUR_SHIP_NO = sh.no;
  CUR_SHIP_FROM = 'order';
  if(!shipLocked(sh)) shipLoadSaved(sh);
  go('E04');
}
/* 旧入口兼容：人工「创建发货单」已取消，一律改为打开系统自动生成的那张单 */
function orderShipCreate(no){ return orderShipOpen(no); }
function shipSaveAndBack(){
  if(!shipSave(true)) return;
  toast('已保存，状态仍为「待发货」；确认发货请在「发货单详情」中进行');
  go('E04');
}
function shipDetailLines(sh){ return shipLinesOf(sh); }
function shipDraftLines(){
  return shipEditLines().map(l=>{
    const s = SHIP[l.i] || {qty:'', off:false};
    return {...l, qty:s.off ? 0 : (s.qty==='' ? '' : (Number(s.qty)||0)),
            off:!!s.off, note:SHIP_META.notes[l.i]||''};
  });
}
function shipLineAmt(lines){ return lines.reduce((a,l)=>a + (l.off?0:(Number(l.qty)||0))*l.p, 0); }
function shipDiffCount(sh){ return shipDiffOf(sh); }
/* 离开 E02 前收集输入：切页后 DOM 会重建，所以填写内容先落到全局 */
function e02Collect(){
  /* 发货日期 sh.date 不在这里采集：它来自采购订单、E02 只读展示，任何路径都不写回。 */
  const sp=document.getElementById('e02-shipper'), ph=document.getElementById('e02-phone'), nt=document.getElementById('e02-note');
  const ar=document.getElementById('e02-arrival');
  if(sp) SHIP_META.shipper = sp.value.trim() || CUR_ACCOUNT.name;
  if(ph) SHIP_META.phone   = ph.value.trim();   /* 必填：留空不回退，由 shipSave 拦截 */
  if(nt) SHIP_META.note    = nt.value.trim();
  if(ar) SHIP_META.arrival = ar.value.trim();   /* 选填：留空就是没有送达时间 */
  shipEditLines().forEach(l=>{ const el=document.getElementById('snote-'+l.i); if(el) SHIP_META.notes[l.i]=el.value.trim(); });
}
/* 保存即进入同一张发货单详情：核对与确认发货都在 E04，不再单列「确认发货单」屏，
   底部也不再放「下一步」按钮（保存成功即跳转）。 */
function shipSaveOpen(){ if(shipSave()) go('E04'); }

/* 提交校验：把未填 / 为 0 且未勾「本行不发」的行标红，并给出逐行提示 */
function shipMarkErrors(bad){
  const box = document.getElementById('s-err');
  if(box){
    const names = bad.slice(0,4).map(l=>'第 '+l.i+' 行「'+l.n+'」').join('、') + (bad.length>4?' 等 '+bad.length+' 行':'');
    box.innerHTML = '<div class="banner err">' + I.warn +
      '<div><div class="t">有 '+bad.length+' 行实发量未填或为 0 / 不是整件数，暂不能保存</div>' +
      names + '：按包装单位整件计数，请填写大于 0 的整数，或勾选「本行不发」。红框标出的输入框需要补充。</div></div>';
    box.style.display = 'block';
  }
  bad.forEach(l=>{
    const inp = document.getElementById('sq-'+l.i);
    if(inp){
      inp.classList.add('bad');
      if(l.qty==='' || Number(l.qty)===0) inp.value = l.qty;   /* 让红框里显示真实的 0 / 空值 */
    }
    const tr = document.getElementById('sr-'+l.i); if(tr) tr.classList.add('row-bad');
  });
  const first = bad.length && document.getElementById('sq-'+bad[0].i);
  if(first){
    try{
      const r = first.getBoundingClientRect();
      if(r.top < 0 || r.bottom > window.innerHeight) first.scrollIntoView({block:'center'});
    }catch(e){}
  }
}
function shipClearErrors(){
  document.querySelectorAll('table.ship input.qty.bad').forEach(x=>x.classList.remove('bad'));
  document.querySelectorAll('table.ship tr.row-bad').forEach(x=>x.classList.remove('row-bad'));
  const ph = document.getElementById('e02-phone'); if(ph) ph.classList.remove('err');
  const box = document.getElementById('s-err');
  if(box){ box.innerHTML=''; box.style.display='none'; }
}
function shipErrClear(i){
  const inp = document.getElementById('sq-'+i); if(inp) inp.classList.remove('bad');
  const tr  = document.getElementById('sr-'+i); if(tr) tr.classList.remove('row-bad');
  if(!document.querySelector('table.ship input.qty.bad')){
    const box = document.getElementById('s-err');
    if(box){ box.innerHTML=''; box.style.display='none'; }
  }
}

/* 保存 = 留痕：把当前填写写回同一张「待发货」单，不改状态、不推进订单、不生成送货单。
   draft=true 仅供 go() 离开编辑页时做静默暂存（不写保存时间、不视为已核对），
   显式「保存 / 保存并返回 / 下一步」一律走行级校验，不通过则不落库。 */
function shipSave(quiet, draft){
  const sh = curShip();
  if(shipLocked(sh)){ if(!quiet) toast('该发货单已确认发货并锁定','err'); return false; }
  /* 发货日期恒定：由采购订单带入且 E02 只读；若被控制台 / 残留状态改动，这里纠正回订单配送日期，
     保证食安报告有效期自动关联的判定基准不被改掉。 */
  sh.date = shipDateFromOrder(sh);
  e02Collect();
  const lines = shipDraftLines();
  if(!draft){
    /* 联系电话必填：清空后不允许保存，输入框红框 + 顶部错误区提示 */
    if(!SHIP_META.phone){
      const ph = document.getElementById('e02-phone');
      if(ph){ ph.classList.add('err'); ph.focus(); }
      const box = document.getElementById('s-err');
      if(box){
        box.innerHTML = '<div class="banner err">' + I.warn +
          '<div><div class="t">联系电话为必填项，暂不能保存</div>请填写发货人联系电话后再保存。</div></div>';
        box.style.display = 'block';
      }
      toast('联系电话为必填项，请填写后再保存','err');
      return false;
    }
    const bad = shipInvalidLines(lines);
    if(bad.length){
      shipMarkErrors(bad);
      toast('有 '+bad.length+' 行实发量未填或为 0 / 不是整件数，请补充后再保存','err');
      return false;
    }
    shipClearErrors();
  }
  sh.savedLines = lines;
  sh.amt = shipLineAmt(lines);
  sh.diff = shipDiffOf(sh);
  sh.shipper = SHIP_META.shipper;
  sh.phone = SHIP_META.phone;
  sh.note = SHIP_META.note;
  sh.arrival = SHIP_META.arrival;   /* 送达时间随保存写回同一张发货单，E01 列表即时刷新 */
  if(!draft){
    sh.prepared = true;
    sh.savedAt = nowStamp();
    if(!quiet) toast('已保存，状态仍为「待发货」，除发货日期外确认发货前可继续修改');
  }
  return true;
}
/* 确认发货 = 真正发货：锁定快照、把订单推进到「已发货」、生成送货单。
   注意：这一步不产生、不关联任何验收单 —— 验收由门店侧完成，验收信息与结论回写
   供应端后才新增验收单，并把订单 / 发货单联动推进到「已完成」。
   一单一发：只认这一张系统自动生成的单，且必须已核对保存、逐行实发量合法。 */
function shipDispatch(){
  const sh = curShip();
  if(shipLocked(sh)){ toast('该发货单已确认发货，不能重复操作','err'); go('E04'); return; }
  const ord = ORDERS.find(o=>o.no===sh.order);
  if(!ord || ord.st!=='CONFIRMED'){ toast('关联订单不是「已确认」，不能确认发货','err'); return; }
  if(!shipPrepared(sh)){ toast('请先核对实发量并保存，再确认发货','err'); shipEditNo(sh.no, CUR_SHIP_FROM); return; }
  const lines = shipLinesOf(sh);
  if(shipInvalidLines(lines).length){ toast('存在未填或为 0 的实发量，请先修改发货信息','err'); shipEditNo(sh.no, CUR_SHIP_FROM); return; }
  sh.lines = lines;
  sh.savedLines = lines;
  sh.amt = shipLineAmt(lines);
  sh.diff = shipDiffOf(sh);
  sh.dispatchedAt = nowStamp();
  sh.st = 'SHIPPED';
  ord.st = 'SHIPPED';
  let dn = dnOf(sh);
  if(!dn){
    dn = {no:'DN-'+sh.no.slice(3), ship:sh.no, order:sh.order, store:sh.store,
          generatedAt:sh.dispatchedAt, lines:lines.length, amt:sh.amt, by:sh.shipper};
    DELIVERY_NOTES.unshift(dn);
  }
  toast('已确认发货：订单推进为「已发货」，送货单 '+dn.no+' 已生成');
  go('E04');
}

let SHIP = {};

/* 演示用：0041 是「系统自动建单后仓库已按实际出库量核对保存」的那一单，保留真实差异行 */
const INIT_WAIT = SHIPMENTS.find(x=>x.no==='SH-20261026-0041');
if(INIT_WAIT){
  const ls = shipBaseLines(INIT_WAIT).map(l=>{
    const r = ROWS.find(x=>x.i===l.i);
    const q = r ? r.act : l.q;
    return {...l, qty:q, off:q===0, note:''};
  });
  INIT_WAIT.savedLines = ls;
  INIT_WAIT.amt = shipLineAmt(ls);
  INIT_WAIT.diff = shipDiffOf(INIT_WAIT);
  INIT_WAIT.prepared = true;
}

/* 数据载入时按新口径补齐：两类订单「确认 / 中标」后都必须有一张系统自动生成的发货单。
   询价中标订单没有人工「确认接单」动作，所以这一条正是它的建单时点（中标生成）。 */
ORDERS.filter(o=>o.st==='CONFIRMED' && !shipOf(o.no)).forEach(o=>{
  const day = o.no.replace(/^[A-Z]+-(\d{4})(\d{2})(\d{2}).*$/, '$1-$2-$3');
  shipAutoCreate(o, o.confirmedAt || day + (o.type==='plan' ? ' 09:12' : ' 10:05'));
});
shipAutoCloseExpired();
/* 历史只读单：商品行、金额、行数与变动行一律按各自订单行重算，送货单同步，
   避免只读详情还显示 PO-…0081 的 18 行商品。 */
SHIPMENTS.filter(sh=>shipLocked(sh)).forEach(sh=>{
  const ls = shipLinesOf(sh);
  sh.amt = shipLineAmt(ls);
  sh.diff = shipDiffOf(sh);
  const dn = dnOf(sh);
  if(dn){ dn.lines = ls.length; dn.amt = sh.amt; }
});
shipInitFor(curShip());

function shipJudge(i){
  const r = shipEditLines().find(x=>x.i===i);
  const s = SHIP[i];
  if(!r || !s) return {k:'void', txt:'整行未发', dev:-100};
  if(s.off) return {k:'void', txt:'整行未发', dev:-100};
  const q = (s.qty===''||isNaN(s.qty)) ? 0 : Number(s.qty);
  return judge(r, q);
}
function devTxt(j){
  if(j.k==='normal') return '—';
  if(j.k==='void') return '−100%';
  return (j.dev>0?'+':'') + j.dev.toFixed(1) + '%';
}
function shipStats(){
  let normal=0, fl=0, df=0, vd=0, amt=0, tell=0, silent=0;
  shipEditLines().forEach(r=>{
    const j = shipJudge(r.i);
    if(j.k==='normal') normal++;
    else if(j.k==='float') fl++;
    else if(j.k==='void'){ vd++; r.pres?tell++:silent++; }
    else { df++; r.pres?tell++:silent++; }
    amt += (Number(SHIP[r.i].qty)||0) * r.p;
  });
  return {normal, fl, df, vd, amt, need:df+vd, tell, silent};
}
/* E02 一期不做阈值判定：金额只按实发量累加，不再统计浮差 / 超阈值 / 需说明 */
function e02Amt(){
  return shipEditLines().reduce((s,r)=> s + (SHIP[r.i] && !SHIP[r.i].off ? (Number(SHIP[r.i].qty)||0)*r.p : 0), 0);
}
function e02SummaryHTML(){
  const ls = shipEditLines(), shNo = curShip().no;
  const rptN = ls.reduce((n,l)=>n+linksOfLine(shNo, l.i).length, 0);
  const autoN = ls.reduce((n,l)=>n+linksOfLine(shNo, l.i).filter(x=>x.scene==='auto').length, 0);
  return `<span class="fi">共 <b>${ls.length}</b> 行 · 本行不发 <b>${ls.filter(r=>SHIP[r.i] && SHIP[r.i].off).length}</b> 行</span>
    <span class="fi">食安报告已关联 <b>${rptN}</b> 份（系统自动 <b>${autoN}</b> 份） <span class="hint">· 按有效期覆盖发货日期自动关联，无需确认 · 不进送货单 / 金额 / 不阻塞确认发货</span></span>
    <span style="margin-left:auto">实发合计金额 <b>${money(e02Amt())}</b></span>`;
}
/* 食安报告作为「发货明细」第 9 列的行内单元格：已关联 chip + 解绑 + 选择/上传入口。
   与 E04 共用同一份报告库引用数据，不复制文件、不写进冻结的商品行快照。 */
function e02ReportCellHTML(sh, l, locked){
  const lks = linksOfLine(sh.no, l.i);
  const chips = lks.length
    ? lks.map(lk=>{
        const r = reportById(lk.reportId) || {};
        const isAuto = lk.scene==='auto';
        const tip = `${r.name||'—'} · ${r.by||''} · ${(r.files||[]).length} 个文件 · 有效期 ${reportValidText(r)}` +
          (isAuto ? ` · ${lk.autoReason||'按有效期自动关联'}，无需确认` : '');
        return `<span class="rpt-chip${isAuto?' auto':''}${r.del?' void':''}" title="${tip}">${r.name||'—'}${isAuto?'<span class="hint" style="font-size:10.5px;margin-left:4px">自动</span>':''}${locked?'':`<span class="link" style="margin-left:5px" onclick="reportUnlink('${lk.id}')">×</span>`}</span>`;
      }).join('')
    : '<span class="hint">未关联</span>';
  const op = locked ? '<span class="hint">只读 · 到发货单详情明细行补传</span>'
    : `<span class="link" onclick="reportPickOpen('${sh.no}',${l.i},'E02')">${lks.length?'＋ 追加 / 上传':'＋ 选择 / 上传报告'}</span>`;
  return `<div class="rpt-cell">${chips}</div><div class="rpt-op">${op}</div>`;
}
/* 关联 / 解绑后只重绘报告单元格与汇总栏，不整屏 go('E02')：
   正在核对但尚未保存的实发量、逐行备注、发货人 / 电话 / 整单备注都不会被冲掉。 */
function e02ReportPaint(){
  const sh = curShip(), locked = shipLocked(sh);
  shipEditLines().forEach(l=>{
    const td = document.getElementById('srpt-'+l.i);
    if(td) td.innerHTML = e02ReportCellHTML(sh, l, locked);
  });
  shipPaint();   /* 汇总栏里的报告份数随之刷新 */
}
/* E02 走局部刷新（保住未保存的实发量 / 备注 / 发货人）；E04 是只读页，整屏刷新
   以同步流转记录的「补传食安报告」节点，但恢复滚动位置 —— 否则在明细表末尾补传完
   会跳回页面顶部，又要重新滚回去看结果。 */
function reportRefresh(back){
  const to = back || CUR;
  if(to==='E02' && CUR==='E02'){ e02ReportPaint(); return true; }
  if(to==='E04' && CUR==='E04'){
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    go('E04');
    window.scrollTo(0, y);
    return true;
  }
  return false;
}
function e02FootHTML(){
  const sh = curShip();
  if(shipLocked(sh)) return `<div class="lft">该发货单已于 ${sh.dispatchedAt} 确认发货并锁定，不可再修改</div>
    <div><button class="btn btn-primary" onclick="go('E04')">查看发货单</button></div>`;
  const tip = shipPrepared(sh) ? '' : ' · 下单量（足量）已预填，待核对保存';
  if(CUR_SHIP_FROM==='order') return `<div class="lft">关联订单 ${sh.order} · 待发货${tip}，确认发货请在「发货单详情」中进行</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="shipSaveAndBack()">保存并返回</button>
    </div>`;
  return `<div class="lft">共 ${shipEditLines().length} 行 · 实发合计 <b>${money(e02Amt())}</b> · 待发货${tip}，除发货日期（来自订单、只读）外确认发货前均可修改</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="shipSaveOpen()">保存并查看发货单</button>
    </div>`;
}
/* 重绘只同步「本行不发」的禁用状态与实发合计金额；只有确认发货后才锁定 */
function shipPaint(){
  const locked = shipLocked(curShip());
  shipEditLines().forEach(r=>{
    const inp = document.getElementById('sq-'+r.i);
    if(inp && SHIP[r.i]) inp.disabled = !!SHIP[r.i].off || locked;
  });
  const sb = document.getElementById('s-sumbar');
  if(sb) sb.innerHTML = e02SummaryHTML();
  const ft = document.getElementById('s-foot');
  if(ft) ft.innerHTML = e02FootHTML();
}

function shipSet(i, v){
  const s = SHIP[i];
  if(!s) return;
  const l = shipEditLines().find(x=>x.i===i);
  const u = l ? l.u : '件';
  if(v===''){ s.qty = ''; }
  else {
    const raw = Number(v);
    const n = qtyNorm(raw, u);
    s.qty = n;
    if(!isWeightUnit(u) && raw!==n){
      const inp = document.getElementById('sq-'+i);
      if(inp) inp.value = n;
      const t = Date.now();
      if(t - (window.__qtyTip||0) > 1800){ window.__qtyTip=t; toast('按「'+u+'」整件计数，已取整为 '+n); }
    }
  }
  if(!s.off) s.keep = s.qty;
  shipErrClear(i);
  shipPaint();
}
function shipOff(i, el){
  const s = SHIP[i];
  if(!s) return;
  if(el.checked){ s.keep = s.qty; s.qty = 0; } else { s.qty = (s.keep===''||s.keep===undefined) ? 0 : s.keep; }
  s.off = el.checked;
  const inp = document.getElementById('sq-'+i);
  if(inp) inp.value = s.qty;
  shipErrClear(i);
  shipPaint();
}
function shipReset(){
  SHIP = {};
  shipAutoLines(curShip()).forEach(l=>{
    SHIP[l.i] = {qty:l.qty, off:l.off, keep:l.qty};
  });
  shipClearErrors();
  shipPaint();
  toast('已恢复为下单量（足量备货，缺货预告尚未生成）');
}

/* ---------- E02 发货单编辑（关键屏） ---------- */
def('E02','发货单编辑','发货与分拣', ()=>{
  /* 一期不做阈值判定：明细按这张单自己的订单行生成，实发量按下单量（足量）预填。

        <thead><tr>
          <th class="c">行号</th><th>品名 / 包规</th><th class="c">单位</th><th class="r">下单量</th>
          <th class="r">预估备货量</th><th class="r">实发量</th><th class="r">单价</th><th class="r">订单金额</th>
          <th class="c">本行不发</th><th>备注</th>

/* E03「确认发货单」已并入 E04「发货单详情」：
   填写后点「下一步：查看发货单」、列表点「查看」、D02 点「查看发货单」，
   都是同一个环节、同一屏；按是否锁定决定可改、按钮与送货单卡片。 */

/* ============================================================
   F 段 · 验收与售后
   ============================================================ */
/* ============================================================
   验收明细数据层（门店侧回写，供应端只读）
   ------------------------------------------------------------
   唯一来源：该验收单关联发货单的「只读商品行」shipLinesOf(sh)。
   品名 / 规格 / 单位 / 下单量 / 单价 / 实发量一律不在这里重写，全部继承发货单；
   YS_DIFF 只记录食堂现场对「哪一行、扣多少、为什么」的判定。
   F01 验收结果、F02 验收详情、F06 验收台账、shipAudit() 共用这份派生数据，
   所以「应收 → 实发 → 实收 → 拒收 → 合格量 → 结算金额」在每一屏都必然相同。
   ============================================================ */
/* i = 发货单商品行号；short = 实收少于实发的件数；rej = 拒收。
   未列出的验收单 = 全部按发货明细点收合格（零差异）。 */
const YS_DIFF = {
  'YS-20261026-0016': [
    {i:3, rej:2, note:'表层轻微发芽，拒收 2 袋'}
  ],
  'YS-20261025-0015': [
    {i:7,  rej:3,         note:'规格不符，拒收 3 袋'},
    {i:12, rej:2,         note:'边角破损拒收 2 箱'}
  ],
  'YS-20261025-0012': [
    {i:10, rej:3,         note:'受潮结块，拒收 3 包'}
  ],
  'YS-20261027-0018': [
    {i:7,  rej:2,         note:'黄叶偏多，拒收 2 件'},
    {i:11, short:2,       note:'到货短装 2 包'},
    {i:13, rej:1,         note:'边角破损拒收 1 箱'},
    {i:16, rej:1,         note:'到货活力不足，拒收 1 桶'}
  ]
};

/* 逐行派生：实收 = 实发 − 短装；合格量 = 实收 − 拒收；结算金额 = 合格量 × 单价。
   所有扣减按该行真实实发量收敛（clamp），不会扣出负数或超过发货量。
   扣重维度已取消（门店验收只记短装 / 拒收，不再单列扣重）。 */
function ysLines(ys){
  const sh = SHIPMENTS.find(x=>x.no===ys.sh);
  if(!sh) return [];
  const src = shipLinesOf(sh);
  const byI = {};
  (YS_DIFF[ys.no] || []).forEach(d=>{ byI[d.i] = d; });
  return src.map(l=>{
    const d     = byI[l.i] || null;
    const ship  = Number(l.qty);                                   /* 发货单实发量 */
    const short = d && d.short ? Math.min(d.short, ship) : 0;
    const got   = Math.max(0, ship - short);                        /* 食堂点收件数 */
    const rej   = d && d.rej   ? Math.min(d.rej, got) : 0;
    const ok    = Math.max(0, got - rej);
    const diff  = (short || rej) ? 1 : 0;
    const res   = rej ? '部分拒收' : (short ? '短装' : '合格');
    const r = {i:l.i, n:l.n, s:l.s, u:l.u, q:Number(l.q), p:Number(l.p)};
    return {r, ship, short, got, rej, ok, diff,
            res, cls: diff ? 'wait' : 'done', why: diff ? 'none' : 'same',
            note: d ? d.note : '与发货一致',
            amt: Math.round(ok * r.p * 100) / 100};
  });
}

/* 单据级汇总：件数、金额、差异行数、结论全部由明细现算，不再独立编造。 */
function ysSummary(ys){
  const rows = ysLines(ys);
  const m2 = n => Math.round(n * 100) / 100;
  const due      = rows.reduce((s,x)=>s + x.r.q, 0);          /* 应收件数 = Σ 下单量 */
  const shipQty  = rows.reduce((s,x)=>s + x.ship, 0);         /* 实发件数 */
  const got      = rows.reduce((s,x)=>s + x.got, 0);          /* 实收件数 */
  const rej      = rows.reduce((s,x)=>s + x.rej, 0);          /* 拒收件数 */
  const ok       = rows.reduce((s,x)=>s + x.ok, 0);            /* 合格件数 */
  const diff     = rows.filter(x=>x.diff).length;              /* 差异行数 */
  const orderAmt = rows.reduce((s,x)=>s + x.r.q * x.r.p, 0);  /* 应收金额 */
  const shipAmt  = rows.reduce((s,x)=>s + x.ship * x.r.p, 0); /* 发货金额 */
  const amt      = rows.reduce((s,x)=>s + x.amt, 0);           /* 结算金额 = Σ 合格量 × 单价 */
  const rejAmt   = rows.reduce((s,x)=>s + x.rej * x.r.p, 0);
  const shortAmt = rows.reduce((s,x)=>s + x.short * x.r.p, 0);
  return {
    rows, due, shipQty, got, rej, ok, diff,
    orderAmt:m2(orderAmt), shipAmt:m2(shipAmt), amt:m2(amt),
    rejAmt:m2(rejAmt), shortAmt:m2(shortAmt),
    res: diff ? '部分拒收' : '全部合格',
    cls: diff ? 'wait' : 'done'
  };
}

/* ---------- 验收单数据源（门店侧回写，供应端只读） ----------
   链路口径：发货单「确认发货」后只进入「已发货」，此时不产生、不关联任何验收单；
   门店侧完成验收后，验收信息与验收结论才回写供应端，此时新增一条验收单，
   并把订单 / 发货单联动推进到「已完成」。因此「已发货 · 待门店验收」是合法中间态，
   判断有没有验收结果只能查 ysOf(sh)，不能用 shipLocked(sh) 代替。
   一单一验：「已完成」与「有验收单」互为充要条件 —— 验收结论回写才进入已完成，
   所以每一张已完成发货单（及其订单）都必须能查到一张验收单，条数必须对齐；
   验收单的 t 即回写时刻，等于发货单 acceptedAt（与 E04 流转记录「进入已完成」同一时间点）。
   列表按 t 倒序；单号前缀是批次编号，不作为筛选或排序依据。 */
const ACCEPTANCES = [
  {no:'YS-20261026-0016', sh:'SH-20261026-0039', store:'静安嘉里店', stall:'面点档',   t:'2026-10-27 08:10', by:'李敏'},
  {no:'YS-20261026-0017', sh:'SH-20261026-0040', store:'静安嘉里店', stall:'快餐档',   t:'2026-10-27 08:05', by:'王芳'},
  {no:'YS-20261027-0018', sh:'SH-20261026-0044', store:'徐汇滨江店', stall:'快餐档',   t:'2026-10-27 07:12', by:'王芳'},
  {no:'YS-20261025-0015', sh:'SH-20261026-0038', store:'徐汇滨江店', stall:'快餐档',   t:'2026-10-26 08:20', by:'王芳'},
  {no:'YS-20261025-0014', sh:'SH-20261026-0037', store:'长宁来福士店', stall:'面点档', t:'2026-10-26 08:05', by:'张丽'},
  {no:'YS-20261025-0013', sh:'SH-20261026-0042', store:'虹桥天地店', stall:'小炒档',   t:'2026-10-25 08:30', by:'王芳'},
  {no:'YS-20261025-0012', sh:'SH-20261026-0036', store:'浦东世纪汇店', stall:'小炒档', t:'2026-10-25 08:15', by:'李敏'},
  {no:'YS-20261024-0011', sh:'SH-20261026-0043', store:'徐汇滨江店', stall:'汤品档',   t:'2026-10-24 08:20', by:'张丽'}
];
/* 单据级字段全部由 ysSummary() 从逐行明细派生后回填，禁止再手工写 due/got/rej/ok/amt/diff。
   F01 列表、F02 页头 / 统计、F06 台账、shipAudit() 读到的因此是同一套数字。 */
ACCEPTANCES.forEach(a=>{
  const s = ysSummary(a);
  Object.assign(a, {
    due:s.due, got:s.got, rej:s.rej, ok:s.ok, diff:s.diff,
    amt:s.amt, res:s.res, cls:s.cls,
    shipQty:s.shipQty, orderAmt:s.orderAmt, shipAmt:s.shipAmt
  });
});
function ysOf(sh){ return ACCEPTANCES.find(a=>a.sh===sh.no) || null; }
let CUR_YS_NO = null;
/* 标记：当前验收详情(F02)是否由「退货单」进入。只有 true 时 F02 才显示「返回退货单」按钮，
   且点击返回到退货处理进度(F05)。从验收结果(F01)/台账(F06)/发货单等其它入口进入 F02 时均为 false。 */
let YS_FROM_RETURN = false;
/* 标记：当前验收详情(F02)是否由「验收结果列表(F01)」经「查看」进入。true 时 F02 显示「返回列表」按钮，返回 F01。 */
let YS_FROM_LIST = false;
/* 标记：当前验收详情(F02)是否由「发货单详情(E04)」经「看验收结果」进入。true 时 F02 显示「返回发货单」按钮，返回 E04。 */
let YS_FROM_E04 = false;
/* 标记：当前送货单打印预览(K05)由哪个页面进入，决定 K05 顶部「返回」按钮的去向。
   默认 'E04'（发货单详情）；F02 进入时设为 'F02'，其余模板/批量打印页也各自记录，避免返回错页。 */
let K05_BACK = 'E04';
const K05_BACK_LABEL = {E04:'返回发货单', F02:'返回验收单', E09:'返回模板', E10:'返回批量打印', I01:'返回模板', I02:'返回模板'};
function goK05(back){
  K05_BACK = back || 'E04';
  go('K05');
}
/* 报价单 / 采购订单打印预览的来源与返回：与 K05 一样是全局页，不进侧栏导航。
   C06 打印进 K08、D02 打印进 K09；I01 模板列表预览也按单据类型分流到对应模板。 */
let PRINT_BACK = 'C06';
const PRINT_BACK_LABEL = {C06:'返回报价单', D02:'返回详情', I01:'返回模板'};
function goQuotePrint(back){ PRINT_BACK = back || 'C06'; go('K08'); }
function goOrderPrint(back){ PRINT_BACK = back || 'D02'; go('K09'); }
/* 标记：当前采购订单详情(D02)由哪个列表/页面进入，决定 D02 顶部返回按钮的去向与文案。
   默认 'D01'（订单中心列表）；E01 / A02 / E04 / F05 等入口各自记录，F05 进入时返回对应退货单详情。 */
let D02_BACK = 'D01';
const D02_BACK_LABEL = {D01:'返回列表', E01:'返回列表', A02:'返回工作台', E04:'返回发货单', F05:'返回详情'};
function ordOpen(no, back){
  CUR_ORDER_NO = no;
  D02_BACK = back || 'D01';
  go('D02');
}
function ysOpen(no){
  const ys = ACCEPTANCES.find(a=>a.no===no) || ACCEPTANCES[0];
  CUR_YS_NO = ys.no;
  /* 同步当前发货单：F02 页头「送货单」按钮 / K05 也要指向这张验收单关联的发货单 */
  CUR_SHIP_NO = ys.sh;
  YS_FROM_RETURN = false;   // 非退货入口，F02 不显示「返回退货单」
  YS_FROM_LIST = false;     // 非 F01 列表入口
  YS_FROM_E04 = false;      // 非发货单详情入口
  go('F02');
}
function ysOpenFromShip(){
  const ys = ysOf(curShip());
  if(!ys){ toast('门店尚未验收：验收结果与结论回写供应端后才会生成验收单'); return; }
  CUR_YS_NO = ys.no;
  CUR_SHIP_NO = ys.sh;
  YS_FROM_RETURN = false;
  YS_FROM_LIST = false;
  YS_FROM_E04 = true;       // 来自发货单详情(E04)「看验收结果」，F02 显示「返回发货单」
  go('F02');
}
/* F01 验收结果列表「查看」进入 F02：标记来自列表，F02 显示「返回列表」按钮 */
function ysOpenFromList(no){
  const ys = ACCEPTANCES.find(a=>a.no===no) || ACCEPTANCES[0];
  CUR_YS_NO = ys.no;
  CUR_SHIP_NO = ys.sh;
  YS_FROM_LIST = true;
  YS_FROM_RETURN = false;
  YS_FROM_E04 = false;
  go('F02');
}

/* ---------- F01 验收与售后 ---------- */
def('F01','验收结果','验收与售后', ()=>{

    <tr>

      <td>${o.store}</td>

      <td class="r"><span class="link" onclick="ysOpenFromList('${o.no}')">查看</span></td>

      ``) +
  `
  <div class="card pad0">
