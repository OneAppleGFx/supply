/* ------------------------------------------------------------
   通用分页
   —— 状态按屏存在 PGST（内存），翻页只改状态再 go()，让重渲染接管，
      不手工改 DOM。用法：
        const pg = pgSlice('B03', list);       // 拿 view / cur / pages
        ... 用 pg.view 渲染行 ...
        ${pgFoot('B03', pg)}                   // 塞进 sum-bar 末尾
   ------------------------------------------------------------ */
const PGSZ = [10,20,50];
const PGST = {};
/* 确定性伪随机：同一 seed 每次渲染产出同一序列
   —— 台账类长列表靠它补齐行数，翻页 / 重渲染才不会换内容 */
function rnd(seed){
  let s = seed >>> 0;
  return ()=>{
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
function pgOf(key, defSz){
  const d = defSz || PGSZ[0];
  if(!PGST[key]) PGST[key] = {p:1, sz:d};
  if(PGSZ.indexOf(PGST[key].sz) < 0) PGST[key].sz = d;
  return PGST[key];
}
/* 切片：cur 做越界兜底 —— 删行 / 改条数后页码失效也能落到有效页 */
function pgSlice(key, arr, defSz){
  const st = pgOf(key, defSz);
  const total = arr.length;
  const pages = Math.max(1, Math.ceil(total / st.sz));
  const cur   = Math.min(Math.max(1, st.p), pages);
  st.p = cur;
  return {view: arr.slice((cur-1)*st.sz, cur*st.sz), cur, pages, total, sz: st.sz};
}
/* scr = 重渲染哪个屏。分页键不必等于屏 id —— B03 用 'B03pending' / 'B03priced' 等
   给五个状态 Tab 各存一份页码，不传 scr 时退回 key（绝大多数屏 key 就是 id） */
function pgNav(key, n, scr){ pgOf(key).p = n; go(scr || key); }
function pgSzSel(key, v, scr){ const st = pgOf(key); st.sz = parseInt(v,10) || PGSZ[0]; st.p = 1; go(scr || key); }

/* 页码条：fn 为跳转函数名；给了 key 则走通用 pgNav(key,n[,scr]) */
function pgHTML(cur, pages, fn, key, scr){
  if(pages <= 1) return '';
  const arg = n => (key ? `'${key}',${n}${scr?`,'${scr}'`:''}` : String(n));
  const num = n => `<button class="pg-btn ${n===cur?'on':''}" onclick="${fn}(${arg(n)})">${n}</button>`;
  const box = [];
  if(pages <= 7){
    for(let i=1;i<=pages;i++) box.push(num(i));
  }else{
    box.push(num(1));
    if(cur > 3) box.push('<span class="pg-gap">…</span>');
    for(let i=Math.max(2,cur-1); i<=Math.min(pages-1,cur+1); i++) box.push(num(i));
    if(cur < pages-2) box.push('<span class="pg-gap">…</span>');
    box.push(num(pages));
  }
  return `<div class="pager">
    <button class="pg-btn ic" ${cur<=1?'disabled':''} onclick="${fn}(${arg(cur-1)})" title="上一页">‹</button>
    ${box.join('')}
    <button class="pg-btn ic" ${cur>=pages?'disabled':''} onclick="${fn}(${arg(cur+1)})" title="下一页">›</button>
  </div>`;
}
/* 底栏右侧整块：第 x / y 页 + 页码 + 每页条数
   —— 总数不超过最小页长且没改过条数时，整块不渲染（短列表不该有分页噪音） */
function pgFoot(key, pg, scr){
  const show = pg.total > PGSZ[0] || pg.sz !== PGSZ[0];
  if(!show) return '';
  return `<span style="margin-left:auto;display:flex;align-items:center;gap:10px">
    ${pg.pages>1?`<span class="pg-info">第 <b>${pg.cur}</b> / ${pg.pages} 页</span>`:''}
    ${pgHTML(pg.cur, pg.pages, 'pgNav', key, scr)}
    <select class="select pg-sz" onchange="pgSzSel('${key}',this.value${scr?`,'${scr}'`:''})">
      ${PGSZ.map(n=>`<option value="${n}" ${n===pg.sz?'selected':''}>${n} 条/页</option>`).join('')}
    </select>
  </span>`;
}

/* ============================================================
   B06 · 货品价格趋势
   ============================================================ */
/* ------------------------------------------------------------
   趋势折线图 —— B06 详情弹层里那张图
   ------------------------------------------------------------
   为什么手写 SVG、不引图表库：这里只需要一条折线、一根均价参考线、每点一个
   提示框，为它打一个库进来比这张图本身还重（单文件原型，加个库就是几百 KB）。

   三件事决定了这张图长什么样：
     ① 横轴 = 设价时间，点的横向位置按**真实天数**换算，不是等距排开。
        等距会把「一个月改 5 次」和「一年改 5 次」画成一模一样的形状 ——
        而这两件事的含义正好相反。
     ② 纵轴 = 价格，按数据上下各留 18% 余量自适应，不固定从 0 起。
        生鲜单价从 1.85 到 28.00 差 15 倍；固定从 0 起画，低价货的线会被压成
        一条贴着轴的平线，波动一点也看不出来。自适应之后，涨跌幅度才看得见。
     ③ 悬停看单点明细：日期 / 操作人 / 价格 / 对均价偏离。
        提示框是 SVG 里的一层 <g>，用纯 CSS :hover 显隐 —— 不挂 JS 事件，
        弹层反复重绘也不会留下失效的监听。
   ------------------------------------------------------------ */
function trendChart(sid){
  const raw = priceHist(sid).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(String(x.at||'')));
  const avg = priceAvg(sid);
  const cut = avgCut();
  /* 按口径切一刀：历史是按时间正序的，所以「口径内」一定是末尾连续的一段 ——
     不用逐点判，找到第一个落进口径的位置就够了。 */
  const firstIn = cut ? raw.findIndex(x=>String(x.at) >= cut) : 0;
  if(raw.length < 2){
    return `<div class="tch-empty">${I.info}
      <div>这个货品只有 1 条价格记录，还画不出趋势 —— 改过一次价之后，这里就有曲线了。</div></div>`;
  }

  const W = 776, H = 272;
  const padL = 58, padR = 22, padT = 22, padB = 46;
  const iw = W - padL - padR, ih = H - padT - padB;

  const ts = raw.map(x=>new Date(x.at + 'T00:00:00').getTime());
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  const ps = raw.map(x=>x.p);

  /* 纵轴区间：把均价也纳进来，否则均价虚线会跑到框外看不见 */
  let lo = Math.min(...ps), hi = Math.max(...ps);
  if(avg > 0){ lo = Math.min(lo, avg); hi = Math.max(hi, avg); }
  const sp0 = (hi - lo) || Math.max(Math.abs(hi) * 0.1, 0.4);
  lo = Math.max(0, lo - sp0 * 0.18);
  hi = hi + sp0 * 0.18;

  const Y = v => padT + ih - ((v - lo) / ((hi - lo) || 1)) * ih;
  const X = t => padL + (t1 === t0 ? iw / 2 : ((t - t0) / (t1 - t0)) * iw);

  /* 刻度步长：从一张「人眼好读」的候选步长里挑 —— 要求落下 3–6 格。
     不能简单地「让格数 ≤ 5」：单价 1.85 的货波动只有两毛，那样挑会只剩 2 格刻度
     （¥1.85 / ¥1.90），轴上什么都读不出来。3–6 格既够读，也不至于糊成一片。 */
  const CANDS = [0.01,0.02,0.05,0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100,200];
  const fit = c => { let n = 0; for(let v = Math.ceil(lo/c)*c; v <= hi + 1e-9; v += c) n++; return n; };
  const step = CANDS.find(c => fit(c) >= 3 && fit(c) <= 6)
            || CANDS.find(c => fit(c) >= 2) || 1;
  const ticks = [];
  for(let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(4));
  const money = v => '¥' + v.toFixed(2);

  /* 网格 + 纵轴刻度 */
  const grid = ticks.map(v=>`
    <line class="grid" x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W-padR}" y2="${Y(v).toFixed(1)}"/>
    <text class="axl" x="${padL-10}" y="${(Y(v)+3.6).toFixed(1)}" text-anchor="end">${money(v)}</text>`
  ).join('');

  /* 横轴日期标签：挤不下就抽稀，首尾一定保留（那是「从哪到哪」） */
  const lab = [];
  raw.forEach((x,i)=>{
    const px = X(ts[i]);
    const prev = lab.length ? lab[lab.length-1].x : -999;
    if(i === 0 || i === raw.length-1 || px - prev >= 56) lab.push({x:px, t:x.at.slice(5)});
  });
  if(lab.length > 2 && lab[lab.length-1].x - lab[lab.length-2].x < 56) lab.splice(lab.length-2,1);
  const xlab = lab.map(l=>{
    /* 首尾两个标签贴边时改锚点，否则「09-18」会有一半画到画布外面 */
    const anc = l.x > W - padR - 18 ? 'end' : (l.x < padL + 18 ? 'start' : 'middle');
    return `<text class="axl" x="${l.x.toFixed(1)}" y="${H-padB+22}" text-anchor="${anc}">${l.t}</text>`;
  }).join('');

  const pts = raw.map((x,i)=>[X(ts[i]), Y(x.p)]);
  const toLine = arr => arr.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const line = toLine(pts);
  const base = padT + ih;
  /* 面积只铺在口径内那一段。绿色面积是整张图最抢眼的元素，铺满全程等于在宣称
     「均价算的是整条线」—— 而实际只算了末尾一小段，用户拿计算器一除就对不上。 */
  const inPts = firstIn < 0 ? [] : pts.slice(firstIn);
  const inLine = toLine(inPts);
  const area = inPts.length > 1
    ? `M ${inPts[0][0].toFixed(1)},${base} L ${inPts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ')} L ${inPts[inPts.length-1][0].toFixed(1)},${base} Z`
    : '';
  /* 口径外的部分走浅灰虚线。多带一个点（firstIn）是为了让虚线和实线接上，
     否则分界处会断开一截，看起来像数据缺失。
     整段都在口径外（firstIn < 0）时，虚线要覆盖全部点 —— 否则图上一根线都没有，
     看起来像数据丢了，而事实是「均价算不出来，但历史都在」。 */
  const outSlice = firstIn < 0 ? pts : (firstIn > 0 ? pts.slice(0, firstIn + 1) : []);
  const outLine = outSlice.length > 1
    ? `<polyline class="line out" points="${toLine(outSlice)}"/>` : '';
  const cutMark = firstIn > 0
    ? `<line class="cutline" x1="${pts[firstIn][0].toFixed(1)}" y1="${padT}" x2="${pts[firstIn][0].toFixed(1)}" y2="${base}"/>`
    : '';

  /* 每个点：命中圆 + 悬停竖线 + 提示框。
     提示框靠右就翻到左边、靠顶就翻到下面 —— 弹层里被裁掉的提示等于没有 */
  const BW = 186, BH = 124;
  const dots = raw.map((x,i)=>{
    const px = pts[i][0], py = pts[i][1];
    const dev = avg ? (x.p - avg) / avg * 100 : 0;
    /* 口径内没样本时 avg 为 0，「偏离 +0.0%」会被读成「跟均价持平」——
       那是谎话，直接写「—」 */
    const dTxt = avg > 0 ? ((dev > 0 ? '+' : '') + dev.toFixed(1) + '%') : '—';
    const dCol = avg > 0 ? (dev > 0.05 ? '#B45309' : (dev < -0.05 ? '#1F8B4C' : '#64748B')) : '#94A3B8';
    const isLast = i === raw.length - 1;
    const isIn = firstIn >= 0 && i >= firstIn;
    let bx = px + 16, by = py - BH - 14;
    if(bx + BW > W - 4) bx = px - 16 - BW;      /* 靠右 → 翻到点的左边 */
    if(bx < 2) bx = 2;
    if(by < 4) by = py + 18;                    /* 顶到上边 → 翻到点的下方 */
    if(by + BH > H - 4) by = Math.max(4, H - BH - 4);  /* 下面也放不下 → 夹进画布 */
    const bx2 = Math.round(bx), by2 = Math.round(by);
    const row = (k, v, y, col, bold) =>
      `<text x="${bx2+12}" y="${by2+y}" class="tk">${k}</text>
       <text x="${bx2+BW-12}" y="${by2+y}" text-anchor="end" class="tv"${col?` style="fill:${col}"`:''}${bold?' font-weight="600"':''}>${v}</text>`;
    /* 末点的「当前 ¥x.xx」贴着右边界，改右对齐贴在点的左侧，否则会溢出去 */
    const curAnc = px > W - padR - 70 ? 'end' : 'start';
    const curX   = Math.round(curAnc === 'end' ? px - 9 : px + 9);
    return `
    <g class="cp">

  const avgY = avg > 0 ? Y(avg) : null;

function priceTrend(sid){
  const g = goodsOne(sid) || {};
  const h = priceHist(sid);
  const inR = histIn(sid);                       /* 当前口径内、真正参与均价的那几条 */
  const avg = priceAvg(sid);
  const cut = avgCut();
  const inSet = new Set(inR);
  const list = h.slice().reverse().map(x=>{
    const dev = avg ? ((x.p-avg)/avg*100) : 0;
    const inIt = inSet.has(x);
    return `
    <tr${inIt?'':' style="background:#FCFCFD"'}>
      <td class="mono">${x.at}</td>
      <td${inIt?'':' style="color:var(--text-4)"'}>${x.by}</td>
      <td class="mono r name"${inIt?'':' style="color:var(--text-3)"'}>¥${x.p.toFixed(2)}</td>
      <td class="mono r" style="color:var(--text-3)">${x===h[h.length-1]?'(当前)':(avg>0?((dev>0?'+':'')+dev.toFixed(1)+'%'):'—')}</td>
      <td class="r">${inIt ? tag('计入','done') : '<span style="color:var(--text-4);font-size:11.5px">口径外</span>'}</td>
    </tr>`;
  }).join('');
  const lastAt = h.length ? h[h.length-1].at : '—';
  modal('货品价格趋势 · '+(g.pname||sid),
    `<div class="dl" style="margin-bottom:16px">
      <div><dt>SKU 编码</dt><dd class="mono">${sid}</dd></div>
      <div><dt>当前货品价</dt><dd class="mono name">¥${(g.price||0).toFixed(2)}</dd></div>
      <div><dt>均价估算</dt><dd class="mono">${avg>0?('¥'+avg.toFixed(2)):'—'}</dd>
        <div class="hint" style="font-size:11px;margin-top:1px">${avgLabel()} · ${inR.length}/${h.length} 次计入</div></div>
      <div><dt>变更次数</dt><dd class="mono">${h.length} 次</dd></div>
    </div>
    ${trendChart(sid)}
    <div class="banner ${avg>0?'info':'warn'}" style="margin:16px 0 14px">${avg>0?I.box:I.warn}
      <div>${avg > 0
        ? `均价 = <b>「${avgLabel()}」内 ${inR.length} 次</b>变更价的简单平均（这一共 ${h.length} 次变更，只有口径内的计入），仅作<b>定价参考</b>。要换时间范围，回列表点「均价口径」。下单以「提交时刻的货品价格」为准，此处改价不影响已在途 / 已生成的订单。`
        : `<b>「${avgLabel()}」内没有一条改价记录</b>，所以均价算不出来 —— 这个货最后一次改价是 <b>${lastAt}</b>。它多半是长期不调价的稳定品；要看均价，把口径放宽到「全部历史」，或等下一次调价后自然就有了。`}</div>
    </div>
    <div class="card-hd" style="padding:0 0 10px;border-bottom:none"><h3>变更明细</h3>
      <span class="hint" style="margin-left:auto">与上图同一个数据源 · 灰字行在口径外，不参与均价</span></div>
    <div class="tbl-wrap"><table class="tbl compact">
      <thead><tr><th>变更日期</th><th>操作人</th><th class="r">价格</th><th class="r">对均价偏离</th><th class="r">是否计入均价</th></tr></thead>
      <tbody>${list}</tbody>
    </table></div>`,
    `<button class="btn btn-default" onclick="closeModal()">关闭</button>`, true);
}
/* ---------- 均价口径配置弹层 ---------- */
function avgCfgOpen(){
  AVG_DRAFT = AVG_CFG;
  avgCfgPaint();
}
function avgCfgPaint(){
  const list = goodsAll().filter(g=>parseFloat(g.price) > 0);
  const rows = AVG_RANGES.map(d=>{
    const on = AVG_DRAFT === d.k;
    let nGood = 0, nSamp = 0;
    list.forEach(g=>{
      const n = histIn(g.sid, d.k).length;
      nSamp += n;
      if(n) nGood++;
    });
    const noS = list.length - nGood;
    const cutD = avgCut(d.k);
    return `
    <div class="avgopt${on?' on':''}" onclick="avgCfgPick('${d.k}')">
      <span class="rd">${on?I.tick:''}</span>
      <span class="bd">
        <b>${d.label}</b>
        <span class="sub">${cutD ? (cutD+' 及之后（含今天）的改价记录') : '不限时间，全部改价记录'}</span>
      </span>
      <span class="num"><b>${nGood}</b> 个有样本 · 共 <b>${nSamp}</b> 条${
        noS ? `<span class="zw">${noS} 个货品无记录，均价显示「—」</span>` : ''}</span>
    </div>`;
  }).join('');
  modal('均价时间口径', `
    <div class="banner info" style="margin-bottom:14px">${I.info}
      <div>这里选的是<b>取哪些价格记录来算均价</b>，不是给样本加权 —— 取出来之后仍是简单平均。
      改完<b>整站的「均价」一起改</b>：这一页的均价与偏离、趋势详情里的均价线，
      以及「货品编辑」保存时的 <b>±50% 偏离预警</b>，都按这一档取样本。</div>

    <div class="hint" style="margin-top:14px;line-height:1.85">
      口径内一条记录都没有的货品，均价显示「—」，<b>不会退回全部历史</b> ——
      一退回，这个设置就成了摆设，你永远不知道它到底生没生效。</div>`,
    `<button class="btn btn-default" onclick="closeModal()">取消</button>
     <button class="btn btn-primary" onclick="avgCfgApply()">应用口径</button>`);
}
function avgCfgPick(k){ AVG_DRAFT = k; avgCfgPaint(); }
function avgCfgApply(){
  const before = AVG_CFG;

  if(CUR === 'B06') go('B06');

}

       而事实是「算不出来」。两种状态的含义完全不同，不能共用一个显示。 */

      <td style="color:var(--text-3)">${g.spec}</td>
      <td class="mono r name">¥${g.price.toFixed(2)}</td>
      <td class="mono r">${has?('¥'+avg.toFixed(2)):'<span style="color:var(--text-4)">—</span>'}
        <div style="font-size:10.5px;color:var(--text-4);font-weight:400;letter-spacing:0;line-height:1.5">${inR.length}/${h.length} 次</div></td>
      <td class="mono r ${(has&&d>0.05)?'warn':''}" style="${has&&d<-0.05?'color:var(--brand-600)':''}">${

  return pagehd('货品价格趋势',
      `货品价格的历史变更记录与均价估算 · 仅用于追溯与定价参考；下单以<b>提交时的货品价格</b>为准，此处不影响已在途订单`,
      `<button class="btn btn-default" onclick="avgCfgOpen()" title="设置用多长时间内的改价记录来算均价 —— 这一档口径同时决定趋势详情的均价线，与货品编辑保存时的 ±50% 偏离预警">${I.clock}均价口径 · ${avgLabel()}</button>
       <button class="btn btn-default" onclick="toast('已导出价格趋势表')">${I.down}导出</button>
       <button class="btn btn-primary" onclick="go('B07')">${I.coin}批量调价</button>`) +
  `
  <div class="card pad0">
    <div class="tb2">

      <input class="input" style="width:200px" placeholder="品名 / SKU 编码">

          ${nGood < allP.length ? ('· <b style="color:#B45309">'+(allP.length-nGood)+' 个</b>货品此口径内无记录') : ''}</span>

/* ============================================================
   B07 · 批量调货品价格
   ============================================================ */
let B07MODE = 'pct', B07VAL = 3;
let B07SEL = null;                       /* sid -> bool；null = 默认全选 */
function b07Priced(){ return goodsAll().filter(g=>parseFloat(g.price) > 0); }
function b07IsSel(sid){ return !B07SEL || B07SEL[sid] !== false; }
function b07SelN(){ return b07Priced().filter(g=>b07IsSel(g.sid)).length; }
function b07NP(base){
  const v = B07VAL;
  return B07MODE === 'pct' ? base * (1 + v/100) : base + v;
}
function b07DevColor(d){ return d > 0 ? 'var(--warning)' : (d < 0 ? 'var(--brand-600)' : 'var(--text-4)'); }

/* 预览值只写 DOM，不重渲染 —— 否则输入框会失焦 */
function b07Calc(){
  const m = document.getElementById('b7-mode'); if(m) B07MODE = m.value;
  const vi = document.getElementById('b7-val'); if(vi) B07VAL = parseFloat(vi.value) || 0;
  document.querySelectorAll('tr[data-base]').forEach(tr=>{
    const base = parseFloat(tr.dataset.base);
    const np = b07NP(base);
    const d = (np - base) / base * 100;
    const a = tr.querySelector('.np'), b = tr.querySelector('.dv');
    if(a) a.textContent = '¥' + np.toFixed(2);
    if(b){
      b.textContent = (d > 0 ? '+' : '') + d.toFixed(1) + '%';
      b.style.color = b07DevColor(d);
    }
  });
}
function b07SyncHd(){
  const n = b07SelN(), t = b07Priced().length;
  const cb = document.getElementById('b7-allcb');
  if(cb) cb.checked = n > 0 && n === t;
  const c1 = document.getElementById('b7-cnt'); if(c1) c1.textContent = n;
  const c2 = document.getElementById('b7-sel'); if(c2) c2.textContent = n;
}
/* 勾选状态存在数据层，翻页不丢 */
function b07Toggle(sid, cb){
  if(!B07SEL) B07SEL = {};
  B07SEL[sid] = !!cb.checked;
  b07SyncHd();
}
function b07All(cb){
  if(!B07SEL) B07SEL = {};
  const on = !!cb.checked;
  b07Priced().forEach(g=>{ B07SEL[g.sid] = on; });
  go('B07');
}

function b07Apply(){
  const m = document.getElementById('b7-mode'); if(m) B07MODE = m.value;
  const vi = document.getElementById('b7-val'); if(vi) B07VAL = parseFloat(vi.value) || 0;
  let n = 0;
  b07Priced().forEach(g=>{
    if(!b07IsSel(g.sid)) return;
    const p = +b07NP(g.price).toFixed(2);
    if(CLAIM[g.sid]){
      CLAIM[g.sid].price = p;
      recordPrice(g.sid, p, '批量调价');
      QUOTE.forEach(r=>{ if(r.pid===g.sid) r.price = p; });
      n++;
    }
  });
  if(!n){ toast('请至少勾选一个货品','err'); return; }
  B07SEL = null;
  toast('已调整 '+n+' 个货品的货品价格，并记入价格历史');
  go('B06');
}

  }).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--text-4);padding:34px 0">暂无已设货品价格的货品</td></tr>`;

  return pagehd('批量调货品价格',
      `按百分比或固定差额批量调整货品价格 · 调整前可预览 · <b>确认后写入价格历史，并即时成为货品价格（直采 / 询价报价默认取此价同步生效）</b>`,
      `<button class="btn btn-default" onclick="go('B06')">${I.back}返回趋势</button>
       <button class="btn btn-primary" onclick="b07Apply()">确认调价</button>`) +
  `<div class="grid-2-1">
    <div>
      <div class="card">
        <div class="card-hd" style="padding:0 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px">
          <h3>调整规则</h3><span class="hint">改完立即在下方预览</span>
        </div>
        <div class="b7-rule">
          <div class="field"><label><span class="req">*</span>调整方式</label>
            <select class="select" id="b7-mode" onchange="b07Calc()">
              <option value="pct" ${B07MODE==='pct'?'selected':''}>按百分比（%）</option>
              <option value="fix" ${B07MODE==='fix'?'selected':''}>按固定差额（元）</option>
            </select></div>
          <div class="field"><label><span class="req">*</span>调整值</label>
            <input class="input" id="b7-val" value="${B07VAL}" oninput="b07Calc()">
            <div class="hint">正数为上调，负数为下调</div></div>
        </div>
      </div>

      <div class="card pad0">
        <div class="card-hd">
          <h3>影响范围预览 <span class="sub">共 <span id="b7-cnt">${selN}</span> 个货品将变化</span></h3>
          <span class="hint">灰色为调整前，右侧为调整后</span>
        </div>
        <div class="tbl-wrap"><table class="tbl compact">
          <thead><tr>
            <th class="c" style="width:44px"><input type="checkbox" id="b7-allcb" ${selN>0&&selN===pg.total?'checked':''} onchange="b07All(this)" style="width:15px;height:15px;accent-color:var(--brand-600)"></th>
            <th style="width:92px">SKU</th><th>门店</th><th>品名</th><th>规格</th><th class="r">调整前</th>
            <th class="r">调整后</th><th class="r">变动</th>
          </tr></thead>
          <tbody>${rows}</tbody>

/* 报价单列表：档口跟着询价单一起带过来 —— 一张报价单回的就是某个档口那一单，
   「哪个店的」还不够，同店两个档口同时发单时，只写门店根本分不清哪张对哪张。
   行数同样拆成「报价行数 / 采购行数」：报 8 行、他采购 9 行，说明有 1 行我主动不报。 */
def('C05','报价单列表','询价与报价', ()=>{
  const data = QUOTE_LIST;
  const pg = pgSlice('C05', data);
  const list = pg.view.map(r=>{
    const act = r.st==='已提交' ? '修改报价' : '查看';
    return `
    <tr class="clickable" onclick="openQuote('${r.st}','${r.no}')">
      <td class="name mono">${r.no}</td>
      <td class="mono" style="color:var(--text-3)">${r.rfq}</td>
      <td>${r.store}</td>
      <td><span class="stall">${r.stall}</span></td>
      <td class="mono r"><b style="${r.qLines>=r.lines?'':'color:var(--text-3)'}">${r.qLines}</b>
        <span style="color:var(--text-4);font-weight:400"> / ${r.lines}</span></td>
      <td class="mono r name">${money(r.amt)}</td>
      <td class="mono">${r.t}</td>
      <td>${tag(r.st, r.cls)}</td>
      <td class="r"><span class="link" onclick="event.stopPropagation();openQuote('${r.st}','${r.no}')">${act}</span></td>
    </tr>`;
  }).join('');
  /* 中标合计只由「已出结果」的单加总，而且只加真正中标的那几行 ——
     部分中标的单把整张报价合计算进「中标」，金额会虚高。 */
  const wonAmt = data.filter(r=>r.st==='全部中标'||r.st==='部分中标')
    .reduce((s,r)=>{
      const d = QDETAIL[r.no];
      if(!d || !d.lines || !d.lines.length) return s + r.amt;
      const lose = new Set(d.lose||[]);
      const w = d.lines.reduce((a,l,i)=>
        (lose.has(i) || l.none || !(parseFloat(l.price) > 0)) ? a : a + l.q*parseFloat(l.price), 0);
      return s + w;
    }, 0);

  /* 页签计数从数据里数 —— 提交一张单就会多一张「已提交」，
     写死的数字半小时后就会和表格对不上 */
  const cnt = s => data.filter(r=>r.st===s).length;
  return pagehd('报价单列表',
      `与询价单一一对应 · 共 <b>${data.length}</b> 张 · 提交即传上平台 · <b>截止前可再次修改</b>，以最后一次提交为准`,
      `<button class="btn btn-default" onclick="toast('已导出报价台账')">${I.down}导出</button>
       <button class="btn btn-primary" onclick="go('C01')">去报价</button>`) +
  `<div class="card pad0">
    <div class="tabsline">
      <button class="tb on">全部 <span class="n">${data.length}</span></button>
      <button class="tb">已提交 <span class="n">${cnt('已提交')}</span></button>
      <button class="tb">待公示 <span class="n">${cnt('待公示')}</span></button>
      <button class="tb">部分中标 <span class="n">${cnt('部分中标')}</span></button>
      <button class="tb">全部中标 <span class="n">${cnt('全部中标')}</span></button>
      <button class="tb">未中标 <span class="n err">${cnt('未中标')}</span></button>
    </div>
    <div class="tb2">
      <select class="select" style="width:150px"><option>全部门店</option>${STORES.map(s=>`<option>${s.n}</option>`).join('')}</select>
      <input class="input" style="width:210px" placeholder="报价单号 / 询价单号">
      <input class="input" style="width:150px" type="date" value="2026-10-26">
      <button class="btn btn-primary sm" onclick="toast('已按条件查询')">查询</button>
      <button class="btn btn-default sm" onclick="toast('已重置')">重置</button>
      <span class="hint r">截止后进入「待公示」，门店确认报价后回写中标结果</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th>报价单号</th><th>询价单号</th><th>门店</th><th>采购档口</th>
        <th class="r">报价行数 / 采购行数</th><th class="r">报价合计</th>
        <th>提交时间</th><th>状态</th><th class="r">操作</th>
      </tr></thead>
      <tbody>${list}</tbody>
    </table></div>
    <div class="sum-bar">
      <span>共 ${pg.total} 张</span>
      <span>中标合计 <b>${money(wonAmt)}</b></span>
      <span style="color:var(--text-4)">提交即传上平台；询价截止前可再次修改，以最后一次提交为准</span>
      ${pgFoot('C05', pg)}
    </div>
  </div>`;
});

def('C06','报价单详情','询价与报价', ()=>{
  const q = CUR_QUOTE;
  /* 未参与（从未提交报价）的询价单没有报价单数据 —— 这里是兜底，正常进不来 */
  if(!q){
    return pagehd('未参与', `本单未提交报价，无报价数据`,
      `<button class="btn btn-default" onclick="go('C05')">${I.back}返回列表</button>`,
      tag('未参与','off')) +
    `<div class="card" style="padding:42px;text-align:center;color:var(--text-3);font-size:13.5px;line-height:1.9">
       该询价单未在截止前提交报价，系统中不存在对应的报价单，故无可查看的报价明细。<br>
       下一轮询价发起后，可在截止前参与报价并生成报价单。</div>`;
  }
  /* 报价明细从 QDETAIL 取 —— 每张报价单自己的行，避免「点 A 单看 B 单」的对不上 */
  const d = QDETAIL[q.no] || {lose:[], lines:[]};
  const loseSet = new Set(d.lose||[]);
  const won   = d.lines.filter((l,i)=>!l.none && !loseSet.has(i)).length;
  const loseN = d.lines.filter((l,i)=>!l.none && loseSet.has(i)).length;
  const noneN = d.lines.filter(l=>l.none).length;
  const total = d.lines.reduce((s,l)=> s + (l.none ? 0 : (l.q*(l.price||0))), 0);
  const loseWhy = q.st==='未中标' ? '价格高于均价 8%' : '价格高于中标价';
  /* 待公示 = 已提交且已截止，但门店还没确认报价 —— 比价结果此时不对外展示 */
  const pending = q.st==='待公示';
  /* 已提交 = 询价还没截止，报价单还能改 —— 比价压根还没开始，
     这时候把「几中标几未中」摆出来，等于在报价期内把底价漏给对手方 */
  const openRfq = q.st==='已提交';
  const hideRes = pending || openRfq;
  const maskTag = pending ? '<span style="color:var(--text-4)">待公示</span>'
                          : '<span style="color:var(--text-4)">截止后比价</span>';
  const maskWhy = pending ? '门店确认后公示' : '询价进行中，截止后由门店比价';
  const rows = d.lines.map((l,i)=>{
    if(l.none) return `<tr>
      <td class="mono c" style="color:var(--text-4);width:46px">${i+1}</td>
      <td class="nm"><b>${l.n}</b><span>${l.s}</span></td>
      <td class="c">${l.u}</td>
      <td class="mono r">${l.q}</td>
      <td class="mono r" colspan="2" style="color:var(--text-4)">不可供 / 不报价</td>
      <td>${tag('不报价','off')}</td>
      <td style="font-size:12.5px;color:var(--text-3)">本轮未报价</td>
    </tr>`;
    const isLose = loseSet.has(i);
    return `<tr>
      <td class="mono c" style="color:var(--text-4);width:46px">${i+1}</td>
      <td class="nm"><b>${l.n}</b><span>${l.s}</span></td>
      <td class="c">${l.u}</td>
      <td class="mono r">${l.q}</td>
      <td class="mono r">¥${l.price.toFixed(2)}</td>
      <td class="mono r name">¥${(l.q*l.price).toFixed(2)}</td>
      <td>${hideRes?maskTag:(isLose?tag('未中标','err'):tag('已中标','done'))}</td>
      <td style="font-size:12.5px;color:var(--text-3)">${hideRes?maskWhy:(isLose?loseWhy:'—')}</td>
    </tr>`;
  }).join('');

  const head = `${q.store} · <b>${q.stall}</b> · ${q.lines} 行 · 提交于 <b>${q.t}</b> · ${pending?'<b>已截止</b>，待门店确认后公示结果':openRfq?'<b>询价进行中</b>，比价结果截止后公布':`比价结果 <b>${won} 中标 / ${loseN} 未中</b>`}`;
  const btns = `<button class="btn btn-default" onclick="go('C05')">${I.back}返回列表</button>
       <button class="btn btn-default" onclick="toast('已下载报价单 PDF')">${I.print}下载</button>
       ${q.st==='已提交'
         ? `<button class="btn btn-primary" onclick="go('C03')">修改报价</button>`
         : pending
           ? `<button class="btn btn-default" disabled title="报价已截止，门店确认报价公示后方可查看中标结果"
                style="opacity:.5;cursor:not-allowed">看中标结果</button>`
           : `<button class="btn btn-primary" onclick="go('C07')">看中标结果</button>`}`;

  return pagehd(q.no, head, btns, tag(q.st, q.cls)) +
  `
  <div class="card">
    <div class="dl four">
      <div><dt>关联询价单</dt><dd class="mono">${q.rfq}</dd></div>
      <div><dt>采购门店</dt><dd>${q.store}</dd></div>
      <div><dt>采购档口</dt><dd><span class="stall">${q.stall}</span></dd></div>
      <div><dt>提交时间</dt><dd class="mono">${q.t}</dd></div>
      <div><dt>提交人</dt><dd>${d.submitter||'—'}</dd></div>
      <div><dt>报价行数 / 采购行数</dt><dd class="big">${q.qLines} / ${q.lines}</dd></div>
      <div><dt>不报价</dt><dd class="big">${noneN} 行</dd></div>
      <div><dt>报价合计</dt><dd class="big">${money(total)}</dd></div>
      <div><dt>比价状态</dt><dd>${pending?'已比价 · 待门店确认公示':openRfq?'未开始 · 截止后统一比价':`已完成 · ${d.cmp||'—'}`}</dd></div>
    </div>
  </div>

  <div class="card pad0" style="margin-top:12px">
    <div class="card-hd">
      <h3>报价明细 <span class="sub">单价为提交时锁定价，与当前货品价格无关</span></h3>
      <span class="hint">只读</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th class="c" style="width:46px">序号</th><th>商品 / 规格</th><th class="c">单位</th><th class="r">需求量</th>
        <th class="r">报价单价</th><th class="r">金额</th><th style="width:100px">比价结果</th><th>说明</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="sum-bar">
      ${hideRes?`<span>报价 ${d.lines.length} 行</span><span style="color:var(--text-4)">${pending?'中标结果待门店确认后公示':'比价未开始 · 截止后统一公布'}</span>`
               :`<span>中标 ${won} 行</span><span>未中标 ${loseN} 行</span>`}
      ${noneN?`<span>不报价 ${noneN} 行</span>`:''}
      <span style="margin-left:auto">报价合计 <b>${money(total)}</b></span>
    </div>
  </div>
`;
});

/* ============================================================
/* ============================================================
   直采：食堂直接下单（非询价），SKU 级，提交即按当前货品价格快照成交价
   —— 成交价写入订单行，后续改价 / 趋势页都不回查，保证历史单不被追溯
   ============================================================ */
let DC_SEQ = 1;
let DC_STORE = (typeof STORES!=='undefined' && STORES[0]) ? STORES[0].n : '徐汇滨江店';
const DIRECT_ORDERS = [
  {no:'DC-20261025-0007', at:'2026-10-25 09:20', store:'徐汇滨江店', status:'待发货',
   lines:[
     {sid:'S1000101', n:'青菜',   spec:'周转箱 · 5kg/件', q:3, price:3.20},
     {sid:'S1000601', n:'胡萝卜', spec:'网袋 · 5kg/袋',   q:2, price:2.60}
   ]}
];
function dcAmt(){
  let total = 0;
  document.querySelectorAll('#dc-rows tr[data-sid]').forEach(tr=>{
    const q = parseFloat((tr.querySelector('.dc-q')||{}).value) || 0;
    const p = parseFloat(tr.dataset.price) || 0;
    const amt = q * p;
    const cell = tr.querySelector('.dc-amt');
    if(cell) cell.textContent = q>0 ? '¥'+amt.toFixed(2) : '—';
    total += amt;
  });
  const t = document.getElementById('dc-total');
  if(t) t.textContent = '¥'+total.toFixed(2);
}
function dcSubmit(){
  const sel = [...document.querySelectorAll('#dc-rows tr[data-sid]')].filter(tr=>{
    const cb = tr.querySelector('input[type=checkbox]');
    return cb && cb.checked;
  });
  const lines = [];
  sel.forEach(tr=>{
    const q = parseFloat((tr.querySelector('.dc-q')||{}).value) || 0;
    if(q > 0){
      const sid = tr.dataset.sid;
      const c = CLAIM[sid] || {};
      lines.push({sid, n:tr.dataset.n, spec:tr.dataset.spec, q, price: parseFloat(c.price)||0});
    }
  });
  if(!lines.length){
    toast('请勾选至少一个货品并填写数量（>0）','err');
    return;
  }
  const now = new Date();
  const ymd = now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
  const no = 'DC-'+ymd+'-'+String(DC_SEQ++).padStart(4,'0');
  DIRECT_ORDERS.unshift({no, at:ymd+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
    store:DC_STORE, status:'待发货', lines});
  toast('已生成直采单 '+no+'，成交价已按当前货品价格快照');
  go('D11');
}

function pickDone(el){
  const tr = el.closest('tr');
  tr.classList.toggle('picked');
  const box = tr.querySelector('.w3');
  if(box) box.value = box.value || tr.dataset.act;
  recount();
}
function recount(){
  const rows = [...document.querySelectorAll('#picktbl tbody tr')];
  const done = rows.filter(r=>r.classList.contains('picked')).length;
  const el = document.getElementById('pickprog');
  if(el){ el.textContent = done + ' / ' + rows.length; }
  const bar = document.getElementById('pickbar');
  if(bar){ bar.style.width = (done/rows.length*100) + '%'; }
}

def('F06','验收记录台账','验收与售后', ()=>{
  /* 前 6 条为手工样例，其余按近 30 天节奏补齐到 42 张（确定性生成，翻页不换内容） */
  const R = rnd(20261027);
  const base = [
    {d:'10-27', sh:'SH-20261026-0041', store:'徐汇滨江店', due:'298.0', got:'278.8', rej:'2.7', ok:'276.1', rate:'92.7', st:'待确认', cls:'wait'},
    {d:'10-26', sh:'SH-20261025-0038', store:'徐汇滨江店', due:'314.5', got:'314.5', rej:'0.8', ok:'313.7', rate:'99.7', st:'已确认', cls:'done'},
    {d:'10-26', sh:'SH-20261025-0039', store:'静安嘉里店', due:'148.0', got:'141.5', rej:'1.0', ok:'140.5', rate:'94.9', st:'已确认', cls:'done'},
    {d:'10-25', sh:'SH-20261024-0036', store:'浦东世纪汇店', due:'272.0', got:'268.0', rej:'3.2', ok:'264.8', rate:'97.4', st:'已确认', cls:'done'},
    {d:'10-25', sh:'SH-20261024-0037', store:'长宁来福士店', due:'198.0', got:'196.5', rej:'0.0', ok:'196.5', rate:'99.2', st:'已确认', cls:'done'},
    {d:'10-24', sh:'SH-20261023-0033', store:'虹桥天地店',   due:'92.0',  got:'88.0',  rej:'2.4', ok:'85.6', rate:'93.0', st:'已确认', cls:'done'}
  ];
  const ST5 = ['徐汇滨江店','静安嘉里店','浦东世纪汇店','长宁来福士店','虹桥天地店'];
  /* 配送日从 10-23 往前推，每 3 天里有一个「双单日」，平均 1.33 张/天，36 张正好铺满 27 天
     （10-23 → 09-27），与页头「近 30 天」对得上。
     单号按「下单日 + 当日序号」生成、序号逐日重置 —— 不会出现 0041 之后接 0042 的跨日跳号 */
  for(let d = 23, i = 0; base.length < 42; d--, i++){
    const mon  = d > 0 ? '10' : '09';
    const dd   = String(d > 0 ? d : 30 + d).padStart(2,'0');
    const cnt  = (i % 3 === 1) ? 2 : 1;           /* 双单日一次补 2 张 */
    let   seq  = cnt === 2 ? 14 : 9;              /* 当日序号从 09 / 14 往下排 */
    for(let k = 0; k < cnt && base.length < 42; k++){
      const due  = 90 + Math.round(R()*230);      /* 92 ~ 320 件 */
      const loss = +(R()*4).toFixed(1);           /* 扣减 0 ~ 4.0 件 */
      const got  = +(due - R()*8).toFixed(1);
      const ok   = +(got - loss).toFixed(1);
      base.push({
        d: mon+'-'+dd,
        sh: 'SH-2026'+mon+dd+'-'+String(seq--).padStart(4,'0'),
        store: ST5[Math.floor(R()*5)],
        due: due.toFixed(1), got: got.toFixed(1), rej: loss.toFixed(1), ok: ok.toFixed(1),
        rate: (ok/due*100).toFixed(1),
        st: '已确认', cls: 'done'
      });
    }
  }
  const pg  = pgSlice('F06', base);
  const rec = pg.view.map(r=>`
    <tr>
      <td class="mono">10-${r.d.split('-')[1]}</td>
      <td class="name mono">${r.sh}</td>
      <td>${r.store}</td>
      <td class="mono r">${r.due}</td>
      <td class="mono r">${r.got}</td>
      <td class="mono r" style="color:var(--danger)">${r.rej}</td>
      <td class="mono r"><b>${r.ok}</b></td>
      <td class="r"><span class="dev ${parseFloat(r.rate)>=98?'fl':'er'}">${r.rate}%</span></td>
      <td>${tag(r.st, r.cls)}</td>
      <td class="r"><span class="link" onclick="go('F02')">查看</span></td>
    </tr>`).join('');

  /* KPI 由台账现算，避免「页头写 42、表里只有几行」 */
  const sumDue  = base.reduce((s,r)=>s+parseFloat(r.due),0);
  const sumRej  = base.reduce((s,r)=>s+parseFloat(r.rej),0);
  const sumOk   = base.reduce((s,r)=>s+parseFloat(r.ok),0);
  const avgRate = (sumOk/sumDue*100).toFixed(1);
  const rejAmt  = (sumRej*4.77).toFixed(2);
  const waitN   = base.filter(r=>r.st==='待确认').length;

  return pagehd('验收记录台账',
      `近 30 天 <b>${base.length}</b> 张验收单 · 平均合格率 <b>${avgRate}%</b> · 差异已全部进入结算口径`,
      `<button class="btn btn-default" onclick="toast('已导出验收台账（Excel）')">${I.down}导出</button>
       <button class="btn btn-default" onclick="go('F01')">今日待确认${waitN?'（'+waitN+'）':''}</button>`,
      tag('30 天','info')) +
  `

  <div class="stats" style="grid-template-columns:repeat(4,1fr)">
    ${kpi('验收单数', String(base.length), '张', '30 天 · 5 家门店')}
    ${kpi('平均合格率', avgRate, '%', '合格量 ÷ 应发量')}
    ${kpi('累计扣减量', sumRej.toFixed(1), '件', '占总发货量 '+(sumRej/sumDue*100).toFixed(1)+'%')}
    ${kpi('扣减金额', rejAmt, '元', '已计入 10 月结算')}
  </div>

  <div class="card pad0">
    <div class="tb2">
      <select class="select" style="width:140px"><option>近 30 天</option><option>近 7 天</option><option>本月</option></select>
      <select class="select" style="width:150px"><option>全部门店</option>${STORES.map(s=>`<option>${s.n}</option>`).join('')}</select>
      <span class="grow"></span>
      <span class="hint">合格率 = 合格量 ÷ 应发量</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th style="width:70px">配送日</th><th>发货单</th><th style="width:130px">门店</th>
        <th class="r" style="width:90px">应发</th><th class="r" style="width:90px">实发</th>
        <th class="r" style="width:90px">扣减</th><th class="r" style="width:90px">合格量</th>
        <th class="r" style="width:90px">合格率</th><th style="width:96px">状态</th><th class="r" style="width:80px">操作</th>
      </tr></thead>
      <tbody>${rec}</tbody>
    </table></div>
    <div class="sum-bar">
      <span>共 <b>${pg.total}</b> 张 · 待确认 <b>${waitN}</b></span>
      <span>合格 <b>${sumOk.toFixed(1)}</b> 件 / 应发 <b>${sumDue.toFixed(1)}</b> 件</span>
      <span style="color:var(--text-4)">合格率 = 合格量 ÷ 应发量</span>
      ${pgFoot('F06', pg)}

  <div class="grid-2-1" style="margin-top:12px">

      </div>
      <div class="hint" style="margin-top:14px;line-height:1.7">「未告知差异」占 49%，是唯一能靠<b>提前预告</b>压下去的一档。</div>

def('I03','打印记录','打印与模板', ()=>{
  const logs9 = [
    {t:'10-27 05:02', doc:'分拣单', no:'PC-20261027-0412', u:'张丽', prt:'HP-M405', pg:2, st:'成功', cls:'done'},
    {t:'10-27 04:58', doc:'送货单', no:'SH-20261027-0046', u:'张丽', prt:'HP-M405', pg:1, st:'成功', cls:'done'},
    {t:'10-27 04:56', doc:'标签',   no:'SH-20261027-0046', u:'张丽', prt:'HP-M405', pg:18, st:'成功', cls:'done'},
    {t:'10-26 21:40', doc:'送货单', no:'SH-20261026-0041', u:'张丽', prt:'HP-M405', pg:1, st:'成功', cls:'done'},
    {t:'10-26 21:38', doc:'送货单', no:'SH-20261026-0039', u:'陈昊', prt:'HP-M405', pg:1, st:'卡纸', cls:'err'},
    {t:'10-26 21:39', doc:'送货单', no:'SH-20261026-0039', u:'陈昊', prt:'HP-M405', pg:1, st:'成功（重打）', cls:'done'},
    {t:'10-26 10:12', doc:'对账单', no:'ST-202609-03', u:'陈昊', prt:'EPSON L3153', pg:6, st:'成功', cls:'done'},
    {t:'10-25 16:30', doc:'结算单', no:'JS-202609-05', u:'陈昊', prt:'EPSON L3153', pg:2, st:'成功', cls:'done'}
  ];
  /* 补齐到 1284 条（本月），确定性生成 —— 10 条/页即 129 页，页码压缩规则才有实战 */
  const RP = rnd(12840);
  const DOCS = ['送货单','分拣单','标签','对账单','结算单'];
  const PPL  = ['张丽','陈昊','王强','李敏'];
  const PRT  = ['HP-M405','EPSON L3153','HP-M405','HP-M405'];
  let dSeq = 27;
  for(let i=0; logs9.length<1284; i++){
    const bad = RP() < 0.012;
    const doc = DOCS[Math.floor(RP()*DOCS.length)];
    const dd  = String(Math.max(1, dSeq - Math.floor(i/50))).padStart(2,'0');
    logs9.push({
      t: `10-${dd} ${String(Math.floor(RP()*24)).padStart(2,'0')}:${String(Math.floor(RP()*60)).padStart(2,'0')}`,
      doc,
      no: (doc==='对账单'?'ST-':doc==='结算单'?'JS-':'SH-')+'202610'+dd+'-'+String(Math.floor(RP()*900)+100).padStart(4,'0'),
      u: PPL[Math.floor(RP()*PPL.length)],
      prt: PRT[Math.floor(RP()*PRT.length)],
      pg: doc==='标签' ? Math.floor(RP()*24)+4 : Math.floor(RP()*6)+1,
      st: bad ? '卡纸' : '成功', cls: bad ? 'err' : 'done'
    });
  }
  /* 生成时日期是倒着铺、时刻是随机的，打印台账必须按时间倒序 —— 排一次再分页，
     否则第 1 页会看到「05:02 / 23:41 / 11:07」跳着走 */
  logs9.sort((a,b)=> a.t < b.t ? 1 : (a.t > b.t ? -1 : 0));
  const pg = pgSlice('I03', logs9);
  const failN = logs9.filter(r=>r.cls==='err').length;
  const pageSum = logs9.reduce((s,r)=>s+r.pg,0);
  const recs = pg.view.map(r=>`
    <tr>
      <td class="mono" style="font-size:12px">${r.t}</td>
      <td><span class="tag gray">${r.doc}</span></td>
      <td class="mono" style="color:var(--text-3)">${r.no}</td>
      <td>${r.u}</td>
      <td class="mono" style="font-size:12px">${r.prt}</td>
      <td class="mono r">${r.pg}</td>
      <td>${tag(r.st, r.cls)}</td>
      <td class="r"><span class="link" onclick="toast('已重新发送打印任务')">重打</span></td>
    </tr>`).join('');

  return pagehd('打印记录',
      `本月 <b>${pg.total.toLocaleString('zh-CN')}</b> 张 · 失败 <b>${failN}</b> 张 · 记录保留 90 天`,
      `<button class="btn btn-default" onclick="toast('已导出打印台账')">${I.down}导出</button>
       <button class="btn btn-default" onclick="go('E10')">批量打印</button>`) +
  `

  <div class="stats" style="grid-template-columns:repeat(4,1fr)">
    ${kpi('本月打印', pg.total.toLocaleString('zh-CN'), '张', '送货单 / 分拣单 / 标签 / 对账单')}
    ${kpi('成功率', (100-failN/pg.total*100).toFixed(1), '%', '失败 '+failN+' 张均为卡纸 / 缺纸')}
    ${kpi('页数合计', pageSum.toLocaleString('zh-CN'), '页', '标签按张计，单据按页计')}
    ${kpi('纸张消耗', pageSum.toLocaleString('zh-CN'), '张', '三联纸 ≈ '+Math.ceil(pageSum/300)+' 包')}
  </div>

  <div class="card pad0">
    <div class="tb2">
      <select class="select" style="width:120px"><option>近 7 天</option><option>今天</option><option>本月</option></select>
      <select class="select" style="width:120px"><option>全部类型</option><option>送货单</option><option>分拣单</option><option>标签</option><option>对账单</option></select>
      <input class="input" style="width:190px" placeholder="单据号">
      <button class="btn btn-primary sm" onclick="toast('已按条件查询')">查询</button>
      <span class="hint r">同一单据打印 2 次以上会标为「重打」</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th style="width:130px">打印时间</th><th style="width:96px">类型</th><th>单据号</th>
        <th style="width:80px">操作人</th><th style="width:150px">打印机</th>
        <th class="r" style="width:70px">页数</th><th style="width:130px">结果</th><th class="r" style="width:70px">操作</th>
      </tr></thead>
      <tbody>${recs}</tbody>
    </table></div>
    <div class="sum-bar">
      <span>共 <b>${pg.total.toLocaleString('zh-CN')}</b> 张 · 失败 <b>${failN}</b> 张</span>
      <span>累计 <b>${pageSum.toLocaleString('zh-CN')}</b> 页</span>
      <span style="color:var(--text-4)">同一单据打印 2 次以上会标为「重打」</span>
      ${pgFoot('I03', pg)}
    </div>
  </div>
`;
});

  ["待办只挂这一屏：橙色就是现在要动手的","这一屏既是门店目录的全量视图，也是<b>唯一的待办落点</b>：待设价的货会标橙，侧栏橙色数字、页头橙色标签、页头橙色的「待设价」数，三处是同一个口径（只数现在真能供货的：门店下架 / 删除、临时停售都不算）。<br>五个 Tab 上的数字只是「筛出来有几条」，<b>不着色、不是催你</b>；真正该动手的，是那枚橙色。点徽标进来，待设价的行还在原来的 SKU 位置上（不提前、不置顶），按编码自己找，比让行跳来跳去快。"],
  ["取消「确认供货」：推送过来即待设价","以前门店商品过来，要先点一次「确认我要供」，再填三个字段才能给价 —— 那一步对生鲜供应商没有信息量：<b>你来这儿本来就是来给价的</b>。<br>现在推送过来直接是「待设价」，填完价就是「已设价」，立刻进询价、直采、发货。少一次点击，也少一个会积压的收件箱。"],
  ["「待设价」和「已设价」差在哪","<b>待设价</b>标橙：门店要的货你还没给价，它不会出现在询价单里，也不会被安排分拣。<br><b>已设价</b>：<b>货品价格已填且 &gt; 0</b> —— 就这一条，询价、直采、发货全通。包装单位、产地这些是选填，缺了照样能供。<b>颜色不是装饰，它对应「能不能进业务流程」</b>。"],
  ["「临时停售」替代原来的「拒绝」","以前确认之后反悔要「标记不供货」，措辞像否定关系，点一下就像撕破脸。<br>现在只有<b>临时停售</b>：停售期间不进新询价、不排分拣，<b>已提交的报价与在途订单照常履约</b>，随时点「恢复在售」回来，记录一直都在 —— 季节性下架、货源断了、这周不想做，都用它。"],
  ["「已失效」只有一种：门店把商品下架了","门店把商品<b>下架</b>（这段时间不卖了，SKU 还在），你这边的货品联动为「已失效」，只读留痕。这不是处罚，也不需要你操作。<br>门店重新上架后，<b>下一条推送</b>就会把它自动恢复到下架前的状态（已设价的仍是已设价，停售的仍是停售）—— 不设「确认恢复」，因为「门店又上架了」这件事没有第二种答案。"],
  ["门店「删除」≠「下架」：这类直接逻辑删除，不占你的屏","下架是暂时的，删除是门店<b>不要这个东西了</b>。<br>门店删除的 SKU，供应端只做<b>逻辑删除</b>：打标记、退出「门店商品」清单（连「全部」Tab 也不显示）、不进你的待办数量、不占 KPI 分母 —— 但数据一条不删，历史订单、送货单、验收单、对账单、发票仍能追溯回这个 SKU。<br>这两件事最容易被混：<b>下架 = 还要你看见（迟早要恢复），删除 = 不该再占你注意力</b>。清单里只留需要你判断的货。"],
  ["失效只停「未来」，不停「已经答应的」","门店把商品下架了，但你昨天已经中标、明天要送的货<b>仍然要送完</b>。<b>订单 = 承诺</b>不因门店下架而失效。「已失效」Tab 里「仍有 N 行未完成订单」，就是提醒你：这几行还得照常分拣、照常发货。"],
  ["同一商品，多个 SKU 必须分别设价","「老豆腐」是 <span class=\"mono\">P10013</span>，下面有 5kg/箱 与 2.5kg/箱 两个 SKU。它们是同一个东西，但<b>单价、起订量、包装成本都不同</b>，所以是两行、两份设价，不能合并成一个。"],
  ["规格不符：反馈运营，别硬设价","门店写「12kg/箱」，你按「10kg/箱」供货：比价时价格看着低，中标后每箱都差 2kg，这类差异最后只能记在你头上。<br>正确动作是截图反馈运营改 SKU；在那之前先<b>临时停售</b>，比按错的规格供一年便宜得多。"],
  ["列表按 SKU 编码正序，不按时间、不按状态","一屏几十行，编码正序是<b>唯一一个「第二次来还能在同一个位置找到」的排法</b>：<br>① 编码里带着商品序，同一商品的多规格自然上下相邻（<span class=\"mono\">S1001301</span> 与 <span class=\"mono\">S1001302</span> 挨着），报错规格的概率比按时间乱序低得多；<br>② 不做「待办优先」——那会让行随状态跳来跳去，你刚记住的位置下次打开就变了；<br>③ 想只看该我处理的，用上面的 Tab 筛，不要靠排序暗示。<br>要按别的维度看，用筛选区的门店 / 形态 / 分类。"],
],
B03i:[
  ["导入不是绕开门槛，只是省掉重复劳动","门店一次推来几十个「待设价」SKU 是首日就会遇到的量级，靠一条条点「设价」撑不住 —— 但这些价格本来就在你自己的报价表里躺着，复制粘贴几十遍并不产生任何判断。<br><b>所以被省掉的只有重复劳动，门槛一个都没降</b>：货品价格仍然必填、仍然必须 &gt; 0；只收<b>待设价 / 已设价 / 临时停售</b>三种状态，已失效（门店下架）和门店已删除是只读留痕，一律挡回并在下面逐行写出理由 —— 挡回但<b>说清楚为什么</b>，比静默跳过强得多。"],
  ["空单元格保持原值：破坏性操作必须一次一条、看得见","这是本功能最容易做错的一条。如果「空」被当成「清空」，一份只填了价格的文件会把每一行的别名、产地、保质期、备注全部抹掉 —— 而你的本意只是设个价。<br>所以导入里<b>空 = 不动它</b>，要清空请去「货品编辑」里删。这个不对称是刻意的：<b>批量只能往上加信息，要抹掉东西必须回到单条、看得见地抹</b>。"],
  ["只读对照列：让眼睛认得出，但不让手改得动","模板第 2 列「<b>商品信息（只读）</b>」写着这件货的<b>品名 · 规格 · 门店</b>。要它是因为一张只有 SKU 编码和几十行价格的表，人根本没法核对 —— 你得来回切页面查「S1001901 到底是哪个货」。<br>但这一列<b>写不进去</b>：商品名、规格、门店都是门店推过来的主数据，供应端本来就没有修改权（这一屏的只读边界）。如果它能写进去，等于开了一条绕过主数据只读的后门；何况门店下一轮推送就会把它盖回来 —— 你以为改了，第二天又变回去，比不改更糟。<br>所以它整列被跳过：<b>改了不报错、也不生效</b>，预览页会直接告诉你「有 N 行与系统不一致，已忽略」。这一列你整列删掉也不影响导入。"],
  ["先看清楚会写什么，再动手","三步走：给数据 → 校验预览 → 写入结果。预览里逐行摆出「灰字现值 → 黑体新值」，改了几处一目了然；<b>默认全选但可以逐行取消</b>，随手的几行不必陪跑；一个字段都不会变的行不进「可写入」，免得在结果页里冒充成功。<br>模板也不是空表 —— <b>已设价的现价与现有信息都已经填好</b>，你只改要改的那几格；正因为如此，「价格必填」不会把已经设好价的行逼着重打一遍。"],
  ["批量与单条走同一条写入路径","导入和「货品编辑」的单条保存调用同一个写入函数：改价<b>必留痕</b>（价格历史 +1 条）、未提交报价单里该行的初始价跟着变、<b>已设价仍由「价格 &gt; 0」派生</b>。<br>两条路分开写，结果一定是「单条记了历史、批量忘了记」或者「一边同步了报价价、另一边没同步」，然后同一个字段在两屏显示成两个数 —— 这种账最后没人对得清。"],
],
B06:[
  ["均价只有一个定义，所以口径只能有一处","「均价」在本平台不只这一屏在用：趋势详情里的均价线、每一行的「对均价偏离」，还有<b>「货品编辑」保存时那条 ±50% 预警</b>，算的都是它。<br>所以时间口径做成<b>一处配置、全站生效</b>。如果每个地方各存一份，结果必然是同一件货在列表按 3 个月算、在预警里按全部历史算 —— 两个均价摆在同一个人面前，谁都说不清哪个才是「均价」。"],
  ["口径决定取哪些样本，不改变算法","改了时间范围，均价仍然是<b>简单平均</b>：把口径内的记录取出来，加起来除以条数。这里没有加权、没有移动平均、没有「越近的越算数」—— 要么做，要么不做，不做就不假装做了。<br>所以要理解一个数为什么变了，只需要问一句：<b>这个范围内有哪几次改价？</b>"],
  ["口径内没记录就写「—」，不退回全部历史","一件半年没调过价的货，在「近 3 个月」里一条记录都没有。这时均价显示「—」、偏离也显示「—」，而不是偷偷拿全部历史顶上去。<br>回退看着「友好」，实际把这个设置变成了摆设：你把它设成 1 个月，看到的却是一年的均价，然后你以为配置没生效。<b>算不出来就承认算不出来</b>，并在页面上直接告诉你「这个货最后一次改价是 X 月 X 日，把口径放宽就能看到」。"],
  ["图上要看得出这一刀切在哪","如果整条曲线都画成实线、只把均价数字换掉，用户会以为均价算的是整条线，拿计算器一除对不上。<br>所以图表分了两段：<b>口径内走绿色实线、铺面积；口径外走浅灰虚线、空心点</b>，中间一道竖虚线标出起点，从口径起点起还画一根均价参考线。明细表也加了「是否计入均价」一列，逐条能核对。<br>一句话：这个数字是怎么来的，页面自己要说清楚。"],
],
C01:[
  ["报价即承诺","你报的价一旦中标，即为不可撤回的供货义务 —— 不允许拒单、不允许变更、不允许取消。中标后供不上只有一条路：<b>先做缺货预告，再按实发量写差异备注</b>。请务必按实际能供的量与价报价。"],
  ["一张单 = 一个门店的一个档口","<b>采购主体最小的颗粒度是档口，不是门店。</b>一个食堂里快餐档、面点档、小炒档各排各的菜单、各算各的成本，各自发起自己的询价单 —— 所以「徐汇滨江店」不是一张单，「徐汇滨江店 · 快餐档」才是。<br>同一家店、同一天，你可能会同时收到快餐档和小炒档的两张单，<b>它们是两张单、两次报价、两份中标结果</b>，不要合并看。原因很实在：档口之间的报价可以不一样，把两张单并成一张，价就没法分开定了。<br>以前这一列显示的是「品类范围」（生鲜蔬果 · 7 类），那是从明细里数出来的二手信息 —— 既不能用来找人，也不能用来筛单。而且一个档口可以同时要素菜和肉，<b>品类范围根本框不住它</b>，删掉不丢任何信息。<br>档口本身<b>不做筛选下拉</b>：它回答的是「这单是谁要的」，看一眼那一列就知道，不需要先选一次再筛。要缩范围，筛门店 —— 同店不同档口本来就是两张单，筛到店就够。"],
  ["「报价行数 / 采购行数」是两个数，不是一个","<b>分子是你报了几行，分母是门店要了几行。</b>以前只有一个「行数」，看的人得先猜这是谁的行数 —— 8 行到底是他要 8 行、还是我报了 8 行？两个并排放，一眼就分得清：<span class=\"mono\">8 / 8</span> 是报满了，<span class=\"mono\">5 / 8</span> 是还差三行没动手。<br>没报的那几行<b>不是你少报了，是你还没报</b>，所以分步做单时分子会一直涨，不用怕它不好看：只有真正勾了「不可供」的行才算本轮不供，那个数在详情里单独列。<br>分子在没报满时是浅色的 —— 状态列已经写着「待报价」，这里只需要<b>忍住不再重复喊一次</b>。"],
],
C02:[
  ["报价前请确认两件事","① <b>每个商品独立选标</b>：平台按 SKU 分别比价，你可能只中其中几行，其余行由别家供货 —— 中标行必须全量履约。<br>② <b>报得准比报得低重要</b>：低价中标后供不上，只能靠缺货预告 + 差异备注兜底，差异率会记在你头上。"],
  ["这一列为什么是「报价」，不是「参考价」","参考价回答的是「这个 SKU 上一轮别人卖多少」，你在这张单上要决定的是「我报多少」—— <b>两个数长得差不多，放在同一行最容易被读成一个</b>。<br>所以这一屏只给你自己的数：它就是你点「参与报价」时看到的那个默认价（货品价格，可逐行改），<b>改完回来这里会跟着变</b>。想比参考价，进报价单，那一屏两列并排放 —— 比在哪儿看，不该比在哪儿改。"],
  ["横杠不是 0 元","还没填价的行一律显示 <span class=\"mono\">—</span>。<br>它<b>不是你报了 0 元</b>，也不是「报得很便宜」，而是「这行你还没给价」。<br>这轮不想供、或供应商临时停售的，在报价单里把这一行选成「不可供」即可 —— 选了「不可供」的行也不计入合计，且有明确标记、可随时改回，不会凭空消失成一条死行。"],
],
C03:[
  ["报价即承诺 · 提交后不可撤回、不可改价","每个商品<b>独立选标</b>，你可能只中其中几行。中标行必须全量履约；供不上只能走「缺货预告 + 差异备注」，并计入差异率。"],
  ["为什么这一列改不了","这一列显示的是你<b>已设价</b>的供货货品，跟着门店 SKU 走，不能在这里换。待设价的 SKU 根本不会出现在询价单里，所以不必担心「漏映射」。"],
  ["不可供怎么填","某行确实供不上，直接把状态选成「不可供」即可（价格框自动冻结、不计入合计）。这比报低价再少发更划算 —— 前者不影响评分，后者会进差异率。"],
  ["价格参考","参考价是平台上期成交均价，仅供参照，不构成上限。明显偏离会被标记「异常价」，在比价环节给出提示，但不强制拦截。"],
  ["同一商品报给不同档口，价可以不一样","页头写着采购门店和<b>采购档口</b> —— 这张单只对这个档口负责。快餐档要 5kg 箱的土豆、面点档要 25kg 袋的，规格不同、包装成本不同，价本来就不该一样；哪怕规格一样，<b>量小、送货频次高的档口成本更高</b>，也允许报到不同的价。<br>所以不要把「上次给这个店报过 3.20」直接套过来 —— 上次可能是另一个档口。真要复用，用「参考价」，它是按<b>同一 SKU</b> 拉的历史均价，不是按门店拉的。"],
],
C06:[
  ["这是提交时刻的只读快照，任何角色都无法修改","报价是承诺：提交时间、单价、不报价标记全部留痕。若报价确有问题，唯一补救是<b>在比价完成前联系运营撤回</b>，并承担记录在案的后果。"],
  ["「报价行数 / 采购行数」在这里仍然并排放","列表页两个数一起看、详情页也得一起看 —— 单看一个数会得出相反的结论。<span class=\"mono\">8 / 8</span> 是我报满了 8 行；<span class=\"mono\">8 / 9</span> 是我报了 8 行、还剩 1 行没报或标了不可供。<br>「采购行数」是门店要的，<b>不会因为我报了价而变</b>；「报价行数」是我的动作，会随着提交涨到上限。两个数现在锁在快照里，之后门店改自己的明细也不回溯 —— 这份快照记的是<b>当时他要几行、我答了几行</b>。"],
  ["采购档口是这单的归属，不是备注","页头的「门店 · 档口」说明了<b>这批货最终进哪个窗口</b>。同一门店下另一个档口的单不在这一屏，也不共享这份报价 —— 想看那单，回列表筛门店、看「采购档口」那一列（档口不单独做筛选，同店不同档口本来就是两张单）。"],
  ["未中标会告诉你原因","「价格高于中标价 ¥0.12」，只有差价的会显示差价。差太多则不显示对手价，只提示「价格明显偏高」。"],
  ["中标行即刻生效","中标行自动生成正式订单，不需要你确认，也不能拒绝。供不上只有两条路：<b>缺货预告</b>与<b>差异备注</b>。"],
],
C07:[
  ["正式订单已生效，无需确认、不能拒绝、不能取消","中标即履约。明天如果某一行确实供不上，请<b>先在订单详情做缺货预告</b>（截止今天 16:00 已过，本单预告窗口已关闭，只能走发货备注），发货时按实发量填写并写清差异原因。"],
],
D02:[
  ["本订单为中标结果，已生效 · 不可拒绝 / 不可变更 / 不可取消","没有任何「确认接单」「拒绝」「申请改单」「取消」入口 —— 这是刻意设计。供不上只有两条出口：<b>① 缺货预告</b>（提前告知，食堂可找替补）→ <b>② 发货差异备注</b>（按实发量落数、超阈值必须说明）。"],
],
D03:[
  ["这张表不是单据，是「今晚该备多少」的答案","同一配送日、同一商品的量合并后一次备货，避免三张单分三次去冷库。<b>已做缺货预告的行会自动扣减</b>，不需要你自己在心里减。"],
  ["备货量怎么定","按「建议备货」再多备 <b>3%–5%</b> 的损耗余量，量小的品类多备一点。多备的部分不会自动变成超发 —— 发货仍按订单填，多出来的留到后天用或走其他渠道。"],
  ["导出有上限，而且每次都留痕","单次上限 <b>5,000 行</b>，超了请按配送日拆开导。导出记录含操作人与时间，可用于追溯 —— <b>导出是只读操作，不影响任何单据状态</b>。"],
],
D04:[
  ["导出容易踩的坑","<b>① 金额取哪个</b> —— 预估金额按下单量算，结算金额按验收合格量算，两者能差 5% 以上。对账请用后者。<br><b>② 跨月账期</b> —— 10-31 的订单可能在 11-01 验收，按「配送日期」和「验收日期」筛会得到不同结果。<br><b>③ 缺货预告行数</b> —— 这是唯一能证明「你提前说过」的字段，建议一直勾上。"],
  ["导出会不会影响别人","不会。导出是只读操作，不影响单据状态，也不会触发任何通知。但<b>导出记录里的操作人会留痕</b>，用于数据外泄追溯。"],
],
D05:[
  ["预告不改变订单，也不减免供货义务","它的作用是让食堂提前知道、提前找替补。订单的下单量、金额、结算口径都不会因为预告而改变 —— 这一点请在提交前确认理解。<br><span style=\"opacity:.85\">⏱ 预告截止 <b>2026-10-26 16:00</b> 已过（当前 19:44）。此时提交仍会被接收并推送，但会标记为「<b>迟预告</b>」，单独统计、不改变考核口径。</span>"],
  ["提交后会怎样","① 食堂侧立刻收到站内消息 + 短信；② 食堂可标记「已找替补 / 接受减量 / 无影响」；③ <b>订单数量、金额不变</b>；④ 发货时该行默认带出「预计可供量」作为实发量预填值。"],
  ["为什么不说「申请调整订单」","一旦读起来像申请，供应商就会等食堂「批」了才发货 —— 那就等于把拒单按钮换了个名字装回来。<b>文案本身就是规则的一部分</b>，所以主按钮固定为「提交预告」。"],
],
E01:[
  ["发货单在提交前可以反复修改；提交后即锁定，成为「事实」","提交时系统按平台阈值逐行判定：<b>浮差内</b>自动放行，<b>超阈值 / 整行未发</b>必须勾选原因并写说明。提交后不可再改，只能走线下。"],
],
E02:[
  ["按实发量落数，改动即判定 —— 不需要你判断「超没超」","每行右侧灰字就是本行允许范围（由平台按品类设定）。<b>浮差内</b>自动放行；<b>超阈值 / 整行未发</b>下一步必须写说明。全新填写时实发量默认带出下单量，已做缺货预告的行默认带出「预计可供量」——本页是仓管已录过数的草稿。"],
  ["灰蓝色行 = 浮差内","称重、分拣必然有误差，落在平台阈值内就是<b>正常业务</b>，不需要说明、不算违约。系统故意用最不显眼的灰蓝色 —— 如果它也标红，说明阈值定错了。"],
  ["橙色行 = 超阈值","可以发，但要说明。做了缺货预告的行，原因自动带入，你只需确认；<b>没做预告的行，原因必须自己选</b>，且会被计入「未告知差异」台账。"],
  ["为什么没有「+ 新增商品行」","订单是承诺，发货只能在承诺范围内落数。多出来的货食堂没有预算、没有验收标准，也结不了款 —— <b>所以这一屏不留空白行</b>。"],
],
E03:[
  ["提交的瞬间就锁定","提交后发货单立即锁定并推送食堂，<b>不可修改</b>。若提交后才发现填错，只能线下沟通、由食堂在验收环节按实际收货处理 —— 这正是「发货单提交即事实」的含义。"],
  ["这一屏只出现「需要说明」的行 —— 浮差行不在其中","每条说明都会打印在<b>送货单</b>上、并在食堂验收时与被验收结果逐行对照。写得含糊（「有问题」「少量」）不算合格说明，验收方可以看到原文。"],
],
E04:[
  ["发货单提交即事实，数量、备注、时间全部锁定","这是全系统唯一「提交后完全不可改」的单据 —— 因为它是<b>食堂签收的依据</b>。发现填错只能冲销重开，且会留痕。"],
],
E05:[
  ["批次是「谁在什么时候把哪几行装上了哪辆车」","发货单是<b>承诺的落数</b>，批次是<b>物理事实</b>。一单可能分两车走（比如水产要晚 1 小时），验收时按批次核对更容易定位问题。"],
  ["MVP 不做补发","短装不补发，直接按实发结算。批次视图保留「多批」结构，是为了后续可能出现的<b>临时补货</b>场景，一期不会主动生成第二批。"],
  ["整单未发也要有批次","整单未发时仍会生成一张 <b>0 元发货单 + 0 数量批次</b>，否则订单会永远停在「备货中」，对账挂不上号。"],
  ["装车时间为什么重要","食堂说「7 点没到货」，你说「5 点半就发了」—— 装车时间与出库温度是唯一能自证的记录。<b>晚于时段 15 分钟以上即计不及时。</b>"],
],
E06:[
  ["分拣单只服务一件事：让拣货的人少走回头路","所以它按<b>库位</b>而不是按订单行号排序，行号只用来和发货单对齐。称重栏填的是<b>实拣量</b>，填完点行即视为已拣。"],
],
E07:[
  ["分拣单不出现价格、不出现客户名","它会被贴在拣货车或随手带走，属于<b>可外流的纸张</b>。所以只印品名、规格、数量、余量空栏 —— 价格与门店信息一概不出现。"],
  ["为什么留手写空栏","仓库现场没有终端，实拣量先手写、回办公室再录。ERP 常见的「必须扫码才准走」在生鲜场景跑不通 —— <b>手上是湿的、戴着胶手套</b>。"],
  ["12 行 / 页的由来","18 行订单印成 1 页会挤到 8pt，站着一手拿纸一手拣时看不清。拆成 12 + 6，把<b>字号保在 10.5pt</b>，比省一张纸重要。"],
  ["与送货单的区别","分拣单给<b>自己人</b>看（无价格、无门店）；送货单给<b>食堂签收</b>（含价格、含差异备注、含公章）。两者字段刻意不重叠。"],
],
E08:[
  ["不写原因也能提交，但这条差异会直接进履约档案","差异说明不是免责工具，是<b>给食堂的解释</b>。它有预告、有原因、有时间戳，验收时食堂看到的是「提前说过」还是「事后才知道」。"],
  ["补填入口在这里，不在发货单里","发货单页只显示<b>已填的备注</b>，补填统一进这个清单。原因：一个人漏填，往往意味着那天有几单一起漏，集中看比逐单翻更快。"],
],
E09:[
  ["模板不是「好看」，是「签收时不出争议」","食堂收货的是厨师长或库管，<b>他只核对三件事：品名对不对、数量对不对、差异为什么</b>。模板的每一个字段都在服务这三件事，其余一律不印。"],
  ["差异分两段打印","上半段是<b>应发数量</b>（下单量），下半段是<b>实发数量</b>（含差异备注）。两段不合并 —— 合并后食堂只看得到实发，「你少发了多少」就被藏起来了。"],
  ["不印我方编码","我方货品编码在食堂侧是无效信息，印上去只会让收货人多问一句。要印就印<b>平台 SKU</b>，那是双方共用的码。"],
  ["模板改动不追溯","改模板只影响之后打印的单据，已打印的仍是旧版式。<b>已签收的纸质件才是法律意义上的凭据</b>，系统里存的 PDF 只是副本。"],
],
E10:[
  ["按线路排、而不是按单号排","司机是<b>一车一线路</b>，纸按路线顺序叠好，到一站抽一张。按单号排会让他在车里翻半天，这是最容易被忽略但每天都要付代价的细节。"],
  ["「已打印」不等于「已送达」","打印只是个动作，系统里不会把单据状态推到「已收货」。状态推进只认<b>食堂签收</b>（验收单）。这两个状态分开记，是避免「打印了就算发了」的糊涂账。"],
  ["打印失败不会整批重来","卡纸或断纸时，那一张<b>标红留在队列里</b>，其余照打。整批重来会导致重复出单 —— 司机手里两张一样的纸，是最难处理的情况。"],
],
F01:[
  ["验收结果是结算的唯一依据 —— 下单量、发货量都不直接进结算","结算口径固定为 <b>Σ（验收合格量 × 单价）</b>。验收结论由食堂侧录入，供应商<b>只读</b>；对结论有异议可在 <b>24 小时内</b>发起一次申诉，申诉期间该笔金额挂账，不计入待结算。"],
],
F02:[
  ["验收只核两件事：数量、包规","<b>数量</b>对得上（应收 → 实发 → 实收），<b>包规</b>对得上（送货的箱 / 袋 / 桶，和门店下单的规格是不是同一个）。这两条都过，就是合格。<br>平台<b>不再按商品等级做品质分级判定</b> —— 等级既难标准化，也容易变成扯不清的口水仗。现场发现变质、破损这类看得见的问题，直接计入拒收，用数量说话。"],
  ["四件事的对应关系，一屏看完","想看清楚「预告怎么说的 / 发货怎么备注的 / 平台阈值多少 / 食堂实际收了多少」这四件事的对应关系，点右上角<b>差异对照</b>。"],
  ["结算金额 = Σ（合格量 × 单价），不是发货金额，也不是下单金额","<b>合格量 = 实收 − 拒收 − 扣重</b>。拒收与扣重由食堂现场录入并附照片，供应商侧只读 —— 所以下单量、发货量都不直接进结算，只有验收合格量进。<b>多发不会多收钱，少发一定少收钱。</b>"],
],
F03:[
  ["四件事并排，才能回答「这 5 件差在哪、谁的责任、该不该扣钱」","预告说的是<b>履约意愿</b>，备注说的是<b>现场事实</b>，阈值说的是<b>平台规则</b>，验收说的是<b>最终事实与结算</b>。任何一列单独看，都会得出错误结论。"],
  ["为什么预告要单独一列","菠菜少了 6 包，和干辣椒少了 1 袋，看起来都是「短装」。但菠菜<b>提前 5 小时</b>告诉了食堂，食堂来得及找替补；干辣椒没说，食堂早上才发现。<b style=\"color:var(--text-1)\">结果相同，性质不同。</b>"],
  ["为什么阈值要单独一列","上海青少了 0.6 件 —— 这在叶菜称重里是正常误差，不算差异。阈值是<b>平台设的、对所有供应商一致的</b>，摆在中间是让双方看到同一条尺子，而不是各说各的。"],
  ["为什么验收放最后一列","猪五花肉超发 1 件，供应商也备注了 —— 但食堂扣重 1 件、按 25 件结。超发不等于多收钱：<b style=\"color:var(--text-1)\">钱只按合格量算</b>，所以「多发一点冲一冲」在这里没有收益。"],
],
F04:[
  ["售后不是「翻案」，是「补充证据」","食堂判你「未告知」，你说「通知过」—— <b>系统里有没有那条预告记录，一查就清楚</b>。所以申诉时最关键的不是文字，是那次预告的时间戳。"],
  ["哪些争议值得提","金额小于 <b>5 元</b>的争议，沟通成本高于争议本身。系统会自动提示「本次申诉金额 2.88 元，是否确认」，但不阻止 —— 有时争的不是钱。"],
  ["照片不是装饰","发芽的土豆、破边的豆腐，一张照片能省三轮对话。<b>没有照片的申诉，改判率不到 15%</b>；有照片的接近 70%。"],
  ["申诉期间不阻塞结算","争议行会先按验收结果结算，改判后下一期多退少补。<b>不能因为一张 2.88 元的争议，卡住 5 万元的账期。</b>"],
],
F05:[
  ["这页只做一件事：让你看到「凭什么这么判」","时间轴按<b>发生顺序</b>排，不按角色分组 —— 裁定看的是同一时间段里双方各自做了什么、什么时候做的。谁先谁后，本身就是证据。"],
  ["两边的照片必须摆在一起","你的出库照（05:40 拍摄，鸡身完好）和食堂的收货照（07:05 拍摄，鸡腿内侧淤血）之间隔了 <b>1 小时 25 分</b>。这 85 分钟里发生了什么、温度有没有断链，就是这个争议的全部内容。分开看，两边说的都对。"],
  ["48 小时是硬时限，超时不收","签收后 <b>48 小时内</b>发起申诉有效，系统在发起时就校验并记录在时间轴上（「在 48 小时时限内」）。这条由系统判定，不靠人工，也不接受事后补。"],
  ["先告诉你可能的结果，再让你等结论","改判全额 <b>+42.00</b> / 部分改判 <b>+0 ~ +25.20</b> / 维持原判 <b>0.00</b> —— 三个区间在提交时就写在这里，不是等裁定出来才知道自己能拿多少。这样你判断「值不值得继续投入精力」时有依据。"],
  ["「历史同类申诉」不是情怀，是概率","同类禽类申诉 6 单中改判 2 单，改判率 <b>33%</b>。这个数字每单都刷新，用来校准预期 —— 有些争议值得争，有些争了也是维持原判。"],
  ["平台逾期，不罚你","平台承诺 <b>2 个工作日</b>出结论。逾期时本单标红、进平台运营的待办池，但<b>不影响你按期结算</b> —— 争议金额不占你的账期。"],
],
F06:[
  ["这张表就是账：应发 → 实发 → 扣减 → 合格量","合格量决定结算金额，<b>而合格量只由食堂称重与验收决定</b>。你能改的只有「实发」和「备注」，改不了「合格」。这是整个平台最硬的一条线。"],
],
G01:[
  ["对账单不是「我算的账」，是「双方都认的账」","每一行都能点回到<b>那张验收单</b>：下单多少、实发多少、扣了多少、为什么扣。对不出结论的账，都能在 3 次点击内找到源头。"],
  ["结算口径只有一个","<b>合格量 × 下单单价</b>。不是实发量，也不是验收时的市场价。价格在订单生成那一刻就锁死，验收只改数量。"],
  ["有异议怎么办","标记「有异议」并填写争议行，平台介入核对。<b>不阻塞其他门店结算</b> —— 一家的争议不该拖住四家的账期。"],
  ["为什么不是「月结单」","叫对账不叫结算，是因为这一步是<b>双方核对</b>，钱还没动。真正的付款在 G03 结算单之后。"],
],
G02:[
  ["四列并排，任何一行都能自己验算","应发 → 实发 → 合格 → 金额。<b>应发减实发是短装，实发减合格是质量扣减</b>。这两段分开列，是为了让你清楚每一件是怎么没的。"],
  ["确认对账之后，就不能翻价了","确认即进入开票、到账，<b>不可撤回</b>。有疑问请先在该行标记「有异议」，再联系运营 —— 标记不改金额，只留一个口子。"],
],
G03:[
  ["结算单是「最终数字」，对账单是「推导过程」","对账单能点回每一张验收单；结算单只留结论。财务要的是后者，<b>你要的永远是前者</b>。两个都要能下载。"],
],
H01:[
  ["门店不是「你加的客户」，是「平台分配给你的」","这决定了这个页面的性质：<b>只读 + 局部可配</b>。你不能新增门店、不能改门店地址、不能改账期 —— 那些都属于平台侧的主数据。"],
  ["配送偏好由门店定，你只能看","默认时段、送货单模板、是否贴标签都是<b>门店侧设置</b>。要调请联系平台运营 —— 这几项直接影响食堂的收货排班，不是供应商能单方面改的。"],
],
H02:[
  ["主账号只有一个，且不能停用","主账号是付款与合同的责任人。<b>子账号再高的权限也改不了银行账号与发票信息</b> —— 这条硬约束写在权限矩阵里，不能配置。"],
  ["为什么不做自定义角色","供应商的团队通常 <b>3–8 人</b>，自定义角色会变成「一人一角色」，配置成本高于收益。一期只给 4 个固定角色，覆盖 95% 的用法。"],
  ["门店范围是数据权限","「张丽只见徐汇 / 静安」意味着她登录后<b>看不到其他门店的订单与价格</b>，不是界面上隐藏 —— 后端也查不出来。"],
  ["停用即失效","停用后所有登录态立即失效，已提交的单据不受影响。已签收的纸质送货单上如果是这个人的签名，责任仍归属商户主体。"],
],

/* 入口按钮：只有存在规则条目时才出现 */
function ruleN(id){ return (RULES[id]||[]).length; }
function ruleBtn(id){
  const n = ruleN(id); if(!n) return '';
  return `<button class="rule-btn" onclick="ruleShow('${id}')" title="看这一屏的设计规则">${I.info}规则说明<b class="rule-c">${n}</b></button>`;
}
function ruleShow(id){
  const r = RULES[id] || [];
  if(!r.length) return;
  const s = SCREENS.find(x=>x.id===id) || {title:''};
  modal(`规则说明 · ${s.title}`,
    `<div class="rule-hd">这一屏为什么长这样 · 共 <b>${r.length}</b> 条 · 全部是产品规则，不是操作说明</div>
     <div class="rule-doc">${r.map(([t,b],i)=>
       `<section><h4><i>${String(i+1).padStart(2,'0')}</i><span>${t}</span></h4><div class="rule-bd">${b}</div></section>`
     ).join('')}</div>`,
    `<button class="btn btn-default" onclick="closeModal()">知道了</button>`, true);
}
