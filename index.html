/* ---------- K05 送货单打印预览：按确认发货时生成的送货单渲染 ---------- */
def('K05','送货单打印','全局', ()=>{
  const sh = curShip();
  const dn = dnOf(sh);
  const lines = shipDetailLines(sh);
  const amt = shipLineAmt(lines);
  const rows = lines.map(l=>{
    const note = l.note || (l.off ? '本行未发' : '—');
    return `
    <tr>
      <td class="c">${l.i}</td>
      <td>${l.n}</td>
      <td style="color:#64748B">${l.s}</td>
      <td class="c">${l.u}</td>
      <td class="r">${fmt(l.q)}</td>
      <td class="r" style="${Number(l.qty)!==l.q||l.off?'font-weight:600':''}">${l.off?'0':fmt(l.qty)}</td>
      <td style="font-size:10px;color:${l.note||l.off?'#8A4B08':'#94A3B8'}">${note}</td>
    </tr>`;
  }).join('');
  const diffLines = lines.filter(l=>l.off || Number(l.qty)!==l.q);
  const informed = diffLines.filter(l=>l.pres);
  const others   = diffLines.filter(l=>!l.pres);
  const li = l=>`<li>第 ${l.i} 行 ${l.n}：${l.off?'本行未发':`实发 ${fmt(l.qty)} ${l.u}，下单 ${fmt(l.q)} ${l.u}`}${l.note?'，'+l.note:''}。</li>`;
  const banner = dn
    ? `<div class="card" style="margin-bottom:12px;padding:12px 18px;font-size:13px;color:var(--text-2)">送货单 <b class="mono">${dn.no}</b> 于 ${dn.generatedAt} 随「确认发货」生成 · ${dn.lines} 行 · ${money(dn.amt)} · 已随货同步食堂。</div>`
    : `<div class="card" style="margin-bottom:12px;padding:12px 18px;font-size:13px;color:var(--text-2)">该发货单尚未确认发货，<b>送货单未生成</b>；以下仅为内容预览，不能作为随货凭证。确认发货后本页自动变为正式送货单。</div>`;
  return pagehd('送货单打印预览',
      `${dn?dn.no:'未生成'} · ${sh.no} · A4 纵向 · 随货同行联 · 一式两联`,

       <button class="btn btn-primary" onclick="toast('已发送到打印队列')">${I.print}打印</button>`,
      tag(dn?'已生成':'未生成', dn?'done':'off')) +
  banner +
  `
  <div style="background:#EDF1EF;border:1px solid var(--line-3);border-radius:var(--r-xl);padding:22px 20px">
    <div class="a4">
      <h2>送 货 单</h2>
      <div class="sub">DELIVERY NOTE · 随货同行联 · 第 1 联（供应商存）</div>
      <div class="hr"></div>
      <div class="hd">
        <span>单号：<b style="color:#0F172A">${dn?dn.no:'—'}</b></span>
        <span>生成时间：${dn?dn.generatedAt:'—'}</span>
      </div>
      <div class="meta" style="grid-template-columns:repeat(2,1fr);gap:5px 18px">
        <div><span>供应商：</span><b>上海鲜达农产品有限公司</b></div>
        <div><span>采购门店：</span><b>${sh.store} · ${sh.stall}</b></div>
        <div><span>配送时间：</span><b>${shipTimeText(sh)}</b></div>
        <div><span>关联订单：</span><b>${sh.order}</b></div>
        <div><span>关联发货单：</span><b>${sh.no}</b></div>
        <div><span>发货人：</span><b>${sh.shipper||SHIP_META.shipper}</b></div>
        <div><span>联系电话：</span><b>${sh.phone||SHIP_META.phone}</b></div>
        <div><span>确认发货：</span><b>${sh.dispatchedAt||'—'}</b></div>
      </div>
      <table>
        <thead><tr>
          <th style="width:30px">序号</th><th style="width:72px">品名</th><th style="width:96px">规格</th>
          <th style="width:32px">单位</th><th style="width:46px">下单量</th><th style="width:46px">实发量</th>
          <th>差异备注</th>
        </tr></thead>
        <tbody>
          ${rows}
          <tr>
            <td colspan="4" class="r" style="font-weight:600">合计 ${lines.length} 行</td>
            <td class="r" style="font-weight:600">${qtyTotal(lines)}</td>
            <td class="r" style="font-weight:600">${actTotal(lines).toFixed(1)}</td>
            <td style="font-size:10px">实发金额 ${money(amt)}（仅供参考，结算以验收合格量为准）</td>
          </tr>
        </tbody>
      </table>

      <div class="diff-box" style="border-color:#CDE7D8;background:#F7FCF9">
        <div class="h" style="color:#14603C">一、已提前告知的差异（缺货预告 · ${informed.length} 行）</div>
        <ul>${informed.length?informed.map(li).join(''):'<li>无</li>'}</ul>

      <div class="diff-box" style="border-color:#F8DCB4;background:#FFFCF6">
        <div class="h" style="color:#8A4B08">二、其他差异（发货时未做预告 · ${others.length} 行）</div>
        <ul>${others.length?others.map(li).join(''):'<li>无</li>'}</ul>
      </div>

      ${(sh.note||SHIP_META.note)?`<div class="diff-box" style="border-color:#DDE8E2;background:#FAFBFC">
        <div class="h">整单备注</div><ul><li>${sh.note||SHIP_META.note}</li></ul></div>`:''}

      <div class="sign">
        <div>供应商发货人签字：<div class="line"></div><span style="font-size:10px">日期：${(sh.dispatchedAt||'').slice(0,10)||'　　年　　月　　日'}</span></div>
        <div>食堂收货人签字：<div class="line"></div><span style="font-size:10px">日期：　　年　　月　　日</span></div>
      </div>
      <div class="sign" style="grid-template-columns:1fr 1fr;margin-top:12px">
        <div>送货人签字：<div class="line"></div></div>
        <div>收货意见：<div class="line"></div></div>
      </div>

      <div class="foot">
        1. 本单所列实发量为发货事实，签收仅表示数量交接，<b>不代表验收合格</b>；最终结算以食堂端验收合格量 × 单价为准。<br>
        2. 标注「已提前告知」的差异为订单生效后供应商按流程提交的缺货预告，已在系统内留痕，与本单同时具备效力。<br>
        3. 未在本单备注的差异，请在验收单上如实记录，本单不另行追认。<br>
        4. 本单一式两联：第一联供应商存，第二联随货交食堂。
      </div>
    </div>
  </div>`;
});
function qtyTotal(a){ return a.reduce((n,l)=>n+(Number(l.q)||0),0); }
function actTotal(a){ return a.reduce((n,l)=>n+(l.off?0:(Number(l.qty)||0)),0); }

function modal(title, body, footer, wide){
  closeModal();
  const d = document.createElement('div');
  d.className = 'mask'; d.id = 'mask';
  d.innerHTML = `<div class="modal${wide?' wide':''}" onclick="event.stopPropagation()">
    <div class="modal-hd"><h3>${title}</h3><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-bd">${body}</div>
    ${footer?`<div class="modal-ft">${footer}</div>`:''}
  </div>`;
  d.onclick = closeModal;
  document.body.appendChild(d);
}
function closeModal(){ const m = document.getElementById('mask'); if(m) m.remove(); }
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeModal(); });

/* 流转记录时间行：第 4 位为操作人，系统层面动作留空则不显示。
   统一渲染，D02 订单详情 / E04 发货单详情共用。 */
function tlRow([tm,tx,k,by]){
  return `<div class="tl-item ${k}"><div class="tm">${tm}${by?`<span class="op">· 操作人 ${by}</span>`:''}</div><div class="tx">${tx}</div></div>`;
}

function pager(total){
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)">
    <span class="hint">共 ${total} 条记录</span>
    <div style="display:flex;gap:6px;align-items:center">
      <select class="select" style="width:104px;height:28px;font-size:12.5px"><option>20 条/页</option><option>50 条/页</option><option>100 条/页</option></select>
      <button class="btn btn-default xs">上一页</button>
      <button class="btn btn-primary xs">1</button>
      <button class="btn btn-default xs">2</button>
      <button class="btn btn-default xs">下一页</button>
    </div>
  </div>`;
}
function hbar(lab, val, max, cls, right){
  const w = Math.max(2, Math.round(val / max * 100));
  return `<div class="hbar"><span class="lab">${lab}</span><span class="track"><span class="fill ${cls||''}" style="width:${w}%"></span></span><span class="v">${right!==undefined?right:val}</span></div>`;
}
function colsChart(data){
  const max = Math.max(...data.map(d=>d.v));
  return `<div class="cols">${data.map(d=>`
    <div class="c">
      <span class="cv">${d.v}</span>
      <span class="cbar${d.mut?' mut':''}" style="height:${Math.max(3, d.v/max*100)}%"></span>
      <span class="cl">${d.l}</span>
    </div>`).join('')}</div>`;
}
function spark(vals, color){
  const w = 340, h = 46, max = Math.max(...vals), min = Math.min(...vals);
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-min)/((max-min)||1))*(h-10)-5).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color||'#1F8B4C'}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}
function kpi(lab, val, unit, foot, cls){
  return `<div class="stat ${cls||''}"><div class="lab">${lab}</div>
    <div class="val">${val}${unit?`<small>${unit}</small>`:''}</div>
    <div class="foot">${foot||''}</div></div>`;
}
function todoTabs(cur){
  /* 「询价待报价」这个数直接数 RFQ，不手写 —— 手写的时候出现过 Tab 上是 2、
     点进去页头写 3 的情况。一个口径只能有一个来源。 */
  const rfqWait = RFQ.filter(r=>r.st==='待报价').length;
  const t = [['A03','询价待报价',String(rfqWait),''],['A04','待发货','1',''],['A05b','缺货预告','1','warn'],
             ['A05','差异待说明','2','err'],['A06','退货待处理','0','']];
  return `<div class="tabsline">${t.map(([id,n,c,k])=>
    `<button class="tb${cur===id?' on':''}" onclick="go('${id}')">${n}<span class="n ${k}">${c}</span></button>`
  ).join('')}</div>`;
}

/* ============================================================

     back   1 = 门店已重新上架，下一条推送自动恢复

     ② 「删除」比「下架」更彻底：下架是这段时间不卖了，货还在；
        删除是门店不要这个东西了，留在清单里只会干扰你 —— 所以逻辑删除后

};
/* 门店删除 = 供应端逻辑删除：标记在、记录在，但不再进清单、不再要你处理 */
function isDel(sid){ return !!(VOID[sid] && VOID[sid].kind === 'del'); }
function isOff(sid){ return !!(VOID[sid] && VOID[sid].kind !== 'del'); }
/* 门店商品清单的分母：把「已删除」摘出去，剩下的才是你在管的货 */
function liveCat(){ return CATALOG.filter(c=>!isDel(c.sid)); }
function delList(){ return CATALOG.filter(c=>isDel(c.sid)); }
function offList(){ return CATALOG.filter(c=>isOff(c.sid)); }
function delCount(){ return delList().length; }
/* 兼容旧调用：失效 = 下架，删除不算失效 */
function voidList(){ return offList(); }
function voidCount(){ return offList().length; }
/* 待自动恢复：门店已重新上架、等下一条推送 */
function backCount(){ return offList().filter(c=>VOID[c.sid].back).length; }

/* 「已设价」由货品价格算出来，不信任手写标记
   —— 只有货品价格（> 0）是硬门槛：它是一路流进报价 → 订单 → 对账的那个数字。
      包装单位、产地改成选填后不再参与判定：填了更好看（送货单、溯源标签要用），
      没填也不妨碍这个 SKU 进询价、直采和发货。
      判定统一走这里，保存时的 c.done、列表状态、报价能不能提交都靠它，
      所以「放宽必填」只改这一行，不会出现「能保存但报不了价」的两套口径。 */
function fullOf(c){ return !!(c && parseFloat(c.price) > 0); }

/* 派生：已设价且未被门店下架 / 删除的门店 SKU + 我补的字段（即「能供货」的货品全集） */
function goodsAll(){
  return CATALOG.filter(c=>CLAIM[c.sid] && !VOID[c.sid] && fullOf(CLAIM[c.sid]))
    .map(c=>Object.assign({}, c, CLAIM[c.sid], {done:1}));
}
/* 能供货的 SKU 口径：待设价 + 已设价
   —— 清单要能当「我这边到底有哪些货」的总账看，只列已设价的话，
      新推过来还没设价的那批就不见了，容易以为没收到。
   三种货不进来，都因为「现在供不了」：
     门店下架 / 删除 → 不是我的货了（且数据只做逻辑删除，历史单据仍可追溯）
     临时停售        → 我主动暂停的，恢复在售后才回到清单（在「供货价格维护 · 临时停售」里管）
   注意不能用 liveCat()：那个只摘「门店删除」，「门店下架」和「临时停售」都还在里面。
   也不复用 goodsAll()：B06 价格趋势 / B07 批量调价 / 直采都要「得着价的货」，
   混进没价的会被 ¥NaN 带崩，所以这里单独一支。 */
/* 不在清单里的两种货，各有多少 —— 页头得给个数，否则你会问「我的货怎么少了」。
   口径 = 不进 B03「全部」可供货视图的货，一个不漏：
     停售 2 个 + 下架 4 个 + 删除 2 个 + 清单 42 个 = 门店目录 50 个，能对上账。
   以前这里只数「有货品价格的那几个失效货」，结果页头写「另有 5 个」，
   而实际被挡掉 8 个 —— 少掉的 3 个（下架但没给过价的）在页头上凭空消失，
   用户对不上数就会以为清单漏了货。 */
function b01Suspend(){ return CATALOG.filter(c=>!VOID[c.sid] && SUSPEND[c.sid]).length; }
function b01Voided(){ return CATALOG.filter(c=>VOID[c.sid]).length; }
function goodsOne(sid){
  const c = CATALOG.find(x=>x.sid===sid);
  return c ? Object.assign({}, c, CLAIM[sid]||{}, {done: fullOf(CLAIM[sid])?1:0}) : null;
}

/* ------------------------------------------------------------
   状态机：五个状态，没有「确认」这一步
     pending  门店推送过来即待设价（还没填货品价格）
     priced   已设价 —— 可参与询价、直采、发货
     suspend  我临时停售 —— 随时恢复，停售期间不进新询价
     void     门店下架 —— 只读留痕，重新上架后自动恢复
     del      门店删除 —— 逻辑删除，不进任何清单（数据留着给历史单据查）
   注意 void 与 del 的区别不是「严重程度」，而是「还要不要你看见」：
   下架是暂时的，你迟早要恢复；删除是门店不要了，不该再占你一屏。
   ------------------------------------------------------------ */
function gSt(sid){
  const v = VOID[sid];
  if(v)                  return v.kind === 'del' ? 'del' : 'void';
  if(SUSPEND[sid])       return 'suspend';
  if(fullOf(CLAIM[sid])) return 'priced';
  return 'pending';
}
const STNAME = {pending:'待设价', priced:'已设价', suspend:'临时停售', void:'已失效', del:'门店已删除'};

/* 报价入口：不再「确认」，直接进报价页给价 */

function suspendAsk(sid){

function suspendDo(sid){
  const w = document.getElementById('sp-why'), n = document.getElementById('sp-note');

     入口只有 B03 一处（含 B02 页内的停售按钮），所以目标固定是 B03。 */
  go('B03');

function resumeDo(sid){
  if(!SUSPEND[sid]) return;

  /* 恢复到货品真实的落点：有价回「已设价」，没价回「待设价」。
     原来不设 Tab，人停在「临时停售」里点恢复，货当场从这个列表消失 ——
     恢复了却看不见，等于告诉你操作失败了 */
  B03TAB = (gSt(sid) === 'priced') ? 'priced' : 'pending';
  go('B03');
  toast('已恢复在售 · 该货品重新参与询价、直采与发货');
}

/* 批量临时停售：作用于「已设价」标签下、当前筛选条件下的「全部」货品

/* 别名只有一条改法：进「货品编辑」(B02) 改完随 b02Save 一起提交。
   原 B01 的行内别名输入框已随 B01 删除，对应的 aliasSet() 一并下线 ——
   留着它等于留一个绕开保存校验的后门。 */

/* 货品价格历史（按 SKU）：每次改价留痕，用于「货品价格趋势」页的追溯与均价估算
   —— 它不是定价来源，定价来源是 CLAIM[sid].price；这里只是历史记录与统计 */
const PRICE_HIST = {};
/* 日期加减（精确到天）：趋势图横轴是真实时间，点与点的横向间距要按天数算 */
function shiftDate(ymd, days){
  const t = new Date(String(ymd) + 'T00:00:00');
  if(isNaN(t.getTime())) return ymd;
  t.setDate(t.getDate() + days);
  const p = x => String(x).padStart(2, '0');
  return t.getFullYear() + '-' + p(t.getMonth()+1) + '-' + p(t.getDate());
}
/* 本地"今天"（YYYY-MM-DD）。不用 toISOString()：那是 UTC，东八区晚上 8 点之后
   会被算成明天，而「近 30 天」这类口径的锚点必须是用户所在时区的今天。 */
function ymdLocal(d){
  const t = d || new Date(), p = x => String(x).padStart(2,'0');
  return t.getFullYear() + '-' + p(t.getMonth()+1) + '-' + p(t.getDate());
}
const TODAY = ymdLocal();
/* 由字符串派生的稳定伪随机数：同一个 SKU 每次打开看到的曲线必须一模一样。
   用 Math.random() 的话，同一个货品刷新两次就是两条形状不同的线 —— 
   用户会以为价格真的变了，这比没有图更糟。 */
function seedRnd(str){
  let h = 0;
  for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) & 0x7fffffff;
  return () => (h = (h*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
}
const PRICE_OPS = ['王强','王强','王强','张丽','批量调价'];
Object.keys(CLAIM).forEach(sid=>{
  const c = CLAIM[sid], cur = parseFloat(c.price);
  if(!(cur > 0)) return;
  const rnd = seedRnd(sid);
  const n = 8 + Math.floor(rnd()*7);                 /* 8–14 个点：一季到一年的改价次数 */
  /* 末点贴近今天（1–13 天前，按 SKU 稳定派生）。
     原先末点取 CLAIM.at，全部停在 2026-09 中旬 —— 距今一个多月，
     于是「近 1 个月」这一档口径会把所有货品的样本取空，配置看起来像坏了。

     另有约 1/8 的货是「长期没调过价的稳定货」（米面油这类），
     最后一次改价在 6–10 个月前 —— 它们在「近 1 / 3 / 6 个月」里一条样本都没有，
     正好用来看清口径筛空之后页面长什么样（均值显示「—」，而不是回退到全部历史）。 */
  const stale = rnd() < 0.13;
  const end = stale
    ? shiftDate(TODAY, -(180 + Math.floor(rnd()*120)))
    : shiftDate(TODAY, -(1 + Math.floor(rnd()*13)));
  /* 约 4 成的货「最近正在密集调价」（叶菜跟着行情走），最近三次间隔压到 3–9 天；
     其余是季度级调整。不做这个区分，所有货品在「近 1 个月」里都只筛出 2 个样本，
     每一行都写着 2/N —— 看着像写死的数，也看不出这档口径到底筛掉了什么。 */
  const busy = rnd() < 0.4;
  const pts = [];
  let back = 0;
  for(let i=n-1;i>=0;i--){
    if(i < n-1){
      /* 间隔越往前越大：最近一次隔 7–16 天，最远一次隔 40–50 天。
         同一条历史因此「近期密、远期疏」，几档时间口径才真的落在不同样本上；
         若各段等距，跨 400 天就得塞进 40 个点，图上会挤成一团。 */
      const j = n-1-i;
      let step = 7 + (j-1)*4 + Math.floor(rnd()*10);
      if(busy && j <= 3) step = Math.max(2, Math.round(step * 0.35));
      back += step;
    }
    pts[i] = {at: shiftDate(end, -back), p: 0, by: PRICE_OPS[Math.floor(rnd()*PRICE_OPS.length)]};
  }
  /* 价格：从当前价往回做小幅随机游走（单步 ±4.5%），最后一点严格等于当前货品价。
     波动幅度必须小 —— 一旦演示数据自己就偏出均价 50%，「较历史均价 ±50%」的
     校验会在你什么都没做的时候先报警。 */
  let acc = cur;
  for(let i=n-1;i>=0;i--){
    pts[i].p = +acc.toFixed(2);
    acc = acc * (1 + (rnd()-0.5)*0.09);
  }
  pts[n-1].p = +cur.toFixed(2);
  pts[n-1].by = '王强';
  PRICE_HIST[sid] = pts;
});
/* 异常调价标记：被标记的改价记录不计入均价及一切统计（最高优先级）。
   以 sid 下「日期|价格」组合为键持久化到 localStorage，刷新后标记仍在 ——
   演示数据按 SKU 确定性生成，同一组合每次打开都一致，索引可跨刷新复用。 */
const PRICE_ABN = {};
(function(){
  try{
    const raw = localStorage.getItem('wb_price_abn');
    if(raw){ const o = JSON.parse(raw); for(const k in o) if(o[k] && o[k].length) PRICE_ABN[k] = o[k]; }
  }catch(e){}
  Object.keys(PRICE_HIST).forEach(sid=>{
    const set = PRICE_ABN[sid]; if(!set) return;
    PRICE_HIST[sid].forEach(x=>{ if(set.indexOf(x.at+'|'+x.p) !== -1) x.abn = true; });
  });
})();
function savePriceAbn(){
  try{ localStorage.setItem('wb_price_abn', JSON.stringify(PRICE_ABN)); }catch(e){}
}
/* 在「变更明细」里标记 / 取消标记某次改价为异常；标记后从均价与所有统计中排除 */
function toggleAbn(sid, idx){
  const h = PRICE_HIST[sid]; if(!h || !h[idx]) return;
  const x = h[idx], key = x.at + '|' + x.p;
  x.abn = !x.abn;
  const set = PRICE_ABN[sid] || (PRICE_ABN[sid] = []);
  const i = set.indexOf(key);
  if(x.abn){ if(i === -1) set.push(key); }
  else if(i !== -1) set.splice(i, 1);
  if(!set.length) delete PRICE_ABN[sid];
  savePriceAbn();
  priceTrend(sid);   /* 原地重渲染弹窗：均价、偏离、趋势线、明细同步刷新 */
  toast(x.abn ? '已标记为异常调价 · 已从均价等统计中排除' : '已取消异常标记');
}
/* 取某 SKU 的价格变更历史（无记录则回退到当前货品价格单点） */
function priceHist(sid){
  if(PRICE_HIST[sid] && PRICE_HIST[sid].length) return PRICE_HIST[sid];
  const c = CLAIM[sid];
  if(c && parseFloat(c.price) > 0) return [{at:'—', p:c.price, by:'—'}];
  return [];
}
/* ============================================================
   均价的时间口径（全平台唯一一处配置）
   ------------------------------------------------------------
   「均价」在本平台只有一个定义：这一页的均值列、趋势详情、以及货品编辑保存时
   的 ±50% 预警，调的都是 priceAvg()。所以口径也只能有一处配置 —— 分开写的结果
   必然是同一条货在列表按 3 个月算、在预警里按全部历史算，两个均价谁都说不清。

   口径决定的是「取哪些价格记录作样本」，不是「把样本加权」：
   样本取到之后仍然是简单平均（BR-06）。
   ============================================================ */
const AVG_RANGES = [
  {k:'m1',  label:'近 1 个月',  days:30},
  {k:'m3',  label:'近 3 个月',  days:90},
  {k:'m6',  label:'近 6 个月',  days:180},
  {k:'m12', label:'近 12 个月', days:365},
  {k:'all', label:'全部历史',   days:0}
];
let AVG_CFG   = 'm3';      /* 默认近 3 个月 —— 生鲜报价的常用参考窗口 */
let AVG_DRAFT = null;      /* 配置弹层里的临时选择，点「应用」才落到 AVG_CFG */
function avgDef(k){ return AVG_RANGES.find(x=>x.k===(k||AVG_CFG)) || AVG_RANGES[1]; }
function avgLabel(k){ return avgDef(k).label; }
/* 口径的起始日；'' = 不限（全部历史） */
function avgCut(k){ const d = avgDef(k); return d.days ? shiftDate(TODAY, -d.days) : ''; }
/* 按口径取「参与均价的样本」。
   无日期的占位记录（'—'，即只有当前价、没有改价历史的货品）一律计入 ——
   它是这类货品唯一的样本，按日期筛会把它筛成空，而它明明有一条真实价格。 */
function histIn(sid, k){
  const h = priceHist(sid), cut = avgCut(k);
  if(!cut) return h;
  return h.filter(x=> !/^\d{4}-\d{2}-\d{2}$/.test(String(x.at||'')) || String(x.at) >= cut);
}
/* 均价估算 = 口径内变更价的简单平均，供定价参考。
   口径内一条记录都没有时返回 0，调用方显示「—」—— 不回退到全部历史：
   一回退，「时间范围」这个配置就变成了装饰，用户永远不知道自己的设置生没生效。 */
/* 异常调价：被标记的改价记录不计入均价及一切统计维度（最高优先级）。
   排除优先于时间口径 —— 口径内但被标异常的，照常排除，不参与均值。 */
function isAbn(x){ return !!(x && x.abn); }
/* 真正参与统计的样本 = 口径内 且 非异常；avg / 偏离 / 趋势统计都从这里取 */
function histStat(sid, k){
  return histIn(sid, k).filter(x => !isAbn(x));
}
function priceAvg(sid, k){
  const h = histStat(sid, k);
  return h.length ? h.reduce((s,x)=>s+x.p,0)/h.length : 0;
}
/* 改价时记入历史 */
function recordPrice(sid, p, by){
  if(!PRICE_HIST[sid]) PRICE_HIST[sid] = [];
  PRICE_HIST[sid].push({at:ymdLocal(), p, by:by||'王强'});
}

def('A05','差异待说明','待办中心', ()=>{
  /* 差异待说明只统计「待发货且实发 ≠ 下单」的真实发货单：行数 / 实发金额 / 涉及金额
     一律由商品行派生。已完成单是足量发货、且验收结论已回写，不再进本待办。 */
  const list = SHIPMENTS.filter(sh=>sh.st==='WAIT' && shipDiffOf(sh)>0).map(sh=>{
    const ls = shipLinesOf(sh);
    const dl = ls.filter(l=>l.off || Number(l.qty)!==Number(l.q));
    const lost = dl.reduce((s,l)=>s + Math.abs(Number(l.q)-Number(l.qty))*Number(l.p), 0);
    return {sh:sh.no, po:sh.order, store:sh.store, rows:dl.length,
            amt:shipLineAmt(ls), lost:Math.round(lost*100)/100,
            time:sh.savedAt||sh.createdAt, over:'待核对保存'};
  });
  const pg = pgSlice('A05', list);
  const rows = pg.view.map(r=>`
    <tr class="st-diff">
      <td class="c" style="width:44px"><input type="checkbox" style="width:15px;height:15px;accent-color:var(--brand-600)"></td>

      <td class="mono r">${money(r.amt)}</td>
      <td class="mono r" style="color:var(--danger)">${money(r.lost)}</td>
      <td class="mono">${r.time}</td>
      <td class="mono" style="color:var(--danger)">${r.over}</td>
      <td class="r"><span class="link" onclick="toast('差异补填为二期功能')">一键补填</span></td>

  return pagehd('待办中心 · 差异待说明',
      `共 <b>${list.reduce((s,r)=>s+r.rows,0)} 行</b>实发与下单不一致、尚未填写原因 · <b>未补填不进入对账</b> · 仅统计待发货单`,

       <button class="btn btn-primary" onclick="toast('差异补填为二期功能')">逐单补填</button>`) +
  `<div class="card pad0">
    ${todoTabs('A05')}
    <div class="tb2">
      <select class="select" style="width:150px"><option>全部门店</option>${STORES.map(s=>`<option>${s.n}</option>`).join('')}</select>

      <input class="input" style="width:196px" placeholder="发货单号 / 订单号">
      <button class="btn btn-primary sm" onclick="toast('已按条件查询')">查询</button>
      <button class="btn btn-default sm" onclick="toast('已重置')">重置</button>
      <span class="hint r">仅统计<b>超阈值</b>行，浮差行不进本待办</span>

def('A05b','缺货预告待办','待办中心', ()=>{
  /* 待核对订单 = 真实「已确认」订单；未核对行 = 该订单明细里还没有预告记录的行 */
  const pendOrders = ORDERS.filter(o=>o.st==='CONFIRMED');
  const pend = pendOrders.map((o,i)=>{
    const ls = ordLines(o);
    return {no:o.no, store:o.store, lines:ls.length, un:ls.filter(r=>!r.pres).length,
            due:'今天 16:00', over:i===0?'已超时 3 小时 44 分':'剩 20 小时 16 分', k:i===0?'err':''};
  }).map(r=>`
    <tr class="${r.k==='err'?'st-diff':''}">
      <td class="name mono">${r.no}</td>
      <td>${r.store}</td>

  const presAll = ORDERS.reduce((a,o)=>a.concat(ordLines(o).filter(r=>r.pres).map(r=>({o, r}))), []);
  const done = presAll.map(({o,r})=>{
    const pr = r.pres, g = r.q - (Number(pr.qty)||0);
    const hd = pr.handled || '待回音';
    const cls = hd==='已找替补'?'done':(hd==='接受减量'?'proc':(hd==='待回音'?'wait':'off'));
    return `
    <tr>
      <td class="name">${escHTML(r.n)}</td>
      <td class="mono r">${fmt(r.q)}</td>
      <td class="mono r">${fmt(pr.qty)}</td>
      <td class="mono r" style="color:${g>0?'var(--warning)':'var(--text-4)'}">${g>0?'−'+fmt(g):'0'}</td>
      <td>${pr.reason==='—'?'<span class="hint">—</span>':escHTML(pr.reason||'—')}</td>
      <td class="mono">${escHTML(pr.time||'—')}${pr.late?' <span class="tag wait" style="height:18px;font-size:10.5px">迟</span>':''}</td>
      <td class="mono">${pr.readAt || (hd==='待回音'?'待回音':'10-26 18:30')}</td>
      <td><span class="tag ${cls}" style="height:20px;font-size:11px">${hd}</span></td>
      <td style="font-size:12.5px;color:var(--text-3)">${r.act===0?'未供（与预告一致）':`供 ${fmt(r.act)} ${escHTML(r.u)}（与预告一致）`}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" class="hint" style="padding:18px 20px">暂无已提交的缺货预告记录。</td></tr>`;

  return pagehd('待办中心 · 缺货预告',
      `待核对 <b>${pendOrders.length} 单</b>（其中 <b>1 单已过截止</b>）· 已提交 <b>${presAll.length} 行</b>，食堂回音 <b>${presAll.filter(x=>x.r.pres.handled && x.r.pres.handled!=='待回音').length} 行</b> · 提交后不改订单`,
      `<button class="btn btn-default" onclick="toast('已导出预告台账')">${I.down}导出</button>
       <button class="btn btn-primary" onclick="goD05('${pendOrders.length?pendOrders[0].no:ORDER.no}','A05b')">${I.bell}发起预告</button>`) +
  `<div class="card pad0">
    ${todoTabs('A05b')}
    <div class="tb2">
      <span class="hint">预告不改变订单数量与金额，只让食堂提前知道、提前找替补</span>
      <span class="hint r">预告截止默认提前 8 小时 · 可在 J05 调整</span>
    </div>
  </div>

  <div class="card pad0" style="margin-top:12px">
    <div class="card-hd">
      <h3>① 待核对可供量 <span class="sub">已排产但还没确认明天能不能全供上</span></h3>
      <span class="tag wait">${pendOrders.length} 单</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th>订单号</th><th>门店</th><th class="r">行数</th><th class="r">未核对行</th>
        <th>预告截止</th><th>状态</th><th class="r">操作</th>
      </tr></thead>
      <tbody>${pend}</tbody>
    </table></div>
    <div style="padding:11px 20px;background:var(--brand-50);border-top:1px solid var(--line);font-size:12.5px;color:var(--text-3)">超时提交仍会被接收，但标记「<b>迟预告</b>」：食堂当天下午已排好菜单、补救空间小，因此单独统计。
    </div>

  <div class="card pad0" style="margin-top:12px">
    <div class="card-hd">
      <h3>② 已提交 · 看食堂回音 <span class="sub">提交完就石沉大海的功能，用两次就没人再用</span></h3>
      <span class="link muted" onclick="goD05('${ORDER.no}','A05b')">查看完整台账</span>

      <span class="fi"><span class="lg" style="background:#FEF3E2"></span>迟预告 <b>${presAll.filter(x=>x.r.pres.late).length}</b></span>
      <span class="fi"><span class="lg" style="background:#F1F5F9"></span>预告了但未缺 <b>${presAll.filter(x=>x.r.q===(Number(x.r.pres.qty)||0)).length}</b>（偏保守，不罚但统计）</span>

    </div>
  </div>
`;
});

/* ============================================================
   共享：形态标签（毛菜 / 净菜 / 半成品）
   —— B02 货品编辑、B03 供货价格维护都复用这一个渲染
   ============================================================ */
const FORMTAG = f => f==='毛菜' ? tag('毛菜','off') : (f==='净菜' ? tag('净菜','proc') : tag('半成品','wait'));

/* ============================================================
   B02 · 确认 / 完善供货货品
   ============================================================ */
/* ------------------------------------------------------------
   前端校验
   —— 目标：必填未填 / 价格异常时标红到具体字段、说清怎么改，
      并且真的不落库。价格会一路流进报价 → 订单 → 对账，
      一个多打的小数点能亏掉一单，所以这里宁可拦住。
   ------------------------------------------------------------ */
const B02LBL = {price:'货品价格', alias:'货品别名', tpcode:'货品第三方编码',
                pack:'包装单位', origin:'产地', shelf:'保质期', note:'内部备注'};
/* 价格偏离历史均价的预警线 —— 超过就拦（±50% 是生鲜单次调价的合理上限） */
const B02_DEV = 0.5;

/* 属性值转义：品名 / 别名里带 " 或 < 时不至于把 value="" 撕开 */
const at = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* 草稿：首次进入按 CLAIM 回填；换 SKU 自动重来 */
function b02Draft(g){
  if(!B02DRAFT || B02DRAFT.sid !== g.sid){
    B02DRAFT = {
      sid: g.sid,
      alias:  g.alias  || '',
      pack:   g.pack   || '',
      origin: g.origin || '',
      shelf:  g.shelf  || '',
      tpcode: g.tpcode || '',
      note:   g.note   || '',
      price:  parseFloat(g.price) > 0 ? String(parseFloat(g.price).toFixed(2)) : ''
    };
    B02ERR = {};
  }
  return B02DRAFT;
}

/* 校验：返回 {字段: 说明}，空对象 = 通过
   —— 只有「货品价格」是必填：它是唯一一路流进报价 → 订单 → 对账的数字。
      包装单位、产地只影响单据怎么印，缺了照样能供货，所以不拦保存、也不拦报价
      （以前这两个是必填，结果是门店一推送就得先补两项才能给价，纯属自找的阻塞）。 */
function b02Check(d){
  const e = {};

  const raw = String(d.price==null?'':d.price).trim();
  if(!raw){
    e.price = '货品价格必填 —— 没有价格，这个货品进不了询价单，也开不了直采单';
  }else if(/^-/.test(raw)){
    e.price = '货品价格不能为负数';
  }else if(!/^(\d+(\.\d+)?|\.\d+)$/.test(raw)){
    e.price = '只能填数字（如 3.20），不要带「元」、单位或空格';
  }else{
    const p   = parseFloat(raw);
    const avg = priceAvg(d.sid);
    if(!(p > 0)){
      e.price = '货品价格必须大于 0';
    }else if(p > 9999){
      e.price = '单价 ' + raw + ' 元明显偏高，疑似多输了一位数';
    }else if(/\.\d{3,}$/.test(raw)){
      e.price = '最多 2 位小数 —— 金额只精确到分';
    }else if(avg > 0 && Math.abs(p-avg)/avg > B02_DEV){
      const dev = (p-avg)/avg*100;
      /* 文案里必须带口径：同一句话在「近 1 个月」和「全部历史」下指的完全不是同一个数，
         不写清楚，用户会拿这个均价去对账，然后对不上。 */
      e.price = '较' + avgLabel() + '均价 ¥' + avg.toFixed(2) + ' 偏离 ' + (dev>0?'+':'') + dev.toFixed(0)
              + '%，超出 ±' + (B02_DEV*100) + '% 预警线；确实要调这个幅度，请走「批量调货品价格」（带留痕）';
    }
  }
  return e;
}

/* 输入即清掉本字段的红框 —— 只改 DOM，不整体重渲染，否则输入框会失焦 */
function b02Set(k, v){
  if(!B02DRAFT) return;
  B02DRAFT[k] = v;
  if(B02ERR[k]){
    delete B02ERR[k];
    const el = document.getElementById('b2-'+k);
    if(el) el.classList.remove('err');
    const box = document.querySelector('.field[data-f="'+k+'"]');
    if(box) box.classList.remove('bad');
    const m = document.getElementById('b2e-'+k);
    if(m){ m.classList.remove('err'); m.innerHTML = b02Hint(k); }
  }
  b02Sync();
}

/* 页头状态 + 顶部汇总条跟着 B02ERR 实时收敛 —— 修好一项就走一项，不留陈旧文案 */
function b02Sync(){
  const g = goodsOne(EDITSID);
  if(!g || !B02DRAFT) return;
  const n = Object.keys(B02ERR).length;

  const t = document.getElementById('b2-tag');
  if(t){
    const left = n || Object.keys(b02Check(B02DRAFT)).length;
    t.className = 'tag ' + (left ? 'wait' : 'done');
    t.textContent = left ? ('未填完 · 缺 ' + left + ' 项') : '填写完整 · 可保存';
  }

  const box = document.getElementById('b2-vfail');
  if(box){
    box.style.display = n ? 'flex' : 'none';
    const vn = document.getElementById('b2-vn');
    if(vn && n) vn.textContent = n;
    const ul = document.getElementById('b2-vlist');
    if(ul) ul.innerHTML = n
      ? Object.keys(B02ERR).map(k=>`<li>${B02LBL[k]||k} —— ${B02ERR[k]}</li>`).join('')
      : '';
  }
}

/* 保存：先校验，不通过就标红 + 拦住，一个字段都不写 */
/* 写一个 SKU 的货品信息 —— 单条保存（B02）与批量导入（B03i）共用这一处。
   分开写两份的结果必然是：一边改价记了历史、另一边忘了；一边同步了报价行的初始价、
   另一边没同步，然后同一个字段在两张页面上显示成两个价。 */
function applyGoods(sid, d, by){
  const c = CLAIM[sid] || (CLAIM[sid] = {});
  c.pack   = (d.pack   || '').trim();
  c.origin = (d.origin || '').trim();
  c.shelf  = (d.shelf  || '').trim();
  c.alias  = (d.alias  || '').trim();
  c.tpcode = (d.tpcode || '').trim();
  c.note   = (d.note   || '').trim();

  const p = parseFloat(d.price);
  const had = parseFloat(c.price) > 0;
  const changed = Math.abs((parseFloat(c.price) || 0) - p) > 0.0001;
  c.price = p;
  if(changed) recordPrice(sid, p, by || '王强');     /* 改价必留痕 */
  c.done = fullOf(c) ? 1 : 0;
  /* 未提交的报价单里，这一行的初始价跟着货品价格走（已提交的单不动，BR-07） */
  QUOTE.forEach(r=>{ if(r.pid === sid) r.price = p; });
  return {p, changed, had};
}

function b02Save(){
  const g = goodsOne(EDITSID);
  if(!g) return;
  const wasSt = gSt(g.sid);            /* 保存前的状态 —— 决定提示怎么说 */
  const d = b02Draft(g);
  const e = b02Check(d);
  B02ERR = e;
  const ks = Object.keys(e);

  if(ks.length){
    go('B02');                       /* 重渲染，让红框与原因出现（草稿在数据层，内容不丢） */
    const first = document.getElementById('b2-'+ks[0]);
    if(first){ first.focus(); first.scrollIntoView({block:'center'}); }
    toast('有 '+ks.length+' 项不符合要求，未保存：'+ks.map(k=>B02LBL[k]||k).join(' / '), 'err');
    return;
  }

  const r = applyGoods(g.sid, d, '王强');

  B02DRAFT = null; B02ERR = {};
  /* 回到货品**真正所在**的那个 Tab，不是一律「已设价」。
     原来写死 'priced'：从「临时停售」Tab 点编辑、只改了个别名保存，
     货还在停售、却把你送到「已设价」——列表里当然找不到它，像是保存把它弄丢了。 */
  B03TAB = SUSPEND[g.sid] ? 'suspend' : (VOID[g.sid] ? 'void' : 'priced');
  /* 提示按「保存前是什么状态」分开说：
     停售中的货品保存完仍是停售，不能跟着喊「转为已设价、可参与询价」 */
  toast(SUSPEND[g.sid]
    ? `已保存 · 该货品仍在临时停售中，恢复在售后新价才生效`
    : (wasSt === 'pending'
        ? `已设价 ¥${r.p.toFixed(2)}${r.changed?' · 价格变动已记入历史':''} · 状态转为「已设价」，可参与询价与直采`
        : (r.changed
            ? `已改价 ¥${r.p.toFixed(2)} · 价格变动已记入历史 · 只影响从这一刻起的新单`
            : `已保存 · 价格未变，未产生新的价格记录`)));
  go(B02BACK);
}

/* 校验提示：money 类字段的 hint 依赖单位，所以做成函数而不是常量 */
function b02Hint(k){
  const g = goodsOne(EDITSID) || {};
  if(k==='pack')   return '<b>选填</b> · 验收时和门店包规核对的依据，不填也能供货';

  if(k==='note')   return '选填 · 只有你自己看得到，不打印在任何单据上';
  return '';
}

/* ============================================================
   B03 · 供货价格维护（合并原「门店商品目录 / 供货确认 / 失效商品」三屏）
   ------------------------------------------------------------
   数据从哪来：底层直接复用门店 SKU 数据 —— 即各门店分配给本供应商的商品；
   供应端不另建商品主数据，只挂一张扩展表，按 SKU 维护货品价格与扩展信息。
   门店对商品的新增 / 改规格 / 改价 / 下架 / 删除，由门店侧接口回调实时推过来，
   页面不轮询、不做定时拉取，更没有「手动刷新」：通道是否健康，看同步状态即可。

   一条状态线，四个可见阶段：
       门店推送 → 待设价 → 已设价 → 临时停售 / 已失效
   原来中间那道「确认供货」整段拿掉：推送过来即「待设价」，填完价即
   「已设价」，立刻能进询价、直采、发货；唯一需要表达「我不卖」的地方
   是「临时停售」—— 可恢复、不扣分、不删记录。

   门店侧两个动作，供应端两种处理，别混：
       下架  → 「已失效」，只读留痕；门店重新上架，下一条推送自动恢复
       删除  → 供应端逻辑删除，直接退出清单，不再占你的看板
               （数据仍留着——历史订单、验收、对账、发票要能追溯）
   ============================================================ */
/* 门店重新上架后的自动恢复：按失效前状态还原，删除过的同 SKU 重新上架也算
   —— 「门店又上架了」这件事没有第二种答案，所以不设人工确认 */
function applyBack(){
  const back = CATALOG.filter(c=>VOID[c.sid] && VOID[c.sid].back);
  back.forEach(c=>{
    const prev = VOID[c.sid].prev;
    delete VOID[c.sid];
    if(prev==='suspend' && !SUSPEND[c.sid]){
      SUSPEND[c.sid] = {at: nowStamp(), why:'失效前已停售', note:'门店重新上架后按原状态恢复'};
    }
  });
  return back.length;
}
/* Tab 顺序 = 商品在你手里走过的路（门店删除的不进来，见 b03List） */
const B03TABDEF = [
  ['all','全部'], ['pending','待设价'], ['priced','已设价'], ['suspend','临时停售'], ['void','已失效']
];
const B03HINT = {
  all:    '直接复用门店 SKU 数据，这一屏始终与门店一致 · 按 SKU 编码正序，同一商品的多规格上下相邻',
  pending:'门店送来的货品即「待设价」· 填完货品价格并保存，自动变「已设价」（其余字段选填）',
  priced: '已设价即可参与询价、直采与发货；点「编辑」改动价格 / 包装 / 产地等，只影响之后的新单，不回溯历史单据',
  suspend:'临时停售不是拒绝：随时恢复在售，不删记录、不影响评分，停售期间不进新询价',
  void:   '只有「下架」算失效，只读留痕，门店重新上架后自动恢复；门店「删除」的不在这一页 —— 供应端已逻辑删除'
};
let B03TAB = 'all';
function goB03(tab){ B03TAB = tab || 'all'; go('B03'); }

/* 供货价格维护的筛选项：与「状态 Tab」正交 —— Tab 决定看哪一类货，
   下面四个筛选项再在当前类里继续收窄；切换 Tab 时筛选保留、不丢。
   只存值、不重渲染：重渲染交给「查询」按钮，避免输入过程中整屏重绘导致输入框失焦 */
let B03STORE='', B03FORM='', B03CAT='', B03KW='';
function b03SetVal(k,v){
  if(k==='store') B03STORE=v; else if(k==='form') B03FORM=v;
  else if(k==='cat')  B03CAT=v;  else if(k==='kw')   B03KW=v;
}
function b03Apply(){ go('B03'); }
function b03ResetFilter(){ B03STORE=''; B03FORM=''; B03CAT=''; B03KW=''; go('B03'); }
function b03StatusTag(sid){
  const st = gSt(sid);
  return st==='priced'  ? tag('已设价','done')
       : st==='suspend' ? tag('临时停售','off')
       : st==='void'    ? tag('已失效','off')
       : st==='del'     ? tag('门店已删除','off')
       : tag('待设价','wait');
}
/* 「推送 / 报价 / 停售说明」列已移出视觉区，原因写进状态格的 hover 提示 ——
   停售理由、失效原因、还有几行货没发完，都还能看到，但不再占一列宽度 */
function tipOf(html){
  return String(html).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().replace(/"/g,'&quot;');
}
/* 排序：一律按 SKU 编码正序 —— 编码里带着商品序，同一商品的多规格自然挨在一起
   （P10013 的 5kg/箱 与 2.5kg/箱 就上下相邻，报错规格的概率比按时间乱序低得多）。
   不做「待我动作优先」：那会让行随状态跳来跳去，你第二次找同一行得重新扫一遍。
   注意 base 用 liveCat()：门店删除的已经逻辑删除，不进任何 Tab —— 包括「全部」 */
function b03List(k){
  let base = liveCat().filter(c=> k==='all' ? true : gSt(c.sid)===k);
  if(B03STORE) base = base.filter(c=> c.store===B03STORE);
  if(B03FORM)  base = base.filter(c=> c.form===B03FORM);
  if(B03CAT)   base = base.filter(c=> c.cat.indexOf(B03CAT)>=0);
  if(B03KW){ const kw = B03KW.toLowerCase(); base = base.filter(c=> (c.sid+' '+c.pname).toLowerCase().indexOf(kw)>=0); }
  return base.slice().sort((a,b)=> String(a.sid).localeCompare(String(b.sid)));
}

def('B03','供货价格维护','商品与价格', ()=>{
  /* 计数一律基于在管清单：门店删除的已逻辑删除，不进分母、不进任何 Tab */
  const cnt = s => liveCat().filter(c=>gSt(c.sid)===s).length;
  const nPend = cnt('pending'), nPriced = cnt('priced'), nSus = cnt('suspend'), nVoid = cnt('void');
  const nAll = liveCat().length, nDel = delCount();
  const tab  = B03TABDEF.some(t=>t[0]===B03TAB) ? B03TAB : 'all';
  const list = b03List(tab);
  const pg   = pgSlice('B03'+tab, list);
  const backN = offList().filter(c=>VOID[c.sid].back).length;
  const owedN = offList().filter(c=>VOID[c.sid].owed>0).length;

  const rows = pg.view.map(c=>{
    const st = gSt(c.sid), cl = CLAIM[c.sid], sp = SUSPEND[c.sid], vd = VOID[c.sid];
    /* 没价格一律一个破折号，和本屏同一写法
       —— 以前这里有「待设价」「未设价」两种说法，同一个格子两种词，
          扫列表时得多读一遍才知道都是「没价」。有没有价看有没有 ¥ 就够了，
          至于为什么没价（待你设价 / 已失效 / 门店删了），状态列已经说清楚了 */
    const price = (cl && parseFloat(cl.price) > 0) ? ('¥' + parseFloat(cl.price).toFixed(2))
      : '<span style="color:var(--text-4)">—</span>';
    let note = '<span style="color:var(--text-4)">—</span>';
    if(st==='pending'){
      note = `<span style="color:var(--text-4)">${(c.t||'').slice(0,10)} 推送 · 接口推送</span>`;
    }else if(st==='priced'){
      /* 包装单位 / 产地改成选填后可能是空的 —— 逐段拼，别留下「 · 别名 xxx」这种前后都空的残句 */
      const p1 = cl.pack || '<span style="color:var(--text-4)">未填包装单位</span>';
      const bits = [];
      if(cl.origin) bits.push(cl.origin);
      if(cl.alias)  bits.push('别名 ' + cl.alias);
      note = `<span style="color:var(--text-3)">${p1}</span>
              <span style="display:block;font-size:11px;color:var(--text-4)">${bits.length ? bits.join(' · ') : '未填产地'}</span>`;
    }else if(st==='suspend'){
      note = `<b style="color:#B45309">${sp.why||'临时停售'}</b>
              <span style="display:block;font-size:11px;color:var(--text-4)">${sp.at}${sp.note?(' · '+sp.note):''}</span>`;
    }else{
      note = `<span style="color:var(--text-3)">${vd.type} · ${(vd.at||'').slice(0,10)}</span>
              <span style="display:block;font-size:11px;${vd.owed>0?'color:#B45309':'color:var(--text-4)'}">${
                vd.owed>0 ? ('仍有 '+vd.owed+' 行未完成订单，照常发货')
                          : (vd.back ? '门店已重新上架 · 自动恢复在售' : (vd.note||''))}</span>`;
    }
    const act =
      st==='pending' ? `<span class="link" onclick="editGoods('${c.sid}')">设价</span>
                        <span class="link muted" style="margin-left:10px" onclick="suspendAsk('${c.sid}')">停售</span>`
    : st==='priced'  ? `<span class="link" onclick="editGoods('${c.sid}')">编辑</span>
                        <span class="link muted" style="margin-left:10px" onclick="suspendAsk('${c.sid}')">停售</span>`
    : st==='suspend' ? `<span class="link" onclick="resumeDo('${c.sid}')">恢复在售</span>
                        <span class="link muted" style="margin-left:10px" onclick="editGoods('${c.sid}')">编辑</span>`
    : `<span class="link muted">${vd.back?'等待推送恢复':'等待门店上架'}</span>`;
    return `
    <tr class="${st==='pending'?'st-diff':((st==='suspend'||st==='void')?'st-rej':'')}">
      <td class="mono" style="font-size:11px;color:var(--text-3)">${c.sid}</td>
      <td class="name"><span class="ellip">${c.pname}</span>
        <span class="ellip" style="font-size:11.5px;color:var(--text-4);font-weight:400">${c.spec}</span></td>
      <td class="c">${c.u}</td>
      <td class="c">${FORMTAG(c.form)}</td>
      <td><span class="ellip">${c.cat}</span></td>
      <td style="font-size:12px;color:var(--text-3)"><span class="ellip">${c.brand}</span></td>
      <td style="font-size:12px;color:var(--text-2)"><span class="ellip">${c.store}</span></td>

      <td title="${tipOf(note)}">${b03StatusTag(c.sid)}</td>
      <td class="r">${act}</td>
    </tr>`;
  }).join('');

  const numOf = k => k==='all'?nAll : (k==='pending'?nPend : (k==='priced'?nPriced : (k==='suspend'?nSus : nVoid)));
  /* Tab 上的数字只是「筛出来有几条」，不是待办提醒 —— 待办橙色高亮就在这屏的「待你设价」标签，

  const tabs = B03TABDEF.map(([k,n])=>

  ).join('');

  const voidNote = (tab==='void' && (backN||owedN)) ? `<div class="banner warn" style="margin:12px 14px 0">

      ${owedN?`<div style="margin-top:${backN?'6px':'0'}">${backN?'其中':'有'} <b>${owedN}</b> 个 SKU 仍有未完成订单：失效只停「未来」，<b>已经答应的货照常分拣、照常发货</b>。</div>`:''}
    </div>

  const okN   = nPriced;                                  /* 可参与报价 = 已设价 */

  const goneN = b01Voided();                              /* 门店下架 / 删除 */

/* ============================================================
   B03i · 导入货品信息（供货价格维护页「导出」旁边那个「导入」）
   ------------------------------------------------------------
   为什么要单独一屏：门店一次推来 28 个「待设价」SKU，而价格早就躺在你自己的报价表里。
   一个一个点「设价」= 28 次跳页 + 28 次复制粘贴；批量导入是唯一能把它压成一次操作的路径。
   三条硬规则，少一条都会把已经设好的货弄坏：
     1) 价格必填且大于 0 —— 货品价格是唯一流进报价 / 订单 / 对账的数字，导入不能绕过这道门槛；
     2) 只收待设价 / 已设价 / 临时停售 —— 已失效（门店下架）和门店已删除是只读留痕，挡回去；
     3) 空单元格 = 保持原值 —— 否则「只导价格」的那份文件会把别名、产地、保质期一并清空。
   写入统一走 applyGoods()，跟 B02 单条保存是同一条路：改价留痕、未提交报价行的价格同步
   这两件事不会变成「单条有、批量没有」。
   ============================================================ */
const IMPMAX  = 500;                        /* 单次上限：再多就该走接口对接，不是粘贴 */
/* 列定义：[键, 表头, 认表头时接受的别名, 类别]
   类别三档：req 必填 / opt 选填（留空保持原值）/ ro 只读对照（整列不参与写入）。
   info 这一列是给眼睛用的：模板里写着「上海青 · 5kg/件 · 徐汇滨江店」，
   扫一眼就知道这行是哪个货，不用回头查 SKU 编码。
   它也是这一屏唯一「写不进去」的列 —— 商品名、规格、门店都是门店推过来的主数据，
   供应商改不了（B03 的只读边界）。所以这列改了不会报错、也不会生效，导入时被跳过。 */
const IMPCOLS = [
  ['sid',   'SKU编码',        ['sku编码','skucode','sku','编码'],            'req'],
  ['info',  '商品信息（只读）', ['商品信息','商品基础信息','商品名称','品名'],    'ro'],
  ['price', '货品价格',        ['货品价格','价格','单价'],                    'req'],
  ['pack',  '包装单位',        ['包装单位','包装','包规'],                    'opt'],
  ['origin','产地',            ['产地'],                                    'opt'],
  ['shelf', '保质期',          ['保质期'],                                  'opt'],
  ['alias', '别名',            ['别名'],                                    'opt'],
  ['tpcode','三方编码',        ['三方编码','第三方编码'],                     'opt'],
  ['note',  '备注',            ['备注'],                                    'opt']
];
/* 模板列序（带表头时按名字对，不依赖这个顺序；无表头时才用它兜底） */
const IMPORD  = IMPCOLS.map(c=>c[0]);
/* 上一版模板的列序：那时候还没有 info 列。用户手里可能留着旧文件，
   删掉表头再导时列数少一列，若还按新序读，价格会读到包装单位上去 —— 所以按列数分流。 */
const IMPORD_OLD = ['sid','price','pack','origin','shelf','alias','tpcode','note'];
const IMPINFO = 'info';                     /* 只读列，单独拎出来免得散落各处写字符串 */
const IMPNAME = {pack:'包装单位', origin:'产地', shelf:'保质期', alias:'别名', tpcode:'三方编码', note:'备注'};
/* 第 1 步那张「九列怎么写」的说明表：以 IMPCOLS 为骨架，这里只补每个键怎么讲。
   从同一份定义派生，加一列就自动多一行 —— 上一版是这里手抄了一遍列名，
   加列时最容易漏的就是这一处（页面写着 8 列、模板导出 9 列，用户照着页面填必错）。 */
const IMPDOC = {

  pack:  ['选填',        '留空保持原值不动'],
  origin:['选填',        '留空保持原值不动'],
  shelf: ['选填',        '留空保持原值不动'],
  alias: ['选填',        '留空保持原值不动'],
  tpcode:['选填',        '留空保持原值不动'],
  note:  ['选填',        '留空保持原值不动']

/* 长度上限：这些字段最后要印在送货单 / 拣货单上，超长会被裁掉 —— 裁在哪儿不可控 */

const CUR_USER = CUR_ACCOUNT.name;             /* 当前操作员（主账号），取自当前账号 */

/* 导入记录列表页（B03ir）与详情页（B03ird）：从「导入货品信息」单入口进入，

def('B03ir','导入记录','__import_log__', ()=> impRecListHtml());

/* 一行切成格：Excel 粘过来是 \t，存成 CSV 是 ，，引号里的分隔符不算 */
function impCells(line){
  const sep = line.indexOf('\t') >= 0 ? '\t' : ',';
  const out = []; let cur = '', q = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(q){
      if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    }else if(ch === '"') q = true;
    else if(ch === sep){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
/* 只读对照列的值：品名 · 规格 · 门店。模板和「对照不一致」的判定都用它，
   两处必须同一份拼法，否则用户改都没改就被提示"与系统不一致" */
function impInfoOf(c){
  if(!c) return '';
  return [c.pname, c.spec, c.store].filter(Boolean).join(' · ');
}
/* 表头 → 列号。带表头就按名字对；表头被顺手删掉了就按模板顺序读 ——
   行序还是模板序，不能因此把整份文件判废。
   只读列也照常认出来（认出来才知道要跳过它，而不是当成一个不认识的列） */
function impIdx(head){
  const m = {};
  head.forEach((h,i)=>{
    const k = String(h).toLowerCase().replace(/[\s　]/g,'');
    IMPCOLS.forEach(def=>{
      const key = def[0], als = def[2];
      if(m[key] !== undefined) return;
      if(als.some(a=> k === a || k.indexOf(a) === 0)) m[key] = i;
    });
  });
  return m;
}
/* 无表头时按列数分流：9 列 = 当前模板（含 info），8 列 = 旧模板。
   只读列不进 idx —— 不进就是"整列忽略"，后面所有取数都不会碰它 */
function impNoHeadIdx(n){
  const ord = n >= IMPORD.length ? IMPORD : IMPORD_OLD;
  const m = {};
  ord.forEach((k,i)=>{ if(k !== IMPINFO) m[k] = i; });
  return m;
}
/* 单行判定：先把「为什么不能写」说清楚，再去算差异 —— 顺序反过来，
   一条已失效的行也会长出「¥3.00 → ¥3.20」这种看着能写的预览 */
function impJudge(r, seen){
  const c = CATALOG.find(x=>x.sid === r.sid);
  const why = [];
  let st = null;
  if(!r.sid) why.push('缺 SKU 编码');
  else if(!c) why.push('SKU「'+r.sid+'」不在你的门店商品里');
  else{
    st = gSt(c.sid);
    if(st === 'del')       why.push('门店已删除 · 已逻辑删除，只读留痕');
    else if(st === 'void') why.push('已失效（门店下架）· 只读留痕，等门店重新上架');
    if(seen[r.sid] !== undefined) why.push('与第 '+seen[r.sid]+' 行重复，只认第一行');
    else seen[r.sid] = r.ln;
  }
  const raw = String(r.price == null ? '' : r.price).trim();
  const p = parseFloat(raw);
  if(!raw) why.push('价格必填');
  else if(isNaN(p) || p <= 0) why.push('价格须为大于 0 的数字（现填「'+raw+'」）');
  Object.keys(IMPLIM).forEach(k=>{
    const v = String(r[k] == null ? '' : r[k]);
    if(v.length > IMPLIM[k]) why.push(IMPNAME[k]+' 超过 '+IMPLIM[k]+' 字（现 '+v.length+' 字）');
  });
  return {st, why, p};
}
/* 合并 + 差异：因为「空 = 保持原值」，「会改成什么」能精确算出来并摆给你看 */
function impPlan(r){
  const cur = goodsOne(r.sid) || {};
  const keep = (v, old) => { const s = String(v == null ? '' : v).trim(); return s === '' ? String(old || '') : s; };
  const d = {
    price: r.price,
    pack:  keep(r.pack,   cur.pack),   origin: keep(r.origin, cur.origin),
    shelf: keep(r.shelf,  cur.shelf),  alias:  keep(r.alias,  cur.alias),
    tpcode:keep(r.tpcode, cur.tpcode), note:   keep(r.note,   cur.note)
  };
  const p = parseFloat(r.price), oldP = parseFloat(cur.price) || 0;
  const chg = [];
  if(Math.abs(oldP - p) > 0.0001)
    chg.push({k:'price', t: oldP > 0 ? ('¥'+oldP.toFixed(2)+' → ¥'+p.toFixed(2)) : ('设价 ¥'+p.toFixed(2))});
  ['pack','origin','shelf','alias','tpcode','note'].forEach(k=>{
    const nv = String(d[k]||'').trim(), ov = String(cur[k]||'').trim();
    if(nv === ov) return;
    chg.push({k, t: ov ? (IMPNAME[k]+' '+ov+' → '+nv) : (IMPNAME[k]+' 新增「'+nv+'」')});
  });
  return {cur, d, p, oldP, chg};
}
function impParse(raw){
  const lines = String(raw||'').split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length);
  if(!lines.length) return {empty:true, ok:[], bad:[], same:[], cut:0, hasHead:false, infoChg:0};
  const head = impCells(lines[0]);
  const m = impIdx(head);
  const hasHead = (m.sid !== undefined) || (m.price !== undefined);
  const idx = hasHead ? m : impNoHeadIdx(impCells(lines[0]).length);
  const all = hasHead ? lines.slice(1) : lines;
  const cut = Math.max(0, all.length - IMPMAX);
  const seen = {};
  const ok = [], bad = [], same = [];
  /* 只读列被改写的行数。不参与任何写入，但要数出来告诉用户"你改的这一列没上传"——
     不说的话，改完品名发现门店那边没变，会以为是导入丢数据了 */
  const infoChg = {n: 0};
  all.slice(0, IMPMAX).forEach((line, i)=>{
    const c = impCells(line);
    const ln = i + (hasHead ? 2 : 1);     /* 行号按你文件里的行算，报错时能照着改 */
    const gv = k => (idx[k] === undefined ? '' : String(c[idx[k]] == null ? '' : c[idx[k]]).trim());
    const r = {ln, sid:gv('sid'), price:gv('price'), pack:gv('pack'), origin:gv('origin'),
               shelf:gv('shelf'), alias:gv('alias'), tpcode:gv('tpcode'), note:gv('note'),
               info:gv(IMPINFO)};
    const j = impJudge(r, seen);
    const cat = CATALOG.find(x=>x.sid === r.sid);
    r.st = j.st; r.stName = j.st ? STNAME[j.st] : '—';
    r.name = cat ? cat.pname : '—';
    r.spec = cat ? cat.spec : '';
    r.store = cat ? cat.store : '—';
    r.infoSys = impInfoOf(cat);
    r.infoEdited = !!(r.info && r.infoSys && r.info !== r.infoSys);
    if(j.why.length){ r.why = j.why; bad.push(r); return; }
    const pl = impPlan(r);
    r.plan = pl; r.chg = pl.chg; r.p = pl.p; r.oldP = pl.oldP;
    if(r.infoEdited) infoChg.n++;
    /* 一字未改的行不进「可写入」：既没东西可写，还会在结果里占一个「成功」的坑 */
    if(!pl.chg.length){ r.why = ['与现有信息完全一致，没有要写的东西']; same.push(r); return; }
    ok.push(r);
  });
  return {empty:false, hasHead, cut, ok, bad, same, infoChg: infoChg.n};
}

/* ---------------- 状态与动作 ---------------- */
function impIsSel(ln){ return !IMPSEL || IMPSEL[ln] !== false; }
function impSelRows(){ return (IMP ? IMP.ok : []).filter(r=>impIsSel(r.ln)); }
function impSelN(){ return impSelRows().length; }

function impToggle(ln, cb){

function impSyncHd(){

/* 从 B03 进来一律从第一步开始：上一批的解析结果留着，很容易和新文件混成一批 */
function impOpen(){ IMPST = 1; IMP = null; IMPDONE = null; IMPSEL = null; IMPRAW = ''; go('B03i'); }
function impBack(){ IMPST = 1; go('B03i'); }
function impRestart(){ IMPST = 1; IMP = null; IMPDONE = null; IMPSEL = null; IMPRAW = ''; go('B03i'); }

function impRun(text){
  IMPRAW = String(text == null ? IMPRAW : text);
  const r = impParse(IMPRAW);
  IMP = r; IMPDONE = null; IMPSEL = null;
  if(r.empty){
    IMPST = 1; go('B03i');
    toast('还没有数据：把表格粘进来，或点「载入示例」看一份完整的', 'err');
    return;
  }
  IMPST = 2; go('B03i');
  const nNo = r.bad.length + r.same.length;
  toast(r.ok.length
    ? ('校验完成 · 可写入 '+r.ok.length+' 条' + (nNo ? ('，另有 '+nNo+' 条不写入，原因见下表') : ''))
    : '没有可写入的行 —— 原因都在下表里',
    r.ok.length ? 'ok' : 'err');
}
function impSample(){ impRun(impSampleText()); }
function impFile(ins){
  const f = ins && ins.files && ins.files[0];
  if(!f) return;
  const nm = String(f.name).toLowerCase();
  const isBinary = /\.(xlsx?|xlsm?)$/.test(nm);
  const el = document.getElementById('imp-file-name');
  if(el) el.textContent = f.name;
  /* 二进制表格（.xlsx / .xls）：ExcelJS 读成工作簿，取第一张表转成 CSV 文本，
     仍走同一套 impParse 校验逻辑 —— 加列、改匹配规则只在 impParse 一处维护 */
  if(isBinary){
    if(typeof ExcelJS === 'undefined'){
      toast('未能加载表格解析库（ExcelJS），请联网后重试，或「另存为 .csv / .tsv」再上传', 'err');
      return;
    }
    try{
      const rd = new FileReader();
      rd.onload = () => {
        new ExcelJS.Workbook().xlsx.load(rd.result).then(wb=>{
          const ws = wb.worksheets[0];
          if(!ws){ toast('这个表格读不出来：第一张表是空的', 'err'); return; }
          impRun(excelwsToCsv(ws));
          if(el) el.textContent = f.name + ' · 已校验（表：' + (ws.name || 'Sheet1') + '）';
        }).catch(()=> toast('这个表格读不出来，确认是不是标准 .xlsx / .xls', 'err'));
      };
      rd.onerror = () => toast('文件读不出来，另存为 CSV 再试一次', 'err');
      rd.readAsArrayBuffer(f);
    }catch(e){ toast('这个文件读不了，另存为 CSV 再试一次', 'err'); }
    try{ ins.value = ''; }catch(e){}
    return;
  }
  /* 文本型表格（.csv / .tsv / .txt）：直接读成文本，去掉可能的 BOM，免得首列表头被污染认不出 */
  try{
    const rd = new FileReader();
    rd.onload = () => {
      const txt = String(rd.result || '').replace(/^﻿/, '');
      impRun(txt);
      if(el) el.textContent = f.name + ' · 已校验';
    };
    rd.onerror = () => toast('文件读不出来，另存为 CSV 再试一次', 'err');
    rd.readAsText(f, 'utf-8');
  }catch(e){ toast('这个文件读不了，另存为 CSV 再试一次', 'err'); }
  try{ ins.value = ''; }catch(e){}
}
/* ExcelJS 工作表 → CSV 文本（喂给 impParse）。按行列数铺满，空格保留为空，
   公式取计算结果、富文本取文本、日期取 YYYY-MM-DD，其余转字符串 */
function excelwsToCsv(ws){
  const out = [];
  const rc = ws.rowCount || 0, cc = ws.columnCount || 0;
  for(let r = 1; r <= rc; r++){
    const line = [];
    for(let c = 1; c <= cc; c++){
      line.push(impCSV(excelVal(ws.getCell(r, c).value)));
    }
    out.push(line.join(','));
  }
  return out.join('\n');
}
function excelVal(v){
  if(v == null) return '';
  if(typeof v === 'object'){
    if('result' in v && v.result != null) return String(v.result);
    if(v.richText) return v.richText.map(t=>t.text || '').join('');
    if('text' in v) return String(v.text);
    if(v instanceof Date) return v.toISOString().slice(0, 10);
    return '';
  }
  return String(v);
}

/* 模板带现价与现有信息 —— 已设价的行不会因为「价格必填」被你重打一遍，
   只需要改真正要改的那几格 */
function impTplRows(){
  return liveCat().filter(c=>IMPOKST.indexOf(gSt(c.sid)) >= 0)
    .sort((a,b)=> String(a.sid).localeCompare(String(b.sid)));
}
function impCSV(v){
  const s = String(v == null ? '' : v);
  return /[",\n\t]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function impTplText(){
  /* 表头直接把规则写进列名：SKU / 商品信息标记「不可修改」，价格标记「必填」——
     下载到本地的模板自己就会说话，不依赖看说明 */
  const head = IMPCOLS.map(def=>{
    const k = def[0];
    if(k === 'sid')   return 'SKU编码(不可修改)';
    if(k === 'info')  return '商品信息(只读·不可修改)';
    if(k === 'price') return '货品价格(必填)';
    return def[1];
  }).join(',');
  const body = impTplRows().map(c=>{
    const k = CLAIM[c.sid] || {};
    const p = parseFloat(k.price);
    /* 顺序严格跟 IMPCOLS 走 —— 表头按 order 生成、行也从同一份定义拼，
       两边各写一套顺序，改列的时候必然错位 */
    return IMPCOLS.map(def=>{
      const key = def[0];
      if(key === IMPINFO) return impCSV(impInfoOf(c));
      if(key === 'sid')   return impCSV(c.sid);
      if(key === 'price') return p > 0 ? p.toFixed(2) : '';
      return impCSV(k[key] || '');
    }).join(',');
  });
  return head + '\n' + body.join('\n');
}
function impFailText(){
  const src = IMPDONE ? (IMPDONE.bad.concat(IMPDONE.same)) : (IMP ? IMP.bad.concat(IMP.same) : []);
  return '行号,SKU编码,品名,门店,原因\n' + src.map(r=>
    [r.ln, r.sid, r.name, r.store, r.why.join('；')].map(impCSV).join(',')).join('\n');
}
/* 原型里其它「导出」都是 toast，这里给真文件：模板要是假的，这一屏的自证链就断了 */
function impDownload(name, text){
  try{
    const blob = new Blob(['\ufeff' + text], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    a.click();
    URL.revokeObjectURL(url);
    return true;
  }catch(e){ return false; }
}
/* 模板下载：默认给真实 .xlsx —— SKU / 商品信息两列标红并锁定（真·不可修改），
   价格列标橙并标注「必填」，其余列解锁可填；ExcelJS 未加载（离线）时降级为带注解表头的 CSV */
function impTemplate(){

  impTemplateCsv();
}
function impTemplateCsv(){

           : ('模板没能生成，请按列序手动粘贴：'+IMPCOLS.map(c=>c[1]).join(' / ')), ok ? 'ok' : 'err');
}
/* 生成真实 .xlsx 模板（ExcelJS 免费版即可写字体色 / 填充 / 单元格锁定） */
function impTemplateXlsx(){
  if(typeof ExcelJS === 'undefined'){ toast('未能加载表格解析库（ExcelJS），模板改以 CSV 下载', 'warn'); impTemplateCsv(); return; }
  const rows = impTplRows();
  /* 表头直接把规则写进列名：SKU / 商品信息标（不可修改），价格标（必填）——
     既满足「列头显示不可修改 / 必填」，下回上传时 impParse 用前缀匹配也能认出列 */
  const headers = ['SKU编码(不可修改)','商品信息(只读·不可修改)','货品价格(必填)','包装单位','产地','保质期','别名','三方编码','备注'];
  const widths  = [16, 30, 12, 16, 12, 10, 10, 12, 14];
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('货品信息');
  headers.forEach((h, i)=>{ ws.getCell(1, i + 1).value = h; });
  widths.forEach((w, i)=>{ ws.getColumn(i + 1).width = w; });
  const redFont    = {color:{argb:'FFDC2626'}, bold:true}, redFill    = {type:'solid', fgColor:{argb:'FFFDECEC'}};
  const orangeFont = {color:{argb:'FFB45309'}, bold:true}, orangeFill = {type:'solid', fgColor:{argb:'FFFEF3E2'}};
  for(let c = 1; c <= 9; c++){
    const cell = ws.getCell(1, c);
    if(c === 1 || c === 2){ cell.font = redFont;    cell.fill = redFill; }
    else if(c === 3){       cell.font = orangeFont; cell.fill = orangeFill; }
    cell.alignment = {vertical:'middle'};
  }
  rows.forEach(c=>{
    const k = CLAIM[c.sid] || {};
    const p = parseFloat(k.price);
    const r = ws.addRow([
      c.sid, impInfoOf(c), p > 0 ? p.toFixed(2) : '',
      k.pack || '', k.origin || '', k.shelf || '', k.alias || '', k.tpcode || '', k.note || ''
    ]);
    /* 数据行：SKU / 商品信息两列锁定不可改；价格与其余列解锁可填 */
    for(let c = 1; c <= 9; c++){
      const cell = r.getCell(c);
      cell.protection = {locked: (c === 1 || c === 2)};
      cell.alignment = {vertical:'middle'};
    }
  });
  /* 开启工作表保护：被锁定的红列真正改不动，解锁的价格等列照常可填 */
  ws.protect('', { selectLockedCells:true, selectUnlockedCells:true });
  wb.xlsx.writeBuffer().then(buf=>{
    impDownloadBlob('货品信息导入模板.xlsx', buf);
    toast('模板已下载（.xlsx）· '+rows.length+' 个可导入 SKU，红色列已锁定不可修改，价格列必填', 'ok');
  }).catch(()=>{ toast('xlsx 写入失败，已改以 CSV 下载', 'err'); impTemplateCsv(); });
}
/* ExcelJS 生成的 buffer 走 Blob 下载（与 CSV 的 impDownload 分开，type 不同） */
function impDownloadBlob(name, buf){
  try{
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){ return false; }
}

function impCommit(){
  if(!IMP || !IMP.ok.length){ toast('没有可写入的行', 'err'); return; }
  const sel = impSelRows();
  if(!sel.length){ toast('先勾选至少一条要写入的行', 'err'); return; }
  const done = [];
  sel.forEach(r=>{
    const res = applyGoods(r.sid, r.plan.d, '批量导入');
    done.push({sid:r.sid, name:r.name, spec:r.spec, store:r.store, st:r.st, stName:r.stName,
               p:r.p, oldP:r.oldP, changed:res.changed, chg:r.chg, suspend: r.st === 'suspend'});
  });
  IMPDONE = {rows:done, bad:IMP.bad, same:IMP.same, skipped:IMP.ok.length - done.length};
  /* 落一笔导入记录：谁、什么时候、成功几条、失败几条、每条改了什么 / 为什么没改成 */
  impLogAdd({
    id: Date.now(), t: nowStamp(), op: CUR_USER,
    okN: done.length, badN: IMP.bad.length, sameN: IMP.same.length,
    total: done.length + IMP.bad.length + IMP.same.length,
    okRows: done.map(x=>({sid:x.sid, name:x.name, store:x.store, p:x.p, oldP:x.oldP, changed:x.changed, chg:(x.chg||[]).map(c=>c.t)})),
    fails: IMP.bad.map(r=>({ln:r.ln, sid:r.sid, name:r.name, store:r.store, why:r.why||[]}))
  });
  /* 落点 Tab 由「写完之后这些货在哪儿」决定，不写死：
     全成了已设价 → 已设价；里面混着停售的 → 全部。否则点在「已设价」里，
     那几个停售的货就是凭空消失了（B02 保存时踩过同一个坑） */
  B03TAB = done.some(x=>x.suspend) ? 'all' : 'priced';
  IMPST = 3; IMPSEL = null;
  go('B03i');
  const nP = done.filter(x=>x.changed).length;
  toast('已写入 '+done.length+' 个 SKU' + (nP ? (' · '+nP+' 个改价已记入历史') : ' · 价格均未变')
        + (IMP.bad.length ? (' · '+IMP.bad.length+' 条被挡回') : ''));
}

def('B03i','导入货品信息','商品与价格', ()=>{
  const st = IMPST;
  const nOK   = IMP ? IMP.ok.length : 0;
  const nBad  = IMP ? IMP.bad.length : 0;
  const nSame = IMP ? IMP.same.length : 0;
  const nNo   = nBad + nSame;
  const doneRows = IMPDONE ? IMPDONE.rows : [];

  const nToPriced = IMP ? IMP.ok.filter(r=>r.st === 'pending').length : 0;

  const hdTag = st === 3 ? tag('已写入 '+doneRows.length+' 个 SKU', 'done')
    : st === 2 ? tag('可写入 '+nOK+' 条' + (nNo ? (' · 不写入 '+nNo+' 条') : ''), nBad ? 'wait' : 'done')
    : tag('只收待设价 / 已设价 / 临时停售', 'line');

  const steps = `<div class="steps" style="margin-bottom:14px">
    <span class="step ${st>1?'done':'cur'}"><span class="n">${st>1?'✓':'1'}</span>提供数据</span><span class="ln"></span>
    <span class="step ${st>2?'done':(st===2?'cur':'')}"><span class="n">${st>2?'✓':'2'}</span>校验预览</span><span class="ln"></span>
    <span class="step ${st===3?'cur':''}"><span class="n">3</span>写入结果</span>
  </div>`;

  /* 「载入示例」上的条数从示例本身算 —— 写死 13 行，改一次示例就假一次 */
  const demo = impParse(impSampleText());

  const stTag = r => r.st === 'suspend'
    ? tag('临时停售','off') + '<span style="display:block;font-size:11px;color:#B45309;margin-top:2px">恢复在售后新价生效</span>'
    : (r.st === 'pending' ? tag('待设价','wait')
    : (r.st === 'priced' ? tag('已设价','done') : tag(r.stName || '—','off')));

  const priceCell = r => {
    const hasP = r.chg.some(x=>x.k === 'price');
    if(r.oldP <= 0) return '<b style="color:#B45309">设价 ¥'+r.p.toFixed(2)+'</b>';
    if(!hasP)       return '<span style="color:var(--text-3)">¥'+r.p.toFixed(2)+'</span>'
                         + '<span style="font-size:11px;color:var(--text-4)"> 未变</span>';
    return '<span style="color:var(--text-4)">¥'+r.oldP.toFixed(2)+'</span> → <b>¥'+r.p.toFixed(2)+'</b>';
  };
  const chgCell = r => {
    const ext = r.chg.filter(x=>x.k !== 'price');
    return ext.length
      ? '<span style="font-size:11.5px;color:var(--text-2)">'+ext.map(x=>x.t).join(' · ')+'</span>'
      : '<span style="color:var(--text-4)">仅价格</span>';
  };

  /* 不写入的表：拒绝的与「一字未改」的放一起，但徽标分开 ——
     拒绝要改文件，无变化不用改，把两类混成一种颜色会让人白改一遍 */
  const badTable = () => {
    if(!IMP || !nNo) return '';
    const rows = IMP.bad.concat(IMP.same).map(r=>{
      const isSame = !!r.plan;
      return `
      <tr>
        <td class="mono c" style="color:var(--text-4);width:44px">${r.ln}</td>
        <td class="mono" style="font-size:11.5px;color:var(--text-3)">${r.sid || '—'}</td>
        <td class="name"><span class="ellip">${r.name}</span>
          <span class="ellip" style="font-size:11.5px;color:var(--text-4);font-weight:400">${r.spec||''}</span></td>
        <td style="font-size:12px;color:var(--text-3)"><span class="ellip">${r.store}</span></td>
        <td>${r.st ? tag(r.stName,'off') : '<span style="color:var(--text-4)">—</span>'}</td>
        <td style="font-size:11.5px;line-height:1.6">
          <span class="tag ${isSame?'line':'err'}" style="margin-right:6px">${isSame?'无变化':'拒绝'}</span>${(r.why||[]).join('；')}</td>
      </tr>`;
    }).join('');
    return `
    <div class="card pad0">
      <div class="card-hd">
        <h3>不写入 <span class="sub">共 ${nNo} 条 · 拒绝 ${nBad} · 无变化 ${nSame}</span></h3>
        <span class="hint">这些行一个字段都不会动；改完文件可以再校验一次</span>
      </div>
      <div class="tbl-wrap"><table class="tbl compact">
        <thead><tr>
          <th class="c" style="width:44px">行</th><th style="width:92px">SKU 编码</th>
          <th>商品名称 / 销售规格</th><th style="width:13%">门店</th>
          <th style="width:10%">状态</th><th style="width:40%">结果</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  };

  /* ---------- 第 1 步：给数据 ---------- */
  /* 列说明表直接从 IMPCOLS 派生：列名、列数、类别都只有一个来源，
     不会出现"页面写 8 列、模板导出 9 列"这种照着页面填必错的错位 */
  const colRows = IMPCOLS.map((def, i)=>{
    const [key, label, , mode] = def;
    const [mark, txt] = IMPDOC[key] || ['选填',''];
    /* SKU 编码与只读对照列都不可修改：前者是这一行的身份（改了就认不出是哪个货），
       后者是门店主数据（供应端本就没有修改权）。两者都标红 + 「不可修改」 */
    const isRO  = (key === 'sid') || (mode === 'ro');
    const cls   = isRO ? 'err' : (mode === 'req' ? 'wait' : 'line');
    const markTxt = isRO ? '不可修改' : mark;
    return `
    <tr${isRO ? ' style="background:#FEF2F2"' : ''}>
      <td class="c mono" style="color:var(--text-4);width:26px">${i+1}</td>
      <td><b style="font-size:12px;${isRO ? 'color:#DC2626' : ''}">${label}</b></td>
      <td><span class="tag ${cls}" style="white-space:nowrap">${markTxt}</span></td>
      <td style="font-size:11.5px;color:var(--text-3);line-height:1.5">${txt}</td>
    </tr>`;
  }).join('');

  const step1 = `
  <div class="banner info" style="margin-bottom:12px">
    ${I.info}
    <div>
      <div class="t">这一批导的是「货品信息」，不是门店目录 —— 门店推什么品、什么规格，这里改不了</div>
      <div style="margin-top:4px;font-size:12px">
        只收 <b>待设价 / 已设价 / 临时停售</b>：已失效（门店下架）和门店已删除是只读留痕，写不进去。
        <b>留空的格子保持原值</b> —— 只填价格的那份文件，不会把已有的别名、产地、保质期清掉。<br>
        第 2 列「<b>商品信息（只读）</b>」是给你对照用的（品名 · 规格 · 门店），<b>改它不会上传</b>。
      </div>
    </div>
  </div>
  <div class="grid-2-1">
    <div class="card">
      <div class="card-hd" style="padding:0 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px">
        <h3>选择表格文件</h3>
        <span class="hint">支持 .xlsx / .xls / .csv / .tsv，第一行可带表头</span>
      </div>
      <div class="imp-drop" onclick="document.getElementById('imp-file').click()"
           ondragover="event.preventDefault();this.classList.add('over')"
           ondragleave="event.preventDefault();this.classList.remove('over')"

        <div style="margin-top:6px"><b>点击选择文件</b>，或将文件拖到这里</div>

      </div>
      <input type="file" id="imp-file" accept=".xlsx,.xls,.csv,.tsv,.txt" style="display:none" onchange="impFile(this)">
      <div style="display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="document.getElementById('imp-file').click()">选择文件并校验</button>
        <button class="btn btn-default" onclick="impSample()">载入示例（${demo.ok.length} 条可写入 · ${demo.bad.length + demo.same.length} 条不写入）</button>
        <span class="hint r">单次最多 ${IMPMAX} 行 · 校验只读，不改任何数据</span>
      </div>
      <div style="margin-top:12px;padding:10px 12px;background:var(--brand-50);border:1px solid var(--brand-line);border-radius:var(--r-md);font-size:11.5px;color:var(--text-3);line-height:1.7">
        <b style="color:var(--brand-700)">模板说明：</b>「<b class="imp-rov">SKU 编码</b>」「<b class="imp-rov">商品信息</b>」两列<span class="imp-rov">不可修改</span>（红字列）；「<b class="imp-req">货品价格</b>」<span class="imp-req">必填</span>。右侧可下载带现价与现有信息的模板，只改要改的格。
      </div>

    <div class="card pad0">
      <div class="card-hd"><h3>模板与九列说明</h3><span class="hint">红字列不可修改 · 价格为必填</span></div>
      <div style="padding:12px 16px 0">
        <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">模板表头（示例）</div>

      <div style="padding:12px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3);line-height:1.75">
        同一个 SKU 出现多次，只认第一行；其余标「重复」。<br>
        模板里已经填好现价与现有信息 —— 只改要改的格，别整列删掉重填。<br>
        「商品信息（只读）」这一列可以整列删掉，不影响导入：它只是让人一眼看懂这是哪个货。
      </div>

  </div>`;

  /* ---------- 第 2 步：校验预览 ---------- */
  const okRows = (IMP ? IMP.ok : []).map(r=>`
    <tr>
      <td class="c" style="width:40px"><input type="checkbox" ${impIsSel(r.ln)?'checked':''}
        onchange="impToggle(${r.ln}, this)" style="width:15px;height:15px;accent-color:var(--brand-600)"></td>

      <td class="mono" style="font-size:11.5px;color:var(--text-3)">${r.sid}</td>
      <td class="name"><span class="ellip">${r.name}</span>
        <span class="ellip" style="font-size:11.5px;color:var(--text-4);font-weight:400">${r.spec}</span></td>
      <td style="font-size:12px;color:var(--text-2)"><span class="ellip">${r.store}</span></td>

  const step2 = `
  <div class="stats" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">
    ${kpi('可写入', String(nOK), '条', '勾选后才写入')}
    ${kpi('不写入', String(nNo), '条', '拒绝 '+nBad+' · 无变化 '+nSame)}
    ${kpi('价格有变', String(nPchg), '条', '写入后各记一条价格历史')}
    ${kpi('待设价 → 已设价', String(nToPriced), '条', '导入后即可参与询价与直采', 'hi')}
  </div>
  <div class="card pad0">
    <div class="card-hd">
      <h3>可写入 <span class="sub">${nOK} 条 · 默认全选</span></h3>
      <span class="hint">灰字是现值，黑体是要写进去的值</span>
    </div>
    <div class="tbl-wrap"><table class="tbl fixed">
      <thead><tr>
        <th class="c" style="width:40px"><input type="checkbox" id="imp-allcb"
          ${impSelN()>0&&impSelN()===nOK?'checked':''} onchange="impAll(this)"
          style="width:15px;height:15px;accent-color:var(--brand-600)"></th>
        <th class="c" style="width:44px">行</th>
        <th style="width:10%">SKU 编码</th>
        <th style="width:24%">商品名称 / 销售规格</th>
        <th style="width:13%">门店</th>
        <th style="width:11%">状态</th>
