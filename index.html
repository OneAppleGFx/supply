      </tr></thead>
      <tbody>${okRows || '<tr><td colspan="8" class="c" style="padding:34px;color:var(--text-4)">没有可写入的行</td></tr>'}</tbody>
    </table></div>
    <div class="sum-bar">
      <span>已勾选 <b id="imp-seln">${impSelN()}</b> / ${nOK} 条</span>
      <span style="color:${(IMP && IMP.infoChg) ? '#B45309' : 'var(--text-4)'}">${
        (IMP && IMP.infoChg)
          ? ('「商品信息」列有 '+IMP.infoChg+' 行与系统不一致，已忽略 —— 这一列不上传')
          : '写入后价格变动各记一条历史；没勾的行一个字段都不动'
      }</span>
    </div>
  </div>
  ${badTable()}
  <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px">
    <span class="hint" style="margin-right:auto">${
      (IMP && IMP.cut) ? ('文件有 '+IMP.cut+' 行超出单次上限 '+IMPMAX+' 行，已忽略') : '校验只读 · 上面这些还没写入'
    }</span>
    <button class="btn btn-default" onclick="impBack()">${I.back}返回上一步</button>
    <button class="btn btn-default" onclick="impRestart()">清空重来</button>
    <button class="btn btn-primary" id="imp-go" onclick="impCommit()">确认导入 ${impSelN()} 条</button>
  </div>`;

  /* ---------- 第 3 步：写入结果 ---------- */
  const nNew  = doneRows.filter(x=>x.oldP <= 0).length;
  const nUp   = doneRows.filter(x=>x.oldP > 0 && x.changed).length;
  const nExt  = doneRows.filter(x=>!x.changed).length;
  const nSusp = doneRows.filter(x=>x.suspend).length;
  const skipped = IMPDONE ? IMPDONE.skipped : 0;

  const doneRowsHtml = doneRows.map(x=>`
    <tr>
      <td class="mono" style="font-size:11.5px;color:var(--text-3);width:10%">${x.sid}</td>
      <td class="name"><span class="ellip">${x.name}</span>
        <span class="ellip" style="font-size:11.5px;color:var(--text-4);font-weight:400">${x.spec||''}</span></td>
      <td style="font-size:12px;color:var(--text-2)"><span class="ellip">${x.store}</span></td>
      <td>${x.suspend ? tag('临时停售','off') : tag('已设价','done')}</td>
      <td class="mono r"><b>¥${x.p.toFixed(2)}</b></td>
      <td style="font-size:11.5px;color:var(--text-2)">${
        x.oldP <= 0 ? '<span style="color:#B45309">新增价</span>'
        : (x.changed ? '<span style="color:var(--text-4)">¥'+x.oldP.toFixed(2)+'</span> → ¥'+x.p.toFixed(2) : '未变')}</td>
      <td style="font-size:11.5px;color:var(--text-2)">${
        (x.chg||[]).filter(c=>c.k !== 'price').map(c=>c.t).join(' · ') || '<span style="color:var(--text-4)">—</span>'}</td>
      <td>${x.changed ? tag('已记 1 条','done') : '<span style="color:var(--text-4);font-size:11.5px">未变</span>'}</td>
    </tr>`).join('');

  const step3 = `
  <div class="banner ${(IMP && IMP.bad.length) ? 'warn' : 'info'}" style="margin-bottom:12px">
    ${(IMP && IMP.bad.length) ? I.warn : I.check}
    <div>
      <div class="t">已写入 ${doneRows.length} 个 SKU${
        nNew ? (' · 其中 '+nNew+' 个从「待设价」转为「已设价」，现在就参与询价与直采') : ''}</div>
      <div style="margin-top:4px;font-size:12px;line-height:1.8">
        ${nUp ? (nUp+' 个改价已记入价格历史 —— 只影响从这一刻起的新单，不回溯历史单据。<br>') : ''}
        ${nExt ? (nExt+' 个只补了扩展信息、价格没动，因此没有产生新的价格记录。<br>') : ''}
        ${nSusp ? ('其中 <b>'+nSusp+' 个仍在临时停售中</b>：新价要等你在「临时停售」里恢复在售之后才生效。<br>') : ''}
        ${skipped ? (skipped+' 条你取消勾选，未写入。<br>') : ''}
        ${(IMP && IMP.infoChg) ? ('「商品信息」是<b>只读对照列</b>，有 <b>'+IMP.infoChg+'</b> 行写法与系统不一致，已忽略 —— 商品名 / 规格 / 门店由门店推送，供应端改不了。<br>') : ''}
        ${(IMP && IMP.bad.length) ? ('<b>'+IMP.bad.length+' 条被挡回</b>：已失效与门店已删除只读留痕，改不了；其余是格式问题，修完再导一次即可。') : ''}
      </div>
    </div>
  </div>
  <div class="card pad0">
    <div class="card-hd">
      <h3>这一批写进去了什么</h3>
      <span class="hint">逐行可核对，和「供货价格维护」里的显示一致</span>
    </div>
    <div class="tbl-wrap"><table class="tbl compact">
      <thead><tr>
        <th style="width:10%">SKU 编码</th><th>商品名称 / 销售规格</th>
        <th style="width:12%">门店</th><th style="width:9%">现在状态</th>
        <th class="r" style="width:11%">货品价格</th><th style="width:15%">价格变动</th>
        <th style="width:26%">扩展信息</th><th style="width:9%">价格历史</th>
      </tr></thead>
      <tbody>${doneRowsHtml}</tbody>
    </table></div>
    <div class="sum-bar">
      <span>成功 <b>${doneRows.length}</b> 条 · 被挡回 ${IMP ? IMP.bad.length : 0} 条 · 无变化 ${IMP ? IMP.same.length : 0} 条</span>
      <span style="color:var(--text-4)">全部改动可回到「货品编辑」逐条核对，价格历史不可删改</span>
    </div>
  </div>
  ${badTable()}
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    <button class="btn btn-default" onclick="impRestart()">再导一批</button>
    ${(IMP && (IMP.bad.length || IMP.same.length)) ? `<button class="btn btn-default" onclick="impDLFail()">${I.down}导出被挡明细</button>` : ''}
    <button class="btn btn-primary" onclick="go('B03')">${I.back}返回供货价格维护</button>
  </div>`;

  return pagehd('导入货品信息',
      `批量填写<b>货品价格</b>与包装单位 / 产地 / 保质期 / 别名 / 三方编码 / 备注 · <b>价格必填</b> · 留空的格子保持原值不动 · 已失效与门店已删除只读，会被挡回 · 模板第 2 列「<b>商品信息</b>」只作对照，<b>不上传</b>`,
      `<button class="btn btn-default" onclick="go('B03ir')">${I.doc}导入记录${IMPLOG.length?'（'+IMPLOG.length+'）':''}</button>
       <button class="btn btn-default" onclick="impTemplate()">${I.down}下载模板(.xlsx)</button>
       <button class="btn btn-default" onclick="go('B03')">${I.back}返回供货价格维护</button>`,
      hdTag) +
  steps + (st === 3 ? step3 : (st === 2 ? step2 : step1));
});

/* ------------------------------------------------------------
   通用分页
   —— 状态按屏存在 PGST（内存），翻页只改状态再 go()，让重渲染接管，
      不手工改 DOM。用法：
        const pg = pgSlice('B03', list);       // 拿 view / cur / pages
        ... 用 pg.view 渲染行 ...
        ${pgFoot('B03', pg)}                   // 塞进 sum-bar 末尾
   ------------------------------------------------------------ */
const PGSZ = [10,20,50];
const PGST = {};
/* 确定性伪随机：同一 seed 每次渲染产出同一序列
   —— 台账类长列表靠它补齐行数，翻页 / 重渲染才不会换内容 */
function rnd(seed){
  let s = seed >>> 0;
  return ()=>{
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
function pgOf(key, defSz){
  const d = defSz || PGSZ[0];
  if(!PGST[key]) PGST[key] = {p:1, sz:d};
  const sizes = PGST[key].sizes || PGSZ;
  if(sizes.indexOf(PGST[key].sz) < 0) PGST[key].sz = d;
  return PGST[key];
}
/* 切片：cur 做越界兜底 —— 删行 / 改条数后页码失效也能落到有效页。
   sizes 用于给单页配独立每页选项（如 E11 的 5/10/20），不传则用全局 PGSZ。 */
function pgSlice(key, arr, defSz, sizes){
  const st = pgOf(key, defSz);
  if(sizes && sizes.length) st.sizes = sizes.slice();
  const total = arr.length;
  const pages = Math.max(1, Math.ceil(total / st.sz));
  const cur   = Math.min(Math.max(1, st.p), pages);
  st.p = cur;
  return {view: arr.slice((cur-1)*st.sz, cur*st.sz), cur, pages, total, sz: st.sz};
}
/* scr = 重渲染哪个屏。分页键不必等于屏 id —— B03 用 'B03pending' / 'B03priced' 等
   给五个状态 Tab 各存一份页码，不传 scr 时退回 key（绝大多数屏 key 就是 id） */
function pgNav(key, n, scr){ pgOf(key).p = n; go(scr || key); }
function pgSzSel(key, v, scr){
  const st = pgOf(key), sizes = st.sizes || PGSZ, n = parseInt(v,10);
  st.sz = sizes.indexOf(n) >= 0 ? n : sizes[0]; st.p = 1; go(scr || key);
}

/* 页码条：fn 为跳转函数名；给了 key 则走通用 pgNav(key,n[,scr]) */
function pgHTML(cur, pages, fn, key, scr){
  if(pages <= 1) return '';
  const arg = n => (key ? `'${key}',${n}${scr?`,'${scr}'`:''}` : String(n));
  const num = n => `<button class="pg-btn ${n===cur?'on':''}" onclick="${fn}(${arg(n)})">${n}</button>`;
  const box = [];
  if(pages <= 7){
    for(let i=1;i<=pages;i++) box.push(num(i));
  }else{
    box.push(num(1));
    if(cur > 3) box.push('<span class="pg-gap">…</span>');
    for(let i=Math.max(2,cur-1); i<=Math.min(pages-1,cur+1); i++) box.push(num(i));
    if(cur < pages-2) box.push('<span class="pg-gap">…</span>');
    box.push(num(pages));
  }
  return `<div class="pager">
    <button class="pg-btn ic" ${cur<=1?'disabled':''} onclick="${fn}(${arg(cur-1)})" title="上一页">‹</button>
    ${box.join('')}
    <button class="pg-btn ic" ${cur>=pages?'disabled':''} onclick="${fn}(${arg(cur+1)})" title="下一页">›</button>
  </div>`;
}
/* 底栏右侧整块：第 x / y 页 + 页码 + 每页条数
   —— 总数不超过最小页长且没改过条数时，整块不渲染（短列表不该有分页噪音） */
function pgFoot(key, pg, scr){
  const sizes = (PGST[key] && PGST[key].sizes) || PGSZ;
  const show = pg.total > sizes[0] || pg.sz !== sizes[0];
  if(!show) return '';
  return `<span style="margin-left:auto;display:flex;align-items:center;gap:10px">
    ${pg.pages>1?`<span class="pg-info">第 <b>${pg.cur}</b> / ${pg.pages} 页</span>`:''}
    ${pgHTML(pg.cur, pg.pages, 'pgNav', key, scr)}
    <select class="select pg-sz" onchange="pgSzSel('${key}',this.value${scr?`,'${scr}'`:''})">
      ${sizes.map(n=>`<option value="${n}" ${n===pg.sz?'selected':''}>${n} 条/页</option>`).join('')}
    </select>
  </span>`;
}

/* ============================================================
   B06 · 货品价格趋势
   ============================================================ */
/* ------------------------------------------------------------
   趋势折线图 —— B06 详情弹层里那张图
   ------------------------------------------------------------
   为什么手写 SVG、不引图表库：这里只需要一条折线、一根均价参考线、每点一个
   提示框，为它打一个库进来比这张图本身还重（单文件原型，加个库就是几百 KB）。

   三件事决定了这张图长什么样：
     ① 横轴 = 设价时间，点的横向位置按**真实天数**换算，不是等距排开。
        等距会把「一个月改 5 次」和「一年改 5 次」画成一模一样的形状 ——
        而这两件事的含义正好相反。
     ② 纵轴 = 价格，按数据上下各留 18% 余量自适应，不固定从 0 起。
        生鲜单价从 1.85 到 28.00 差 15 倍；固定从 0 起画，低价货的线会被压成
        一条贴着轴的平线，波动一点也看不出来。自适应之后，涨跌幅度才看得见。
     ③ 悬停看单点明细：日期 / 操作人 / 价格 / 对均价偏离。
        提示框是 SVG 里的一层 <g>，用纯 CSS :hover 显隐 —— 不挂 JS 事件，
        弹层反复重绘也不会留下失效的监听。
   ------------------------------------------------------------ */
function trendChart(sid){
  const raw = priceHist(sid).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(String(x.at||'')));
  const avg = priceAvg(sid);
  const cut = avgCut();
  /* 按口径切一刀：历史是按时间正序的，所以「口径内」一定是末尾连续的一段 ——
     不用逐点判，找到第一个落进口径的位置就够了。 */
  const firstIn = cut ? raw.findIndex(x=>String(x.at) >= cut) : 0;
  const abnCount  = raw.filter(isAbn).length;     /* 被标记异常的记录数 */
  const statCount = histStat(sid).length;          /* 真正计入统计的记录数（口径内且非异常） */
  if(raw.length < 2){
    return `<div class="tch-empty">${I.info}
      <div>这个货品只有 1 条价格记录，还画不出趋势 —— 改过一次价之后，这里就有曲线了。</div></div>`;
  }

  const W = 776, H = 272;
  const padL = 58, padR = 22, padT = 22, padB = 46;
  const iw = W - padL - padR, ih = H - padT - padB;

  const ts = raw.map(x=>new Date(x.at + 'T00:00:00').getTime());
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  const ps = raw.map(x=>x.p);

  /* 纵轴区间：把均价也纳进来，否则均价虚线会跑到框外看不见 */
  let lo = Math.min(...ps), hi = Math.max(...ps);
  if(avg > 0){ lo = Math.min(lo, avg); hi = Math.max(hi, avg); }
  const sp0 = (hi - lo) || Math.max(Math.abs(hi) * 0.1, 0.4);
  lo = Math.max(0, lo - sp0 * 0.18);
  hi = hi + sp0 * 0.18;

  const Y = v => padT + ih - ((v - lo) / ((hi - lo) || 1)) * ih;
  const X = t => padL + (t1 === t0 ? iw / 2 : ((t - t0) / (t1 - t0)) * iw);

  /* 刻度步长：从一张「人眼好读」的候选步长里挑 —— 要求落下 3–6 格。
     不能简单地「让格数 ≤ 5」：单价 1.85 的货波动只有两毛，那样挑会只剩 2 格刻度
     （¥1.85 / ¥1.90），轴上什么都读不出来。3–6 格既够读，也不至于糊成一片。 */
  const CANDS = [0.01,0.02,0.05,0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100,200];
  const fit = c => { let n = 0; for(let v = Math.ceil(lo/c)*c; v <= hi + 1e-9; v += c) n++; return n; };
  const step = CANDS.find(c => fit(c) >= 3 && fit(c) <= 6)
            || CANDS.find(c => fit(c) >= 2) || 1;
  const ticks = [];
  for(let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(4));
  const money = v => '¥' + v.toFixed(2);

  /* 网格 + 纵轴刻度 */
  const grid = ticks.map(v=>`
    <line class="grid" x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W-padR}" y2="${Y(v).toFixed(1)}"/>
    <text class="axl" x="${padL-10}" y="${(Y(v)+3.6).toFixed(1)}" text-anchor="end">${money(v)}</text>`
  ).join('');

  /* 横轴日期标签：挤不下就抽稀，首尾一定保留（那是「从哪到哪」） */
  const lab = [];
  raw.forEach((x,i)=>{
    const px = X(ts[i]);
    const prev = lab.length ? lab[lab.length-1].x : -999;
    if(i === 0 || i === raw.length-1 || px - prev >= 56) lab.push({x:px, t:x.at.slice(5)});
  });
  if(lab.length > 2 && lab[lab.length-1].x - lab[lab.length-2].x < 56) lab.splice(lab.length-2,1);
  const xlab = lab.map(l=>{
    /* 首尾两个标签贴边时改锚点，否则「09-18」会有一半画到画布外面 */
    const anc = l.x > W - padR - 18 ? 'end' : (l.x < padL + 18 ? 'start' : 'middle');
    return `<text class="axl" x="${l.x.toFixed(1)}" y="${H-padB+22}" text-anchor="${anc}">${l.t}</text>`;
  }).join('');

  const pts = raw.map((x,i)=>[X(ts[i]), Y(x.p)]);
  const toLine = arr => arr.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const line = toLine(pts);
  const base = padT + ih;
  /* 面积只铺在口径内那一段。绿色面积是整张图最抢眼的元素，铺满全程等于在宣称
     「均价算的是整条线」—— 而实际只算了末尾一小段，用户拿计算器一除就对不上。 */
  const inPts = firstIn < 0 ? [] : pts.slice(firstIn);
  const inLine = toLine(inPts);
  const area = inPts.length > 1
    ? `M ${inPts[0][0].toFixed(1)},${base} L ${inPts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ')} L ${inPts[inPts.length-1][0].toFixed(1)},${base} Z`
    : '';
  /* 口径外的部分走浅灰虚线。多带一个点（firstIn）是为了让虚线和实线接上，
     否则分界处会断开一截，看起来像数据缺失。
     整段都在口径外（firstIn < 0）时，虚线要覆盖全部点 —— 否则图上一根线都没有，
     看起来像数据丢了，而事实是「均价算不出来，但历史都在」。 */
  const outSlice = firstIn < 0 ? pts : (firstIn > 0 ? pts.slice(0, firstIn + 1) : []);
  const outLine = outSlice.length > 1
    ? `<polyline class="line out" points="${toLine(outSlice)}"/>` : '';
  const cutMark = firstIn > 0
    ? `<line class="cutline" x1="${pts[firstIn][0].toFixed(1)}" y1="${padT}" x2="${pts[firstIn][0].toFixed(1)}" y2="${base}"/>`
    : '';

  /* 每个点：命中圆 + 悬停竖线 + 提示框。
     提示框靠右就翻到左边、靠顶就翻到下面 —— 弹层里被裁掉的提示等于没有 */
  const BW = 186, BH = 124;
  const dots = raw.map((x,i)=>{
    const px = pts[i][0], py = pts[i][1];
    const dev = avg ? (x.p - avg) / avg * 100 : 0;
    const isAbnX = isAbn(x);
    /* 口径内没样本时 avg 为 0，「偏离 +0.0%」会被读成「跟均价持平」——
       那是谎话，直接写「—」 */
    const dTxt = avg > 0 ? ((dev > 0 ? '+' : '') + dev.toFixed(1) + '%') : '—';
    const dCol = avg > 0 ? (dev > 0.05 ? '#B45309' : (dev < -0.05 ? '#1F8B4C' : '#64748B')) : '#94A3B8';
    const isLast = i === raw.length - 1;
    const isIn = firstIn >= 0 && i >= firstIn;
    let bx = px + 16, by = py - BH - 14;
    if(bx + BW > W - 4) bx = px - 16 - BW;      /* 靠右 → 翻到点的左边 */
    if(bx < 2) bx = 2;
    if(by < 4) by = py + 18;                    /* 顶到上边 → 翻到点的下方 */
    if(by + BH > H - 4) by = Math.max(4, H - BH - 4);  /* 下面也放不下 → 夹进画布 */
    const bx2 = Math.round(bx), by2 = Math.round(by);
    const row = (k, v, y, col, bold) =>
      `<text x="${bx2+12}" y="${by2+y}" class="tk">${k}</text>
       <text x="${bx2+BW-12}" y="${by2+y}" text-anchor="end" class="tv"${col?` style="fill:${col}"`:''}${bold?' font-weight="600"':''}>${v}</text>`;
    /* 末点的「当前 ¥x.xx」贴着右边界，改右对齐贴在点的左侧，否则会溢出去 */
    const curAnc = px > W - padR - 70 ? 'end' : 'start';
    const curX   = Math.round(curAnc === 'end' ? px - 9 : px + 9);
    return `
    <g class="cp">
      <line class="guide" x1="${px.toFixed(1)}" y1="${padT}" x2="${px.toFixed(1)}" y2="${base}"/>
      <circle class="dot${isAbnX?' abn':(isIn?'':' out')}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${isLast?5:3.6}"/>
      ${isLast?`<text class="cur" x="${curX}" y="${(py-10).toFixed(1)}" text-anchor="${curAnc}">当前 ${money(x.p)}</text>`:''}
      <circle class="hit" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="15"/>
      <g class="tip">
        <rect x="${bx2}" y="${by2}" width="${BW}" height="${BH}" rx="8"
              fill="#fff" stroke="#DDE5EE" stroke-width="1"/>
        <text x="${bx2+12}" y="${by2+18}" class="th">第 ${i+1} 次设价 · 共 ${raw.length} 次</text>
        <line x1="${bx2+12}" y1="${by2+26}" x2="${bx2+BW-12}" y2="${by2+26}" stroke="#EDF1F6"/>
        ${row('设价日期', x.at, 45)}
        ${row('操作人', x.by || '—', 63)}
        ${row('价格', money(x.p), 81, '#0F172A', true)}
        ${row('对均价偏离', dTxt, 99, dCol)}
        ${row('是否计入均价', isAbnX ? '否 · 异常' : (isIn ? '是' : '否 · 口径外'), 117, isAbnX ? '#B91C1C' : (isIn ? '#1F8B4C' : '#94A3B8'))}
      </g>
    </g>`;
  }).join('');

  const avgY = avg > 0 ? Y(avg) : null;
  /* 均价标签默认贴右端；如果最后一个价格点正好落在均价线上（很常见：最后一价 ≈ 均价），
     标签会跟「当前 ¥x.xx」撞在一起，这时把它挪到左端 */
  const avgTxt = avgY === null ? '' :
    (Math.abs(avgY - pts[pts.length-1][1]) < 18
      ? `<text class="avgt" x="${padL}" y="${(avgY-6).toFixed(1)}">均价 ${money(avg)}</text>`
      : `<text class="avgt" x="${W-padR}" y="${(avgY-6).toFixed(1)}" text-anchor="end">均价 ${money(avg)}</text>`);
  const avgLine = avgY === null ? '' : `
    <line class="avgl" x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W-padR}" y2="${avgY.toFixed(1)}"/>
    ${avgTxt}`;

  return `
  <div class="tch-wrap">
    ${(cut && firstIn < 0) ? `<div class="banner warn" style="margin:0 0 10px">${I.warn}
      <div>「${avgLabel()}」内这个货品<b>一条改价记录都没有</b>，均价算不出来 ——
      图上整条线都是口径外的历史。要看到均价，把口径放宽到「全部历史」。</div></div>` : ''}
    <svg class="tch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="货品价格趋势：横轴设价时间，纵轴价格">
      <defs>
        <linearGradient id="tchg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1F8B4C" stop-opacity=".16"/>
          <stop offset="100%" stop-color="#1F8B4C" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}
      <text class="cap" x="${padL-46}" y="${padT-8}">价格</text>
      <text class="cap" x="${W-padR}" y="${H-6}" text-anchor="end">设价时间 →</text>
      ${avgLine}
      ${cutMark}
      ${area?`<path class="area" d="${area}"/>`:''}
      ${outLine}
      ${inPts.length>1?`<polyline class="line" points="${inLine}"/>`:''}
      ${xlab}
      ${dots}
    </svg>
    <div class="tch-lg">
      <span><i class="k1"></i>货品价格</span>
      <span><i class="k2"></i>均价估算 ${avg>0?money(avg):'—'}</span>
      ${firstIn>0?'<span><i class="k3"></i>口径外 · 不计入均价</span>':''}
      ${abnCount>0?'<span><i class="k4"></i>异常调价 · 已排除</span>':''}
      <span class="hint">口径 ${avgLabel()}${cut?('（'+cut.slice(5)+' 起）'):'（不限）'} · ${raw.length} 次记录中 ${statCount} 次计入统计 · 悬停看单点明细</span>
    </div>
  </div>`;
}
function priceTrend(sid){
  const g = goodsOne(sid) || {};
  const h = priceHist(sid);
  const inR = histIn(sid);                        /* 当前口径内的记录（时间窗口） */
  const stat = histStat(sid);                     /* 真正参与均价 / 统计：口径内 且 非异常 */
  const statSet = new Set(stat);
  const inSet  = new Set(inR);
  const avg = priceAvg(sid);
  const cut = avgCut();
  const abnCount = h.filter(isAbn).length;
  const list = h.map((x, idx)=>({x, idx})).reverse().map(({x, idx})=>{
    const dev = avg ? ((x.p-avg)/avg*100) : 0;
    const inIt  = inSet.has(x);
    const abn   = isAbn(x);
    const statIt = statSet.has(x);
    const devTxt = abn ? '异常' : (x === h[h.length-1] ? '(当前)' : (avg>0 ? ((dev>0?'+':'')+dev.toFixed(1)+'%') : '—'));
    const devCol = abn ? '#B91C1C' : 'var(--text-3)';
    const rc = abn ? ' style="background:#FDF4F4"' : (inIt ? '' : ' style="background:#FCFCFD"');
    return `
    <tr${rc}>
      <td class="mono">${x.at}</td>
      <td style="color:${abn?'var(--text-4)':'var(--text-3)'}">${x.by}</td>
      <td class="mono r name" style="color:${statIt?'var(--text-1)':'var(--text-3)'}">¥${x.p.toFixed(2)}</td>
      <td class="mono r" style="color:${devCol}">${devTxt}</td>
      <td class="r">${abn ? tag('异常排除','err') : (inIt ? tag('计入','done') : '<span style="color:var(--text-4);font-size:11.5px">口径外</span>')}</td>
      <td class="r"><button class="btn btn-default sm" onclick="toggleAbn('${sid}',${idx})">${abn ? '取消标记' : '标记异常'}</button></td>
    </tr>`;
  }).join('');
  const lastAt = h.length ? h[h.length-1].at : '—';
  modal('货品价格趋势 · '+(g.pname||sid),
    `<div class="dl" style="margin-bottom:16px">
      <div><dt>SKU 编码</dt><dd class="mono">${sid}</dd></div>
      <div><dt>当前货品价</dt><dd class="mono name">¥${(g.price||0).toFixed(2)}</dd></div>
      <div><dt>均价估算</dt><dd class="mono">${avg>0?('¥'+avg.toFixed(2)):'—'}</dd>
        <div class="hint" style="font-size:11px;margin-top:1px">${avgLabel()} · 计入 ${stat.length} 次（口径外 ${h.length-inR.length} · 异常排除 ${abnCount}）</div></div>
      <div><dt>变更次数</dt><dd class="mono">${h.length} 次</dd></div>
    </div>
    ${trendChart(sid)}
    <div class="banner ${avg>0?'info':'warn'}" style="margin:16px 0 14px">${avg>0?I.box:I.warn}
      <div>${avg > 0
        ? `均价 = <b>「${avgLabel()}」内 ${stat.length} 条有效记录</b>的简单平均（共 ${h.length} 次变更，其中口径外 ${h.length-inR.length} 条、异常调价 ${abnCount} 条已排除），仅作<b>定价参考</b>。被标记「异常排除」的改价不计入均价及任何统计维度（最高优先级）。要换时间范围，回列表点「均价口径」。下单以「提交时刻的货品价格」为准，此处改价不影响已在途 / 已生成的订单。`
        : `<b>「${avgLabel()}」内没有一条改价记录</b>，所以均价算不出来 —— 这个货最后一次改价是 <b>${lastAt}</b>。它多半是长期不调价的稳定品；要看均价，把口径放宽到「全部历史」，或等下一次调价后自然就有了。`}</div>
    </div>
    <div class="card-hd" style="padding:0 0 10px;border-bottom:none"><h3>变更明细</h3>
      <span class="hint" style="margin-left:auto">灰字行在口径外 · 红字「异常排除」不计入任何统计 · 可逐行标记</span></div>
    <div class="tbl-wrap"><table class="tbl compact">
      <thead><tr><th>变更日期</th><th>操作人</th><th class="r">价格</th><th class="r">对均价偏离</th><th class="r">是否计入均价</th><th class="r">操作</th></tr></thead>
      <tbody>${list}</tbody>
    </table></div>`,
    `<button class="btn btn-default" onclick="closeModal()">关闭</button>`, true);
}
/* ---------- 均价口径配置弹层 ---------- */
function avgCfgOpen(){
  AVG_DRAFT = AVG_CFG;
  avgCfgPaint();
}
function avgCfgPaint(){
  const list = goodsAll().filter(g=>parseFloat(g.price) > 0);
  const rows = AVG_RANGES.map(d=>{
    const on = AVG_DRAFT === d.k;
    let nGood = 0, nSamp = 0;
    list.forEach(g=>{
      const n = histIn(g.sid, d.k).length;
      nSamp += n;
      if(n) nGood++;
    });
    const noS = list.length - nGood;
    const cutD = avgCut(d.k);
    return `
    <div class="avgopt${on?' on':''}" onclick="avgCfgPick('${d.k}')">
      <span class="rd">${on?I.tick:''}</span>
      <span class="bd">
        <b>${d.label}</b>

/* ============================================================
   B07 · 批量调货品价格
   ============================================================ */
let B07MODE = 'pct', B07VAL = 3;
let B07SEL = null;                       /* sid -> bool；null = 默认全选 */
function b07Priced(){ return goodsAll().filter(g=>parseFloat(g.price) > 0); }
function b07IsSel(sid){ return !B07SEL || B07SEL[sid] !== false; }
function b07SelN(){ return b07Priced().filter(g=>b07IsSel(g.sid)).length; }
function b07NP(base){
  const v = B07VAL;
  return B07MODE === 'pct' ? base * (1 + v/100) : base + v;
}
function b07DevColor(d){ return d > 0 ? 'var(--warning)' : (d < 0 ? 'var(--brand-600)' : 'var(--text-4)'); }

/* 预览值只写 DOM，不重渲染 —— 否则输入框会失焦 */
function b07Calc(){
  const m = document.getElementById('b7-mode'); if(m) B07MODE = m.value;
  const vi = document.getElementById('b7-val'); if(vi) B07VAL = parseFloat(vi.value) || 0;
  document.querySelectorAll('tr[data-base]').forEach(tr=>{
    const base = parseFloat(tr.dataset.base);
    const np = b07NP(base);
    const d = (np - base) / base * 100;
    const a = tr.querySelector('.np'), b = tr.querySelector('.dv');
    if(a) a.textContent = '¥' + np.toFixed(2);
    if(b){
      b.textContent = (d > 0 ? '+' : '') + d.toFixed(1) + '%';
      b.style.color = b07DevColor(d);
    }
  });
}
function b07SyncHd(){
  const n = b07SelN(), t = b07Priced().length;
  const cb = document.getElementById('b7-allcb');
  if(cb) cb.checked = n > 0 && n === t;
  const c1 = document.getElementById('b7-cnt'); if(c1) c1.textContent = n;
  const c2 = document.getElementById('b7-sel'); if(c2) c2.textContent = n;
}
/* 勾选状态存在数据层，翻页不丢 */
function b07Toggle(sid, cb){
  if(!B07SEL) B07SEL = {};
  B07SEL[sid] = !!cb.checked;
  b07SyncHd();
}
function b07All(cb){
  if(!B07SEL) B07SEL = {};
  const on = !!cb.checked;
  b07Priced().forEach(g=>{ B07SEL[g.sid] = on; });
  go('B07');
}

function b07Apply(){
  const m = document.getElementById('b7-mode'); if(m) B07MODE = m.value;
  const vi = document.getElementById('b7-val'); if(vi) B07VAL = parseFloat(vi.value) || 0;
  let n = 0;
  b07Priced().forEach(g=>{
    if(!b07IsSel(g.sid)) return;
    const p = +b07NP(g.price).toFixed(2);
    if(CLAIM[g.sid]){
      CLAIM[g.sid].price = p;
      recordPrice(g.sid, p, '批量调价');
      QUOTE.forEach(r=>{ if(r.pid===g.sid) r.price = p; });
      n++;
    }
  });
  if(!n){ toast('请至少勾选一个货品','err'); return; }
  B07SEL = null;
  toast('已调整 '+n+' 个货品的货品价格，并记入价格历史');
  go('B06');
}

  }).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--text-4);padding:34px 0">暂无已设货品价格的货品</td></tr>`;

  return pagehd('批量调货品价格',

  `<div class="grid-2-1">

          <h3>调整规则</h3><span class="hint">改完立即在下方预览</span>
        </div>

          <div class="field"><label><span class="req">*</span>调整方式</label>
            <select class="select" id="b7-mode" onchange="b07Calc()">
              <option value="pct" ${B07MODE==='pct'?'selected':''}>按百分比（%）</option>
              <option value="fix" ${B07MODE==='fix'?'selected':''}>按固定差额（元）</option>

          <span class="hint">灰色为调整前，右侧为调整后</span>
        </div>
        <div class="tbl-wrap"><table class="tbl compact">
          <thead><tr>
            <th class="c" style="width:44px"><input type="checkbox" id="b7-allcb" ${selN>0&&selN===pg.total?'checked':''} onchange="b07All(this)" style="width:15px;height:15px;accent-color:var(--brand-600)"></th>
            <th style="width:92px">SKU</th><th>门店</th><th>品名</th><th>规格</th><th class="r">调整前</th>

/* 报价单列表：档口跟着询价单一起带过来 —— 一张报价单回的就是某个档口那一单，
   「哪个店的」还不够，同店两个档口同时发单时，只写门店根本分不清哪张对哪张。
   行数同样拆成「报价行数 / 采购行数」：报 8 行、他采购 9 行，说明有 1 行我主动不报。 */
def('C05','报价单列表','询价与报价', ()=>{
  const data = QUOTE_LIST;
  const pg = pgSlice('C05', data);
  const list = pg.view.map(r=>{
    const act = r.st==='已提交' ? '修改报价' : '查看';
    return `
    <tr class="clickable" onclick="openQuote('${r.st}','${r.no}')">
      <td class="name mono">${r.no}</td>
      <td class="mono" style="color:var(--text-3)">${r.rfq}</td>
      <td>${r.store}</td>
      <td><span class="stall">${r.stall}</span></td>
      <td class="mono r"><b style="${r.qLines>=r.lines?'':'color:var(--text-3)'}">${r.qLines}</b>
        <span style="color:var(--text-4);font-weight:400"> / ${r.lines}</span></td>
      <td class="mono r name">${money(r.amt)}</td>
      <td class="mono">${r.t}</td>
      <td>${tag(r.st, r.cls)}</td>
      <td class="r"><span class="link" onclick="event.stopPropagation();openQuote('${r.st}','${r.no}')">${act}</span></td>
    </tr>`;
  }).join('');
  /* 中标合计只由「已出结果」的单加总，而且只加真正中标的那几行 ——
     部分中标的单把整张报价合计算进「中标」，金额会虚高。 */
  const wonAmt = data.filter(r=>r.st==='全部中标'||r.st==='部分中标')
    .reduce((s,r)=>{
      const d = QDETAIL[r.no];
      if(!d || !d.lines || !d.lines.length) return s + r.amt;
      const lose = new Set(d.lose||[]);
      const w = d.lines.reduce((a,l,i)=>
        (lose.has(i) || l.none || !(parseFloat(l.price) > 0)) ? a : a + l.q*parseFloat(l.price), 0);
      return s + w;
    }, 0);

  /* 页签计数从数据里数 —— 提交一张单就会多一张「已提交」，
     写死的数字半小时后就会和表格对不上 */
  const cnt = s => data.filter(r=>r.st===s).length;
  return pagehd('报价单列表',
      `与询价单一一对应 · 共 <b>${data.length}</b> 张 · 提交即传上平台 · <b>截止前可再次修改</b>，以最后一次提交为准`,
      `<button class="btn btn-default" onclick="toast('已导出报价台账')">${I.down}导出</button>
       <button class="btn btn-primary" onclick="go('C01')">去报价</button>`) +
  `<div class="card pad0">
    <div class="tabsline">
      <button class="tb on">全部 <span class="n">${data.length}</span></button>
      <button class="tb">已提交 <span class="n">${cnt('已提交')}</span></button>
      <button class="tb">待公示 <span class="n">${cnt('待公示')}</span></button>
      <button class="tb">部分中标 <span class="n">${cnt('部分中标')}</span></button>
      <button class="tb">全部中标 <span class="n">${cnt('全部中标')}</span></button>
      <button class="tb">未中标 <span class="n err">${cnt('未中标')}</span></button>
    </div>
    <div class="tb2">
      <select class="select" style="width:150px"><option>全部门店</option>${STORES.map(s=>`<option>${s.n}</option>`).join('')}</select>
      <input class="input" style="width:210px" placeholder="报价单号 / 询价单号">
      <input class="input" style="width:150px" type="date" value="2026-10-26">
      <button class="btn btn-primary sm" onclick="toast('已按条件查询')">查询</button>
      <button class="btn btn-default sm" onclick="toast('已重置')">重置</button>
      <span class="hint r">截止后进入「待公示」，门店确认报价后回写中标结果</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th>报价单号</th><th>询价单号</th><th>门店</th><th>采购档口</th>
        <th class="r">报价行数 / 采购行数</th><th class="r">报价合计</th>
        <th>提交时间</th><th>状态</th><th class="r">操作</th>
      </tr></thead>
      <tbody>${list}</tbody>
    </table></div>

      <span>共 ${pg.total} 张</span>
      <span>中标合计 <b>${money(wonAmt)}</b></span>
      <span style="color:var(--text-4)">提交即传上平台；询价截止前可再次修改，以最后一次提交为准</span>
      ${pgFoot('C05', pg)}

   C06 · 报价单详情（只读）

def('C06','报价单详情','询价与报价', ()=>{
  const q = CUR_QUOTE;
  /* 未参与（从未提交报价）的询价单没有报价单数据 —— 这里是兜底，正常进不来 */
  if(!q){
    return pagehd('未参与', `本单未提交报价，无报价数据`,
      `<button class="btn btn-default" onclick="go('C05')">${I.back}返回列表</button>`,
      tag('未参与','off')) +
    `<div class="card" style="padding:42px;text-align:center;color:var(--text-3);font-size:13.5px;line-height:1.9">
       该询价单未在截止前提交报价，系统中不存在对应的报价单，故无可查看的报价明细。<br>
       下一轮询价发起后，可在截止前参与报价并生成报价单。</div>`;
  }
  /* 报价明细从 QDETAIL 取 —— 每张报价单自己的行，避免「点 A 单看 B 单」的对不上 */
  const d = QDETAIL[q.no] || {lose:[], lines:[]};
  const loseSet = new Set(d.lose||[]);
  const won   = d.lines.filter((l,i)=>!l.none && !loseSet.has(i)).length;
  const loseN = d.lines.filter((l,i)=>!l.none && loseSet.has(i)).length;
  const noneN = d.lines.filter(l=>l.none).length;
  const total = d.lines.reduce((s,l)=> s + (l.none ? 0 : (l.q*(l.price||0))), 0);
  /* 待公示 = 已提交且已截止，但门店还没确认报价 —— 比价结果此时不对外展示 */
  const pending = q.st==='待公示';
  /* 已提交 = 询价还没截止，报价单还能改 —— 比价压根还没开始，
     这时候把「几中标几未中」摆出来，等于在报价期内把底价漏给对手方 */
  const openRfq = q.st==='已提交';
  const hideRes = pending || openRfq;
  const maskTag = pending ? '<span style="color:var(--text-4)">待公示</span>'
                          : '<span style="color:var(--text-4)">截止后比价</span>';
  /* 报价行排序：可报（供）的排前面、不可供（不报价）的置后，组内保持原顺序 ——
     每次进入/刷新本页都按此顺序渲染，不可供行始终落在表格末尾 */
  const dIdxs = d.lines.map((l,i)=>i).sort((a,b)=>
    ((d.lines[a].none?1:0) - (d.lines[b].none?1:0)) || a - b);
  const rows = dIdxs.map(i=>{
    const l = d.lines[i];
    if(l.none) return `<tr>
      <td class="mono c" style="color:var(--text-4);width:46px">${i+1}</td>
      <td class="nm"><b>${l.n}</b><span>${l.s}</span></td>
      <td class="c">${l.u}</td>
      <td class="mono r">${l.q}</td>
      <td class="mono r" colspan="2" style="color:var(--text-4)">不可供 / 不报价</td>
      <td>${tag('不报价','off')}</td>
    </tr>`;
    const isLose = loseSet.has(i);
    return `<tr>
      <td class="mono c" style="color:var(--text-4);width:46px">${i+1}</td>
      <td class="nm"><b>${l.n}</b><span>${l.s}</span></td>
      <td class="c">${l.u}</td>
      <td class="mono r">${l.q}</td>
      <td class="mono r">¥${l.price.toFixed(2)}</td>
      <td class="mono r name">¥${(l.q*l.price).toFixed(2)}</td>
      <td>${hideRes?maskTag:(isLose?tag('未中标','err'):tag('已中标','done'))}</td>
    </tr>`;
  }).join('');

  const head = `${q.store} · <b>${q.stall}</b> · ${q.lines} 行 · 提交于 <b>${q.t}</b> · ${pending?'<b>已截止</b>，待门店确认后公示结果':openRfq?'<b>询价进行中</b>，比价结果截止后公布':`比价结果 <b>${won} 中标 / ${loseN} 未中</b>`}`;
  const btns = `<button class="btn btn-default" onclick="go('C05')">${I.back}返回列表</button>
       <button class="btn btn-default" onclick="goQuotePrint('C06')">${I.print}打印</button>
       ${q.st==='已提交'
         ? `<button class="btn btn-primary" onclick="go('C03')">修改报价</button>`
         : pending
           ? `<button class="btn btn-default" disabled title="报价已截止，门店确认报价公示后方可查看中标结果"
                style="opacity:.5;cursor:not-allowed">看中标结果</button>`
           : `<button class="btn btn-primary" onclick="go('C07')">看中标结果</button>`}`;

  return pagehd(q.no, head, btns, tag(q.st, q.cls)) +
  `
  <div class="grid-2-1" style="margin-top:12px">
    <div>
    <div class="card">
      <div class="dl four">
        <div><dt>关联询价单</dt><dd class="mono">${q.rfq}</dd></div>
        <div><dt>采购门店</dt><dd>${q.store}</dd></div>
        <div><dt>采购档口</dt><dd><span class="stall">${q.stall}</span></dd></div>
        <div><dt>提交时间</dt><dd class="mono">${q.t}</dd></div>
        <div><dt>提交人</dt><dd>${d.submitter||'—'}</dd></div>
        <div><dt>报价行数 / 采购行数</dt><dd class="big">${q.qLines} / ${q.lines}</dd></div>
        <div><dt>不报价</dt><dd class="big">${noneN} 行</dd></div>
        <div><dt>报价合计</dt><dd class="big">${money(total)}</dd></div>
        <div><dt>比价状态</dt><dd>${pending?'已比价 · 待门店确认公示':openRfq?'未开始 · 截止后统一比价':`已完成 · ${d.cmp||'—'}`}</dd></div>
      </div>
    </div>

    <div class="card pad0" style="margin-top:12px">
      <div class="card-hd">
        <h3>报价明细 <span class="sub">单价为提交时锁定价，与当前货品价格无关</span></h3>
        <span class="hint">只读</span>
      </div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th class="c" style="width:46px">序号</th><th>商品 / 规格</th><th class="c">单位</th><th class="r">需求量</th>
          <th class="r">报价单价</th><th class="r">金额</th><th style="width:100px">比价结果</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="sum-bar">
        ${hideRes?`<span>报价 ${d.lines.length} 行</span><span style="color:var(--text-4)">${pending?'中标结果待门店确认后公示':'比价未开始 · 截止后统一公布'}</span>`
                 :`<span>中标 ${won} 行</span><span>未中标 ${loseN} 行</span>`}
        ${noneN?`<span>不报价 ${noneN} 行</span>`:''}
        <span style="margin-left:auto">报价合计 <b>${money(total)}</b></span>
      </div>
    </div>
  `;
  });

  /* ============================================================
     D12 · 接单设置（服务端规则的配置界面）
     —— 配置维度是「门店」：一家门店一条接单规则，不同门店的确认方式可以不同。
        供应商不能创建订单：本页只配置「门店提交直采单后如何被确认」，
        不提供任何新建 / 生成订单能力，也不替门店下单。
     ============================================================ */
  /* mode: manual 人工确认 / instant 提交即自动确认 / delay 延迟 N 分钟自动确认 */
  const AC_MODES = {
    manual:  {t:'人工确认',             cls:'off'},
    instant: {t:'提交即自动确认',        cls:'done'},
    delay:   {t:'延迟 N 分钟自动确认',  cls:'proc'}
  };
  const AC_DELAY_OPTIONS = [5,15,30];   /* 延迟下拉项固定，不加入 0 */
  const AC_DELAY_NONE = 0;              /* 人工 / 提交即确认时的延迟分钟，只读展示，不进下拉 */
  const AC_DEFAULT = {mode:'manual', delay:15, notify:true};
  let AC_GLOBAL_ON = true;   /* 自动确认总开关：关闭后所有门店一律人工确认，各店配置保留 */
  let AC_BY_STORE = {
    S01:{mode:'instant', delay:15, notify:true},
    S02:{mode:'delay',   delay:30, notify:true},
    S03:{mode:'instant', delay:15, notify:false},
    S04:{mode:'manual',  delay:15, notify:true},
    S05:{mode:'delay',   delay:5,  notify:true}
  };
  function acCfg(id){ return AC_BY_STORE[id] || AC_DEFAULT; }
  function acStatus(c){
    if(c.mode==='delay') return {t:'延迟 '+c.delay+' 分钟自动确认', cls:'proc'};
    const m = AC_MODES[c.mode] || AC_MODES.manual;
    return {t:m.t, cls:m.cls};
  }
  function acRowMode(id){
    const e = document.getElementById('acm-'+id);
    return e ? e.value : acCfg(id).mode;
  }
  /* 同一行内联动：接单方式切到「人工确认 / 提交即自动确认」→ 延迟分钟重置为 0（只读展示，不进下拉）；
     切回「延迟 N 分钟自动确认」→ 下拉恢复默认 15 分钟。下拉项始终只有 5/15/30。 */
  function acRowSync(id){
    const m = acRowMode(id);
    const d = document.getElementById('acd-'+id);
    const z = document.getElementById('acz-'+id);
    const n = document.getElementById('acn-'+id);
    const isDelay = m==='delay';
    if(d){
      d.disabled = !isDelay;
      d.style.display = isDelay ? '' : 'none';
      if(isDelay && AC_DELAY_OPTIONS.indexOf(parseInt(d.value,10))<0) d.value = String(AC_DEFAULT.delay);
      if(!isDelay) d.value = '';
    }
    if(z) z.style.display = isDelay ? 'none' : '';
    if(n) n.disabled = m==='manual';
    const s = document.getElementById('acs-'+id);
    if(s){
      const x = acStatus({mode:m, delay:isDelay?(d?(parseInt(d.value,10)||AC_DEFAULT.delay):AC_DEFAULT.delay):AC_DELAY_NONE});
      s.className = 'tag '+x.cls;
      s.textContent = x.t;
    }
  }
  function acGlobalSync(){
    const on = document.getElementById('ac-on');
    const st = document.getElementById('ac-global-state');
    const tip = document.getElementById('ac-off-tip');
    const opened = on && on.checked;
    if(st) st.textContent = opened
      ? '已开启 · 各门店按自己的配置接单'
      : '未开启 · 全部门店暂按人工确认（各店配置保留）';
    if(tip) tip.style.display = opened ? 'none' : '';
  }
  /* 批量套用区自身联动：选人工 / 提交即确认时延迟分钟重置为 0（只读展示，不进下拉）；
     选延迟确认才显示 5/15/30 下拉，切回时给默认 15。 */
  function acBatchModeSync(){
    const m = document.getElementById('ac-batch-mode');
    const d = document.getElementById('ac-batch-delay');
    const z = document.getElementById('acz-batch');
    const isDelay = m && m.value==='delay';
    if(d){
      d.disabled = !isDelay;
      d.style.display = isDelay ? '' : 'none';
      if(isDelay && AC_DELAY_OPTIONS.indexOf(parseInt(d.value,10))<0) d.value = String(AC_DEFAULT.delay);
      if(!isDelay) d.value = '';
    }
    if(z) z.style.display = isDelay ? 'none' : '';
  }
  /* 批量套用：只改本页编辑值，点「保存设置」后才落库；个别门店随后仍可单独改回 */
  function acBatchApply(){
    const m = document.getElementById('ac-batch-mode');
    const d = document.getElementById('ac-batch-delay');
    if(!m) return;
    STORES.forEach(s=>{
      const sm = document.getElementById('acm-'+s.id);
      const sd = document.getElementById('acd-'+s.id);
      if(sm) sm.value = m.value;
      /* 批量切人工 / 提交即确认：延迟分钟同步重置为 0；仅批量选延迟确认才覆写分钟，下拉项仍为 5/15/30 */
      if(sd){
        if(m.value==='delay') sd.value = (d && AC_DELAY_OPTIONS.indexOf(parseInt(d.value,10))>=0) ? d.value : String(AC_DEFAULT.delay);
        else sd.value = '';
      }
      acRowSync(s.id);
    });
    toast('已把「'+AC_MODES[m.value].t+'」填入 '+STORES.length+' 家门店，请点保存设置');
  }
  function acReset(){
    STORES.forEach(s=>{
      const m = document.getElementById('acm-'+s.id);
      const d = document.getElementById('acd-'+s.id);
      const n = document.getElementById('acn-'+s.id);
      if(m) m.value = AC_DEFAULT.mode;
      if(d) d.value = '';   /* 默认人工确认 → 延迟分钟 0 */
      if(n) n.checked = AC_DEFAULT.notify;
      acRowSync(s.id);
    });
    toast('已恢复默认：全部门店人工确认（未保存）');
  }
  function acSave(){
    const on = document.getElementById('ac-on');
    AC_GLOBAL_ON = on ? on.checked : AC_GLOBAL_ON;
    const next = {};
    STORES.forEach(s=>{
      const m = document.getElementById('acm-'+s.id);
      const d = document.getElementById('acd-'+s.id);
      const n = document.getElementById('acn-'+s.id);
      const c = acCfg(s.id);
      const mode = m ? m.value : c.mode;
      const isDelay = mode==='delay';
      next[s.id] = {
        mode: mode,
        delay: isDelay
          ? (d && AC_DELAY_OPTIONS.indexOf(parseInt(d.value,10))>=0 ? parseInt(d.value,10) : AC_DEFAULT.delay)
          : AC_DELAY_NONE,
        notify: n ? n.checked : c.notify
      };
    });
    AC_BY_STORE = next;
    const autoN = STORES.filter(s=>AC_BY_STORE[s.id].mode!=='manual').length;
    toast('接单设置已保存 · '+(AC_GLOBAL_ON
      ? autoN+' 家门店启用自动确认'
      : '总开关关闭，全部门店人工确认')+' · 规则仅对各店新提交的直采订单生效');
  }

  def('D12','接单设置','订单中心', ()=>{
    const rows = STORES.map(s=>{
      const c = acCfg(s.id);
      const st = acStatus(c);
      return `
        <tr>
          <td><b style="display:block;font-weight:600;font-size:13px;line-height:1.35;margin-bottom:2px">${s.n}</b><span style="display:block;font-size:11.5px;line-height:1.35;color:var(--text-4)">${s.m}</span></td>
          <td><select class="select" id="acm-${s.id}" style="width:100%;min-width:164px" onchange="acRowSync('${s.id}')">
            ${Object.keys(AC_MODES).map(k=>`<option value="${k}" ${c.mode===k?'selected':''}>${AC_MODES[k].t}</option>`).join('')}
          </select></td>
          <td>
            <select class="select" id="acd-${s.id}" style="width:100%;min-width:92px;${c.mode==='delay'?'':'display:none'}" onchange="acRowSync('${s.id}')" ${c.mode==='delay'?'':'disabled'}>
              ${AC_DELAY_OPTIONS.map(n=>`<option value="${n}" ${c.mode==='delay'&&c.delay===n?'selected':''}>${n} 分钟</option>`).join('')}
            </select>
            <span id="acz-${s.id}" class="input mono" style="display:${c.mode==='delay'?'none':'inline-flex'};align-items:center;box-sizing:border-box;background:#FAFBFC;color:var(--text-3);cursor:not-allowed" title="人工确认 / 提交即自动确认时不设延迟">0</span>
          </td>
          <td class="c"><label class="chk" style="font-size:12.5px"><input type="checkbox" id="acn-${s.id}" ${c.notify?'checked':''} ${c.mode==='manual'?'disabled':''}> 通知门店</label></td>
          <td><span class="tag ${st.cls}" id="acs-${s.id}">${st.t}</span></td>
        </tr>`;
    }).join('');
    const cnt = k => STORES.filter(s=>acCfg(s.id).mode===k).length;

    return pagehd('接单设置',
        `仅作用于门店直采订单，询价中标订单由中标结果直接生成，不受此配置影响 · 按门店分别配置，各店确认方式可不同`,
        `<button class="btn btn-default" onclick="acReset()">恢复默认</button>
         <button class="btn btn-primary" onclick="acSave()">保存设置</button>`,
        tag('按门店配置','off')) +
    `


    <div class="card" style="margin-bottom:12px">
      <div class="field"><label>自动确认总开关</label>
        <label class="chk"><input type="checkbox" id="ac-on" ${AC_GLOBAL_ON?'checked':''} onchange="acGlobalSync()"> 开启后，门店提交直采订单将自动确认</label>
        <div class="hint">关闭后所有门店一律转为人工确认（急停用），各店已保存的配置保留，重新开启即恢复。</div>
      </div>
      <div class="sum-bar" style="margin-top:14px">
        <span id="ac-global-state">${AC_GLOBAL_ON?'已开启 · 各门店按自己的配置接单':'未开启 · 全部门店暂按人工确认（各店配置保留）'}</span>
        <span style="margin-left:auto"><b>${STORES.length-cnt('manual')}</b> / ${STORES.length} 家门店启用自动确认</span>
      </div>
    </div>

    <div class="card pad0">
      <div class="card-hd">
        <h3>按门店配置 <span class="sub">各门店单独规则</span></h3>
        <span class="hint">接单方式为「人工确认」的门店，提交后仍需供应商逐单确认</span>
      </div>
      <div class="tbl-wrap"><table class="tbl compact">
        <thead><tr>
          <th style="width:26%">门店</th>
          <th style="width:24%">接单方式</th>
          <th style="width:13%">延迟分钟</th>
          <th class="c" style="width:16%">自动确认后通知门店</th>
          <th style="width:21%">当前生效</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="sum-bar">
        <span>提交即自动确认 <b>${cnt('instant')}</b> 家</span>
        <span>延迟自动确认 <b>${cnt('delay')}</b> 家</span>
        <span>人工确认 <b>${cnt('manual')}</b> 家</span>
        <span style="margin-left:auto;color:var(--text-4)">延迟分钟与通知只在自动确认方式下生效</span>
      </div>
    </div>

    <div id="ac-off-tip" class="banner warn" style="margin-top:12px;${AC_GLOBAL_ON?'display:none':''}">${I.info}
      <div>自动确认总开关已关闭：所有门店暂按人工确认执行，上方各店配置保留，重新开启即恢复。</div>
    </div>

    <div class="grid-2-1" style="margin-top:12px">
      <div class="card">
        <div class="card-hd" style="padding:0 0 14px;border-bottom:none"><h3>批量套用</h3></div>
        <div class="field"><label>把同一种方式应用到全部门店</label>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <select class="select" id="ac-batch-mode" style="width:190px" onchange="acBatchModeSync()">
              ${Object.keys(AC_MODES).map(k=>`<option value="${k}">${AC_MODES[k].t}</option>`).join('')}
            </select>
            <select class="select" id="ac-batch-delay" style="width:104px;display:none" disabled>
              ${AC_DELAY_OPTIONS.map(n=>`<option value="${n}">${n} 分钟</option>`).join('')}
            </select>
            <span id="acz-batch" class="input mono" style="width:104px;display:inline-flex;align-items:center;box-sizing:border-box;background:#FAFBFC;color:var(--text-3);cursor:not-allowed" title="人工确认 / 提交即自动确认时不设延迟">0</span>
            <button class="btn btn-default" onclick="acBatchApply()">应用到全部门店</button>
          </div>
        </div>
        <div class="hint" style="margin-top:10px">批量套用只填入本页表单，点「保存设置」后才生效；个别门店随后仍可单独改回。</div>
      </div>
      <div>
        <div class="card">
          <div class="card-hd" style="padding:0 0 14px;border-bottom:none"><h3>规则边界</h3></div>
          <div style="font-size:12.5px;line-height:1.9;color:var(--text-2)">
            <div>· <b>按门店取规则</b>：以订单所属门店为准，A 店自动、B 店人工互不干扰。</div>
            <div>· <b>不创建订单</b>：只响应门店后续新提交的直采单，供应商端没有新建订单入口。</div>
            <div>· <b>不回溯</b>：仅对配置生效后各店新提交的单生效，历史待确认单仍需人工处理。</div>
            <div>· <b>并发只成功一次</b>：状态变更带前置状态校验，人工确认 / 拒绝与自动确认不会重复推进。</div>
            <div>· <b>改回人工即取消</b>：某店改为人工确认，或关闭总开关，该店尚未执行的延迟任务会被取消。</div>
            <div>· <b>确认即承诺</b>：自动确认与人工确认在履约、结算、打印上完全一致，仅流转记录标注来源。</div>
            <div>· <b>确认即自动建单</b>：无论自动确认还是人工确认，服务端推进为「已确认」时都会自动生成唯一一张待发货单；询价中标订单则在中标生成时自动建单，两类订单全覆盖。</div>
          </div>
        </div>
      </div>
    </div>`;
  });

  /* ============================================================
     D03 · 备货参考
     —— 只有一个视角：按商品汇总。
        预告缺口显示到每个商品 × 每个门店的格子上（gap[k] = 该店该商品的预告），
        不按门店另起统计表；分装、线路、配送时段等配送环节一期不做。
     ============================================================ */
  /* 备货日改为起止范围：演示口径把 2026-10-26 视为「今天」，默认两端都落在明天 2026-10-27，
     即默认单日。查询会写回这两个值并重渲染本页，页头 / 卡片 / 汇总栏都读 d03Range()。 */
  const D03_TODAY = '2026-10-26', D03_TOMORROW = '2026-10-27';
  let D03_D0 = D03_TOMORROW, D03_D1 = D03_TOMORROW;
  function d03Range(){ return D03_D0===D03_D1 ? D03_D0 : D03_D0+' ~ '+D03_D1; }
  function d03IsTomorrow(){ return D03_D0===D03_TOMORROW && D03_D1===D03_TOMORROW; }
  function d03Query(){
    const a=document.getElementById('d03-d0'), b=document.getElementById('d03-d1');
    const d0=(a&&a.value)||D03_TOMORROW, d1=(b&&b.value)||D03_TOMORROW;
    if(d0>d1){ toast('起始备货日不能晚于结束备货日','err'); return; }
    D03_D0=d0; D03_D1=d1;
    go('D03');
    toast('已按 '+d03Range()+' 更新备货参考');
  }
  /* 规格不再重写一份：按品名从订单行主数据 ROWS 取（兜底 CATALOG），
     与 D02 明细 / E02 发货单 / E04 详情 / K05 送货单的商品规格同源。 */
  function d03Spec(n){
    const r = ROWS.find(x=>x.n===n);
    if(r) return r.s;
    const c = CATALOG.find(x=>x.pname===n);
    return c ? c.spec : '';
  }
  def('D03','备货参考','订单中心', ()=>{
    /* 备货参考是「对应备货日范围内所有订单的采购总和」，不对应具体某一张订单：
       门店列只标注需求归属，不再展示订单编号。 */
    const STORES = [
      {n:'徐汇滨江店'},
      {n:'浦东世纪汇店'},
      {n:'静安嘉里店'}
    ];
    /* s = 三店下单量 · gap = 三店各自的缺货预告（qty 缺口 / why 原因 / reply 食堂回音 / time 预告时间） */
    const agg = [
      {n:'上海青',   u:'件', s:[30,40,20], gap:[null,null,null]},
      {n:'小白菜',   u:'件', s:[25,30,0],  gap:[null,null,null]},
      {n:'菠菜',     u:'包', s:[18,0,12],  gap:[{qty:6,  why:'产地缺货', reply:'接受减量', time:'10-26 17:05'},null,null]},
      {n:'土豆',     u:'袋', s:[50,60,30], gap:[null,{qty:5, why:'品质不达标 · 已自检剔除', reply:'接受减量'},null]},
      {n:'白萝卜',   u:'袋', s:[30,0,20],  gap:[null,null,null]},
      {n:'胡萝卜',   u:'袋', s:[20,0,0],   gap:[null,null,null]},
      {n:'猪五花肉', u:'件', s:[25,20,15], gap:[null,null,null]},
      {n:'猪里脊',   u:'件', s:[18,0,12],  gap:[null,null,null]},
      {n:'三黄鸡',   u:'箱', s:[12,0,8],   gap:[null,null,null]},
      {n:'活虾',     u:'桶', s:[12,10,0],  gap:[{qty:12, why:'未到货', reply:'已找替补', time:'10-26 16:20'},null,null]},
      {n:'鲫鱼',     u:'桶', s:[15,0,10],  gap:[null,null,{qty:3, why:'上游未到货', reply:'接受减量'}]},
      {n:'鸡蛋',     u:'箱', s:[8,10,6],   gap:[null,{qty:2, why:'称重损耗', reply:'已找替补'},null]},
      {n:'老豆腐',   u:'箱', s:[6,8,0],    gap:[null,null,null]},
      {n:'干辣椒',   u:'袋', s:[3,4,2],    gap:[null,null,null]},
      {n:'鲜香菇',   u:'袋', s:[8,0,6],    gap:[null,null,{qty:2, why:'品质不达标 · 已自检剔除', reply:'接受减量'}]}
    ];
    const gapQty = (r,k)=> r.gap[k] ? r.gap[k].qty : 0;
    const TOTAL_GAP = agg.reduce((a,r)=>a+r.s.reduce((x,_,k)=>x+gapQty(r,k),0),0);
    /* 左侧 5 列固定：商品（带规格）/ 单位 / 下单合计 / 已预告缺口 / 建议备货。
       门店列一律排在右侧可横向滚动区，门店再多也能对着商品看汇总。 */
    const rows = agg.map(r=>{
      const tot = r.s.reduce((a,b)=>a+b,0);
      const pre = r.s.reduce((a,_,k)=>a+gapQty(r,k),0);
      const need = tot - pre;
      return `
      <tr class="${pre?'st-float':''}">
        <td class="fx fx1 nm"><b>${r.n}</b><span>${d03Spec(r.n)}</span></td>
        <td class="fx fx2 c">${r.u}</td>
        <td class="fx fx3 mono r name">${tot}</td>
        <td class="fx fx4 mono r" style="color:${pre?'var(--warning)':'var(--text-3)'}">${pre?'−'+pre:'—'}</td>
        <td class="fx fx5 mono r" style="font-weight:700;color:var(--brand-700)">${need}</td>
        ${STORES.map((_,k)=>{
          const g = r.gap[k];
          const sub = !r.s[k] ? '未订' : (g ? '预告 −'+g.qty : '缺口 0');
          const col = g ? 'var(--warning)' : 'var(--text-4)';
          const tip = g ? `title="${g.why} · 食堂${g.reply}${g.time?' · '+g.time:''}"` : '';
          return `<td class="mono r" ${tip} style="line-height:1.35">${r.s[k]||'—'}<span style="display:block;font-size:10.5px;font-weight:500;color:${col}">${sub}</span></td>`;
        }).join('')}
      </tr>`;
    }).join('');

    /* 预告缺口只在上表按「商品 × 门店」逐格展示，不另起门店统计表 */

    return pagehd('备货参考',
        `门店对应时间范围内所有订单的商品需求量，按商品合并一次备完`,
        `<span class="hint" style="white-space:nowrap">备货日</span>
         <input class="input" id="d03-d0" type="date" value="${D03_D0}" style="width:132px">
         <span style="color:var(--text-3)">~</span>
         <input class="input" id="d03-d1" type="date" value="${D03_D1}" style="width:132px">
         <button class="btn btn-default" onclick="d03Query()">查询</button>
         <button class="btn btn-default" onclick="toast('已导出备货单')">${I.down}导出备货单</button>
`) +
    `
    <div class="card pad0">
      <div class="card-hd">
        <h3>按商品汇总</h3>
        <span class="hint">每店列为该门店对应时间范围内<b>所有订单的采购总和</b></span>
      </div>
      <div class="d03-wrap" id="d03-wrap"><table class="tbl d03">
        <thead><tr>
          <th class="fx fx1">商品 / 规格</th><th class="fx fx2 c">单位</th>
          <th class="fx fx3 r">下单合计</th><th class="fx fx4 r">已预告缺口</th><th class="fx fx5 r">建议备货</th>
          ${STORES.map(st=>`<th class="r">${st.n}</th>`).join('')}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="sum-bar">
        <span style="margin-left:auto;color:var(--text-4)">建议备货量 = 下单合计 − 该商品各门店预告缺口之和</span>
      </div>
    </div>`;
  });

  /* ============================================================
     E04 · 发货单详情 = 发货前核对（唯一单据页）
     ============================================================ */
  /* 线上更正 / 重开一期不做设计：E04 不提供改单入口，相关弹窗已移除 */

  def('E04','发货单详情','发货与分拣', ()=>{
    /* 确认发货前显示可编辑的当前内容；确认发货后显示锁定快照与生成的送货单 */
    const sh = curShip();
    const stInfo = SHIP_ST[sh.st] || ['待发货','wait'];
    const locked = shipLocked(sh);
    const rptReadonly = shipRptReadonly(sh);
    const ready = shipPrepared(sh);
    const dn = dnOf(sh);
    const ys = ysOf(sh);                    /* 有无验收单由「门店是否回写」决定，不由 locked 决定 */
    const accepting = sh.st==='SHIPPED' && !!sh.acceptingAt && !ys;  /* 门店已提交首次验收数据、结论未回写：采购订单进入验收中，发货单仍为已发货 */
    const awaitingAccept = sh.st==='SHIPPED' && !ys && !accepting;   /* 已发货 · 门店尚未验收：合法中间态（已关闭单不落此态） */
    const lines = shipDetailLines(sh);
    const amt = shipLineAmt(lines);
    const offN = lines.filter(l=>l.off).length;
    const qtySum = a=>a.reduce((n,l)=>n+(Number(l.q)||0),0);
    const actSum = a=>a.reduce((n,l)=>n+(l.off?0:(Number(l.qty)||0)),0);
    const rptTotal = lines.reduce((n,l)=>n+linksOfLine(sh.no,l.i).length,0);
    const autoTotal = lines.reduce((n,l)=>n+linksOfLine(sh.no,l.i).filter(x=>x.scene==='auto').length,0);
    /* 食安报告补传并入「发货明细」第 9 列，与 E02 同一形态（chip + 行内入口），
       不再单列右栏 card。E04 是「发货单详情」：待发货态报告只读（发货前的关联 / 上传
       统一在 E02 明细行内完成），只有已发货后（SHIPPED+）才给「补传」入口。
       已发货锁定后只追加、不替换：不显示解绑，已关联项只读。
       「本行不发 / 实发 0」的行不给补传入口，否则补传清单永远清不空。 */
    const rptCell = l=>{
      const lks = linksOfLine(sh.no, l.i);
      const canLink = !l.off && Number(l.qty)>0;
      const chips = lks.length
        ? lks.map(lk=>{
            const r = reportById(lk.reportId)||{};
            const cls = lk.scene==='auto' ? ' auto' : (lk.scene==='after' ? ' after' : '');
            const sceneTx = lk.scene==='auto' ? '按有效期自动关联' : (lk.scene==='after' ? '已发货补传' : '发货前关联');
            const tip = `${r.name||'—'} · ${sceneTx} · ${r.by||''} · 有效期 ${reportValidText(r)}${lk.autoReason?' · '+lk.autoReason:''}`;
            return `<span class="rpt-chip${cls}${r.del?' void':''}" title="${tip}">${r.name||'—'}${lk.scene==='auto'?'<span class="hint" style="font-size:10.5px;margin-left:4px">自动</span>':''}</span>`;
          }).join('')
        : '<span class="hint">未关联</span>';
      const op = rptReadonly
        ? '<span class="hint">已关闭 · 报告只读</span>'
        : (!locked
            ? (canLink ? '<span class="hint">待发货只读</span>'
                       : '<span class="hint">本行不发 · 待发货只读</span>')
            : (!canLink ? '<span class="hint">本行不发 · 无需补传</span>'
            : `<span class="link" onclick="reportPickOpen('${sh.no}',${l.i},'E04')">＋ 补传报告</span>`));
      return `<div class="rpt-cell">${chips}</div><div class="rpt-op">${op}</div>`;
    };
    const rowsHtml = lines.map(l=>`
      <tr>
        <td class="mono c" style="color:var(--text-4);width:46px">${l.i}</td>
        <td class="nm"><b style="display:block;font-weight:600;font-size:13px;line-height:1.35">${l.n}</b><span style="display:block;margin-top:1px;font-size:11.5px;line-height:1.35;color:var(--text-4)">${l.s}</span></td>
        <td class="c" style="color:var(--text-3)">${l.u}</td>
        <td class="r mono" style="color:var(--text-4)">${fmt(l.q)}</td>
        <td class="r mono" style="color:var(--text-4)">${fmt(l.plan===undefined?l.q:l.plan)}</td>
        <td class="r mono name"><b>${l.qty===''?'<span class="hint">未填写</span>':(l.off?'0':fmt(l.qty))}</b></td>
        <td class="r mono" style="color:var(--text-3)">${(l.p||0).toFixed(2)}</td>
        <td class="r mono"><span class="mono">${money(l.q*(l.p||0))}</span></td>
        <td class="c">${l.off?tag('本行不发','off'):'<span class="hint">—</span>'}</td>
        <td style="color:var(--text-3)">${l.note||'<span class="hint">—</span>'}</td>
        <td class="rpt-td" style="width:230px">${rptCell(l)}</td>
      </tr>`).join('');
    /* 流转记录 = 状态变更的真实时间点，不再用「现在」占位。
       待发货：建单那一刻进入（createdAt）；已发货：确认发货（dispatchedAt）；
       门店提交第一次验收数据（acceptingAt）：仅采购订单进入验收中，发货单仍为已发货，本页记动作节点；
       已完成：食堂验收完成（acceptedAt）；已关闭：关闭（closedAt）。末条即当前状态且带真实时间。 */
    /* 操作人：人工动作标注账号 / 验收人；系统动作（自动建单、生成送货单、自动关闭）留空不标 */
    const tl = [[sh.createdAt||'—','<b>系统自动生成发货单</b> · 进入待发货','done']];
    if(sh.savedAt) tl.push([sh.savedAt,'<b>保存修改</b>','done', sh.shipper||CUR_ACCOUNT.name]);
    if(locked){
      tl.push([sh.dispatchedAt,'<b>确认发货</b> · 进入已发货','done', sh.shipper||CUR_ACCOUNT.name]);
      tl.push([dn?dn.generatedAt:sh.dispatchedAt,'<b>生成送货单</b>','done']);  /* 系统按冻结内容生成 */
      if(sh.acceptingAt || sh.st==='COMPLETED'){
        /* 门店首次提交验收数据：采购订单进入验收中，发货单仍为已发货；操作人取 acceptingBy，完成后取验收单 by */
        tl.push([sh.acceptingAt||sh.acceptedAt||sh.dispatchedAt,'<b>门店提交首次验收数据</b>','done', (ys&&ys.by)||sh.acceptingBy||'']);
      }
      if(sh.st==='COMPLETED'){
        tl.push([sh.acceptedAt||sh.dispatchedAt,'<b>食堂验收完成</b> · 进入已完成','done', (ys&&ys.by)||'']);
      }
      if(sh.st==='CLOSED')    tl.push([sh.closedAt||sh.dispatchedAt,'<b>订单关闭</b> · 进入已关闭','done']);  /* 系统自动关闭 */
    }
    /* 系统按有效期自动关联：节点从引用关系派生，不写进 sh 的冻结字段 */
    const autoLinks = linksOfShip(sh.no).filter(l=>l.scene==='auto');
    if(autoLinks.length){
      tl.push([autoLinks[0].at, `<b>系统自动关联食安报告</b> · ${autoLinks.length} 份 · 发货日期 ${sh.date} 落在有效期内，无需确认`,'done']);
    }
    /* 补传报告：节点从引用关系派生，不写进 sh 的冻结字段；补传发生在发货之后，故追加到末尾 */
    const patchGroups = {};
    linksOfShip(sh.no).filter(l=>l.scene==='after').forEach(l=>{
      (patchGroups[l.batch] = patchGroups[l.batch] || []).push(l);
    });
    Object.keys(patchGroups).forEach(b=>{
      const g = patchGroups[b];
      tl.push([g[0].at, `<b>补传食安报告</b> · ${g.length} 份 · 追加关联，不改单据`,'warn', g[0].by||CUR_ACCOUNT.name]);
    });
    const timeline = tl.map(tlRow).join('');
    /* 返回上一层：按进入来源决定去向与文案，各状态常驻 */
    const backBtn = CUR_SHIP_FROM==='order'
      ? `<button class="btn btn-default" onclick="D02_BACK='E04';go('D02')">${I.back}返回详情</button>`
      : `<button class="btn btn-default" onclick="go('E01')">${I.back}返回列表</button>`;
    const mainBtns = locked
      ? (ys
          ? `<button class="btn btn-primary" onclick="ysOpenFromShip()">看验收结果</button>`
          : (accepting
              ? `<button class="btn btn-default" onclick="toast('门店于 ${sh.acceptingAt} 已提交首次验收数据，采购订单进入验收中、发货单仍为已发货；结论回写后生成验收单，两张单同步进入已完成')">已发货 · 待结论</button>`
              : (awaitingAccept
                  ? `<button class="btn btn-default" onclick="toast('门店尚未验收：验收信息与结论由门店侧验收后回写供应端，届时才会生成验收单')">等待门店验收</button>`
                  : '')))
      : `<button class="btn btn-default" onclick="shipEditCurrent()">修改发货信息</button>` +
        (!ready ? ''
          : `<button class="btn btn-primary" onclick="shipDispatch()">${I.truck}确认发货</button>`);
    const printBtn = dn
      ? `<button class="btn btn-default" onclick="goK05('E04')">${I.print}送货单</button>`
      : `<button class="btn btn-default" onclick="toast('确认发货后才会生成送货单')">${I.print}送货单（未生成）</button>`;
    const headTag = tag(stInfo[0], stInfo[1]);   /* 发货单只有待发货 / 已发货 / 已完成 / 已关闭，验收中仅是采购订单状态 */
    return pagehd(sh.no,
        `${sh.order} · ${sh.store} · ${sh.stall} · ${lines.length} 行 · 实发 <b>${money(amt)}</b>${locked?'':(!ready?' · 待发货，下单量待核对保存':(CUR_SHIP_FROM==='order'?' · 待发货，本页可核对':' · 待发货，本页可核对并确认发货'))}`,
        `${backBtn}
         ${printBtn}
         ${mainBtns}`,
        headTag) +
    `
    <div class="stats" style="grid-template-columns:repeat(4,1fr)">
      ${kpi('实发金额', money(amt).replace('¥',''), '元', '')}
      ${kpi('发货行数', String(lines.length), '行', '')}
      ${kpi('本行不发', String(offN), '行', '')}
      ${kpi('当前状态', stInfo[0], '', '')}
    </div>

  <div class="grid-2-1" style="margin-top:12px">
    <div>
      <div class="card">
        <div class="dl four">
          <div><dt>发货单号</dt><dd class="mono">${sh.no}</dd></div>
          <div><dt>关联订单</dt><dd class="mono">${sh.order}</dd></div>
          <div><dt>采购门店 / 档口</dt><dd>${sh.store} · ${sh.stall}</dd></div>
          <div><dt>配送时间</dt><dd class="mono">${shipTimeText(sh)}</dd></div>
          <div><dt>发货人</dt><dd>${sh.shipper||SHIP_META.shipper}</dd></div>
          <div><dt>联系电话</dt><dd class="mono">${unmaskPhone(sh.phone||SHIP_META.phone)}</dd></div>
          <div><dt>建单方式</dt><dd>系统自动生成 · 一个订单只发一次</dd></div>
          <div><dt>创建时间</dt><dd class="mono">${sh.createdAt||'—'}</dd></div>
          <div><dt>确认发货时间</dt><dd class="mono">${sh.dispatchedAt||'—'}</dd></div>
          <div style="grid-column:1/-1"><dt>整单备注</dt><dd style="line-height:1.7">${SHIP_META.note ? SHIP_META.note : '<span class="hint">无整单备注</span>'}</dd></div>
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <div class="card-hd" style="padding:0 0 14px;border-bottom:none"><h3>送货单 <span class="sub">确认发货这一刻生成</span></h3>
          ${dn?tag('已生成','done'):tag('未生成','off')}</div>
        ${dn
          ? `<div class="dl four">
               <div><dt>送货单号</dt><dd class="mono">${dn.no}</dd></div>
               <div><dt>生成时间</dt><dd class="mono">${dn.generatedAt}</dd></div>
               <div><dt>随货行数</dt><dd>${dn.lines} 行 · ${money(dn.amt)}</dd></div>
             </div>
             <div class="hint" style="margin-top:12px">逐行备注原文打印在送货单上；<span class="link" onclick="goK05('E04')">查看 / 打印送货单</span></div>`
          : `<div style="font-size:13px;color:var(--text-2);line-height:1.7">尚未确认发货，送货单未生成。确认发货时系统会按当前实发量、逐行备注生成随货同行联，并同步把订单推进为「已发货」。</div>`}
      </div>

    </div>
    <div>
      <div class="card">
        <div class="card-hd" style="padding:0 0 14px;border-bottom:none"><h3>流转记录 <span class="sub">${stInfo[0]}</span></h3></div>
        <div class="timeline">${timeline}</div>
      </div>
    </div>
  </div>

  <!-- 发货明细全宽：9 列（含食安报告列）放在 61% 宽的左栏会被裁切，
       与 E02 一致改为全宽，最右列不用横向滚动就能看到。
       待发货态该列只读；已发货后才在最右列提供「补传」。 -->
  <div class="card pad0" style="margin-top:12px">
    <div class="card-hd">
      <h3>发货明细 <span class="sub">${lines.length} 行</span></h3>
      <span class="hint">${rptReadonly
        ? '订单 / 发货单已关闭：<b style="color:var(--text-2)">食安报告只读</b>，不提供补传'
        : (locked
          ? '最右列可<b style="color:var(--text-2)">补传食安报告</b>（默认带出该商品上次关联）· 已发货：只追加、不替换'
          : `待发货：本页食安报告<b style="color:var(--text-2)">只读</b> · 已按<b style="color:var(--text-2)">有效期自动关联 ${autoTotal} 份</b>`)}</span>
    </div>
    <div class="tbl-wrap"><table class="tbl" style="min-width:1030px">
      <thead><tr>
        <th class="c">行号</th><th>品名 / 规格</th><th class="c">单位</th><th class="r">下单量</th>
        <th class="r">预估备货量</th><th class="r">实发量</th><th class="r">单价</th><th class="r">订单金额</th>
        <th class="c">本行不发</th><th>备注</th>
        <th>食安报告 <span class="hint" style="font-weight:400">（${rptReadonly?'只读':(locked?'补传 · 只追加':'只读')}）</span></th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
    <div class="sum-bar">
      <span>下单 ${fmt(qtySum(lines))} 件 → 实发 ${fmt(actSum(lines))} 件</span>
      <span style="margin-left:auto">实发金额 <b>${money(amt)}</b></span>
    </div>
  </div>`;
});

/* ============================================================
   E11 · 食安报告库（报告清单 + 报告详情反查引用）
   口径：报告 = 资产（名称 / 报告ID / 上传时间 / 上传人 / 上传内容 / 有效期 / 作废标记），
         关联 = 引用（只存 reportId + 商品 pid/sid + 发货单行），
         单据 = 冻结快照（lines / savedLines 一律不写）。
   E11 只做管理维护（详情查看 / 作废 / 引用追溯），不提供新增入口；报告创建收敛在
   E02 发货前编辑、E04 发货后补传的「关联食安报告」弹层内，创建即关联到该发货明细行。
   不区分标品、不区分报告类型，带有效期（生效日 ~ 失效日）；名称「食安报告 YYYY.MM.DD NNN」自动生成。
   报告一旦被引用即不可变；作废只做 del:true，历史引用仍可查、新关联候选过滤掉。
   已发货后补传只追加不替换，走 shipReportPatch 绕开 shipSave 的锁定拦截；
   E04 待发货态报告只读，发货前关联只在 E02 明细行内进行。
   报告加 validFrom/validTo：发货日期落在有效期内时按 pid 自动关联（scene=auto，无需确认），
   手动筛选 / 新增只作补充；已过期不新关联，历史引用不追改。
   ============================================================ */
const REPORT_TODAY = '2026-10-26';   /* 原型业务日：新增报告落在这一天的流水里 */
/* validFrom / validTo = 报告有效期（含首尾两天）。

/* 种子 pid/sid 从发货单真实商品行读，保证与当前行同源；再补一条历史锚点，
   让待发货单首行一定有「该商品历史关联过、且有效期覆盖发货日期」的报告可自动关联。 */
SHIP_REPORT_LINKS.forEach(lk=>{
  const sh = SHIPMENTS.find(x=>x.no===lk.ship);
  const line = sh ? shipLinesOf(sh).find(l=>l.i===lk.line) : null;
  lk.pid = line ? (line.pid||'') : '';
  lk.sid = line ? (line.sid||'') : '';
  lk.goodsName = line ? line.n : '—';
  lk.goodsSpec = line ? line.s : '';
});
(function(){
  /* 运行时可能有多张待发货单（含撤回后重确认新建的单），逐张确保首行能带出历史关联；
     来源单只取已发货 / 已完成的历史单，弹层里「上次关联于 SH-…」才是真正的历史。 */
  SHIPMENTS.filter(x=>x.st==='WAIT' && !x.del).forEach(w=>{
    const wl = shipLinesOf(w)[0];
    if(!wl || !wl.pid) return;
    if(SHIP_REPORT_LINKS.some(l=>!l.del && l.pid===wl.pid && l.ship!==w.no)) return;
    let anchor = null;
    for(const sh of SHIPMENTS){
      if(sh.st==='WAIT' || sh.del) continue;
      const l = shipLinesOf(sh).find(x=>x.pid===wl.pid);
      if(l){ anchor = {sh:sh, l:l}; break; }
    }
    if(!anchor) return;
    SHIP_REPORT_LINKS.push({id:'LNK-SEED-'+w.no, ship:anchor.sh.no, line:anchor.l.i,
      reportId:'RPT-20261003-001', scene:'before', at:'2026-10-26 09:12', by:'张品控',
      batch:'B-SEED', del:false, pid:anchor.l.pid||'', sid:anchor.l.sid||'',
      goodsName:anchor.l.n, goodsSpec:anchor.l.s});
  });
})();

/* ---------------- 有效期 · 系统自动关联 ----------------
   判定基准是「该张发货单的发货日期 sh.date」是否落在报告有效期内，不是业务今天。
   同一份报告对 10-26 发货的单可命中、对 11-01 发货的单就不命中；历史引用不追改。 */
function dateAdd(d, n){
  const p = String(d).slice(0,10).split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1]-1, p[2]+n)).toISOString().slice(0,10);
}
function reportValidOn(r, shipDate){
  if(!r || r.del || !shipDate) return false;
  const d = String(shipDate).slice(0,10);
  return (r.validFrom||'0000-00-00') <= d && d <= (r.validTo||'9999-12-31');
}
/* 报告库列表里的状态按「业务今天」展示；自动关联一律按每张单的发货日期判定，两者不混用 */
function reportLifeTag(r){
  if(r.del) return ['已作废','void'];
  if(r.validFrom && r.validFrom > REPORT_TODAY) return ['未生效','off'];
  if(r.validTo && r.validTo < REPORT_TODAY) return ['已过期','off'];
  return ['有效','done'];
}
function reportValidText(r){
  return (r.validFrom||'—').replace(/-/g,'.') + ' ~ ' + (r.validTo||'—').replace(/-/g,'.');
}
/* 按商品 pid 反查「其他发货单」曾关联过的报告，筛出有效期覆盖本单发货日期的，
   取上传时间最新的一份（拍板口径：只取最新一份）。排除作废报告与作废发货单。 */
function autoReportFor(sh, line){
  if(!sh || !line || !line.pid || shipLocked(sh) || sh.del) return null;
  const ids = [...new Set(SHIP_REPORT_LINKS.filter(l=>!l.del && l.pid===line.pid &&
    l.ship!==sh.no && shipActive(l.ship) && reportActive(l.reportId)).map(l=>l.reportId))];
  const cands = ids.map(reportById).filter(r=>reportValidOn(r, sh.date));
  if(!cands.length) return null;
  cands.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')) ||
                    String(b.id||'').localeCompare(String(a.id||'')));
  return cands[0];
}
/* 系统自动关联：只作用于发货前（WAIT）单；只追加不替换（该行已有任何引用就跳过）；
   排除「本行不发 / 实发 0」。幂等：同报告由 reportLink 去重，重复调用不会重复写。
   写入 scene='auto'、by='系统自动'，autoReason 记下命中的有效期与发货日期，无需任何确认。 */
function shipReportAutoSync(){
  const made = [];
  SHIPMENTS.filter(x=>x.st==='WAIT' && !x.del).forEach(sh=>{
    shipLinesOf(sh).forEach(l=>{
      if(l.off || Number(l.qty)<=0) return;
      if(linksOfLine(sh.no, l.i).length) return;
      /* 该行曾经自动关联过（哪怕后来被用户解绑成 del:true）就不再重建，尊重用户解绑 */
      if(SHIP_REPORT_LINKS.some(x=>x.ship===sh.no && x.line===l.i && x.scene==='auto')) return;
      const r = autoReportFor(sh, l);
      if(!r) return;
      reportLink(sh.no, l.i, [r.id], 'auto').forEach(lk=>{
        lk.by = '系统自动';
        lk.at = sh.savedAt || sh.createdAt || (REPORT_TODAY+' 14:20');  /* 落在建单之后，流转记录不倒流 */
        lk.autoReason = '发货日期 '+sh.date+' 在有效期 '+(r.validFrom||'—')+' ~ '+(r.validTo||'—')+' 内';
        made.push(lk);
      });
    });
  });
  return made;
}
/* 加载期对全部待发货单执行一次：报告列一打开就已经有按有效期自动关联的结果。
   已发货单不自动补关联（冻结快照 + E04 只读），仍走人工补传。 */
shipReportAutoSync();

function reportById(id){ return FOOD_REPORTS.find(r=>r.id===id) || null; }
function reportActive(id){ const r=reportById(id); return r && !r.del ? r : null; }
function shipActive(no){ const s=SHIPMENTS.find(x=>x.no===no); return s && !s.del; }
function linksOfLine(shNo, i){
  return SHIP_REPORT_LINKS.filter(l=>!l.del && l.ship===shNo && l.line===i && reportActive(l.reportId));
}
function linksOfShip(shNo){
  return SHIP_REPORT_LINKS.filter(l=>!l.del && l.ship===shNo && shipActive(l.ship) && reportActive(l.reportId));
}
function linksOfReport(id){
  return SHIP_REPORT_LINKS.filter(l=>!l.del && l.reportId===id && shipActive(l.ship));
}
/* 上一次关联：按 pid 反查「其他发货单」的历史（排除整张当前单，避免带出本单自己的关联，
   弹层才不会显示「上次关联于本单」）。按关联时间取最近一批（一次操作可能关联多份）。 */
function lastLinkedReports(pid, shNo, i){
  const ls = SHIP_REPORT_LINKS.filter(l=>!l.del && l.pid===pid && reportActive(l.reportId) &&
    shipActive(l.ship) && l.ship!==shNo);
  if(!ls.length) return null;
  const maxAt = ls.reduce((m,l)=>l.at>m?l.at:m, '');
  return {at:maxAt, ship:ls.find(l=>l.at===maxAt).ship,
          ids:[...new Set(ls.filter(l=>l.at===maxAt).map(l=>l.reportId))]};
}
function reportSeqNext(dateStr){
  const day = dateStr.replace(/-/g,'');
  const nums = FOOD_REPORTS.filter(r=>r.id.indexOf('RPT-'+day+'-')===0).map(r=>Number(r.id.slice(-3))||0);
  return String(Math.max(0,...nums)+1).padStart(3,'0');   /* 含已作废：序号不回收 */
}
function reportCreate(files, by, vf, vt){
  const seq = reportSeqNext(REPORT_TODAY);
  const r = {id:'RPT-'+REPORT_TODAY.replace(/-/g,'')+'-'+seq,
    name:'食安报告 '+REPORT_TODAY.replace(/-/g,'.')+' '+seq,
    at:REPORT_TODAY+' 14:20', by:by||CUR_ACCOUNT.name,
    validFrom:vf||REPORT_TODAY, validTo:vt||dateAdd(REPORT_TODAY,30),
    files:files.map(f=>({...f})), del:false};
  FOOD_REPORTS.push(r);
  return r;
}
/* 只追加：同一行同一报告已有有效引用就跳过，绝不替换、不重复 */
function reportLink(shNo, i, ids, scene){
  const sh = SHIPMENTS.find(x=>x.no===shNo);
  if(!sh || !ids.length) return [];
  const line = shipLinesOf(sh).find(l=>l.i===i);
  const batch = 'B-'+String(SHIP_REPORT_LINKS.length+1).padStart(4,'0');
  const made = [];
  ids.forEach(rid=>{
    if(!reportActive(rid)) return;
    if(linksOfLine(shNo,i).some(l=>l.reportId===rid)) return;
    const lk = {id:'LNK-'+String(SHIP_REPORT_LINKS.length+1).padStart(4,'0'),
      ship:shNo, line:i, reportId:rid, scene:scene, at:REPORT_TODAY+' 14:20',
      by:CUR_ACCOUNT.name, batch:batch, del:false,
      pid:line?(line.pid||''):'', sid:line?(line.sid||''):'',
      goodsName:line?line.n:'—', goodsSpec:line?line.s:''};
    SHIP_REPORT_LINKS.push(lk); made.push(lk);
  });
  return made;
}
/* 已发货后的独立写入口：不碰 sh.lines / savedLines / 金额 / 状态 / 送货单，
   因此能绕开 shipSave() 对锁定单的无条件拦截。 */
function shipReportPatch(shNo, i, ids){
  const sh = SHIPMENTS.find(x=>x.no===shNo);
  if(shipRptReadonly(sh)){ toast('已关闭订单 / 发货单的食安报告只读，不能补传','err'); return []; }
  if(!sh || !shipLocked(sh)){ toast('该发货单未锁定，请用发货前关联','err'); return []; }
  return reportLink(shNo, i, ids, 'after');
}
function reportUnlink(linkId){
  const sh = curShip();
  if(shipLocked(sh)){ toast('该发货单已锁定，已关联报告只读，不能解绑','err'); return; }
  const lk = SHIP_REPORT_LINKS.find(l=>l.id===linkId);
  if(lk){ lk.del = true; toast('已解除该报告关联（逻辑删除，留痕）'); if(!reportRefresh(CUR)) go(CUR); }
}
/* 食安报告文件内容预览：原型无真实图片 / PDF，按文件生成模拟检测报告页面（SVG data URI）。
   图片显示扫描影像、PDF 显示报告正文页、表格显示数据表页；缩略图与放大图共用同一份内容。 */
function reportFileURI(f){
  const n=String(f.n||'file'), ext=(n.split('.').pop()||'').toLowerCase();
  const isImg=f.k==='img', isPdf=ext==='pdf', isSheet=/xlsx?|csv/.test(ext);
  const bar=isImg?'#2f855a':(isPdf?'#1f5fa8':'#7c5cbf');
  const title=isImg?'现场检测影像':(isPdf?'食品安全检测报告':'检测数据汇总表');
  const sub=isImg?'SAMPLING PHOTOGRAPH':(isPdf?'FOOD SAFETY TEST REPORT':'TEST DATA SHEET');
  let lines='';
  const widths=[470,420,455,390,440,410];
  for(let i=0;i<6;i++){ lines+=`<rect x="52" y="${190+i*34}" width="${widths[i]}" height="9" rx="2" fill="#dfe4ea"/>`; }
  let tbl=`<rect x="52" y="410" width="496" height="34" fill="#eef3f9"/>`;
  [52,190,300,410,548].forEach(x=>{ tbl+=`<line x1="${x}" y1="410" x2="${x}" y2="546" stroke="#cdd6e2"/>`; });
  for(let r=0;r<4;r++){ const y=444+r*34; tbl+=`<line x1="52" y1="${y}" x2="548" y2="${y}" stroke="#e3e8ef"/>`; }
  tbl+=`<text x="62" y="432" font-size="12" fill="#4a5a6a" font-family="sans-serif">检测项目</text><text x="200" y="432" font-size="12" fill="#4a5a6a" font-family="sans-serif">检测结果</text><text x="310" y="432" font-size="12" fill="#4a5a6a" font-family="sans-serif">标准限值</text><text x="420" y="432" font-size="12" fill="#4a5a6a" font-family="sans-serif">单项判定</text>`;
  const seal=`<circle cx="440" cy="640" r="56" fill="none" stroke="#d64545" stroke-width="4" opacity=".85"/><circle cx="440" cy="640" r="46" fill="none" stroke="#d64545" stroke-width="1.5" opacity=".85"/><text x="440" y="634" text-anchor="middle" font-size="15" fill="#d64545" opacity=".9" font-family="sans-serif">检测专用章</text><text x="440" y="656" text-anchor="middle" font-size="11" fill="#d64545" opacity=".8" font-family="sans-serif">INVALID</text>`;
  const safe=n.replace(/[<>&"]/g,'');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<rect width="600" height="800" fill="#eef1f5"/><rect x="24" y="24" width="552" height="752" fill="#fff" stroke="#d5dce6"/>
<rect x="24" y="24" width="552" height="76" fill="${bar}"/>
<text x="300" y="62" text-anchor="middle" font-size="23" fill="#fff" font-family="sans-serif" font-weight="bold">${title}</text>
<text x="300" y="86" text-anchor="middle" font-size="11" fill="#eaf1fa" font-family="sans-serif" letter-spacing="2">${sub}</text>
<text x="52" y="140" font-size="13" fill="#333" font-family="monospace">FILE: ${safe}  /  ${f.sz||''}</text>
${lines}${tbl}
<text x="52" y="586" font-size="12" fill="#667" font-family="sans-serif">结论：所检项目符合 GB 食品安全国家标准。</text>
${seal}
<text x="300" y="752" text-anchor="middle" font-size="12" fill="#9aa5b2" font-family="sans-serif">${isImg?'扫描影像':(isPdf?'PDF 文档 · 第 1 页':'电子表格 · 第 1 页')} · 原型模拟内容</text>
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function reportFilePreview(rid, idx){
  const r=reportById(rid); if(!r) return;
  const f=r.files[idx]; if(!f) return;
  const ext=(f.n.split('.').pop()||'').toLowerCase();
  const kind=f.k==='img'?'图片':(ext==='pdf'?'PDF 文档':'文件');
  modal('文件预览 · '+f.n, `<div style="text-align:center"><img src="${reportFileURI(f)}" style="max-width:100%;max-height:calc(100vh - 250px);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.12)"><div class="hint" style="margin-top:10px">${r.name} · ${r.id} · ${f.n} · ${f.sz} · ${kind}</div></div>`, `<button class="btn btn-default" onclick="closeModal()">关闭</button>`, true);
}
function reportThumbs(files, max, rid){
  const fs=files||[], m=max||3;
  const tagOf=f=>f.k==='img'?'图':(/\.pdf$/i.test(f.n)?'PDF':String((f.n.split('.').pop()||'FILE')).slice(0,4).toUpperCase());
  return `<div class="rpt-thumbs">` + fs.slice(0,m).map((f,i)=>
    `<div class="rpt-file ${f.k==='img'?'img':'doc'}" title="${f.n} · ${f.sz} · 点击查看预览" onclick="event.preventDefault();event.stopPropagation();reportFilePreview('${rid}',${i})"><img class="rpt-thumb" src="${reportFileURI(f)}" alt=""><span class="ic">${tagOf(f)}</span></div>`
  ).join('') + (fs.length>m ? `<div class="rpt-file doc more"><span class="ic">+${fs.length-m}</span><span>更多</span></div>` : '') + `</div>`;
}
function reportFilesText(r){ return `${r.at} 上传 · ${r.by} · ${r.files.length} 个文件`; }

/* ---------------- 关联弹层：自动关联结果（只读） + 条件筛选 + 新增并关联 ----------------
   有效期命中的报告已由系统在加载期写入引用，这里不再预填勾选、也不要求用户确认；
   弹层只承担「未命中需补一份」与「想额外追加报告」两种补充场景。 */
let RPT_PICK = null;
function reportPickOpen(shNo, i, back){
  const sh = SHIPMENTS.find(x=>x.no===shNo); if(!sh) return;
  /* E04 是「发货单详情」：待发货态报告只读，发货前的关联 / 上传统一在 E02 明细行内。
     这里加一道防御，避免深链、残留状态或控制台调用绕过 UI 直接写入。 */
  if((back||CUR)==='E04' && shipRptReadonly(sh)){
    toast('已关闭订单 / 发货单的食安报告只读，不能补传','err'); return;
  }
  if((back||CUR)==='E04' && !shipLocked(sh)){
    toast('待发货单的报告请在「发货单编辑」E02 明细行内关联','err'); return;
  }
  const line = shipLinesOf(sh).find(l=>l.i===i); if(!line) return;
  RPT_PICK = {sh:shNo, i:i, back:back||CUR, locked:shipLocked(sh),
    pid:line.pid||'', sid:line.sid||'', goods:line.n+' · '+line.s,
    shipDate:sh.date, last:lastLinkedReports(line.pid, shNo, i),
    sel:[], only:true, files:[],
    svf:'', svt:'', suf:'', sut:'', sby:'',
    vf:REPORT_TODAY, vt:dateAdd(REPORT_TODAY,30)};
  reportPickRender();
}
function reportPickLastHTML(){
  const p = RPT_PICK;
  const autos = linksOfLine(p.sh, p.i).filter(l=>l.scene==='auto');
  if(!autos.length){
    return `<div class="hint" style="line-height:1.8">该商品没有<b>有效期覆盖本单发货日期（${p.shipDate}）</b>的历史报告，系统未自动关联。<br>可在下方按有效期起止、上传时间起止或上传人筛选报告，或新增上传一份（上传时填写有效期）。</div>`;
  }
  return autos.map(l=>{
    const r = reportById(l.reportId)||{files:[]};
    return `<div class="rpt-row on" style="cursor:default">
      ${reportThumbs(r.files,3,r.id)}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">${r.name||'—'}</div>
        <div class="hint mono">有效期 ${reportValidText(r)}</div>
        <div class="hint">${l.autoReason||''} · ${reportFilesText(r)}</div>
        <div class="hint">操作人：${l.by||'系统自动'} · ${l.at}</div>
      </div><span class="rpt-chip auto">已自动关联</span></div>`;
  }).join('') + `<div class="hint" style="margin-top:8px">系统按商品 pid 与有效期自动写入，<b>无需确认</b>；下方仅用于额外补充报告。</div>`;
}
function reportPickResultsHTML(){
  const p = RPT_PICK;
  const by = String(p.sby||'').trim().toLowerCase();
  const hasFilter = !!(p.svf || p.svt || p.suf || p.sut || by);
  const hist = p.only ? [...new Set(SHIP_REPORT_LINKS.filter(l=>!l.del&&l.pid===p.pid&&shipActive(l.ship)).map(l=>l.reportId))] : null;
  /* 只列「有效期覆盖本单发货日期」且未作废的报告；已在本行的也不再列为候选 */
  const linkedIds = linksOfLine(p.sh, p.i).map(l=>l.reportId);
  let list = FOOD_REPORTS.filter(r=>{
    if(r.del || !reportValidOn(r, p.shipDate) || linkedIds.indexOf(r.id)>=0) return false;
    /* 有效期按与查询区间有交集判定；上传日期按上传当天落在区间内；上传人模糊匹配 */
    if(p.svt && r.validFrom && r.validFrom>p.svt) return false;
    if(p.svf && r.validTo   && r.validTo  <p.svf) return false;
    const day = String(r.at||'').slice(0,10);
    if(p.suf && day && day<p.suf) return false;
    if(p.sut && day && day>p.sut) return false;
    if(by && String(r.by||'').toLowerCase().indexOf(by)<0) return false;
    return true;
  });
  if(hist) list = list.filter(r=>hist.indexOf(r.id)>=0);
  if(!list.length) return `<div class="hint">${p.only && !hasFilter ? '本商品暂无其他在有效期内的历史报告，可关闭「仅本商品历史」查看全部，或新增一份。' : '没有匹配当前筛选条件的在有效期内报告。'}</div>`;
  return `<div class="hint" style="margin-bottom:6px">仅显示有效期覆盖发货日期 <b class="mono">${p.shipDate}</b> 的报告；已过期 / 未生效 / 已作废的不可新关联</div>
    <div style="max-height:210px;overflow:auto">` + list.map(r=>{
    const on = p.sel.indexOf(r.id)>=0;
    return `<label class="rpt-row ${on?'on':''}">
      <input type="checkbox" ${on?'checked':''} onchange="reportPickToggle('${r.id}')">
      ${reportThumbs(r.files,2,r.id)}
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">${r.name}</div>
        <div class="hint mono">有效期 ${reportValidText(r)}</div>
        <div class="hint">${reportFilesText(r)} · 已被引用 ${linksOfReport(r.id).length} 次</div></div></label>`;
  }).join('') + `</div>`;
}
