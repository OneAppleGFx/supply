function reportPickToggle(id){
  const p = RPT_PICK; if(!p) return;
  const k = p.sel.indexOf(id);
  if(k>=0) p.sel.splice(k,1); else p.sel.push(id);
  const el = document.getElementById('rpt-results'); if(el) el.innerHTML = reportPickResultsHTML();
}
/* 新增区有效期写回 RPT_PICK：弹层局部刷新时不会丢输入 */
function reportPickValid(k, v){ if(RPT_PICK) RPT_PICK[k] = v; }
/* 筛选条件实时作用于候选列表：只刷结果区，避免输入框失焦。 */
function reportPickFilter(k, v){
  if(!RPT_PICK) return;
  RPT_PICK[k] = v;
  const el = document.getElementById('rpt-results'); if(el) el.innerHTML = reportPickResultsHTML();
}
function reportPickFilterReset(){
  if(!RPT_PICK) return;
  Object.assign(RPT_PICK, {svf:'', svt:'', suf:'', sut:'', sby:''});
  ['rp-svf','rp-svt','rp-suf','rp-sut','rp-sby'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.value = '';
  });
  const el = document.getElementById('rpt-results'); if(el) el.innerHTML = reportPickResultsHTML();
}
function reportPickOnly(v){
  RPT_PICK.only = v;
  const el = document.getElementById('rpt-results'); if(el) el.innerHTML = reportPickResultsHTML();
}
function reportPickAddFile(){
  const n = RPT_PICK.files.length+1;
  RPT_PICK.files.push({n:n%3===0?('附件_'+n+'.pdf'):('现场照片_'+n+'.jpg'),
    k:n%3===0?'file':'img', sz:(110+n*37)+' KB'});
  const el = document.getElementById('rpt-newfiles'); if(el) el.innerHTML = reportPickNewHTML();
}
function reportPickConfirm(){
  const p = RPT_PICK; if(!p) return;
  /* 与 reportPickOpen 同源的二次校验：E04 来源必须是已发货锁定单，否则不允许写入。 */
  const _sh = SHIPMENTS.find(x=>x.no===p.sh);
  if(p.back==='E04' && shipRptReadonly(_sh)){
    toast('已关闭订单 / 发货单的食安报告只读，不能补传','err'); return;
  }
  if(p.back==='E04' && (!_sh || !shipLocked(_sh))){
    toast('待发货单的报告请在「发货单编辑」E02 明细行内关联','err'); return;
  }
  const ids = p.sel.slice();
  if(p.files.length){
    if(p.vf > p.vt){ toast('失效日期不能早于生效日期','err'); return; }
    ids.push(reportCreate(p.files, CUR_ACCOUNT.name, p.vf, p.vt).id);
  }
  if(!ids.length){ toast('请至少勾选一份报告，或新增一份','err'); return; }
  const made = p.locked ? shipReportPatch(p.sh,p.i,ids) : reportLink(p.sh,p.i,ids,'before');
  if(!made.length){ toast('所选报告已在本行，无需重复关联','err'); return; }
  closeModal();
  toast((p.locked?'已补传食安报告 ':'已关联食安报告 ')+made.length+' 份 · 未改动发货单据');
  if(!reportRefresh(p.back)) go(p.back);
}

/* ---------------- E11 · 报告清单 / 报告详情 ---------------- */
/* E11 已收敛为单一清单视图，不再有「报告库 / 引用台账」两个 tab。
   保留同名兼容入口，仅供历史深链与回归探针调用（等价于 go('E11')）。 */
function rptSetTab(){ go('E11'); }

/* ---------------- E11 · 条件筛选查询区 ----------------
   RPT_FILTER 只在「查询 / 重置」时变更；改输入框不即时改列表，避免输入过程中列表跳动。
   口径（起 / 止任一端留空 = 该侧不限）：
     · 报告 ID   —— 模糊匹配 RPT-… 编号（不区分大小写），也匹配报告名称，便于从名称反查
     · 状态      —— 按业务今天的 reportLifeTag()：有效 / 未生效 / 已过期 / 已作废
     · 有效期起止 —— 报告的 validFrom ~ validTo 与所查区间「有交集」即命中
                    （即报告在这段区间内任一天有效）；不是要求整段落在区间内
     · 上传日期起止 —— 上传当天（at 前 10 位）落在区间内
   筛选只作用于 E11 的展示清单，不改 FOOD_REPORTS、不动作废状态、不影响 E02/E04 的关联与自动关联。 */
const RPT_STATUS_OPTIONS = ['有效','未生效','已过期','已作废'];
let RPT_FILTER = {id:'', st:'', vf:'', vt:'', uf:'', ut:''};
function rptEsc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function rptFilterActive(){ const f=RPT_FILTER; return !!(f.id||f.st||f.vf||f.vt||f.uf||f.ut); }
function rptFilterRows(){
  const f=RPT_FILTER, kw=String(f.id||'').toLowerCase();
  return FOOD_REPORTS.filter(r=>{
    if(kw && (r.id+' '+r.name).toLowerCase().indexOf(kw)<0) return false;
    if(f.st && reportLifeTag(r)[0]!==f.st) return false;
    /* 区间交集：报告生效日晚于查询结束，或失效日早于查询开始，都不相交 */
    if(f.vt && r.validFrom && r.validFrom>f.vt) return false;
    if(f.vf && r.validTo   && r.validTo  <f.vf) return false;
    const day=String(r.at||'').slice(0,10);
    if(f.uf && day && day<f.uf) return false;
    if(f.ut && day && day>f.ut) return false;
    return true;
  });
}
function rptFilterCollect(){
  const v=id=>{ const e=document.getElementById(id); return e?String(e.value||'').trim():''; };
  RPT_FILTER={id:v('rf-id'), st:v('rf-st'), vf:v('rf-vf'), vt:v('rf-vt'), uf:v('rf-uf'), ut:v('rf-ut')};
}
function rptQuery(){ rptFilterCollect(); pgOf('E11').p = 1; go('E11'); }
function rptReset(){ RPT_FILTER={id:'',st:'',vf:'',vt:'',uf:'',ut:''}; pgOf('E11').p = 1; go('E11'); }
function rptStatusOptions(){
  return `<option value="">全部状态</option>` + RPT_STATUS_OPTIONS.map(x=>
    `<option value="${x}" ${RPT_FILTER.st===x?'selected':''}>${x}</option>`).join('');
}

/* 报告详情里的「引用情况」：按报告反查引用记录，四个维度固定为
   发货单 / 门店 / 商品 pid / 发货时间。历史引用不因报告作废或过期而消失。
   发货时间：已发货单取确认发货时间 dispatchedAt；待发货单尚无确认动作，
   取「发货日期 + 选填送达时间」的配送时间（与 E01 / E04 / K05 同源）。 */
function reportUsageHTML(r){
  const ls = linksOfReport(r.id).slice().sort((a,b)=> b.ship.localeCompare(a.ship) || a.line-b.line);
  if(!ls.length) return `<div class="hint" style="padding:12px 0;line-height:1.8">该报告尚未被任何发货单引用。</div>`;
  const ships = [...new Set(ls.map(l=>l.ship))];
  const rows = ls.map(l=>{
    const sh = SHIPMENTS.find(x=>x.no===l.ship) || {};
    const scene = l.scene==='auto' ? '系统自动关联' : (l.scene==='after' ? '发货后补传' : '发货前关联');
    const t = sh.dispatchedAt || shipTimeText(sh);
    const tTip = sh.dispatchedAt ? '确认发货时间' : '配送时间（待发货）';
    return `<tr>
      <td class="mono">${l.ship}<div class="hint" style="font-size:11px">明细行 ${l.line} · ${scene}</div></td>
      <td>${sh.store||'—'}<div class="hint" style="font-size:11px">${sh.stall||''}</div></td>
      <td>${l.goodsName||'—'} <span class="hint">${l.goodsSpec||''}</span>
        <div class="hint mono" style="font-size:11px">${l.pid||'—'}${l.sid?' / '+l.sid:''}</div></td>
      <td class="mono">${t||'—'}<div class="hint" style="font-size:11px">${tTip}</div></td></tr>`;
  }).join('');
  return `<div class="card pad0" style="margin-top:14px">
      <div class="card-hd"><h3 style="font-size:13px">引用情况</h3></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>发货单</th><th>门店</th><th>商品 / pid</th><th>发货时间</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="sum-bar"><span>共 ${ls.length} 条引用</span><span>覆盖 ${ships.length} 张发货单</span>
        </div></div>`;
}
/* 函数名保留 reportPreview 以兼容既有深链 / 探针，UI 文案统一为「报告详情」。 */

      <div><dt>上传时间</dt><dd class="mono">${r.at}</dd></div>
      <div><dt>上传人</dt><dd>${r.by}</dd></div>
      <div><dt>状态</dt><dd>${reportLifeTag(r)[0]}</dd></div>
      <div><dt>有效期</dt><dd class="mono">${reportValidText(r)}</dd></div>
      <div><dt>自动关联判定</dt><dd class="hint">按各发货单的发货日期是否落在有效期内</dd></div>

function bpSum(){
  const boxes = [...document.querySelectorAll('#bptbl input[type=checkbox]')];
  const n = boxes.filter(b=>b.checked).length;
  const c = document.getElementById('bpcnt'), p = document.getElementById('bppage');
  if(c) c.textContent = n;
  if(p) p.textContent = n * 2;
}
/* ============================================================
   F04 · 售后退货处理（门店端退货申请的查看与处理）
   ------------------------------------------------------------
   保留「门店端退货申请」的查看与处理（审核通过即结算扣减 / 驳回），
   移除原「验收异议申述」链路：申诉说明、申诉成功率、48 小时申诉时限、
   争议货品、数量/品质争议类型、证据对照、改判金额、历史同类申诉等。
   退货与验收申诉是两件事 —— 本屏只处理「门店发起的退货」，
   对验收结论本身有异议的申诉（一期）不在此做。
   退货业务模型与 A06「退货待处理」一致：<b>退货 = 不计入验收合格量，
   结算时自然扣减对应金额，没有独立退款动作</b>；F04 / A06 共用同一份 RETURNS 数据。
   ============================================================ */
let CUR_RETURN_NO = null;
/* 退货申请单一数据源：与 A06「退货待处理」共用。状态只有 待确认 / 已同意 / 已拒绝。 */
const RETURNS = [
  {no:'TH-20261026-0006', ys:'YS-20261025-0014', store:'长宁来福士店', stall:'面点档', n:'上海青',    q:'4 件',  amt:12.80,  why:'品质不达标', why2:'叶片发黄',   t:'10-26 09:12', pt:'',            st:'待确认', cls:'wait'},
  {no:'TH-20261026-0005', ys:'YS-20261026-0017', store:'静安嘉里店', stall:'快餐档',   n:'猪五花肉', q:'15 件', amt:252.00, why:'品质不达标', why2:'厚度不均',   t:'10-26 08:40', pt:'',            st:'待确认', cls:'wait'},
  {no:'TH-20261026-0004', ys:'YS-20261025-0015', store:'徐汇滨江店', stall:'快餐档',   n:'老豆腐',   q:'1 箱',  amt:8.50,   why:'运输破损',   why2:'边角碎裂',   t:'10-26 07:55', pt:'',            st:'待确认', cls:'wait'},
  {no:'TH-20261025-0003', ys:'YS-20261025-0013', store:'虹桥天地店', stall:'小炒档',   n:'活虾',     q:'2 件',  amt:84.00,  why:'死亡超标',   why2:'死亡率 30%',  t:'10-25 08:20', pt:'10-25 10:30', st:'已同意', cls:'done'},
  {no:'TH-20261024-0002', ys:'YS-20261025-0012', store:'浦东世纪汇店', stall:'小炒档', n:'小白菜',   q:'3 件',  amt:9.00,   why:'品质不达标', why2:'含泥过多',   t:'10-24 09:05', pt:'10-24 11:15', st:'已拒绝', cls:'off'}
];
/* 退货申请数据自洽校验（供应商端护栏）：
   退货商品必须属于其关联验收单的逐行明细。根因：原 RETURNS 为手写演示数据，与关联验收单无联动校验，
   曾出现「退的商品不在验收单里」的不一致（TH-20261026-0006 退小白菜 / TH-20261024-0002 退菠菜，均不在各自验收单明细）。
   门店端发起退货时，商品只能从关联验收单明细中选；此处开机自检并 console 告警，防止演示数据再次失配。 */
function returnYsProducts(ysNo){
  const ys = ACCEPTANCES.find(a=>a.no===ysNo);
  if(!ys) return [];
  return ysLines(ys).map(x=>x.r.n);
}
/* 退货单 → 关联采购订单：退货关联验收单(ys) → 验收单的发货单(sh) → 发货单的采购订单(order)。
   用于 F04 / F05 把「关联的验收单」改为「关联的采购订单」，点击跳转到采购订单详情(D02)。 */
function returnPoNo(ysNo){
  const ys = ACCEPTANCES.find(a=>a.no===ysNo);
  if(!ys || !ys.sh) return null;
  const sh = SHIPMENTS.find(s=>s.no===ys.sh);
  if(!sh || !sh.order) return null;
  return sh.order;
}
function returnAudit(){
  const bad = [];
  RETURNS.forEach(r=>{
    const ys = ACCEPTANCES.find(a=>a.no===r.ys);
    if(!ys){ bad.push(r.no+' 关联验收单 '+r.ys+' 不存在'); return; }
    const prods = returnYsProducts(r.ys);
    if(prods.indexOf(r.n) < 0)
      bad.push(r.no+' 退货商品「'+r.n+'」不在关联验收单 '+r.ys+' 明细内（明细：'+prods.join('、')+'）');
  });
  if(bad.length) console.warn('[returnAudit] 退货数据与关联验收单不一致：\n'+bad.join('\n'));
  return bad;
}
/* 轻量 HTML 转义：处理说明为用户输入，回显到 F05 时避免破坏结构 */
function escHTML(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* 退货处理统一落库：F04 单条处理 / A06 批量同意 都必须走这里，
   只改 RETURNS 这一份数据，状态、结论、处理说明、处理时间一次写全。
   下游 F04 KPI / 徽标、A02 待办、A06 待办、D01「售后情况」、F05 流转记录全部现算，故一处改全站联动。 */
function returnDecide(r, decision, note){
  r.st        = decision==='同意' ? '已同意' : '已拒绝';
  r.cls       = decision==='同意' ? 'done' : 'off';
  r.decision  = decision;
  r.note      = note || '';
  /* 处理时间沿用演示数据基线：申请当天 11:40，与 F05 流转记录「供应商审核」节点同源，
     也保证 F04「处理时间」区间筛选（按 MM-DD 前 5 位）可用、72 小时时限自洽。 */
  r.pt        = r.t.slice(0,5) + ' 11:40';
}
/* F04 单条处理提交：读表单 → 校验 → 落库 → 重渲染当前屏 */
function returnSubmit(no){
  const r = RETURNS.find(x=>x.no===no);
  if(!r){ toast('退货申请不存在','err'); return; }
  if(r.st!=='待确认'){ closeModal(); toast('该申请已处理（'+r.st+'），不能重复处理','err'); go(CUR); return; }
  const sel      = document.getElementById('rh_decision');
  const decision = (sel && sel.value==='驳回') ? '驳回' : '同意';
  const note     = ((document.getElementById('rh_note')||{}).value || '').trim();
  const amtEl    = document.getElementById('rh_amt');
  const amt      = amtEl && amtEl.value!=='' ? Number(amtEl.value) : r.amt;
  if(decision==='驳回' && !note){ toast('驳回时必须填写处理说明','err'); return; }  /* 保留弹窗，让用户可以补填 */
  if(!isFinite(amt) || amt<0){ toast('扣减金额需为有效数字','err'); return; }
  if(decision==='同意') r.amt = Math.round(amt*100)/100;   /* 同意时按表单确认的扣减金额落库；驳回不改申请金额 */
  returnDecide(r, decision, note);
  closeModal();
  go(CUR);   /* 重渲染当前页（F04 列表 / F05 详情），状态、KPI、徽标、流转记录随之更新 */
  toast('退货申请已'+(decision==='同意'?'同意':'驳回')+'，结果已同步门店端');
}
/* A06 批量同意提交：与单条处理共用 returnDecide，避免同一份 RETURNS 两套行为 */
function batchReturnSubmit(){
  const pend = RETURNS.filter(r=>r.st==='待确认');
  if(!pend.length){ closeModal(); toast('当前没有待确认的退货申请','err'); go(CUR); return; }
  const sum = pend.reduce((s,r)=>s+r.amt,0);
  pend.forEach(r=>returnDecide(r, '同意', '批量同意'));
  closeModal();
  go(CUR);
  toast('已同意 '+pend.length+' 笔退货，合计扣减 ¥'+sum.toFixed(2));
}
/* 处理弹窗：处理说明仅在「驳回」时出现；选「审核通过」时隐藏并清空，审核通过不要求填写说明 */
function rhToggleNote(){
  const sel  = document.getElementById('rh_decision');
  const wrap = document.getElementById('rh_note_wrap');
  if(!sel || !wrap) return;
  const show = sel.value==='驳回';
  wrap.style.display = show ? 'block' : 'none';
  if(!show){ const t = document.getElementById('rh_note'); if(t) t.value=''; }
}
function returnHandle(no){
  const r = (typeof no==='string' ? RETURNS.find(x=>x.no===no) : no) || RETURNS[0];
  /* 已处理的申请不再打开处理弹窗，避免状态被反复改写 */
  if(r.st!=='待确认'){ toast('该申请已处理（'+r.st+'），不能重复处理','err'); return; }
  modal('处理退货申请 · '+r.no, `
    <div class="banner info" style="margin-bottom:14px">${I.info}
      <div>退货申请由<b>门店端发起</b>，供应商在此查看并处理：审核通过即<b>不计入验收合格量</b>（结算时自然扣减对应金额，无独立退款动作），或驳回。需在门店发起后 <b>72 小时</b>内处理完毕，超时默认同意。</div>
    </div>
    <div class="dl two" style="gap:12px 16px;margin-bottom:16px">
      <div><dt>门店 / 档口</dt><dd>${r.store} · ${r.stall}</dd></div>
      <div><dt>申请时间</dt><dd class="mono">2026-${r.t}</dd></div>
      <div><dt>退货原因</dt><dd>${r.why}（${r.why2}）</dd></div>
    </div>
    <div class="hr" style="height:1px;background:var(--line-2);margin:0 0 16px"></div>
    <div class="row" style="display:flex;gap:12px;margin-bottom:14px">
      <div class="field" style="flex:1">
        <label>退货商品</label>
        <input class="input" value="${r.n} · ${r.q}" readonly>
      </div>
      <div class="field" style="width:150px">
        <label>扣减金额（元）</label>

   原 goYs / goReturnYs / backToReturn（退货 → 验收单 → 返回退货单）链路已随本次调整移除。 */
let F04F = { st:'全部状态', store:'全部门店', t0:'', t1:'', p0:'', p1:'', kw:'' };
function f04rows(){
  let arr = RETURNS;
  if(F04F.st!=='全部状态') arr = arr.filter(r=>r.st===F04F.st);
  if(F04F.store!=='全部门店') arr = arr.filter(r=>r.store===F04F.store);
  if(F04F.kw){ const k=F04F.kw.trim(); if(k) arr = arr.filter(r=> (r.no+' '+(returnPoNo(r.ys)||'')+' '+r.n).includes(k)); }
  if(F04F.t0||F04F.t1){ arr = arr.filter(r=>{ const d='2026-'+r.t.slice(0,5); if(F04F.t0&&d<F04F.t0) return false; if(F04F.t1&&d>F04F.t1) return false; return true; }); }
  if(F04F.p0||F04F.p1){ arr = arr.filter(r=>{ if(!r.pt) return false; const d='2026-'+r.pt.slice(0,5); if(F04F.p0&&d<F04F.p0) return false; if(F04F.p1&&d>F04F.p1) return false; return true; }); }
  return arr;
}
function f04apply(){
  F04F.st = document.getElementById('f04_st').value;
  F04F.store = document.getElementById('f04_store').value;
  F04F.t0 = document.getElementById('f04_t0').value;
  F04F.t1 = document.getElementById('f04_t1').value;
  F04F.p0 = document.getElementById('f04_p0').value;
  F04F.p1 = document.getElementById('f04_p1').value;

function f04export(){
  const rows = f04rows();
  const head = ['退货单号','关联采购订单号','门店','采购档口','退货商品','数量','金额(元)','退货原因','申请时间','处理时间','状态'];
  const esc = v => { const s = String(v==null?'':v); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [head.map(esc).join(',')];
  rows.forEach(r=>{
    lines.push([
      r.no, returnPoNo(r.ys)||'-', r.store, r.stall, r.n, r.q, r.amt, r.why,
      r.t, r.st==='待确认' ? '-' : r.pt, r.st
    ].map(esc).join(','));
  });
  const csv = '﻿' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '售后退货_' + (new Date().toISOString().slice(0,10)) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('已导出 ' + rows.length + ' 条退货数据');
}

def('F06','验收记录台账','验收与售后', ()=>{
  /* 验收台账（统计视图）：与 F01 共用 ACCEPTANCES 单一数据源，不再另造 42 张假单号。
     F01 看单据级结论与结算金额，本屏看数量口径（应发 → 实发 → 扣减 → 合格量）与聚合分析；
     同一张验收单在两屏的发货单 / 门店 / 结论必然一致。验收结论既已回写，台账状态一律「已确认」。 */
  const base = ACCEPTANCES.map(a=>({
    d: a.t.slice(5,10), sh: a.sh, store: a.store,
    due: String(a.due), got: String(a.got), rej: String(a.rej), ok: String(a.ok),
    rate: (a.ok/a.due*100).toFixed(1), st: '已确认', cls: 'done', ysNo: a.no
  }));
  const pg  = pgSlice('F06', base);
  const rec = pg.view.map(r=>`
    <tr>
      <td class="mono">10-${r.d.split('-')[1]}</td>
      <td class="name mono">${r.sh}</td>
      <td>${r.store}</td>

  const sumDue  = base.reduce((s,r)=>s+parseFloat(r.due),0);
  const sumRej  = base.reduce((s,r)=>s+parseFloat(r.rej),0);
  const sumOk   = base.reduce((s,r)=>s+parseFloat(r.ok),0);
  const avgRate = (sumOk/sumDue*100).toFixed(1);
  const rejAmt  = (sumRej*4.77).toFixed(2);
  const waitN   = base.filter(r=>r.st==='待确认').length;

  return pagehd('验收记录台账',

  `

    ${kpi('平均合格率', avgRate, '%', '合格量 ÷ 应发量')}
    ${kpi('累计扣减量', String(Math.round(sumRej)), '件', '占总发货量 '+(sumRej/sumDue*100).toFixed(1)+'%')}
    ${kpi('扣减金额', rejAmt, '元', '已计入 10 月结算')}
  </div>

  <div class="card pad0">

    </div>
    <div class="tbl-wrap"><table class="tbl">

/* G02 明细基础量（按货品汇总）：recv=实收量、rej=拒收量、p=下单单价。
   合格量（不含退货）= max(0, 实收量 − 拒收量 − 已通过退货量)，即最终用于结算的商品计算量；
   金额 = 合格量 × 单价；扣减 = (实收量 − 合格量) × 单价（拒收 + 退货一并扣减）。
   「已通过退货量」来自 RETURNS 中状态「已同意」的退货申请，按当前对账单的门店 + 账期过滤后
   按货品名汇总 —— F04 / A06 处理退货后，G02 的合格量 / 金额 / 扣减即时联动，不另写死数。 */
const ST_LINES = [
  {n:'上海青',   due:720,  recv:704,  rej:0,  p:3.20},
  {n:'小白菜',   due:600,  recv:598,  rej:0,  p:3.00},
  {n:'菠菜',     due:432,  recv:288,  rej:0,  p:4.50},
  {n:'土豆',     due:1200, recv:1176, rej:29, p:2.40},
  {n:'白萝卜',   due:720,  recv:720,  rej:0,  p:1.80},
  {n:'猪五花肉', due:600,  recv:600,  rej:0,  p:16.80},
  {n:'活虾',     due:288,  recv:0,    rej:0,  p:58.00},
  {n:'鸡蛋',     due:96,   recv:96,   rej:0,  p:22.00},
  {n:'老豆腐',   due:144,  recv:144,  rej:12, p:8.50},
  {n:'干辣椒',   due:36,   recv:24,   rej:0,  p:15.00}
];
/* 退货数量字段形如「4 件」「1 箱」，取数值部分；只认「已同意」（审核通过）。 */
function stReturnQty(store, period){
  const ym = period.slice(0,7);   /* '2026-10' */
  const map = {};
  RETURNS.filter(r => r.st==='已同意' && r.store===store &&
                      ('2026-' + String(r.t).slice(0,5)).slice(0,7)===ym)
         .forEach(r=>{
           const q = parseFloat(String(r.q).replace(/[^\d.]/g,'')) || 0;
           map[r.n] = (map[r.n] || 0) + q;
         });
  return map;
}
function stCalcLines(st){
  const retMap = stReturnQty(st.store, st.period);
  return ST_LINES.map(l=>{
    /* 规格 / 单位按品名取订单行主数据 ROWS，与 D02 订单明细同源；缺主数据时留 — */
    const m = ROWS.find(r=>r.n===l.n);
    /* 退货量按该货品实际可扣数量收敛，不会扣出负数或超过实收量 */
    const ret = Math.min(retMap[l.n] || 0, Math.max(0, l.recv - l.rej));
    const ok  = Math.max(0, l.recv - l.rej - ret);
    return {...l, s:m?m.s:'—', u:m?m.u:'—', ret, ok,
            amt: Math.round(ok * l.p * 100)/100,
            adj: Math.round((l.recv - ok) * l.p * 100)/100};
  });
}
/* 「仅显示有扣减的行」只是视图过滤：合计、KPI 始终按全部货品统计，口径不变。 */
function stToggleAdj(cb){
  const box = document.getElementById('st-lines');
  if(!box) return;
  box.querySelectorAll('tr[data-adj="0"]').forEach(tr=>{ tr.style.display = cb.checked ? 'none' : ''; });

def('H04','操作日志','客户与权限', ()=>{
  const logs = [
    {t:'10-27 08:12', u:'李敏', r:'主账号', act:'登录', obj:'—', ip:'116.226.**.31', res:'成功', cls:'done'},
    {t:'10-27 07:40', u:'王强', r:'采购', act:'调整货品价格', obj:'猪五花肉 16.80 → 17.20 元/件（5kg/件）', ip:'116.226.**.44', res:'成功', cls:'done'},
    {t:'10-27 05:05', u:'张丽', r:'仓库', act:'系统自动生成发货单', obj:'SH-20261026-0041（PO-20261026-0081 · 18 行）', ip:'10.20.3.**', res:'成功', cls:'done'},
    {t:'10-27 05:04', u:'张丽', r:'仓库', act:'填写差异备注', obj:'菠菜 · 已预告（产地缺货）', ip:'10.20.3.**', res:'成功', cls:'done'},
    {t:'10-26 21:36', u:'张丽', r:'仓库', act:'确认发货（锁定）', obj:'SH-20261026-0044', ip:'10.20.3.**', res:'成功', cls:'done'},
    {t:'10-26 18:20', u:'陈昊', r:'财务', act:'导出对账单', obj:'ST-202609-03', ip:'116.226.**.88', res:'成功', cls:'done'},
    {t:'10-26 16:35', u:'刘洋', r:'仓库', act:'修改已确认发货单', obj:'SH-20261026-0038', ip:'—', res:'拒绝（已锁定）', cls:'err'},
    {t:'10-25 14:02', u:'赵霞', r:'采购', act:'登录', obj:'—', ip:'—', res:'拒绝（账号停用）', cls:'err'},
    {t:'10-25 09:40', u:'李敏', r:'主账号', act:'停用子账号', obj:'赵霞', ip:'116.226.**.31', res:'成功', cls:'done'}
  ];
  /* 补齐到 126 条（近 7 天），确定性生成 —— 日志量大但结构单一，够撑起真实翻页 */
  const RL = rnd(7271);
  const WHO = [['李敏','主账号','116.226.**.31'],['王强','采购','116.226.**.44'],['张丽','仓库','10.20.3.**'],
               ['陈昊','财务','116.226.**.88'],['刘洋','仓库','10.20.3.**'],['赵霞','采购','—']];
  const ACTS = ['登录','查看订单','填写发货单','确认发货','填写差异备注','导出对账单','调整货品价格','打印送货单',
                '提交报价单','查看验收结果','查看门店商品推送','批量调价','导出验收台账'];
  const dayList = ['10-27','10-26','10-25','10-24','10-23','10-22','10-21'];
  for(let i=0; logs.length<126; i++){
    const w  = WHO[Math.floor(RL()*WHO.length)];
    const dd = dayList[Math.min(6, Math.floor(RL()*7))];
    const hh = String(Math.floor(RL()*14)+8).padStart(2,'0');
    const mi = String(Math.floor(RL()*60)).padStart(2,'0');
    const bad = RL() < 0.06;
    logs.push({
      t: `${dd} ${hh}:${mi}`, u: w[0], r: w[1],
      act: ACTS[Math.floor(RL()*ACTS.length)],
      obj: bad ? '—' : (RL()<0.5 ? 'SH-2026'+String(1020+Math.floor(RL()*8))+'-'+String(Math.floor(RL()*60)).padStart(4,'0')
                                  : 'PO-2026'+String(1020+Math.floor(RL()*8))+'-'+String(Math.floor(RL()*90)).padStart(4,'0')),
      ip: w[2],
      res: bad ? (RL()<0.5?'拒绝（无权限）':'拒绝（账号停用）') : '成功',
      cls: bad ? 'err' : 'done'
    });
  }
  /* 日志按时间倒序 —— 生成时是按随机日/时散着插的，翻页前先排一次，否则第 1 页看着像乱序 */
  logs.sort((a,b)=> a.t < b.t ? 1 : (a.t > b.t ? -1 : 0));
  const pg = pgSlice('H04', logs);
  const okN  = logs.filter(l=>l.cls==='done').length;
  const errN = logs.length - okN;
  const rows = pg.view.map(l=>`
    <tr>
      <td class="mono" style="font-size:12px">${l.t}</td>
      <td><b>${l.u}</b></td>
      <td><span class="tag gray">${l.r}</span></td>
      <td>${l.act}</td>
      <td style="font-size:12.5px;color:var(--text-3)">${l.obj}</td>
      <td class="mono" style="font-size:12px;color:var(--text-4)">${l.ip}</td>
      <td>${tag(l.res, l.cls)}</td>
    </tr>`).join('');

  return pagehd('操作日志',
      `近 7 天 <b>${logs.length}</b> 条操作记录 · 含被拒绝的 <b>${errN}</b> 条 · 日志不可删除、不可编辑`,
      `<button class="btn btn-default" onclick="toast('已导出日志（Excel）')">${I.down}导出</button>
       <button class="btn btn-default" onclick="go('H03')">权限矩阵</button>`) +
  `

  <div class="card pad0">
    <div class="tb2">
      <select class="select" style="width:120px"><option>近 7 天</option><option>近 30 天</option><option>今天</option></select>
      <select class="select" style="width:120px"><option>全部人员</option><option>李敏</option><option>王强</option><option>张丽</option><option>陈昊</option></select>
      <select class="select" style="width:130px"><option>全部动作</option><option>登录</option><option>单据操作</option><option>价格修改</option><option>导出</option></select>
      <input class="input" style="width:170px" placeholder="单据号 / 对象">
      <button class="btn btn-primary sm" onclick="toast('已按条件查询')">查询</button>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th style="width:130px">时间</th><th style="width:80px">操作人</th><th style="width:96px">角色</th>
        <th style="width:150px">动作</th><th>对象</th><th style="width:130px">IP</th><th style="width:140px">结果</th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="7" class="c" style="padding:40px;color:var(--text-4)">暂无操作记录</td></tr>'}</tbody>
    </table></div>
    <div class="sum-bar">
      <span>共 <b>${pg.total}</b> 条 · 成功 <b>${okN}</b> · 被拒 <b>${errN}</b></span>
      <span style="color:var(--text-4)">日志不可删除、不可编辑，保留 12 个月</span>
      ${pgFoot('H04', pg)}

`;

def('I03','打印记录','打印与模板', ()=>{
  const logs9 = [
    {t:'10-27 05:02', doc:'分拣单', no:'PC-20261027-0412', u:'张丽', prt:'HP-M405', pg:2, st:'成功', cls:'done'},
    {t:'10-27 04:58', doc:'送货单', no:'SH-20261026-0044', u:'张丽', prt:'HP-M405', pg:1, st:'成功', cls:'done'},
    {t:'10-27 04:56', doc:'标签',   no:'SH-20261026-0044', u:'张丽', prt:'HP-M405', pg:18, st:'成功', cls:'done'},
    {t:'10-26 21:40', doc:'送货单', no:'SH-20261026-0044', u:'张丽', prt:'HP-M405', pg:1, st:'成功', cls:'done'},
    {t:'10-26 21:38', doc:'送货单', no:'SH-20261026-0039', u:'陈昊', prt:'HP-M405', pg:1, st:'卡纸', cls:'err'},
    {t:'10-26 21:39', doc:'送货单', no:'SH-20261026-0039', u:'陈昊', prt:'HP-M405', pg:1, st:'成功（重打）', cls:'done'},
    {t:'10-26 10:12', doc:'对账单', no:'ST-202609-03', u:'陈昊', prt:'EPSON L3153', pg:6, st:'成功', cls:'done'},
    {t:'10-25 16:30', doc:'结算单', no:'JS-202609-05', u:'陈昊', prt:'EPSON L3153', pg:2, st:'成功', cls:'done'}
  ];
  /* 补齐到 1284 条（本月），确定性生成 —— 10 条/页即 129 页，页码压缩规则才有实战 */
  const RP = rnd(12840);
  const DOCS = ['送货单','分拣单','标签','对账单','结算单'];
  const PPL  = ['张丽','陈昊','王强','李敏'];
  const PRT  = ['HP-M405','EPSON L3153','HP-M405','HP-M405'];
  let dSeq = 27;
  for(let i=0; logs9.length<1284; i++){
    const bad = RP() < 0.012;
    const doc = DOCS[Math.floor(RP()*DOCS.length)];
    const dd  = String(Math.max(1, dSeq - Math.floor(i/50))).padStart(2,'0');
    logs9.push({
      t: `10-${dd} ${String(Math.floor(RP()*24)).padStart(2,'0')}:${String(Math.floor(RP()*60)).padStart(2,'0')}`,
      doc,
      no: (doc==='对账单'?'ST-':doc==='结算单'?'JS-':'SH-')+'202610'+dd+'-'+String(Math.floor(RP()*900)+100).padStart(4,'0'),
      u: PPL[Math.floor(RP()*PPL.length)],
      prt: PRT[Math.floor(RP()*PRT.length)],
      pg: doc==='标签' ? Math.floor(RP()*24)+4 : Math.floor(RP()*6)+1,
      st: bad ? '卡纸' : '成功', cls: bad ? 'err' : 'done'
    });
  }
  /* 生成时日期是倒着铺、时刻是随机的，打印台账必须按时间倒序 —— 排一次再分页，
     否则第 1 页会看到「05:02 / 23:41 / 11:07」跳着走 */
  logs9.sort((a,b)=> a.t < b.t ? 1 : (a.t > b.t ? -1 : 0));
  const pg = pgSlice('I03', logs9);
  const failN = logs9.filter(r=>r.cls==='err').length;
  const pageSum = logs9.reduce((s,r)=>s+r.pg,0);
  const recs = pg.view.map(r=>`
    <tr>
      <td class="mono" style="font-size:12px">${r.t}</td>
      <td><span class="tag gray">${r.doc}</span></td>
      <td class="mono" style="color:var(--text-3)">${r.no}</td>
      <td>${r.u}</td>
      <td class="mono" style="font-size:12px">${r.prt}</td>
      <td class="mono r">${r.pg}</td>
      <td>${tag(r.st, r.cls)}</td>
      <td class="r"><span class="link" onclick="toast('已重新发送打印任务')">重打</span></td>
    </tr>`).join('');

  return pagehd('打印记录',
      `本月 <b>${pg.total.toLocaleString('zh-CN')}</b> 张 · 失败 <b>${failN}</b> 张 · 记录保留 90 天`,
      `<button class="btn btn-default" onclick="toast('已导出打印台账')">${I.down}导出</button>
       <button class="btn btn-default" onclick="go('E10')">批量打印</button>`) +
  `

  <div class="stats" style="grid-template-columns:repeat(4,1fr)">
    ${kpi('本月打印', pg.total.toLocaleString('zh-CN'), '张', '送货单 / 分拣单 / 标签 / 对账单')}
    ${kpi('成功率', (100-failN/pg.total*100).toFixed(1), '%', '失败 '+failN+' 张均为卡纸 / 缺纸')}
    ${kpi('页数合计', pageSum.toLocaleString('zh-CN'), '页', '标签按张计，单据按页计')}
    ${kpi('纸张消耗', pageSum.toLocaleString('zh-CN'), '张', '三联纸 ≈ '+Math.ceil(pageSum/300)+' 包')}
  </div>

  <div class="card pad0">
    <div class="tb2">
      <select class="select" style="width:120px"><option>近 7 天</option><option>今天</option><option>本月</option></select>
      <select class="select" style="width:120px"><option>全部类型</option><option>送货单</option><option>分拣单</option><option>标签</option><option>对账单</option></select>
      <input class="input" style="width:190px" placeholder="单据号">
      <button class="btn btn-primary sm" onclick="toast('已按条件查询')">查询</button>
      <span class="hint r">同一单据打印 2 次以上会标为「重打」</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th style="width:130px">打印时间</th><th style="width:96px">类型</th><th>单据号</th>
        <th style="width:80px">操作人</th><th style="width:150px">打印机</th>
        <th class="r" style="width:70px">页数</th><th style="width:130px">结果</th><th class="r" style="width:70px">操作</th>
      </tr></thead>
      <tbody>${recs}</tbody>
    </table></div>
    <div class="sum-bar">
      <span>共 <b>${pg.total.toLocaleString('zh-CN')}</b> 张 · 失败 <b>${failN}</b> 张</span>
      <span>累计 <b>${pageSum.toLocaleString('zh-CN')}</b> 页</span>
      <span style="color:var(--text-4)">同一单据打印 2 次以上会标为「重打」</span>
      ${pgFoot('I03', pg)}
    </div>
  </div>
`;
});

A03:[
  ["待办排序","待办默认按<b>截止时间升序</b>排列，不按下单时间。"],
  ["不可供处理","无法供应的行在报价单选「不可供」，<b>不影响其他行</b>，不计入差异率。"],
  ["整单处理","不提供整单放弃；逐行选「不可供」，其余行照常报价，未选不可供的行视为可供并进入比价。"],

A05:[
  ["补填必要性","无原因的差异不能计入「已提前告知」或「浮差」，整行计入<b>未告知差异</b>，进入履约档案与对账争议池。"],
  ["补填影响范围","补填仅写入<b>原因与说明</b>，不改发货单数量、金额、时间；单据留「补填于 X 时」痕迹。"],

A05b:[
  ["预告结果分类","预告结果分三类：实际缺货、少供但够用、预告后未缺。第三类<b>不算违约</b>，仅计入预警准确度。"],
  ["回音展示","展示食堂已读时间、替补处理等回音状态，不只显示「已提交」。"],
  ["预告与实发关系","预告为<b>意愿</b>，实发为<b>事实</b>。自动建单时实发量按<b>下单量（足量）</b>预填，「预估备货量」列参考缺货预告；实发量按实际到货核对落数。"],
],
A06:[
  ["退货结算口径","同意退货后该批商品不计入验收合格量，结算时自然扣减对应金额，<b>无独立退款动作</b>。拒绝退货需在单据填写理由，食堂侧可见原文。"],

A09:[
  ["统计结果应用","命中率高：继续供应并提前预告；命中率低且差异多：下期标「不可供」；浮差率高：阈值设置合理，无需调整。"],
],
B02:[
  ["比价公共字段","商品名称、规格、形态等 8 项为<b>比价公共字段</b>，供应商不可自行修改，以保证报价可比。"],
  ["商品形态字段","<b>商品形态</b>由门店在 SKU 上定义，供应端不提供编辑。毛菜、净菜按实收点收，成品按成品率；扣重维度已取消。<br>门店标注有误时先<b>临时停售</b>且不设价，截图反馈运营修改 SKU，不可自行修改。"],
  ["必填字段","<b>货品价格</b>为唯一必填项，流入报价 → 订单 → 对账；缺失则该 SKU 无法报价与开直采单。包装单位、产地、保质期、别名、第三方编码、内部备注均<b>选填</b>。<br><b>价格 &gt; 0 即视为「已设价」</b>，其余字段后补不影响在途询价与订单。"],
  ["字段排序","<b>基础信息</b>按「商品名称 → 商品编码 → SKU 编码 → 商品形态 → 商品分类 → 品牌 → 下发门店 → 销售规格 → 单位」排列。<br><b>扩展信息</b>按「货品价格 → 货品别名 → 货品第三方编码 → 包装单位 → 产地 → 保质期 → 内部备注」排列，必填与高频字段在前。"],
  ["字段变更","原「毛净属性」替换为门店下发的「商品形态」，供应端不再维护扣重相关字段。"],
  ["变更影响","① 已提交报价不自动更新；<br>② 下次报价时包装单位与产地（若已填）<b>冻结进报价版本</b>，历史单据按原版本还原；<br>③ 货品价格改动记入价格历史，影响<b>之后</b>的报价默认价与直采价，不回溯已生成订单；<br>④ 包装单位变更进操作日志，下次报价页提示复核价格。"],
  ["保存校验","<b>仅货品价格触发拦截</b>：非数字、≤ 0、超 2 位小数、单价 &gt; 9999、较历史均价偏离 ±50% 以上任一命中，字段下红字提示且<b>整体保存不生效</b>。包装单位 / 产地不拦截；大幅调价走「批量调货品价格」，含逐条预览与留痕。"],
  ["货品别名使用范围","货品别名仅用于拣货单、库位标签、仓库检索等内部作业；<b>送货单、验收单、对账单、发票一律打印门店商品名</b>"],
],

B03:[
  ["三屏合一状态线","门店商品目录 / 供货确认 / 失效商品合并为一屏，状态线：<b>待设价 → 已设价 → 临时停售 / 已失效</b>。"],
  ["数据同步方式","门店侧新增 SKU、改规格、改价、下架、删除均<b>通过接口主动推送</b>；无定时任务、无手动刷新。供应端复用门店 SKU 主数据，仅维护价格与扩展信息；同步状态展示连接情况与推送条数。"],
  ["待办口径","本屏为唯一待办落点：<b>待设价</b>标橙，侧栏数字、页头标签、页头计数同口径（仅计可供货 SKU；门店下架 / 删除、临时停售不计）。<br>Tab 数字仅为筛选结果数，不着色。待设价行保持原 SKU 位置，不置顶。"],
  ["取消确认供货","推送 SKU 直接为「待设价」，填价后为「已设价」，立即进入询价、直采、发货；无「确认供货」步骤。"],
  ["待设价与已设价","<b>待设价</b>标橙，不进入询价与分拣；<b>已设价</b>条件为<b>货品价格已填且 &gt; 0</b>，包装单位、产地选填。颜色对应能否进入业务流程。"],
  ["临时停售","停售期间不进新询价、不排分拣；<b>已提交报价与在途订单照常履约</b>，可随时恢复在售，记录保留。"],
  ["已失效","门店<b>下架</b> SKU 时，供应端货品联动为「已失效」，只读留痕；门店重新上架后由<b>下一条推送</b>自动恢复至下架前状态，无「确认恢复」操作。"],
  ["删除与下架","门店<b>删除</b>的 SKU 在供应端做<b>逻辑删除</b>：打标记、退出清单（含「全部」Tab）、不计待办与 KPI 分母；数据保留，历史订单、送货单、验收单、对账单、发票仍可追溯。下架为暂时状态，恢复后仍需展示。"],
  ["失效与在途订单","门店下架不影响已中标待发货订单，<b>订单 = 承诺</b>，仍需完成分拣与发货。「已失效」Tab 展示「仍有 N 行未完成订单」。"],
  ["多 SKU 独立设价","同一商品不同 SKU 因单价、起订量、包装成本不同，需分别设价，不可合并。"],
  ["规格不符处理","门店规格与实际供货不符时，先<b>临时停售</b>，截图反馈运营修改 SKU；禁止按错误规格设价。"],
  ["列表排序","按 SKU 编码正序排列：同一商品多规格相邻；不做待办优先，避免行位置随状态变化。其他维度用筛选区（门店 / 形态 / 分类）。"],
],

B03i:[
  ["导入范围","批量导入仅省去重复录入，不降低门槛：<b>货品价格必填且 &gt; 0</b>；仅接受<b>待设价 / 已设价 / 临时停售</b>三种状态。已失效（门店下架）、门店已删除的行被挡回，并在下方逐行列出原因。"],
  ["空单元格语义","导入中<b>空 = 不修改</b>，不清空原值。清空需到「货品编辑」单条操作；批量导入只增加信息，不做破坏性写入。"],
  ["只读对照列","模板第 2 列「<b>商品信息（只读）</b>」展示品名 · 规格 · 门店，供核对。该列为门店主数据，供应端无修改权；即使填写也整列跳过，<b>不报错、不生效</b>，预览提示「有 N 行与系统不一致，已忽略」。整列删除不影响导入。"],
  ["导入流程","三步：提供数据 → 校验预览 → 写入结果。预览逐行展示「灰字现值 → 黑体新值」；<b>默认全选、可逐行取消</b>；无字段变化的行不进入「可写入」。模板已预填现价与现有信息，已设价行无需重填。"],
  ["写入路径一致性","导入与「货品编辑」单条保存调用同一写入函数：改价<b>必留痕</b>（价格历史 +1），未提交报价单该行初始价同步更新，<b>已设价仍由「价格 &gt; 0」派生</b>。"],
],

B06:[
  ["均价定义","「均价」为全站统一口径，用于趋势均价线、每行「对均价偏离」及「货品编辑」±50% 预警。时间范围<b>一处配置、全站生效</b>。"],
  ["计算方式","均价按<b>简单平均</b>计算：口径内记录求和除以条数，无加权、无移动平均。数值变化由口径内改价记录决定。"],
  ["空口径处理","口径内无记录时均价与偏离均显示「—」，<b>不回退全部历史</b>；同时提示该货最后一次改价日期。"],
  ["图表标识","口径内为绿色实线 + 面积，口径外为浅灰虚线 + 空心点，竖虚线标起点，起点起绘制均价参考线；明细表增「是否计入均价」列。"],
],

C01:[
  ["中标即生成订单","报价中标后系统生成询价中标订单，状态「已确认」（门店端与供应端同名），无需再确认，不可拒绝或取消。供不上走<b>缺货预告 + 发货差异备注</b>。"],
  ["采购主体粒度","采购主体最小粒度为<b>档口</b>，非门店。同一门店不同档口为不同询价单、报价与中标结果，档口间报价可不同。<br>原「品类范围」列为明细派生信息，已删除；档口<b>不做筛选下拉</b>，按门店筛选即可。"],
  ["报价行数与采购行数","<b>报价行数</b>为已报行数，<b>采购行数</b>为门店需求行数，并列展示。未报行不计入报价行数；仅勾「不可供」的行视为本轮不供，单独列示。"],
],

C02:[
  ["报价前校验","① 平台按 SKU <b>独立比价</b>，可能部分行中标，中标行须全量履约；② 供不上走缺货预告 + 差异备注，差异计入考核。"],
  ["报价列口径","本列显示<b>当前账号已设价</b>（货品价格，可逐行改），与参考价区分；「参考价」在报价单中并列展示。"],
  ["横杠含义",'未填价行显示 <span class="mono">—</span>，表示<b>尚未报价</b>，非 0 元。不供的行在报价单选「不可供」，不计入合计，可随时改回。'],
],

C03:[
  ["报价提交约束","每个商品<b>独立选标</b>，可能部分行中标；中标行须全量履约。提交后不可撤回、不可改价；供不上走缺货预告 + 差异备注，计入差异率。"],
  ["供货货品列","本列显示<b>已设价</b>的供货货品，跟随门店 SKU，不可在此更换。待设价 SKU 不进入询价单。"],
  ["不可供填报","某行供不上时选「不可供」，价格框冻结、不计入合计；不可供不影响评分，报低价少发计入差异率。"],
  ["价格参考","参考价为平台上期成交均价，仅供参照、不构成上限。明显偏离标记「异常价」并提示，不强制拦截。"],
  ["分档口定价","报价按<b>门店 · 档口</b>生效，同店不同档口的规格、包装成本、送货频次不同，允许不同报价。复用历史价应按<b>同 SKU</b> 参考，不按门店套用。"],
],

C06:[
  ["快照只读","本页为提交时刻的只读快照，记录提交时间、单价、不报价标记，任何角色不可修改。报价有误只能在比价完成前联系运营撤回，并留痕。"],
  ["行数口径",'<b>报价行数 / 采购行数</b>并列：前者为已报行数，后者为门店需求行数，不随报价变化。快照锁定当时数值，后续门店改明细不回溯。'],
  ["档口归属","页头「门店 · 档口」标识本单归属，同店其他档口单据不共享报价；档口不单独做筛选。"],
  ["中标生成","系统按中标结果生成订单并写入「中标即确认」流转记录，无需确认、不可拒绝。同一时刻自动生成唯一待发货单；供不上走缺货预告或差异备注。"],
  ["打印模板","「打印」打开 A4 纵向报价单模板（K08），按提交快照出具：单价锁定、不取当前货品价格；比价结果未公示时纸件同样不显示。"],
],

C07:[
  ["中标生成与预告","询价中标订单中标即生成，流转记录记「中标即确认」，不可拒绝或取消；同时自动创建待发货单。未发货前可在订单详情做缺货预告（不设截止、不标迟预告），发货时按实发量填写并写明差异原因。"],
],

D02:[
  ["下单量计数","门店按<b>件 / 包 / 袋 / 箱 / 桶</b>等包装单位下单，数量为正整数；规格中的「5kg/件」为包装规格，非计价单位。单价可到分，订单金额 = Σ（整数下单量 × 单价）。仅按重量计价（kg / 斤）允许 1 位小数。列表、详情、发货单、送货单取同一份明细。"],
  ["订单上下文","本页按列表传入的<b>订单号</b>渲染订单号、类型、来源渠道、确认方式、门店 / 档口、行数、金额、明细、缺货预告、步骤条与流转记录，无写死样例单。<br>明细表在发货状态前增「<b>下单备注</b>」列，展示门店下单原文，供应端只读，未填显示「-」，不写进发货单快照。"],
  ["已读回执","打开详情即视为已读：原本无回执的订单（待确认 / 已拒绝 / 已关闭）登记<b>首次查看时刻与查看人</b>；已有回执保留原记录，重复打开不覆盖。回执不改订单状态。"],
  ["文案收敛","确认方式与流转记录仅保留主文案：确认方式显示「待供应商确认 / 中标即确认 / 人工确认」，流转节点仅留动作名与时间；判断依据见页头状态标签与明细。缺货预告板块本期前端不做，仅保留标题标注。"],
  ["流转时间口径","各节点取<b>真实状态变更时间</b>，末条为当前状态：待确认=创建、已拒绝=拒绝接单、已关闭=撤回、已确认=确认时刻、已发货=确认发货、验收中=首次提交验收数据、已完成=验收完成。不设「现在」占位节点，节点名与 K07 状态字典一致。"],
  ["验收中环节","门店<b>首次提交验收数据</b>即进入「验收中」，记录「食堂验收 · 进入验收中」；结论回写供应端后记录「食堂验收完成 · 进入已完成」。已完成订单须依次有<b>确认发货 → 进入验收中 → 进入已完成</b>三段，不新增常驻状态枚举。"],
  ["可用操作","<b>待确认</b>：确认接单 / 拒绝接单；<b>已确认</b>：缺货预告与查看发货单（已自动建单）；<b>已发货及之后</b>：只读查看发货单；<b>已拒绝 / 已关闭</b>：终态只读。列表不承担状态变更。"],
  ["发货单查看入口","发货单在<b>订单确认 / 中标生成</b>时由系统自动创建，一单一单。本页仅可查看；「已确认」可维护实发量，之后只读。发货动作集中在 E01，D02 不执行发货。"],
  ["发货次数","一单仅确认发货一次，不分批、不拆单、不追加。补发另开<b>补发订单</b>并生成独立发货单与送货单；历史订单不重开修改。"],
  ["中标订单约束","中标即履约，流转记录记「中标即确认」，不可确认、拒绝或取消。供不上走缺货预告与差异备注。仅门店直采单在待确认时可确认或拒绝，不可改量或议价。"],
  ["配送日期与送达时间","门店下单仅填<b>配送日期</b>，D01 / D02 与订单导出统一使用该字段名。<b>送达时间</b>为发货单上 E02 选填的实际到店时刻（时分），E01 列表拼成「配送时间」（如 2026-10-26 7:00），E04 与 K05 同步显示，未填仅显示日期。<b>发货日期由配送日期自动带入发货单，不可修改</b>，非门店配送时段或线路排线。"],
  ["一期不设截止字段","不设「发货截止」「预告截止」字段与倒计时。订单过配送日期未发货自动置「已关闭」，不进备货、发货与对账。缺货预告在<b>未发货前</b>均可上报，不设 16:00 截止、不标「迟预告」；确认发货后入口关闭。"],
  ["打印模板","「打印」打开 A4 纵向采购订单模板（K09），按当前订单号与明细出具：数量 / 金额口径与详情一致；不替代送货单。"],
],

D03:[
  ["表用途与聚合口径","非单据，按备货日（或区间）+ 商品合并需求量一次备货；<b>已预告缺口自动扣减</b>。仅「按商品汇总」一个视角，不另起门店统计表。门店列<b>仅示门店名、不带订单号</b>，值为该店在时间范围内所有订单的采购合计。"],
  ["备货日范围","起止两个日期控件，默认两端均为<b>明天（演示口径 2026-10-27）</b>。起始晚于结束被拦截。"],
  ["规格数据源","「商品」列展示<b>品名 + 规格</b>两行。规格按品名从订单行主数据 <code>ROWS</code> 取，兜底 <code>CATALOG</code>，与 D02 / E02 / E04 / K05 同源。"],
  ["冻结列与滚动","<b>商品 / 单位 / 下单合计 / 已预告缺口 / 建议备货</b> 五列冻结于左侧，表头冻结；门店列在右侧滚动区。滚动容器宽高自适应，纵向 / 横向按内容溢出滚动；滚动条 12px、深色滑块浅色轨道，冻结列右缘带分隔阴影。冻结不改变数量口径。"],
  ["缺口逐格展示","预告按<b>订单（门店）逐行提交</b>，缺口归属具体门店 × 商品。每店格子小字：<b>有预告显示「预告 −N」、无预告「缺口 0」、未订「未订」</b>；悬停橙色缺口查看原因与食堂回音。<b>已预告缺口列 = 三店缺口之和</b>，建议备货 = 下单合计 − 该合计。"],
  ["一期范围","不实现线路、配送时段、装车顺序与按门店分装。门店列仅标注缺口归属，非分装作业单，不按门店单独统计。"],
  ["建议备货量","下单合计 − 该商品各门店预告缺口之和。"],
  ["导出记录","底层的用户操作日志需要记录操作人与时间，可追溯。导出为<b>只读</b>操作，不改单据状态。"],
],

D05:[
  ["订单上下文","从 D02 点「缺货预告」带入<b>订单号</b>，品名 / 规格 / 单位 / 下单量逐行取自该订单 <code>ordLines()</code>，与 D02 / E02 / E04 / K05 同源；页头、台账、已选行数与缺口合计按该单现算。支持 <code>#D05&order=PO-…</code> 深链。提交后预告写回订单行，D02 预告卡与预估备货量同步更新。"],
  ["预告效力","预告仅用于提前告知与找替补，<b>不改订单数量、金额与结算口径</b>。<b>未发货前均可上报</b>，不设截止、不标「迟预告」；确认发货后入口关闭。"],
  ["提交后动作","① 食堂收到站内消息 + 短信；② 食堂可标记「已找替补 / 接受减量 / 无影响」；③ <b>订单数量、金额不变</b>；④ 预告仅更新「预估备货量」参考列（下单量 − 缺口），<b>不自动改实发量</b>，实发量在发货时按实际出库核对。"],
  ["按钮文案","主按钮固定为「提交预告」，不使用「申请调整订单」等表述，避免产生审批语义。"],
],

E01:[
  ["系统建单，无新建入口","门店直采在<b>确认接单</b>、询价中标在<b>中标生成</b>时，系统自动生成唯一「待发货」发货单，一单一发。关联为系统不变量。本页仅提供<b>填写 / 核对 / 确认发货</b>，无「创建发货单」按钮；A04 批量创建已撤。"],
  ["发货主链","待发货（系统建单）→ 按下单量（足量）预填 → 按实际出库核对并保存（<b>确认发货前可反复修改</b>）→ <b>确认发货</b>（锁定 + 生成送货单 + 订单转「已发货」）→ 只读详情。一期无「草稿」态与「提交」中间动作，全程一张发货单详情页。"],
  ["预填与核对","商品行取关联订单，实发量按<b>下单量（足量）</b>预填，非 0 / 空白；「本行不发」由供应商按实际勾选。预填为估算值：列表标「待核对」、金额标「预估」，<b>核对保存前不给确认发货</b>。"],
  ["可编辑范围","「待发货」为唯一可编辑态：实发量、本行不发、逐行备注、发货人 / 电话、送达时间、整单备注均可改；<b>发货日期由采购订单带入、全程只读</b>。「保存」仅留痕不改状态，仅「确认发货」锁定。列表对已核对保存的单提供「填写 / 确认发货」直达操作。"],
  ["配送时间口径","本列由发货单<b>配送日期</b>（订单带入、不可改）与 E02 选填的<b>送达时间（时分）</b>拼接，如 <b>2026-10-26 7:00</b>；未填仅显示日期。<b>筛选按配送日期</b>，时刻仅展示、非检索维度；订单侧 D01 / D02 保持「配送日期」。"],
  ["关闭口径","订单过配送日期未发货，或门店直采已确认后申请撤回且供应商同意，相关发货单都同步置「已关闭」并保留在列表中可追溯；撤回退回待确认后门店再次确认，系统会生成全新一张发货单，旧关闭单不参与当前有效单匹配。<b>一单只发一次</b>：短装按实发结算，补发另开订单，不在原单加批次、拆分或二次确认发货。"],
  ["确认发货动作","① 冻结全部实发量与备注；② 关联订单由「已确认」推进为<b>「已发货」</b>，门店端转「待验收」；③ 按冻结内容<b>生成送货单</b>（随货同行联），可在详情查看与打印。"],
  ["二期范围","分拣、批次、装车与批量打印为演示工具页，<b>不进一期主链</b>：分拣实拣量不回写发货单，批次与装车时间不由确认发货生成。一期闭环为「录入 → 确认发货 → 送货单」。"],
],

E02:[
  ["食安报告自动关联","核对明细表最右列为「食安报告」。系统按商品 <b>pid</b> 反查历史关联报告，筛出<b>有效期覆盖本单发货日期</b>者，取<b>上传时间最新一份</b>写入引用（标签「自动」、操作人「系统自动」），<b>无需确认</b>。每行最多一份；「本行不发 / 实发 0」不挂；已有引用不追加、不替换。弹层上半区只读展示自动关联结果，下半区可搜索有效期内报告或新增上传（上传时填有效期）。<b>不单列报告板块</b>；关联 / 解绑后仅刷新该列与汇总栏，不冲掉未保存输入。报告未齐不提示、不阻塞保存与确认发货。"],
  ["数量步长约束","包装单位 <b>step=1</b>，输入 3.5 自动取整为 4 并提示；仅计重单位允许 1 位小数。<b>未勾「本行不发」且实发量未填 / 为 0 / 带小数</b>不允许保存，问题行标红框、整行浅红底。预填下单量（足量）同样为整数。"],
  ["预填与核对","发货单在订单确认 / 中标生成时创建，<b>商品行取关联订单，不共用其他单演示数据</b>；实发量按<b>下单量（足量）</b>预填，「预估备货量」列显示缺口，「本行不发」按实际勾选。已保存单原样带回，填写与二次修改为同一处。<b>本期不设阈值、不算偏差、不做浮差判定</b>。"],
  ["本行不发与备注","整行不供勾选「本行不发」，实发量输入框锁定；逐行备注选填。<b>未勾「本行不发」且实发量未填 / 为 0 / 带小数</b>不允许提交：输入框红框、整行浅红底，补齐或勾选后放行。实发合计随填写实时变化，确认发货后随单锁定。"],
  ["保存行级校验","点「保存 / 保存并返回 / 保存并查看发货单」逐行检查：<b>未勾「本行不发」且实发量未填 / 为 0 / 非整件数</b>则不允许提交，顶部列出问题行号，输入框红框并提示「请填 >0 的整件数」。补齐后红框消失，保存成功才写保存时间，状态仍「待发货」；离开本页静默暂存不写保存时间、不算已核对。"],
  ["发货人信息","发货人默认<b>当前登录账号姓名</b>，联系电话默认<b>该账号绑定手机号</b>；不设「联系人」下拉、不预填门店收货联系人。两字段可改，<b>以确认发货时填写为准</b>。<b>联系电话必填</b>，清空不允许保存；在 E02 / E04 <b>显示完整号码、不做脱敏</b>。"],
  ["发货日期只读","系统按关联订单<b>配送日期</b>建单时带入<b>发货日期</b>，供应端<b>不可修改</b>：E02 只读展示，保存不采集、不写回，且兜底校正回订单配送日期。该日期是<b>食安报告有效期自动关联的判定基准</b>；变更配送日期只能由门店在订单侧发起。"],
  ["送达时间","发货日期后为<b>送达时间</b>，时间选择器填至<b>时:分</b>，可留空。表示<b>当天实际到店时刻</b>，仅挂发货单，不写订单、不参与金额、不作为筛选维度；保存后 E01「配送时间」、E04 与 K05 同步显示，确认发货后锁定。留空时仅显示配送日期。此处只补时刻、不改日期。"],
  ["无新增商品行","订单为承诺，发货仅在承诺范围内落数；多出的货无预算、无验收标准、无法结算，<b>本屏不留空白行</b>。"],
  ["保存与确认发货区分","「保存」做行级校验后写回系统生成的「待发货」单并记保存时间，<b>不改状态、不锁定、不推进订单、不生成送货单</b>；离开本页静默暂存不写时间，「下一步：查看发货单」先走完整保存校验。真正发货在<b>发货单详情或列表点「确认发货」</b>，此刻才锁定并生成送货单。"],
],

E04:[
  ["食安报告状态","与 E02 同一明细表、同一最右列，标签颜色：<b>蓝色 = 有效期自动关联</b>、<b>橙色 = 已发货后补传</b>、绿色 = 发货前人工关联。<b>待发货态本页报告只读</b>：系统已按 <b>pid</b> 与发货日期有效期自动关联，不提供关联 / 上传入口，补充统一在 <b>E02 发货明细行内</b>完成；流转记录增「系统自动关联食安报告 · N 份」。确认发货后才在 E04 行内出现「＋ 补传报告」，可搜索或新增上传。已发货<b>只追加、不替换</b>，已关联项只读、不显示解绑；补传走独立写入口，不改数量 / 金额 / 时间 / 状态 / 送货单，仅流转记录增「补传食安报告 · N 份」。<b>订单 / 发货单已关闭时整列只读，不提供补传入口</b>，写入层同步拦截。不单列右栏报告卡片。"],
  ["数据来源","发货单号、关联订单、门店、配送时间（配送日期 + 选填送达时间）、发货人 / 电话、<b>建单方式（系统自动生成）</b>、创建与确认发货时间、逐行实发量与备注，均取自发货物单，非写死样例。<b>发货前显示当前可改内容，确认后显示锁定快照</b>；联系电话在本页与 E02 <b>显示完整号码、不做脱敏</b>；流转记录首条为「系统自动生成发货单」并带出最近保存时间。从 E01 或 D02 进入显示各自单据。"],
  ["核对前不给确认发货","明细显示关联订单商品行与预填下单量；<b>未核对保存前本页仅提供「修改发货信息」</b>，不提供「确认发货」、不生成送货单。按实际出库核对保存后才出现确认发货按钮。"],
  ["确认后只读","数量、备注、时间在确认发货时锁定，之后只读；本屏不提供线上更正 / 重开入口，更正走线下运营。逐行备注原文打印在送货单上。"],
  ["送货单生成","未发货单无送货单，打印按钮提示「未生成」。确认发货时按冻结的实发量与备注生成随货同行联，单号沿用发货单号，本页与 K05 打印预览均可打开。"],
  ["一期不展示配送字段","配送方式、车牌司机、出库温度、装车批次、线路时段均不在本屏，属二期配送环节。仅保留「谁、何时、发了什么、发多少」及发货单选填的<b>送达时间</b>（与配送日期拼成「配送时间」）。"],
  ["核对入口统一","E02「保存并查看发货单」、E01 列表「查看」、D02「查看发货单」<b>均进入本屏</b>：逐行核对实发量、本行不发、备注、发货人 / 电话后直接确认发货。一期不单列「确认发货单」页；从 D02 进入仅查看与维护，不提供确认发货。"],
  ["按钮语义","<b>修改发货信息</b>：回 E02 同一张单继续改（保留进入来源），状态仍「待发货」；<b>确认发货</b>：冻结数据、生成送货单、订单推进「已发货」，之后只读。此时发货单<b>未关联验收单</b>：验收由门店完成、结论回写后生成验收单并推进订单 / 发货单至「已完成」，故「已发货」阶段显示「等待门店验收」，不提供「看验收结果」。E02 输入框此时全部锁定，同单不重复生成送货单。"],
  ["发货与验收分离","确认发货仅做三件事：冻结实发量、生成送货单、订单推进「已发货」，<b>不创建或关联验收单</b>。「已发货 · 待门店验收」为正常中间态；门店验收结论回写后才新增验收单并推进至「已完成」，本页才出现「看验收结果」。判断依据为<b>发货单是否有关联验收单（ysOf）</b>，不是「是否确认过发货（shipLocked）」——后者在刚发货时即为真。"],
  ["返回逻辑","从 E01 列表进入显示<b>「返回列表」</b>，回发货管理清单；从 D02 进入显示<b>「返回详情」</b>，回<b>发货单详情（E04）</b>。E02 的「保存并返回」与右上角「返回详情」均回同一张发货单详情，不回采购订单详情。按钮仅做返回、不改数据，各状态常驻。"],
  ["流转时间口径","各状态取真实变更时间：<b>待发货</b>=建单时间（createdAt）、<b>已发货</b>=确认发货时间（dispatchedAt）、<b>已完成</b>=验收完成（acceptedAt）、<b>已关闭</b>=关闭时间（closedAt）。<b>验收中仅属采购订单</b>，门店首次提交验收数据（acceptingAt）在发货单流转里只记动作、不改发货单状态（仍为已发货）。末条即当前状态且带真实时间，与页头标签、KPI 一致。"],
  ["发货单状态口径","发货单只有<b>待发货 / 已发货 / 已完成 / 已关闭</b>，不存在「发货单验收中」。门店首次提交验收数据时订单进入验收中、发货单保持已发货；结论回写后两张单同步进入已完成。已完成发货单流转依次为<b>确认发货 → 生成送货单 → 门店提交首次验收数据 → 进入已完成</b>，依据发货单自身状态与时间字段，不依赖验收单对象是否存在；无验收明细的历史单也展示完整流转。"],
],

E05:[
  ["批次定义","批次记录<b>谁在何时将哪几行装上哪辆车</b>。发货单为<b>承诺的落数</b>，批次为<b>物理事实</b>；同批可分两车（如水产晚 1 小时），验收按批次定位问题。<b>分车不等于二次发货</b>，仍只有一次确认发货。"],
  ["补发约束","短装不补发，按实发结算；确需补发另走<b>补发订单</b>并生成独立发货单与送货单，<b>不在原单追加第二批、不二次确认、不拆单</b>。批次视图的多批仅表示装车分车，非补发。"],
  ["整单未发","整单未发仍按实发量 0 确认发货并生成 <b>0 元发货单 + 送货单</b>，否则订单永久停在「已确认」，对账挂不上。"],
  ["装车时间","装车时间与出库温度为自证记录；<b>晚于时段 15 分钟以上计不及时</b>。"],
],

E06:[
  ["排序与拣货","分拣单按<b>库位</b>排序（非订单行号），行号仅用于与发货单对齐。称重栏填<b>实拣量</b>，点行即视为已拣。"],
],

E07:[
  ["字段范围","分拣单不出现价格与客户名，属<b>可外流纸张</b>；仅印品名、规格、数量、余量空栏。"],
  ["手写空栏","仓库现场无终端，实拣量先手写、回办公室再录；不采用「必须扫码才准走」，因生鲜现场戴胶手套操作。"],
  ["分页","每页 <b>12 行</b>；18 行订单拆为 12 + 6，使<b>字号保持 10.5pt</b>，优先保证站立拣货时可读。"],
  ["与送货单区别","分拣单给<b>内部人员</b>（无价格、无门店）；送货单给<b>食堂签收</b>（含价格、差异备注、公章）。字段刻意不重叠。"],
],

E08:[
  ["差异说明","不写原因也可提交，但该差异直接进入履约档案。差异说明为<b>给食堂的解释</b>，含预告、原因与时间戳，验收时区分「提前告知」与「事后知晓」。"],
  ["补填入口","补填统一在本清单，不在发货单页；发货单页只显示<b>已填备注</b>。集中处理便于发现同日多单漏填。"],
],

E09:[
  ["模板目标","模板字段服务签收方核对三件事：品名、数量、差异原因；其余不印。"],
  ["差异两段打印","上半段<b>应发数量</b>（下单量），下半段<b>实发数量</b>（含差异备注）；两段不合并，避免隐藏少发量。"],
  ["编码口径","不印我方货品编码（食堂侧无效），印<b>平台 SKU</b>（双方共用）。"],
  ["模板版本","改模板仅影响之后打印的单据，已打印仍为旧版式；<b>已签收纸质件为法律凭据</b>，系统 PDF 仅为副本。"],
],

E10:[
  ["排序口径","按<b>线路</b>排序，不按单号。司机一车一线路，纸按路线叠放，到一站抽一张。"],
  ["状态区分","「已打印」不等于「已送达」，打印不推进单据状态，状态仅认<b>食堂签收（验收单）</b>，避免「打印即发货」的错账。"],
  ["打印失败处理","卡纸 / 断纸时失败那张<b>标红留在队列</b>，其余照打；整批重来会导致重复出单。"],
],

E11:[
  ["报告是资产，发货单存引用","报告在 <b>E02 发货前编辑 / E04 发货后补传的明细行内</b>上传一次进<b>报告库</b>，可被多张发货单、多个商品行引用。<b>E11 仅做管理维护</b>（详情 / 作废 / 按报告反查引用），<b>无新增上传入口</b>。顶部按<b>报告 ID、状态、有效期起止、上传日期起止</b>组合查询；有效期按与区间有交集判定，上传日期按当天是否落在区间判定，起 / 止留空不限，仅影响本页可见行。发货单仅存「哪行关联哪份报告」引用，<b>不复制文件内容、不写进冻结商品行快照</b>；报告状态变化或被作废，历史单据仍可查到当时关联。"],
  ["报告字段","报告五要素：<b>名称（报告ID）、上传时间、上传人、上传内容、有效期</b>。上传内容为图片与文件混排的扁平集合，不分检疫证 / 检测报告 / 合格证。名称按 <b>食安报告 YYYY.MM.DD NNN</b> 自动生成、不可编辑；序号按当日流水递增，<b>作废不回收</b>。有效期在上传时填写（生效日 ~ 失效日，含首尾），清单与详情均可见。"],
  ["匹配规则","订单行与发货行投影平台主数据 <b>pid / sid</b>，不以「品名+规格」文本作身份，改名或改包规不断链。报告与商品关系写在引用关系的 <b>pid</b> 上：按 pid 反查<b>该商品在其他历史发货单</b>关联过的报告，再筛有效期覆盖本单发货日期者。"],
  ["自动关联规则","按每张发货单的<b>发货日期 sh.date</b> 判定（非今天）；命中取上传时间<b>最新一份</b>写入引用（<b>scene=自动</b>、操作人「系统自动」、autoReason 记录命中的有效期），<b>无需确认</b>。每行最多一份、只追加不替换；该行已有引用或「本行不发 / 实发 0」不挂。自动关联<b>仅对待发货单</b>执行，已发货单不自动补（保持冻结快照与 E04 只读）。弹层上半区只读展示结果，下半区搜索 / 新增仅供补充，此两处需点「确认关联」。"],
  ["过期与作废处理","已过期 / 未生效 / 已作废的报告不参与自动关联，手动筛选也过滤。清单「有效 / 已过期」按<b>业务今天</b>展示，与「按单发货日期判定」不同。<b>历史引用不追改</b>：报告有效期后改或被作废，已发发货单仍显示当时关联的那份，台账可查。"],
  ["已发货只追加","确认发货后商品行与送货单冻结，E04 补传走<b>独立写入口</b>绕开保存拦截：入口在<b>「发货明细」最右列</b>，仅追加新报告，已关联项只读、不可替换或解绑（无「×」）。补传不改数量、金额、时间、状态、验收与已生成送货单，仅流转记录增「补传食安报告 · N 份」。「本行不发 / 实发 0」无补传入口。<b>待发货态 E04 整列只读</b>，关联 / 上传仅在 E02；<b>已关闭订单 / 发货单同样整列只读</b>，不提供补传、写入层同步拦截。系统自动关联也<b>只对得发货单</b>执行。"],
  ["结算与打印隔离","报告为合规凭证，<b>不参与合格量、验收结论与结算金额</b>；未关联不提示、不阻塞确认发货、不产生待办。送货单在确认发货时生成后不再变化，故报告不打印其上；改在<b>报告详情</b>按报告反查引用记录（发货单 / 门店 / 商品 pid / 发货时间）。"],
],

F01:[
  ["结算依据","验收结果是结算唯一依据：<b>Σ（验收合格量 × 单价）</b>。验收结论由食堂录入，供应商<b>只读</b>；一期不提供异议处理入口，结论回写即定稿，逐行可在 F02 核对。"],
  ["验收域入口","左侧「验收与售后」仅保留<b>验收结果（F01）</b>与<b>售后退货处理（F04）</b>：验收单列表、结论、结算金额与差异行走 F01，点单进 F02；F04 处理门店发起的退货申请（查看 + 通过即结算扣减 / 驳回）。<b>验收异议「申诉 / 改判」链路一期不做</b>，相关元素已从 F04 / F05 移除；验收由门店回写、供应端只读，无「待办」。F06 为统计演示屏，仅在原型导航保留，不占左侧菜单。F01 / F02 / F06 / F04 数据独立。"],
  ["验收单条数","<b>「已完成」与「有验收单」互为充要条件</b>：门店验收结论回写后订单 / 发货单推进「已完成」并生成验收单。已完成订单数与验收单条数一一对应。列表按验收时间倒序，<b>不过滤、不分页</b>（F01 全量展示，页头计数由 ACCEPTANCES 现算），F06 行数同源。<code>shipAudit()</code> 双向校验：挂验收单必已完成、已完成必有验收单，并校验一单一验、门店、验收时间（= 发货单 acceptedAt）与合格量口径。"],
  ["结算金额与明细来源","每张验收单逐行明细<b>取自关联发货单的商品行</b>（<code>ysLines()</code> / <code>ysSummary()</code>）：品名、规格、单位、单价、应收、实发继承发货单，门店侧仅补录短装 / 拒收。结算金额 = <b>Σ（合格量 × 单价）</b>、差异行数 = 有扣减的行数，各汇总由明细现算回填 ACCEPTANCES，<b>不写死汇总数字</b>。F01 / F02 / F06 / <code>shipAudit()</code> 读同一份派生结果。"],
],

F02:[
  ["验收核对项","仅核对<b>数量</b>（应收 → 实发 → 实收）与<b>包规</b>（送货包装与下单规格一致）。两项通过即合格。<b>不按商品等级做品质分级</b>；变质、破损等现场问题直接计入拒收。"],
  ["结算口径","结算金额 = <b>Σ（合格量 × 单价）</b>，<b>合格量 = 实收 − 拒收</b>。拒收由食堂现场录入并附照片，供应商只读；下单量、发货量均不直接进结算。多发不多收，少发必少收。"],
  ["明细来源","明细不再固定展示样例单，<b>行数、品名、数量、单价、金额全部跟随该验收单关联的发货单</b>。<code>shipAudit()</code> 校验：明细逐行等于发货单、结算金额不超过发货金额、全合格单零差异且结算金额 = 发货金额。"],
],

F04:[
  ["售后范围","F04 仅处理<b>门店发起的退货申请</b>：退货单号 / 关联发货单 / 门店 / 退货商品 / 数量 / 原因 / 状态，供应商查看并处理（通过即安排取回并结算扣减 / 驳回）。<b>验收异议的申诉 / 改判一期不做</b>，相关元素已从 F04 / F05 移除。"],
  ["数据来源","F04 列表、F05 详情、处理弹窗（<code>returnHandle()</code>）共用 <code>RETURNS</code>；KPI（本月退货单数 / 待确认 / 待确认扣减金额 / 平均处理时长）、状态分布、sum-bar 全部现算。状态仅 待确认 / 已同意 / 已拒绝，无「申诉中」。"],
  ["处理时限","门店发起后 <b>72 小时内</b>处理完毕，超时默认同意。审核通过即<b>不计入验收合格量</b>（结算时自然扣减，无独立退款动作），驳回维持原结算。"],
],

F05:[
  ["进度展示","F05 展示单张退货申请进度：时间轴（门店发起 → 系统校验 → 供应商审核；通过即结算扣减 / 驳回则维持）、退货凭证（门店照片 / 供应商核验）、退货信息（商品 / 原因 / 扣减金额 / 状态）、历史同类退货。<b>无</b>申诉 / 证据对照 / 改判金额等验收异议元素，也无独立「取回 / 退款」动作。"],
],

F06:[
  ["口径聚合","本表展示应发 → 实发 → 扣减 → 合格量，合格量决定结算金额，<b>仅由食堂称重与验收决定</b>。供应商可改「实发」与「备注」，不可改「合格」。"],
  ["统计演示屏","本屏仅做<b>数量口径聚合分析</b>（应发 → 实发 → 扣减 → 合格量、合格率、扣减归因、门店对比）；逐单验收结论与结算金额见 <b>F01</b>。明细与 F01 共用 ACCEPTANCES，每单各数量由关联发货单商品行派生、金额由合格量 × 单价现算，不另造演示单号；「查看」带验收单上下文进 F02。本屏只在原型导航保留。"],
],

G01:[
  ["结算口径","<b>合格量（不含退货）× 下单单价</b>，其中合格量 = 实收量 − 拒收量 − 已通过的退货量。不采用实发量或验收时市场价。价格在订单生成时（门店提交直采 / 中标生成）锁定，验收与退货只改数量。"],
],

G02:[
  ["逐行验算","<b>合格量（不含退货）= 实收量 − 拒收量 − 已通过的退货量</b>，金额 = 合格量 × 单价。实收减合格为「拒收 + 已通过退货」合计扣减；四段逐列排开。退货量仅取 F04 / A06 中<b>已同意</b>的申请，驳回与待确认不进账。"]
],

G03:[
  ["结算单与对账单","结算单为<b>最终数字</b>，对账单为<b>推导过程</b>（可点回每张验收单）。财务用前者，核对用后者，两者均提供下载。"],
],

H01:[
  ["门店来源与权限","门店为<b>平台分配</b>，供应端<b>只读 + 局部可配</b>；不可新增门店、修改地址或账期，上述属平台主数据。"],
  ["配送偏好","默认时段、送货单模板、是否贴标签由<b>门店侧设置</b>，供应商不可修改，调整走平台运营。"],
],

H02:[
  ["主账号约束","主账号唯一且不可停用，为付款与合同责任人。<b>子账号无论权限高低均不可改银行账号与发票信息</b>；该约束写在权限矩阵中，不可配置。"],
  ["固定角色","供应商团队通常为 <b>3–8 人</b>，自定义角色成本高于收益；一期提供 4 个固定角色。"],
  ["门店数据权限","门店范围即数据权限：配置限定门店后，登录后<b>查不到其他门店的订单与价格</b>（后端过滤，非界面隐藏）。"],
  ["停用效果","停用后所有登录态立即失效，已提交单据不受影响；已签收纸质送货单上的签名责任仍归商户主体。"],
],

H03:[
  ["权限矩阵约束","权限矩阵中只读格子为产品底线：主账号列「✓」全部锁死，<b>不可转出付款权与开票权</b>；此类约束不做可配置项。"],
  ["采购与仓库分界","采购管<b>价格与承诺</b>（报价、订单、价格维护），仓库管<b>数量与事实</b>（发货、称重、备注），<b>不交叉</b>：报价人员不可改实发量。"],
  ["财务权限","财务可看订单与对账，不可填写 / 确认发货单、不可报价。发货单由系统自动生成，禁止财务为对账改数量。"],
  ["只读账号","只读账号面向管理者与外部审计，可看全部数据但不可修改，通常<b>不占子账号配额提醒</b>。"],
],

H04:[
  ["日志范围","成功日志记录「做过什么」，失败日志记录「谁想做什么但未做成」，<b>后者为争议排查的关键证据</b>。"],
  ["保留期限","保留 <b>12 个月</b>，覆盖对账差异常见的 30–90 天窗口；更久历史由平台归档，下载需申请。"],
  ["不可删除","界面与主账号均无「清空日志」入口；可删除的审计日志等同于没有审计。"],
  ["价格修改筛选","动作类型单独设「价格修改」档，记录<b>谁在何时将哪个价改为多少</b>。"],
],

I01:[
  ["模板模块定位","生鲜场景中<b>纸质单据为法律凭据</b>（食堂签收纸件），模板错误即证据错误；模板为业务基线，非一般设置项。"],
  ["模板匹配","一张送货单仅命中一个模板，自上而下<b>命中即停</b>：门店单独指定 > 品类规则 > 全局默认。"],
  ["打印方式","一期用浏览器原生打印，不接打印机驱动；型号、纸型仅作<b>记录</b>，排版由浏览器决定，边距由模板控制。"],
  ["预览分流","模板列表「预览」按单据类型打开对应模板：报价单→K08、采购订单→K09；分拣单 / 标签 / 对账单 / 结算单本期沿用送货单预览（K05）。"],

I02:[

I03:[
  ["打印记录用途","记录「谁在几点打了哪一张」：<b>打印时间 + 打印机 + 页数</b>，用于证明纸件生成时刻。"],
  ["打印时间","送货单常在<b>凌晨 4–6 点</b>打印，为争议高发时段；时间轴用于替代记忆。"],
  ["重打留痕","重打允许，但<b>同一张单打出两张相同纸件</b>存在双签收风险；第二次起标「重打」并记录次数。"],
  ["保留期限","保留 <b>90 天</b>：签收争议集中在收货后 7 天，账期争议集中在 45 天。"],

J01:[
  ["平台核验字段","企业名称、统一社会信用代码、法人、注册资本由平台入驻时核验并固定，不可自行修改（避免合同主体被替换）；变更走「申请变更」并由平台审核。"],
  ["收款账号复核","提交后平台<b>电话回拨入驻预留手机号</b>确认，24 小时内生效；为唯一「改后不立即生效」字段。"],
  ["证照提醒","到期前 <b>30 天</b>提醒进待办中心；<b>逾期未更新暂停接单</b>。食堂验收核验证照有效期，属采购方合规要求。"],
  ["经营范围","经营范围由平台入驻时审核，不在本页维护；<b>范围外品类不推送询价单且无提示</b>。具体门店 SKU 供不供，在「供货价格维护」设<b>临时停售</b>，无需另维护范围。"],
  ["评级更新","综合评级每月 <b>1 日</b>更新，影响询价单<b>推送优先级</b>；由履约及时率与验收合格率算出，无人工调整入口。"],
],

J02:[
  ["主体与收货点","对账按<b>商户</b>结，订单按<b>门店</b>下：一张对账单汇总多店金额，一张订单仅对应一家门店。"],

/* 入口按钮：只有存在规则条目时才出现 */
function ruleN(id){ return (RULES[id]||[]).length; }
function ruleBtn(id){
  const n = ruleN(id); if(!n) return '';
  return `<button class="rule-btn" onclick="ruleShow('${id}')" title="看这一屏的设计规则">${I.info}规则说明<b class="rule-c">${n}</b></button>`;
}
function ruleShow(id){
  const r = RULES[id] || [];
  if(!r.length) return;
  const s = SCREENS.find(x=>x.id===id) || {title:''};
  modal(`规则说明 · ${s.title}`,
    `<div class="rule-hd">设计规则 · 共 <b>${r.length}</b> 条 · 产品口径与实现约束，非操作说明</div>
     <div class="rule-doc">${r.map(([t,b],i)=>
       `<section><h4><i>${String(i+1).padStart(2,'0')}</i><span>${t}</span></h4><div class="rule-bd">${b}</div></section>`
     ).join('')}</div>`,
    `<button class="btn btn-default" onclick="closeModal()">知道了</button>`, true);
}

/* 注入 v2 补充样式 */
(function(){ const st=document.createElement('style'); st.textContent=V2CSS; document.head.appendChild(st); })();

/* ---------- 启动 ---------- */
/* 支持 URL hash 直达：#<屏id>[&key=value]，用于「新标签页打开某单据详情」之类深链。
   参数：ys=验收单号（F02）、order=采购订单号（D02 / D05）、st=对账单号（G02）、sh=发货单号（E02 / E04 / K05）、d0/d1=备货日起止（D03）。
   例：#F02&ys=YS-20261025-0014、#G02&st=ST-202610-01、#E02&sh=SH-20261026-0041、#D03&d0=2026-10-27&d1=2026-10-29。无 hash 时回落到首页。 */
function bootFromHash(){
  const h = (location.hash||'').replace(/^#/,'');
  if(!h) return false;
  const parts = h.split('&');
  const id = parts[0];
  if(!SCREENS.some(s=>s.id===id)) return false;
  parts.slice(1).forEach(p=>{
    const i = p.indexOf('=');
    if(i>0){
      const k=p.slice(0,i), v=p.slice(i+1);
      if(k==='ys') CUR_YS_NO=v;
      /* #D05&order=PO-… 直接带着订单上下文落地缺货预告 */
      if(k==='order'){ CUR_ORDER_NO=v; D05_ORDER_NO=v; }
      /* #G02&st=ST-… 直接带着对账单上下文落地，确认对账不会改错单 */
      if(k==='st') CUR_ST_NO=v;
      /* #E02&sh=SH-… 带发货单上下文落地，编辑态（含送达时间）按这张单初始化 */
      if(k==='sh'){
        CUR_SHIP_NO=v;
        const _sh = SHIPMENTS.find(x=>x.no===v);
        if(_sh && !shipLocked(_sh)) shipInitFor(_sh);
      }
      /* #D03&d0=…&d1=… 带着备货日起止范围落地备货参考 */
      if(k==='d0' && /^\d{4}-\d{2}-\d{2}$/.test(v)) D03_D0=v;
      if(k==='d1' && /^\d{4}-\d{2}-\d{2}$/.test(v)) D03_D1=v;
    }
  });
  YS_FROM_RETURN = false;   // 直链进入 F02 不算来自退货单
  YS_FROM_LIST = false;     // 直链进入 F02 不算来自列表
  YS_FROM_E04 = false;      // 直链进入 F02 不算来自发货单详情
  D02_BACK = 'D01';         // 直链进入 D02 默认返回订单中心列表
  D05_ORDER_NO = CUR_ORDER_NO;  // 直链进入 D05 沿用订单上下文（未指定时取当前订单）
  D05_BACK = 'D02';         // 直链进入 D05 默认返回订单详情
  go(id);
  return true;
}
if(!bootFromHash()) go('A01');
returnAudit();   // 开机自检：退货商品须属于关联验收单明细，不一致则 console 告警
